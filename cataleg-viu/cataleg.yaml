# cataleg.yaml - configuració del «catàleg viu» d'Eurast (munta_cataleg.py, actualitza.py, pdf_client.py)
# Tot és opcional: sense res, el catàleg es munta amb els grups que trobi (ordre numèric).

# Data d'edició de la portada general: "auto" = mes actual (AAAA/MM) o un text fix, p. ex. "2026/10".
edicio: auto

# Ordre dels grups al catàleg. Buit = tots els disponibles, per número. Un grup que aquí no surt
# no entra al catàleg encara que tingui PDF.
ordre: [2, 3]   # PROVA 22/10: només 2 grups (l'Armand); treure per a tots

# Un grup nou (G06, G07...) NO demana tocar res: si Odoo té productes marcats d'aquell grup i el generador
# (generadors.per_defecte) en pot fer el PDF, entra sol. Només cal una entrada aquí per canviar el PDF d'origen
# o el generador d'un grup concret.
grups: {}
#  7: {pdf: "ruta/g7.pdf", nom: {es: "...", en: "...", fr: "..."}}

# Com es regenera el PDF d'un grup (es crida com a eina; només llegeix d'Odoo Staging). {n} = número de grup,
# {sortida} = ruta absoluta SENSE extensió (el PDF acabarà a treball/grups/gN.pdf).
generadors:
  per_defecte:
    cwd: ../grups-odoo
    ordre: [python3, scripts/renderitza.py, --grup, "{n}", --sortida, "{sortida}"]

# On busca els PDF de partida d'un grup quan encara no n'hi ha cap de generat a treball/grups/.
# {n} = número de grup. (Es fa servir el primer que existeixi.)
pdf_origen: []   # 22/10: buit a propòsit. Un grup només entra si actualitza.py n'ha generat el PDF des d'Odoo
                 # (treball/grups/gN.pdf). Abans, un grup sense productes marcats tornava a sortir amb un PDF vell.

# Grups amb les relacions sobretaula / suport / versió muntada (relations.json del visor). Només eina d'equip.
relacions_grups: [3, 4, 5]

# Dades de la contraportada (extretes de la contraportada impresa actual del catàleg: no s'inventa res).
contacte:
  empresa: "RECAMBIOS Y COMPONENTES RESTAURACIÓN, S.L."
  adreca: ["Roquetas, nave 115 - Pol. Ind. Can Magre", "08187 - SANTA EULALIA DE RONÇANA (Barcelona) - Spain"]
  email: "comercial@recambiosrcr.com"
  telefon: "+34 938 486 767"
  web: "www.recambiosrcr.com"
  web_marca: "www.eurast.com"

# Visor de partida (còpia del de tarifa-nova; no es modifica) i logo.
visor:
  index_html: "../visor/index.html"
  recursos: "../visor"          # d'aquí es copien logo.png, favicon.ico i favicon.svg
