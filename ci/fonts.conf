<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Al Mac el catàleg es compon amb Arial Narrow / Franklin Gothic; a Linux es fan servir els equivalents lliures. -->
<fontconfig>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Franklin Gothic Book</family><prefer><family>Libre Franklin</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
