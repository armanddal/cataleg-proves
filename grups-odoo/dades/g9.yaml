- id: p28
  n: 28
  tipus: informacio_general
  capcalera:
    banda: assets/g9/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: SERIE P
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.0
    titol:
      es: ASADORES DE POLLOS PLANETARIOS A GAS E PLANETARY GAS CHICKEN ROASTERS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: LOS ASADORES DE POLLOS GOZAN DE LA EXPERIENCIA DEL FABRICANTE LÍDER MUNDIAL. DESDE 1951, MILES DE ASADORES ESTÁN ASANDO POLLOS EN
        TODO EL MUNDO, LO CUAL OFRECE A LOS USUARIOS LA MÁXIMA GARANTÍA DE CALIDAD Y EFICIENCIA…. CARACTERÍSTICAS Construidos en acero inoxidable,
        de 1,5 y 1 mm de espesor. Tapa posterior de acero galvanizado. Proyectados para la producción industrial de asados. Las bandejas de jugos,
        de gran capacidad, están dimensionadas para recoger incluso el aceite que se pueda derramar por los cristales. □ Los cristales templados
        con cierre magnético, de apertura pivotante, dotados de asa de baquelita para evitar quemaduras, asimismo la pérdida de calor con el consiguiente
        ahorro de consumo y también más higiene, evitando la entrada de polvo e insectos. □ Modelos con luz. □ Las espadas y los pinchos también
        son de acero inoxidable. □ Con espadas de 5/6 pollos cada una. □ Con bombos de 4 espadas, que giran planetariamente. □ Con 2 motores reductores,
        en cada bombo, lo cual permite parar la rotación de una espada, para sacarla, mientras las tres restantes siguen girando, con lo que se
        evita que se quemen los pollos. Con interruptores dobles, luminosos por cada bombo. La cocción es por medio de quemadores de acero inoxidable,
        □ de rayos infrarrojos, eficientes, ecológicos y de gran potencia calorífica y bajo consumo. Con grifos de latón, independientes, con
        máximo regulable y mínimo, para su funcionamiento a gas butano-propano o natural. Con bobina de seguridad y termopar. Con las chapas entre
        quemadores desmontables, para facilitar la limpieza y en acero inoxidable de 1,5 mm de espesor. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 8.8
    pos:
      x: 0.5
      y: 3.101
      w: 10.314
      h: 25.6
  - idioma: en
    paragrafs:
    - role: text
      text: CHICKEN GRILLS ENJOY THE WORLD'S LEADING MANUFACTURER'S EXPERIENCE. SINCE 1951, THOUSANDS OF GRILLS ARE GRILLING CHICKENS ALL OVER
        THE WORLD, WHICH OFFERS USERS THE MAXIMUM GUARANTEE OF QUALITY AND EFFICIENCY... FEATURES Constructed in stainless steel, 1.5 and 1 mm
        thick. Galvanized steel back cover. Designed for the industrial production of roasts. The large capacity juice trays are dimensioned to
        collect even the oil that may spill through the glass. □ The tempered glass with magnetic closure, pivoting opening, equipped with bakelite
        handle to avoid burns, also heat loss with consequent savings in consumption and also more hygiene, preventing the entry of dust and insects.
        □ Models with light. □ The swords and skewers are also made of stainless steel. □ With swords of 5/6 chickens each. □ With drums of 4
        swords, rotating planetarily. □ With 2 reduction motors, in each drum, allowing one sword to stop rotating for removal, while the other
        three continue rotating, preventing the chickens from burning. With double illuminated switches for each drum. The cooking is by means
        of stainless steel burners, □ of infrared rays, efficient, ecological and of great calorific power and low consumption. With independent
        brass taps, with adjustable maximum and minimum, for operation with butane-propane or natural gas. With safety coil and thermocouple.
        With removable burner plates for easy cleaning and 1.5mm thick stainless steel. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 8.8
    pos:
      x: 11.114
      y: 3.101
      w: 9.386
      h: 25.6
