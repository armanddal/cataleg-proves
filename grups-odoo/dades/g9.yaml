  - idioma: en
    paragrafs:
    - role: text
      text: CHICKEN GRILLS ENJOY THE WORLD'S LEADING MANUFACTURER'S EXPERIENCE. SINCE 1951, THOUSANDS OF GRILLS ARE GRILLING CHICKENS ALL OVER
        THE WORLD, WHICH OFFERS USERS THE MAXIMUM GUARANTEE OF QUALITY AND EFFICIENCY... GENERIC CHARACTERISTICS OF ROASTERS Constructed of stainless
        steel, 1.5 and 1 mm thick. Galvanized steel back cover. Designed for the industrial production of roasts. The large capacity juice trays
        are dimensioned to collect even the oil that may spill through the glass. □ The tempered glass with magnetic closure, pivoting opening,
        equipped with bakelite handle to avoid burns, also heat loss with consequent savings in consumption and also more hygiene, preventing
        the entry of dust and insects. □ We manufacture models with light. □ The swords, the bearing and the skewers are also made of stainless
        steel. □ With swords of 5/6 chickens each. □ With powerful gear motors, which rotate the swords at 4 revolutions per minute. Chain transmissions.
        DOUBLE-SWORD MACHINES These rotisseries have the advantage that with the same energy expenditure they advance the roast of chickens on
        the front swords. GAS ROASTERS The cooking is by means of stainless steel burners, □ of infrared rays, efficient, ecological and of great
        calorific power and low consumption. With independent brass taps, with adjustable maximum and minimum, for operation with butane-propane
        or natural gas. With safety coil and thermocouple. With removable plates between burners for easy cleaning and made of stainless steel.
        □ ELECTRIC ROASTERS Cooking by means of stainless steel sheathed heating elements. □ They also equip a power regulator, with 3 positions
        (gears), that activates and deactivates the energy, keeping the heat constant, according to the determined position. Protected from the
        corresponding contactor and with a pilot light, operation indicator. ELECTRIC VITROCERAMIC ROASTERS Cooking by means of stainless steel
        sheathed heating elements. With a Schott glass that simplifies cleaning, as using the right product, and when the plates are cold, it
        is really easy. □ They also equip a power regulator, with 3 positions (gears), that activates and deactivates the energy, keeping the
        heat constant, according to the determined position. Protected from the corresponding contactor and with a pilot light, operation indicator.
