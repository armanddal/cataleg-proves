    titol:
      es: F RÔTISSOIRES À POULETS PLANÉTAIRES À GAZ D PLANETARISCHE GAS-HÄHNCHENGRILLS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: LES RÔTISSOIRES À POULETS PROFITENT DE L'EXPÉRIENCE DU PREMIER FABRICANT AU MONDE. DEPUIS 1951, DES MILLIERS DE RÔTISSOIRES RÔTISSENT
        DES POULETS DANS LE MONDE ENTIER, QUI OFFRENT AUX UTILISATEURS LA GARANTIE MAXIMALE DE QUALITÉ ET D'EFFICACITÉ… CARACTÉRISTIQUES Construits
        en acier inoxydable, de 1,5 et 1 mm d'épaisseur. Cache arrière en acier galvanisé. Conçu pour la production industrielle de rôtis. Les
        bacs à jus de grande capacité sont dimensionnés pour recueillir même l'huile qui peut se répandre à travers le verre. □ Le verre trempé
        avec fermeture magnétique, ouverture pivotante, équipé d'une poignée en bakélite pour éviter les brûlures, ainsi que les pertes de chaleur
        avec des économies de consommation conséquentes et également plus d'hygiène, empêchant l'entrée de poussière et d'insectes. □ Modèles
        avec lumière. □ Les broches et les pointes sont également en acier inoxydable. □ Avec des broches de 5/6 poulets chacune. □ Avec des tambours
        de 4 épées, tournant de manière planétaire. □ Avec 2 moteurs réducteurs, dans chaque tambour, permettant d'arrêter la rotation d'une épée
        pour la retirer, tandis que les trois autres continuent de tourner, évitant ainsi que les poulets ne brûlent. Avec des interrupteurs doubles
        lumineux pour chaque tambour. La cuisson se fait au moyen de brûleurs en acier inoxydable, □ de rayons infrarouges, efficaces, écologiques
        et de grand pouvoir calorifique et de faible consommation. Avec robinets en laiton indépendants, avec maximum et minimum réglables, pour
        fonctionnement au butane-propane ou au gaz naturel. Avec bobine de sécurité et thermocouple. Avec plaques de brûleur amovibles pour un
        nettoyage facile et acier inoxydable de 1,5 mm d'épaisseur. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 8.8
    pos:
      x: 0.5
      y: 3.101
      w: 9.85
      h: 25.6
  - idioma: es
    paragrafs:
    - role: text
      text: HÄHNCHENGRILLS GENIESSEN DIE ERFAHRUNG DES FÜHRENDEN HERSTELLERS DER WELT. SEIT 1951 GRILLEN TAUSENDE VON GRILLS HÜHNER AUF DER GANZEN
        WELT, WAS DEN NUTZERN DIE MAXIMALE GARANTIE FÜR QUALITÄT UND EFFIZIENZ BIETET… EIGENSCHAFTEN Gefertigt aus Edelstahl, 1,5 und 1 mm dick.
        Rückseite aus verzinktem Stahl. Entwickelt für die industrielle Herstellung von Braten. Die Saftschalen mit großer Kapazität sind so dimensioniert,
        dass sie auch das Öl sammeln, das durch das Glas gelangen kann. □ Das gehärtete Glas mit Magnetverschluss, schwenkbarer Öffnung, ausgestattet
        mit Bakelitgriff zur Vermeidung von Verbrennungen, Wärmeverlust mit daraus resultierenden Einsparungen beim Verbrauch und mehr Hygiene,
        wodurch das Eindringen von Staub und Insekten verhindert wird. □ Modelle mit Licht. □ Die Schwerter und Spieße sind ebenfalls aus Edelstahl.
        □ Mit Schwertern von je 5/6 Hühnern. □ Mit Trommeln von 4 Schwertern, die planetarisch rotieren. □ Mit 2 Untersetzungsgetrieben in jeder
        Trommel, wodurch ein Schwert zum Herausnehmen angehalten werden kann, während die anderen drei weiterrotieren, wodurch verhindert wird,
        dass die Hähnchen verbrennen. Mit doppelt beleuchteten Schaltern für jede Trommel. Das Kochen erfolgt mittels Edelstahlbrennern, □ Infrarotstrahlen,
        effizient, ökologisch und von großer Heizleistung und geringem Verbrauch. Mit unabhängigen Messinghähnen mit einstellbarem Maximum und
        Minimum für den Betrieb mit Butan-Propan oder Erdgas. Mit Sicherheitsspule und Thermoelement. Mit abnehmbaren Brennerplatten zur einfachen
        Reinigung und 1,5 mm dickem Edelstahl. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 8.8
    pos:
      x: 10.65
      y: 3.101
      w: 9.85
      h: 25.6
