  - idioma: es
    paragrafs:
    - role: text
      text: HÄHNCHENGRILLS GENIESSEN DIE ERFAHRUNG DES FÜHRENDEN HERSTELLERS DER WELT. SEIT 1951 GRILLEN TAUSENDE VON GRILLS HÜHNER AUF DER GANZEN
        WELT, WAS DEN NUTZERN DIE MAXIMALE GARANTIE FÜR QUALITÄT UND EFFIZIENZ BIETET… ALLGEMEINE MERKMALE VON HÄHNCHENGRILLS Hergestellt aus
        Edelstahl, 1,5 und 1 mm dick. Rückseite aus verzinktem Stahl. Entwickelt für die industrielle Herstellung von Braten. Die Saftschalen
        mit großer Kapazität sind so dimensioniert, dass sie auch das Öl sammeln, das durch das Glas gelangen kann. □ Das gehärtete Glas mit Magnetverschluss,
        schwenkbarer Öffnung, ausgestattet mit Bakelitgriff zur Vermeidung von Verbrennungen, Wärmeverlust mit daraus resultierenden Einsparungen
        beim Verbrauch und mehr Hygiene, wodurch das Eindringen von Staub und Insekten verhindert wird. □ Wir stellen Modelle mit Licht her. □
        Die Schwerter, Lager und Spikes bestehen ebenfalls aus Edelstahl. □ Mit Schwertern von je 5/6 Hühnern. □ Mit leistungsstarken Getriebemotoren,
        die die Schwerter mit 4 Umdrehungen pro Minute drehen. Kettenübertragungen. DOPPELSCHWERTMASCHINEN Diese Rotisserien haben den Vorteil,
        dass sie bei gleichem Energieaufwand den Hühnerbraten auf den Vorderschwertern vorantreiben. GAS-HÄHNCHENGRILLS Das Kochen erfolgt mittels
        Edelstahlbrennern, □ Infrarotstrahlen, effizient, ökologisch und von großer Heizleistung und geringem Verbrauch. Mit unabhängigen Messinghähnen
        mit einstellbarem Maximum und Minimum für den Betrieb mit Butan-Propan oder Erdgas. Mit Sicherheitsspule und Thermoelement. Mit abnehmbaren
        Platten zwischen den Brennern zur einfachen Reinigung und aus Edelstahl. □ ELEKTRISCHE-HÄHNCHENGRILLS Kochen mittels Edelstahl-Heizelementen
        mit Schutzmantel. □ Sie statten auch ein Energieregler mit 3 Positionen (Zahnrädern) aus, das die Energie aktiviert und deaktiviert und
        die Wärme entsprechend der festgelegten Position konstant hält. Geschützt vor dem entsprechenden Schütz und mit einer Kontrollleuchte,
        Betriebsanzeige. ELEKTRISCHE GLASKERAMIK-HÄHNCHENGRILLS Kochen mittels Edelstahl-Heizelementen mit Schutzmantel. Mit einem Schott-Glas,
        das die Reinigung vereinfacht, denn mit dem richtigen Produkt und wenn die Platten kalt sind, ist es wirklich einfach.□ Sie statten auch
        ein Energieregler mit 3 Positionen (Zahnrädern) aus, das die Energie aktiviert und deaktiviert und die Wärme entsprechend der festgelegten
        Position konstant hält. Geschützt vor dem entsprechenden Schütz und mit einer Kontrollleuchte, Betriebsanzeige.
