      es: ASADORES DE POLLOS A GAS Y ELÉCTRICOS E GAS AND ELECTRIC CHICKEN ROASTERS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: LOS ASADORES DE POLLOS GOZAN DE LA EXPERIENCIA DEL FABRICANTE LÍDER MUNDIAL. DESDE 1951, MILES DE ASADORES ESTÁN ASANDO POLLOS EN
        TODO EL MUNDO, LO CUAL OFRECE A LOS USUARIOS LA MÁXIMA GARANTÍA DE CALIDAD Y EFICIENCIA…. CARACTERÍSTICAS GENÉRICAS DE LOS ASADORES Construidos
        en acero inoxidable de 1,5 y 1 mm de espesor. Tapa posterior de acero galvanizado. Proyectados para la producción industrial de asados.
        Las bandejas de jugos, de gran capacidad, están dimensionadas para recoger incluso el aceite que se pueda derramar por los cristales.
        □ Los cristales templados con cierre magnético, de apertura pivotante, dotados de asas de baquelita para evitar quemaduras, asimismo la
        pérdida de calor con el consiguiente ahorro de consumo y también más higiene, evitando la entrada de polvo e insectos. □ Fabricamos modelos
        con luz. □ Las espadas, el rodamiento y los pinchos también son de acero inoxidable. □ Con espadas de 5/6 pollos cada una. □ Con potentes
        motores-reductores, que hacen girar las espadas a 4 vueltas por minuto. Transmisiones por cadena. MÁQUINAS DE DOBLE ESPADA Estos asadores,
        tienen la ventaja, de que con el mismo gasto energético van avanzando el asado de pollos de las espadas delanteras . ASADORES A GAS La
        cocción es por medio de quemadores de acero inoxidable, □ de rayos infrarrojos, eficientes, ecológicos y de gran potencia calorífica y
        bajo consumo. Con grifos de latón, independientes, con máximo regulable y mínimo, para su funcionamiento a gas butano-propano o natural.
        Con bobina de seguridad y termopar. Con las chapas entre quemadores desmontables, para facilitar la limpieza y en acero inoxidable. □
        ASADORES ELÉCTRICOS Cocción por medio de resistencias blindadas de acero inoxidable. □ Además equipan un regulador de energia, con 3 posiciones
        (marchas), que activa y desactiva la energía, manteniendo el calor constante, de acuerdo con la posición determinada. Protegido del correspondiente
        contactor y con un piloto luminoso, indicador de funcionamiento. ASADORES VITROCERÁMICOS ELÉCTRICOS Cocción por medio de resistencias
        blindadas de acero inoxidable. Con un cristal schott que simplifica la limpieza, pues empleando el producto adecuado, y cuando las placas
        están frías, es realmente fácil.□ Además equipan un regulador de energía, con 3 posiciones (marchas), que activa y desactiva la energía,
        manteniendo el calor constante, de acuerdo con la posición determinada. Protegido del correspondiente contactor y con un piloto luminoso,
        indicador de funcionamiento.
      estil:
