  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: LES RÔTISSOIRES À POULETS PROFITENT DE L'EXPÉRIENCE DU PREMIER FABRICANT AU MONDE. DEPUIS 1951, DES MILLIERS DE RÔTISSOIRES RÔTISSENT
        DES POULETS DANS LE MONDE ENTIER, QUI OFFRENT AUX UTILISATEURS LA GARANTIE MAXIMALE DE QUALITÉ ET D'EFFICACITÉ… CARACTÉRISTIQUES GÉNÉRIQUES
        DES RÔTISSOIRES À POULETS Construit en acier inoxydable, 1,5 et 1 mm d'épaisseur. Cache arrière en acier galvanisé. Conçu pour la production
        industrielle de rôtis. Les bacs à jus de grande capacité sont dimensionnés pour recueillir même l'huile qui peut se répandre à travers
        le verre. □ Le verre trempé avec fermeture magnétique, ouverture pivotante, équipé d'une poignée en bakélite pour éviter les brûlures,
        ainsi que les pertes de chaleur avec des économies de consommation conséquentes et également plus d'hygiène, empêchant l'entrée de poussière
        et d'insectes. □ Nous fabriquons des modèles avec lumière. □ Les broches, le roulement et les pointes sont également en acier inoxydable.
        □ Avec des broches de 5/6 poulets chacune. □ Avec des moteurs-réducteurs puissants, qui font tourner les broches à 4 tours par minute.
        Transmissions par chaîne. MACHINES À DOUBLE BROCHE Ces rôtissoires ont l'avantage qu'avec la même dépense énergétique elles font avancer
        le rôti de poulets sur les broches avant. RÔTISSOIRES À POULETS À GAZ La cuisson se fait au moyen de brûleurs en acier inoxydable,
      estil:
        color: '#ffffff'
        negreta: true
        mida: 8.8
    - role: text
      text: de rayons infrarouges, efficaces, écologiques et de grand pouvoir calorifique et de faible consommation. Avec robinets en laiton indépendants,
        avec maximum et minimum réglables, pour fonctionnement au butane-propane ou au gaz naturel. Avec bobine de sécurité et thermocouple. Avec
        des plaques amovibles entre les brûleurs pour faciliter le nettoyage et en acier inoxydable. □ RÔTISSOIRES À POULETS ÉLECTRIQUES Cuisson
        au moyen de résistances blindées en acier inoxydable. □ Ils équipent également un régulateur de puissance, à 3 positions, qui allume et
        éteint l'énergie, en maintenant la chaleur constante, selon la position déterminée. Protégé du contacteur correspondant et avec une veilleuse,
        indicateur de fonctionnement. RÔTISSOIRES À POULETS VITROCÉRAMIQUES ÉLECTRIQUES Cuisson au moyen de résistances blindées en acier inoxydable.
        Avec un verre Schott qui simplifie le nettoyage, car en utilisant le produit approprié et lorsque les plaques sont froides, c'est vraiment
        facile. □ Ils équipent également un régulateur de puissance, à 3 positions, qui allume et éteint l'énergie, en maintenant la chaleur constante,
        selon la position déterminée. Protégé du contacteur correspondant et avec une veilleuse, indicateur de fonctionnement.
      estil:
