- id: p40
  n: 40
  tipus: informacio_general
  capcalera:
    banda: assets/g9/plantilla-quadre-numero.emf
    titol:
      fr: BARBECUES ET BROCHETTES AU CHARBON DE BOIS
      de: GEMÜSEKOHLEGRUBBÜCHER UND SKIZZEN
  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: UN BARBECUE AU CHARBON DE BOIS, OFFRE LA SAVEUR AUTHENTIQUE À LA BRASA, AVEC SON ARÔME, SA JUSTE ET SA TEXTURE À GOUTER, PARFAIT ....,
        À TOUS LES TYPES DE NOURRITURE, COMME LA VIANDE, LE POISSON, LES LÉGUMES, LE PAIN, etc.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: DE PLUS, S'ILS SONT À LA VUE DES INVITÉS, IL DEVIENT UN SPARATE QUI CONFIRME L'AUTHENTICITÉ, DE LA CUISINE AU GRIL. ILS PEUVENT ÊTRE
        INSTALLÉS INDISTIQUEMENT À L'INTÉRIEUR OU À L'EXTÉRIEUR, AVEC LA HOTTE ASPIRANTE CORRESPONDANT.
      estil:
        color: '#000000'
        mida: 10.3
    - role: titol
      text: CONSTRUCTION GÉNÉRIQUE DE BARBECUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Extérieur en fer, peint en noir.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Intérieur en fonte, pour résister à des températures allant jusqu'à 350ºC.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Avec tiroir de collecte des cendres, extraction frontale.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Ils ont un canal pour la collecte des huiles et graisses, amovibles, pour le nettoyage.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Un poker est fourni, que nous utiliserons pour étaler la braise.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Et aussi une longue pince de 300 mm, avec laquelle nous pouvons tourner, puis extraire la nourriture.
      estil:
        color: '#000000'
        mida: 10.3
    - role: titol
      text: BARBECUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Avec murs et fond isolés.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Avec la trémie à charbon en fonte, réglable en hauteur, à l'aide d'une manivelle, à l'avant. Cela permet de rapprocher ou d'éloigner
        le gril du gril, qui est toujours dans la même position, ce qui représente un confort important pour le cuisinier, car il évite les efforts
        pour déplacer le gril et les brûlures.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Les grilles sont fournies avec des nervures amovibles. En option, nous avons des grilles à tige, des demi-plaques ou des supports
        pour faire des paellas. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Ils ont des portes d'entrée pour contrôler la braise.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Monté sur 4 roues pivotantes, dont deux avec freins.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Dans ACCESSOIRES, vous trouverez des plans de travail de 350 mm. large, en acier inoxydable, à placer sur les côtés.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.3
    - role: titol
      text: MULTI-BARBECUE ET BROCHETTE DE CHARBON DE BOIS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Intérieur en brique réfractaire.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Avec trémie à charbon en fonte.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Ils sont équipés d'une colonne arrière en acier inoxydable, à 5 positions, pour placer les grilles à la hauteur souhaitée, permettant
        de travailler avec 2 à la fois, et même un support pour les brochettes. Les trois éléments avec la même braise, ce qui économise du charbon
        et permet d'augmenter la production.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Il a également une étagère supérieure fixe en acier inoxydable pour garder les aliments au chaud.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Fourni avec grilles nervurées et à tige. Toujours en acier inoxydable.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Et aussi un support pour les brochettes ou brochettes, avec la moitié d'entre elles simples et l'autre moitié, doubles. Dans ACCESSOIRES,
        vous les trouverez au cas où vous souhaiteriez plus d'unités.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Monté sur quatre pieds métalliques réglables.
      estil:
        color: '#000000'
        mida: 10.3
    - role: titol
      text: VOIR LES ACCESSOIRES BARBECUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Nous avons des cages en inox pour rôtir des petits aliments (crevettes, champignons, légumes ...) et des cages à poisson qui s'ouvrent
        en deux et permettent de retourner les aliments.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 10.3
    - role: titol
      text: TABLES POUR CHARBON DE BOIS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Renforcé pour supporter le poids du Multi-Barbecue.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Construit en acier peint en noir, en époxy.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Avec un couvercle avant en acier inoxydable, qui sert également de table avant, lorsqu'il est horizontal.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Équipé de 4 roues très résistantes, dont deux avec freins.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Ils sont fournis avec une pelle, pour charger le charbon sur le barbecue.
      estil:
        color: '#000000'
        mida: 10.3
    pos:
      x: 0.5
      y: 2.7
      w: 9.85
      h: 23.0
  - idioma: de
    paragrafs:
    - role: text
      text: EIN GEMÜSE-KOHLE-GRILL, BIETET BRASA DEN AUTHENTISCHEN GESCHMACK MIT AROMA, SAFT UND BESCHAFFENHEIT ZU GESCHMACK, PERFEKT ... FÜR
        ALLE LEBENSMITTEL, WIE FLEISCH, FISCH, GEMÜSE, BROT usw.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: AUCH, WENN SIE IM BLICK DER GÄSTE SIND, WIRD ES ZU EINEM SPARAT, DER DIE AUTHENTIZITÄT BESTÄTIGT, VOM KOCHEN BIS ZUM GRILLEN. SIE
        KÖNNEN UNTERSCHIEDLICH INNEN ODER AUSSEN MIT DER ENTSPRECHENDEN EXTRAKTORHAUBE INSTALLIERT WERDEN.
      estil:
        color: '#000000'
        mida: 10.4
    - role: titol
      text: GENERIC BARBECUE CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.4
    - role: text
      text: Außen in Eisen, schwarz lackiert.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Innenraum aus Gusseisen für Temperaturen bis zu 350 ° C.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Mit Aschesammelschublade, Frontextraktion.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Sie haben einen Kanal für die Sammlung von Ölen und Fetten, entfernbar, zur Reinigung.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Ein Poker wird mitgeliefert, mit dem wir die Glut verbreiten.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Und auch eine lange 300 mm Zange, mit der wir uns drehen und dann das Essen extrahieren können.
      estil:
        color: '#000000'
        mida: 10.4
    - role: titol
      text: GRILL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.4
    - role: text
      text: Mit isolierten Wänden und Boden.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Mit dem Eisenguss-Trichter, höhenverstellbar mittels einer Kurbel vorne. Dies ermöglicht es, sich dem Grill zu nähern oder ihn vom
        Grill zu bewegen, der sich immer in derselben Position befindet. Dies stellt einen wichtigen Komfort für den Koch dar, da keine Anstrengungen
        zum Bewegen des Grills und Verbrennungen erforderlich sind.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Die Grills werden mit abnehmbaren Rippen geliefert. Optional haben wir Stangengrills, halbe Platten oder Stützen, um Paellas herzustellen.
        (Siehe ZUBEHÖR)
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Sie haben Haustüren, um die Glut zu kontrollieren.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Montiert auf 4 Lenkrädern, zwei davon mit Bremsen.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Im ZUBEHÖR finden Sie 350 mm Arbeitsplatten. breit, Edelstahl, an den Seiten zu platzieren.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.4
    - role: titol
      text: MMULTI-BARBECUE UND TABLETTEN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.4
    - role: text
      text: Feuerfeste Ziegelausstattung.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Mit gusseisernem Kohlebehälter.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Sie sind mit einer hinteren Edelstahlsäule mit 5 Positionen ausgestattet, um die Grills auf die gewünschte Höhe zu bringen, sodass
        jeweils 2 verwendet werden können, und sogar mit einer Stütze für die Spieße. Die drei Elemente mit der gleichen Glut, die Kohle spart
        und die Produktion steigern kann.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Es hat auch ein festes Edelstahl-Regal, um Lebensmittel warm zu halten.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Lieferung mit Rippen- und Stangengrill. Immer aus Edelstahl.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Und auch eine Unterstützung für die Spieße oder Spieße, wobei die Hälfte einfach und die andere Hälfte doppelt ist. In ZUBEHÖR finden
        Sie diese, falls Sie mehr Einheiten wünschen.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Auf vier verstellbaren Metallbeinen montiert.
      estil:
        color: '#000000'
        mida: 10.4
    - role: titol
      text: SIEHE BARBECUE ZUBEHÖR
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.4
    - role: text
      text: Wir haben Edelstahlkäfige zum Braten kleiner Lebensmittel (Garnelen, Pilze, Gemüse ...) und Fischkäfige, die sich in zwei Hälften
        öffnen und das Wenden von Lebensmitteln ermöglichen.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 10.4
    - role: titol
      text: KOHLETABELLEN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.4
    - role: text
      text: Verstärkt, um das Gewicht des Multi-Barbecue zu tragen.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Hergestellt aus schwarz lackiertem Stahl aus Epoxid.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Mit einer Edelstahl-Frontabdeckung, die auch als Fronttisch fungiert, wenn sie horizontal ist.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Ausgestattet mit 4 sehr widerstandsfähigen Rädern, zwei davon mit Bremsen.
      estil:
        color: '#000000'
        mida: 10.4
    - role: text
      text: Geliefert werden sie mit einer Schaufel geliefert, um Kohle auf den Grill zu laden.
      estil:
        color: '#000000'
        mida: 10.4
    pos:
      x: 10.65
      y: 2.7
      w: 9.85
      h: 23.0
