- id: p39
  n: 39
  tipus: informacio_general
  capcalera:
    banda: assets/g9/plantilla-quadre-numero.emf
    titol:
      es: BARBACOAS Y ESPETOS DE CARBÓN VEGETAL
      en: VEGETABLE CHARCOAL BARBECUES AND SKETCHES
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: UNA BARBACOA DE CARBÓN VEGETAL, OFRECE EL AUTÉNTICO SABOR A BRASA, CON SU AROMA, JUGOSIDAD Y TEXTURA AL GUSTO, PERFECTOS...., A TODA
        CLASE DE ALIMENTOS, COMO CARNES, PESCADOS, VERDURAS, PAN etc.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: ADEMÁS, SI ESTÁN A LA VISTA DE LOS COMENSALES, SE CONVIERTE EN UN ESPARATE QUE CONFIRMA LA AUTENTICIDAD, DE LA COCCIÓN A LA BRASA.
        SE PUEDEN INSTALAR INDISTINTAMENTE EN EL INTERIOR O EXTERIOR, CON LA CORRESPONDIENTE CAMPANA EXTRACTORA.
      estil:
        color: '#000000'
        mida: 10.8
    - role: titol
      text: CONSTRUCCION GENÉRICA DE LAS BARBACOAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.8
    - role: text
      text: Exterior en hierro, pintado en negro.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Interior en hierro fundido, para soportar temperaturas de hasta 350ºC.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Con cajón de recogida de ceniza, se extracción frontal.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Disponen de canal para la recogida de aceites y grasas, extraíble, para su limpieza.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: En dotación se suministra un atizador, el cual utilizaremos para extender la brasa.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Y también una pinzas largas, de 300 mm., con las cuales podremos voltear, y luego extraer los alimentos.
      estil:
        color: '#000000'
        mida: 10.8
    - role: titol
      text: BARBACOAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.8
    - role: text
      text: Con paredes y fondo aislados .
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Con la tolva carbonera de fundición de hierro, de altura regulable, por medio de una manivela, en el frontal. Ello permite aproximar
        o alejar la brasa de la parrilla, la cual está siempre en la misma posición, lo que representa una comodidad importante para el cocinero,
        ya que le evita esfuerzos de movimientos de la parrilla y quemaduras.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: En dotación las parrillas son acanaladas, las cuales son extraíbles. Opcionalmente, disponemos de parrillas de varilla, de medias
        planchas o soportes para hacer paellas. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Disponen de puertas frontales, para el control de la brasa.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Montadas sobre 4 ruedas giratorias, dos de ellas con freno.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: En ACCESORIOS, encontrarán, encimeras de trabajo, de 350 mm. de ancho, de acero inoxidable, para colocar en los laterales.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.8
    - role: titol
      text: MULTI-BARBACOAS Y ESPETOS DE SOBREMESA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.8
    - role: text
      text: Interior de ladrillo refractario.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Con tolva carbonera de fundición de hierro.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Están dotadas de una columnas posteriores de acero inoxidable, con 5 posiciones, para la colocación de las parrillas, en la altura
        deseada, permitiendo trabajar con 2 a la vez, e incluso, un soporte para los espetos. Los tres elementos con la misma brasa, lo que ahorra
        carbón, y permite aumentar la producción.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: También dispone de un estante superior fijo, de acero inoxidable, para mantener calientes los alimentos.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: En dotación, se suministran parrillas acanaladas y de varilla. Siempre de acero inoxidable.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Y también un soporte para los espetos o pinchos, con la mitad de ellos simples y la otra mitad, dobles. En ACCESORIOS, los encontrarán,
        por si desean mas unidades.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Montadas sobre cuatro patas de metal, regulables.
      estil:
        color: '#000000'
        mida: 10.8
    - role: titol
      text: VER ACCESORIOS PARA BARBACOAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.8
    - role: text
      text: Disponemos de jaulas de acero inoxidable, para asar alimentos pequeños, (gambas, setas, verduras...) y jaulas para pescados, que se
        abren por la mitad, y permiten voltear los alimentos.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 10.8
    - role: titol
      text: MESAS CARBONERAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.8
    - role: text
      text: Reforzadas para soportar el peso de la Multi-Barbacoa.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Construida en acero pintado en color negro, en epoxi.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Con una tapa frontal de acero inoxidable, que también hace la función de mesa frontal, cuando está en posición horizontal.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: Equipadas con 4 ruedas muy resistentes, dos de ellas con freno.
      estil:
        color: '#000000'
        mida: 10.8
    - role: text
      text: En dotación, se suministran con una pala, para la carga de carbón a la barbacoa.
      estil:
        color: '#000000'
        mida: 10.8
    pos:
      x: 0.5
      y: 2.7
      w: 10.614
      h: 23.0
  - idioma: en
    paragrafs:
    - role: text
      text: A VEGETABLE CHARCOAL BARBECUE, OFFERS THE AUTHENTIC FLAVOR TO BRASA, WITH ITS AROMA, JUICY AND TEXTURE TO TASTE, PERFECT ...., TO
        ALL KINDS OF FOOD, LIKE MEAT, FISH, VEGETABLES, BREAD, etc.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: IN ADDITION, IF THEY ARE IN THE SIGHT OF THE GUESTS, IT BECOMES A SPARATE THAT CONFIRMS AUTHENTICITY, FROM COOKING TO GRILL. THEY
        CAN BE INSTALLED INDISTINCALLY INSIDE OR OUTSIDE, WITH THE CORRESPONDING EXTRACTOR HOOD.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: GENERIC BARBECUE CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Exterior in iron, painted in black.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Cast iron interior, to withstand temperatures up to 350ºC.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: With ash collection drawer, front extraction.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: They have a channel for the collection of oils and fats, removable, for cleaning.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: A poker is supplied, which we will use to spread the ember.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: And also a long 300 mm tongs, with which we can turn, and then extract the food.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: BARBACUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: With isolated walls and bottom.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: With the iron-cast coal hopper, height adjustable, by means of a crank, on the front. This allows the grill to be moved closer to
        or further away from the grill, which is always in the same position, which represents an important comfort for the cook, since it avoids
        efforts to move the grill and burns.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: The grills are supplied with ribs, which are removable. Optionally, we have rod grills, half plates or supports to make paellas. (See
        ACCESSORIES)
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: They have front doors to control the ember.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Mounted on 4 swivel wheels, two of them with brakes.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: In ACCESSORIES, you will find 350 mm worktops. wide, stainless steel, to place on the sides.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: MULTI-BARBECUE AND TABLETS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Refractory brick interior.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: With cast iron coal hopper.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: They are equipped with a rear stainless steel column, with 5 positions, to place the grills at the desired height, allowing to work
        with 2 at a time, and even a support for the skewers. The three elements with the same ember, which saves coal, and allows to increase
        production.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: It also has a fixed stainless steel top shelf to keep food warm.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Supplied with ribbed and rod grills. Always in stainless steel.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: And also a support for the skewers or skewers, with half of them simple and the other half, double. In ACCESSORIES, you will find
        them, in case you want more units.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Mounted on four adjustable metal legs.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: SEE BARBECUE ACCESSORIES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: We have stainless steel cages, for roasting small foods, (shrimp, mushrooms, vegetables ...) and fish cages, which open in half, and
        allow food to be turned.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: COAL TABLES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Reinforced to support the weight of the Multi-Barbecue.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Constructed of steel painted in black, in epoxy.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: With a stainless steel front cover, which also functions as a front table, when it is horizontal.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Equipped with 4 very resistant wheels, two of them with brakes.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Supplied, they are supplied with a shovel, for loading coal on the barbecue.
      estil:
        color: '#000000'
        mida: 10.6
    pos:
      x: 11.414
      y: 2.7
      w: 9.086
      h: 23.0
