        color: '#000000'
        mida: 13.0
    - role: text
      text: Allumage piézoélectrique.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Équipées d'un hublot frontal.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SAUTEUSES ÉLECTRIQUES
      estil:
