        200 mm backsplash. Individual and removable grease collection trays. □ Brass taps, equipped with adjustable maximum, minimum, and pilot
        position, with safety coil and thermocouple. High-efficiency cast iron burners, 21 KW. □ and 14 KW. □ Burners can optionally be replaced
        (See ACCESSORIES) Round vitrified cast iron grates, Ø 350/370 mm. □ Adjustable feet. SERIES 2 - (700 mm DEPTH) TABLETOP OR ON OPEN STAND
        With smooth countertop. SERIES 5 - (700 mm DEPTH) ON OPEN STAND With refrigerated top, using water diffusers. □ With washing system that
        drains into the rear channel. With a standard water column, adjustable, 700 x 500 mm high. □ SERIES 8 - (900 mm DEPTH) ON STANDS With
        refrigerated top, using water diffusers. □ With washing system that drains into the rear channel. With waste collection drawer. □ With
        a standard water column, adjustable, 700 x 675 mm high. □ ACCESORIES We have round grates for standard flat-bottom pans, □ and also wok
        pans of various diameters. □
