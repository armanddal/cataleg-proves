- id: p04
  n: 4
  tipus: informacio_general
  capcalera:
    banda: assets/g6/plantilla-quadre-numero.emf
    titol:
      es: COCINAS Y FRYTOPS CENTRALES A GAS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENERAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Exterior en acero inoxidable.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Encimeras formadas por un marco de acero inoxidable de 1,5 mm, de espesor, totalmente soldado.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar. Dichos grifos, están
        a ambos lados
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con quemadores colgantes, de fundición, de 7,5 y 5 kw, de potencia y alto rendimiento. Opcionalmente, se pueden montar quemadores
        de mas potencia. (Ver ACCESORIOS).
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Dichos quemadores colgantes y corona, son desmontables con la mano, para facilitar la limpieza.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con robustas parrillas de fundición vitrificadas de 425 x 425 mm. Opcionalmente, se pueden substituir por planchas lisas o ranuradas,
        de fundición (Ver ACCESORIOS).
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Equipan bandejas recoge-grasas individuales.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: En dotación con columna de agua.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con patas regulables.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: COCINAS SOBRE SOPORTE ABIERTO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Con 2 estantes, el inferior y otro intermedio, de acero inoxidable.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: El mod/cod. 40121410, aparte del horno, incorpora 2 estantes.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: COCINAS SOBRE HORNOS PASANTES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Hornos con puertas por ambos lados.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Interior hornos en acero inoxidable.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con quemadores tubulares debajo de la plancha del horno.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Puertas, de acero inoxidable y contra-puertas embutidas, vitrificadas en negro, debidamente aisladas en fibra de vidrio, con tirador.
      refs:
      - 7
      - 8
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Puertas con bisagras reforzadas, con cierre a presión mediante muelle.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Equipados de serie, con 2 bandejas vitrificadas en negro, y 2 rejillas, de 660x440 mm, extraíbles una por cada lado. Sobre las rejillas
        se pueden colocar recipientes GN 1/1 ó EN.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: CONSTRUCCION GENERAL FRYTOPS, SOBRE SOPORTE ABIERTO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Construcción en acero inoxidable.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Encimeras formadas por un marco de acero inoxidable de 1,5 mm, de espesor, totalmente soldado.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con quemadores tubulares, para mejor reparto del calor.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con bandeja recoge-grasas.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Sobre soporte abierto, con estante inferior de acero inoxidable.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con patas regulables.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: PLACAS FRYTOPS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Con peto transversal a ambos lados, de acero inoxidable.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Dichas placas, pasantes, con desagüe a ambos lados.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Placas de 20 mm, de espesor.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: MODELOS CON PLACA DE HIERRO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Encimera rectificada, con la superficie totalmente lisa.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: MODELOS CON PLACA DE HIERRO RANURADA o MIXTA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Los frytops de ancho 450, con la encimera totalmente ranurada
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Los frytops de ancho 850, con 50% de la encimera rectificada lisa y 50% ranurada.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: MODELOS CON PLACA DE CROMO DURO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Encimera con baño de cromo duro de 50 micras.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: La forma de limpieza, es una vez parada la plancha y al cabo de 30/45 minutos, (aún caliente), se deben colocar cubitos de hielo,
        los cuales se evaporarán inmediatamente. Entonces con una espátula-cúter, (Ver ACCESORIOS), se pasará suavemente, para eliminar al máximo
        la grasa y seguidamente un paño húmedo. No poner desengrasante hasta el día siguiente, antes de poner el frytop en marcha y quedará la
        superficie brillante como nueva.
      estil:
        color: '#000000'
        mida: 11.7
    pos:
      x: 0.5
      y: 3.0
      w: 12.7
      h: 25.5
