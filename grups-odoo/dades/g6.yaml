  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION Made of 18/10 AISI 304 stainless steel, both interior and exterior. With large-diameter holes in the plates
        for draining oil and grease. □ With a front grease collection drawer. □ With a stainless steel backsplash around the entire perimeter.
        □ With a front handrail to prevent burns. □ With adjustable feet on all devices. GAS FRYTOPS-TEPPANYAKI With brass taps, equipped with
        high and low settings, a pilot position, safety coil, and thermocouple. With tubular stainless steel burners. □ With piezoelectric ignition
        and individual viewing window for each burner. ELECTRIC FRYTOPS-TEPPANYAKI With stainless steel sheathed heating elements, mounted in
        properly insulated drawers. With thermostat and operation indicator lights. HARD CHROME SMOOTH TOP PLATES 15 mm thick plates, precision
        ground, with a 50-micron hard chrome coating. □ The cleaning process: Once the plate is turned off and after 30/45 minutes (while still
        warm), ice cubes should be placed on the surface. They will evaporate immediately. Then, gently pass the spatula-cutter to remove as much
        grease as possible, followed by a damp cloth. Do not use degreaser until the next day before starting the plate, and the surface will
        shine like new. A spatula-cutter is supplied for cleaning. It should be used without hitting, simply sliding the blade across the surface.
        □'
