      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Démontable pour faciliter le nettoyage.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Vitesse réglable.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Gestion via un moniteur PLC avec 100 programmes de cuisson et écran tactile.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SAUTEUSES À GAZ
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Équipées de brûleurs tubulaires en acier inoxydable à haut rendement.
      estil:
