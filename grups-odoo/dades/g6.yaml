    - role: text
      text: Entièrement fabriqué en acier inoxydable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Isolation thermique avec des panneaux en fibre céramique haute densité.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Châssis sur 4 pieds réglables en acier inoxydable.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Couvercles équilibrés, équipés d'un ressort de pression pour l'ouverture ou la fermeture, avec des poignées correspondantes.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Équipé d'un robinet pour le remplissage de la cuve avec de l'eau froide ou chaude.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SÉRIE 2 - SAUTEUSES BASCULANTES SUR MEUBLE TECHNIQUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Cuves en acier inoxydable.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Conception frontale pour faciliter la vidange.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SÉRIES 5 ET 8 - SAUTEUSES BASCULANTES SUR MONTANTS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: La cuve est placée entre deux montants en acier inoxydable 18/10 AISI 304 qui la soutiennent, permettant son basculement, avec une
        conception frontale pour faciliter la vidange.
      refs:
