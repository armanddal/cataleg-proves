      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Les côtés des cuves sont en acier inoxydable 18/10 AISI 304, et le fond en acier inoxydable 18/10/2 AISI 316 d'une épaisseur de 12 mm.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SÉRIE 2 - SAUTEUSES BASCULANTES AVEC VOLANT
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Fabriquées avec un système de basculement à volant, équipé d'une poignée pliable, le tout en bakélite.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SÉRIES 2, 5 ET 8 - SAUTEUSES BASCULANTES MOTORISÉES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Équipées d'un puissant moteur réducteur, contrôlé par un bouton-poussoir, pour faciliter le basculement et la vidange correspondante.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SÉRIE 8 - SAUTEUSES AVEC MÉLANGEUR
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Mélangeur en acier inoxydable 18/10/2 AISI 316, avec des pales en téflon céramique.
      refs:
