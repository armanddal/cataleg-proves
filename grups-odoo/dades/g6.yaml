    titol:
      en: CENTRAL GAS STOVES AND FRYTOPS
      fr: CUISINES ET FRYTOPS CENTRAUX À GAZ
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERAL CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.3
    - role: text
      text: Exterior in stainless steel.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Countertops made from a 1.5 mm thick stainless steel frame, fully welded.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Brass faucets equipped with adjustable maximum, minimum, and pilot positions. Includes safety coil and thermocouple. These faucets
        are on both sides.
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Hanging burners, made of cast iron, with 7.5 kW and 5 kW power and high efficiency. Optionally, higher power burners can be installed
        (see ACCESSORIES).
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: These hanging burners and crown are removable by hand for easy cleaning.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Robust enameled cast iron grates measuring 425 x 425 mm. Optionally, they can be replaced with smooth or grooved cast iron griddles
        (see ACCESSORIES).
      estil:
        color: '#000000'
        mida: 10.3
    - role: text
      text: Equipped with individual grease collection tray.
      refs:
      - 4
      estil:
