- id: p33
  n: 33
  tipus: informacio_general
  capcalera:
    banda: assets/g6/plantilla-quadre-numero.emf
    titol:
      es: FRYTOPS -TEPPANYAKY, DE CROMO DURO, DE SOBREMESA O SOBRE SOPORTE, A GAS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL En acero inoxidable 18/10 AISI 304, interior y exterior. Con orificio de gran dimensión, en las placas, para
        la salida del aceite y grasas. □ Con cajón recoge grasas frontal. □ Con peto de acero inoxidable, en todo su contorno. □ Con pasamano
        frontal, para evitar quemaduras. □ Con patas regulables en todos los aparatos. FRYTOPS-TEPPANYAKY A GAS Con grifos de latón, dotados de
        máximo y mínimo y posición piloto, con bobina de seguridad y termopar. Con quemadores tubulares de acero inoxidable. □ Con encendido piezoeléctrico
        y mirilla, individual para cada quemador. FRYTOPS-TEPPANYAKY ELÉCTRICOS Con resistencias blindadas de acero inoxidable, montadas en cajones
        debidamente aislados. Con termostato y pilotos indicadores de funcionamiento. PLACAS SUPERIORES LISAS DE CROMO DURO Placas de 15 mm. de
        espesor, rectificadas, con baño de cromo duro de 50 micras. □ La forma de limpieza, es una vez parada la plancha y al cabo de 30/45 minutos
        (aún caliente), se deben colocar cubitos de hielo, los cuales se evaporarán inmediatamente. Entonces la espátula cúter deberá pasarse
        suavemente, para eliminar al máximo la grasa, y seguidamente un paño húmedo. No poner desengrasante hasta el dia siguiente, antes de poner
        la plancha en marcha y quedará la superficie brillante como nueva. En dotación, se suministra una espátula -cuter, para su limpieza, la
        cual se debe usar sin golpear.., solo deslizando la cuchilla por la encimera. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 9.2
