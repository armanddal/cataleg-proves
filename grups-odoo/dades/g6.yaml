- id: p11
  n: 11
  tipus: informacio_general
  capcalera:
    banda: assets/g6/plantilla-quadre-numero.emf
    titol:
      es: SARTENES BASCULANTES DE 150 A 400 LITROS, A GAS Y ELÉCTRICAS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENERAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Totalmente en acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Aislamiento térmico, con paneles de fibra cerámica, de alta densidad.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Chasis sobre 4 patas, regulables, de acero inoxidable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Tapas equilibradas, dotadas de muelle de presión de cierre o apertura, con su correspondiente asa.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con grifo para el llenado de la cuba, de agua, fría o caliente.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 2 - SARTENES BASCULANTES, SOBRE MUEBLE TÉCNICO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con cubas de acero inoxidable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con diseño, en la parte frontal, para facilitar el vaciado.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIES 5 Y 8 - SARTENES BASCULANTES, SOBRE MONTANTES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: La cuba está situada, entre dos montantes de acero inoxidable 18/10 AISI 304, que la sostienen, permitiendo su basculación, con diseño
        en la parte frontal, para facilitar el vaciado.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Los laterales de las cubas están construidas con acero inoxidable 18/10 AISI 304, y el fondo en acero inoxidable 18/10/2 AISI 316,
        de 12 mm, de espesor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 2 - SARTENES CON BASCULACIÓN MEDIANTE VOLANTE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Se fabrican, con basculación mediante un volante, que dispone de un mango plegable. Todo ello de baquelita.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIES 2, 5 Y 8 - SARTENES CON BASCULACIÓN MOTORIZADA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Equipadas con un potente motor reductor, que se controla mediante un pulsador, para facilitar la basculación y el correspondiente
        vaciado.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIES 8 - SARTENES CON MEZCLADOR
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Mezclador de acero inoxidable 18/10/2 AISI 316, con la palas de teflón cerámico.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Desmontable fácilmente, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Velocidad ajustable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Gestión por medio de un monitor PLC, con 100 programas de cocción y pantalla táctil.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SARTENES A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con quemadores tubulares de acero inoxidable de alto rendimiento
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con válvula termostática, regulable de 100 a 300ºC, y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disponen de mirilla frontal.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SARTENES ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con resistencias blindadas de acero inoxidable, montadas sobre cajones debidamente aislados.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato regulable hasta 300º y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.074
      y: 3.0
      w: 13.1
      h: 25.5
