    - role: text
      text: Completely made of 18/10 AISI 304 stainless steel.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Thermal insulation with high-density ceramic fiber panels.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Chassis with 4 adjustable stainless steel legs.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Balanced lids equipped with a pressure spring for closing or opening, with corresponding handles.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Equipped with a faucet for filling the pan with cold or hot water.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 2 - TILTING PANS ON TECHNICAL CABINET
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Stainless steel pans.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Front design to facilitate draining.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 5 AND 8 - TILTING PANS ON MOUNTS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: The pan is positioned between two 18/10 AISI 304 stainless steel mounts that support it, allowing tilting, with a front design to
        facilitate draining.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: The sides of the pans are made of 18/10 AISI 304 stainless steel, and the bottom is 12 mm thick 18/10/2 AISI 316 stainless steel.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 2 - TILTING PANS WITH HANDWHEEL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Manufactured with tilting via a handwheel, which features a foldable handle, all made of Bakelite.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 2, 5 AND 8 - MOTORIZED TILTING PANS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Equipped with a powerful gear motor, controlled by a push button, to facilitate tilting and corresponding draining.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 8 - PANS WITH MIXER
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Mixer made of 18/10/2 AISI 316 stainless steel, with ceramic Teflon blades.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Easily removable for easy cleaning.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Adjustable speed.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Managed via a PLC monitor with 100 cooking programs and a touchscreen.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: GAS PANS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Equipped with high-efficiency stainless steel tubular burners.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Thermostatic valve adjustable from 100 to 300ºC, with a pilot light. Includes safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Piezoelectric ignition.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Equipped with a front viewing window.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: ELECTRIC PANS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Equipped with stainless steel sheathed heating elements mounted on properly insulated drawers.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Adjustable thermostat up to 300ºC and operation indicator light.
      estil:
        color: '#000000'
        mida: 13.0
