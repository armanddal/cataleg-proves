    - role: titol
      text: CONSTRUCCIÓN GENERAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Totalmente en acero inoxidable 18/10 AISI 304 de 2 mm, de espesor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Fondo cubas de acero inoxidable 18/10/2 AISI 316 de 12 mm, de espesor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con grifo de desagüe de 2’’.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con encimera embutida, a la cual está soldada la cuba.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cubas con todos los cantos redondeados, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Aislamiento térmico, con paneles de fibra cerámica, de alta densidad.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Chasis sobre 4 patas, regulables, de acero inoxidable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Tapas equilibradas, dotadas de muelle de presión de cierre o apertura, con su correspondiente asa.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con grifo para el llenado de la cuba, de agua, fría o caliente.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS CON CALOR INDIRECTO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Disponen de doble cámara para el agua, y así evitar que los alimentos se peguen en el fondo y en los laterales de la cuba
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Así mismo, van equipadas con un grupo de seguridad, y manómetro de control, calibrado a 0,5 bar.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: El llenado de dicha cámara es automático, con control de nivel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: También disponen de 2 grifos, situados en el frontal, para el control manual, de máximo y mínimo de agua.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS AUTOCLAVE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Disponen de una tapa de doble pared, con junta de estanqueidad, de silicona alimentaria.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con cierres de presión y la válvula de seguridad, en el centro de la misma.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS CON MEZCLADOR
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Mezclador de acero inoxidable 18/10/2 AISI 316, con la palas de teflón cerámico.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: De velocidad variable, con posibilidad de inversión de giro
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Desmontable fácilmente, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS BASCULANTES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Sistema de basculación automático, con accionamiento hidráulico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Gestión por medio de un monitor PLC, con 100 programas de cocción y pantalla táctil.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con quemadores tubulares de acero inoxidable de alto rendimiento.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con válvula termostática, regulable de 100 a 300ºC, y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disponen de mirilla frontal.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MARMITAS ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con resistencias blindadas en acero incoloy, montadas sobre cajones debidamente aislados.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato regulable hasta 300º y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.074
      y: 3.0
      w: 14.0
      h: 24.8
