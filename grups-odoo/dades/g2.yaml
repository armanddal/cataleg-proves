      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Avec robinet en laiton, équipé de position réglable maximum, minimum et pilote. Avec bobine de sécurité et thermocouple.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Avec allumage électrique piézo.
      estil:
        color: '#000000'
        mida: 10.5
