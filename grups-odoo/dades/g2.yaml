- id: p04
  n: 4
  tipus: informacio_general
  capcalera:
    banda: assets/g2/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: 450 SNACK
    logo_serie: assets/g2/logo-serie-master.png
    titol:
      es: COCINAS A GAS, ELÉCTRICAS, BAÑOS MARÍA Y MESAS DE APOYO, SOBRE SOPORTES ABIERTOS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENERAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: En acero inoxidable AISI-304.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Encimeras embutidas, de 1,5 mm. de espesor, con cantos redondeados para facilitar la limpieza.
      refs:
      - 1
      - 2
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con patas regulables.
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: COCINAS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con quemadores de fundición, de 7,2 y 4,5 Kw., de potencia (según modelo) y alto rendimiento.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Dichos quemadores y corona, son desmontables para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con robustas parrillas de fundición vitrificadas.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Equipa bandejas recojegrasas individuales.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: COCINAS ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Con conmutadores, con 6 niveles de potencia y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Equipan placas cuadradas de fundición, de 300x300 mm., de 4 Kw. de potencia, cada una.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con dispositivo automático de seguridad, que pára la placa, en caso de no tener ningún elemento en ella.
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: COCINAS ELÉCTRICAS VITROCERÁMICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Encimera de cristal Schott de 6 mm de espesor.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Dicho cristal es muy fácil de limpiar, al ser totalmente plano.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con conmutadores con 2 niveles de potencia y pilotos indicadores de funcionamiento.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con resistencias de wolframio, de 2,6 y 1,8 Kw.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Dispone de limitador automático de temperatura.
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: BAÑOS MARÍA ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Con la cuba, GN 1/1, soldada a la encimera, con todos los cantos internos redondeados.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Con grifo de desagüe, situado en el frontal, con dispositivo de seguridad, para evitar la abertura accidental.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Equipados con una resistencia adhesiva, situada en el fondo de la cuba, de manera que el interior de la misma esta totalmente limpio.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: Dotados de termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 11.1
    - role: text
      text: OPCIONALMENTE, disponemos de un doble fondo perforado de acero inoxidable, ver en ACCESORIOS, para el mantenimiento de alimentos en
        ollas, directamente. O si lo desean, pueden colocar distintas combinaciones de recipientes GN. (Ver catálogo GRUPO-16)
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: MESAS DE APOYO
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Hay modelos con cajón, con guías correderas de máxima calidad.
      estil:
        color: '#000000'
        mida: 11.1
    - role: titol
      text: SOPORTES ABIERTOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.1
    - role: text
      text: Todos los elementos del GRUPO2-450SNACK, pueden equipar OPCIONALMENTE, puertas.Ver ACCESORIOS.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 11.1
