- id: p17
  n: 17
  tipus: condicions_venda
  capcalera:
    banda: assets/g2/plantilla-quadre-numero.emf
    titol:
      es: CONDICIONES DE VENTA
  seccions:
  - pos:
      x: 2.5
      y: 2.325
      w: 17.5
      h: 1.5
    textos:
      es:
      - role: titol
        text: PRECIOS
      - role: text
        text: Los precios de la presente tarifa son P.V.P. (Impuestos no incluidos - IVA)
    icona: assets/g2/condicions-icona-p17-1.png
  - pos:
      x: 2.5
      y: 4.019
      w: 17.5
      h: 1.548
    textos:
      es:
      - role: titol
        text: FORMAS DE PAGO
      - role: text
        text: Pago anticipado a la confirmación del pedido.
    icona: assets/g2/condicions-icona-p17-2.png
  - pos:
      x: 2.5
      y: 5.621
      w: 17.5
      h: 2.043
    textos:
      es:
      - role: titol
        text: PORTES EN ESPAÑA
      - role: text
        text: Pagados en península y Baleares, a partir de 500,- €. En caso de importe inferior (base imponible), se cargarán en factura.
    icona: assets/g2/condicions-icona-p17-3.png
  - pos:
      x: 2.5
      y: 7.715
      w: 17.5
      h: 1.986
    textos:
      es:
      - role: titol
        text: CARACTERÍSTICAS TÉCNICAS
      - role: text
        text: Como fabricantes, nos reservamos el derecho de modificar sin previo aviso las características que constan en este catálogo, en beneficio
          de mejorar nuestros productos.
    icona: assets/g2/condicions-icona-p17-4.png
  - pos:
      x: 2.5
      y: 9.897
      w: 17.5
      h: 5.692
    textos:
      es:
      - role: titol
        text: GARANTIA
      - role: text
        text: La garantía se concede solamente en los defectos de fabricación quedando excluidos de ella la utilización indebida.
      - role: text
        text: PIEZAS
      - role: text
        text: Dicha garantía es de 12 meses en piezas defectuosas, siendo por cuenta del cliente los portes de ida y vuelta de dichas piezas.
          Todo material remitido en garantía se facturará y se procederá a su correspondiente abono, una vez remitidas las piezas defectuosas
          y comprobadas por parte del fabricante.
      - role: text
        text: MANO DE OBRA
      - role: text
        text: El servicio de mano de obra y los desplazamiento son siempre por cuenta del cliente. El fabricante no se hará cargo en ningún caso
          de ningún tipo o clase de indemnización.
    icona: assets/g2/condicions-icona-p17-5.png
  - pos:
      x: 2.5
      y: 13.548
      w: 17.5
      h: 1.5
    textos:
      es:
      - role: titol
        text: JURISDICCIÓN
      - role: text
        text: Serán únicamente competentes, en caso de litigio, los tribunales de Barcelona.
    icona: assets/g2/condicions-icona-p17-6.png
  - pos:
      x: 0.0
      y: 15.241
      w: 21.0
      h: 0.798
    barra_idiomes:
      en: SALES CONDITIONS
      fr: CONDITIONS DE VENTE
    color_fons: '#a22b2d'
  - pos:
      x: 2.5
      y: 16.078
      w: 17.5
      h: 2.497
    textos:
      en:
      - role: titol
        text: PRICES
      - role: text
        text: The prices in this list are retail prices (EX-WORKS).
      fr:
      - role: titol
        text: PRIX
      - role: text
        text: Les prix du présent tarif correspondent à des Prix de Vente au Public. (EX-WORKS).
    icona: assets/g2/condicions-icona-p17-1.png
  - pos:
      x: 2.5
      y: 17.747
      w: 17.5
      h: 2.497
    textos:
      en:
      - role: titol
        text: PAYMENT CONDITIONS
      - role: text
        text: Irrevocable letter of credit or Swift.
      fr:
      - role: titol
        text: FORME DE PAIEMENT
      - role: text
        text: Lettre de crédit bancaire irrévocable o virement bancaire.
    icona: assets/g2/condicions-icona-p17-2.png
  - pos:
      x: 2.5
      y: 19.428
      w: 17.5
      h: 3.361
    textos:
      en:
      - role: titol
        text: TECHNICAL CHARACTERISTICS
      - role: text
        text: As a manufacturer, we reserve the right to modify the characteristics of our catalogues without prior notice, in the interest of
          improving our products.
      fr:
      - role: titol
        text: CARACTERISTIQUES TECHNIQUES
      - role: text
        text: En tant que fabricants, nous nous réservons le droit de modifier sans préavis, les caractéristiques indiquées dans le présent catalogue,
          dans le but d’améliorer nos produïts.
    icona: assets/g2/condicions-icona-p17-4.png
  - pos:
      x: 2.5
      y: 22.104
      w: 17.5
      h: 6.508
    textos:
      en:
      - role: titol
        text: GUARANTEE
      - role: text
        text: The guarantee only covers manufacturing defects and excludes unauthorized use.
      - role: text
        text: PARTS
      - role: text
        text: The guarantee for defective parts are 12 months. All shipping costs are to be paid by the consumer.
      - role: text
        text: The manufacturer does not accept any responsability for any type of comprensation.
      fr:
      - role: titol
        text: GARANTIE
      - role: text
        text: La garantie couvre uniquement les défauts de fabrication, une utilisation incorrecte en étant totalement exclue.
      - role: text
        text: PIECES
      - role: text
        text: Cette garantie est de 12 mois sur les pièces défectueuses, leurs transports d’aller et de retour étant à la charge du client.
      - role: text
        text: Les fabricants n’est en aucun cas responsable d’un quelconque type d’indemnisation.
    icona: assets/g2/condicions-icona-p17-5.png
  - pos:
      x: 2.5
      y: 26.812
      w: 17.5
      h: 2.929
    textos:
      en:
      - role: titol
        text: JURISDICTION
      - role: text
        text: In the event of legal action, the only Courts considered competent are those of Barcelona (Spain)
      fr:
      - role: titol
        text: JURIDICTION
      - role: text
        text: En cas de litige, seuls les Tribunaux de Barcelona (Espagne) seront compétents.
    icona: assets/g2/condicions-icona-p17-6.png
