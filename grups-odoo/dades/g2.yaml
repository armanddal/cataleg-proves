  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERAL CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: In stainless steel AISI-304.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Embedded countertops, 1.5 mm. thick, with rounded edges for easy cleaning.
      refs:
      - 1
      - 2
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With adjustable legs.
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: GAS COOKERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: With brass taps, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With cast iron burners, 7.2 and 4.5 Kw., Of power (depending on model) and high performance.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: These burners and crown are removable for easy cleaning.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With robust vitrified cast iron grills.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Equip individual grease trays.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: ELECTRIC COOKERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: With switches, with 6 power levels and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Equipped square cast iron plates, 300x300 mm., 4 Kw. power, each.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With automatic safety device, which stops the board, in case of not having any element in it.
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: VITROCERAMIC ELECTRIC COOKERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: Schott glass countertop, 6 mm. of thickness.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: This glass is very easy to clean, being completely flat.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With switches with 2 power levels and pilot operation indicators.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With tungsten resistors, 2.6 and 1.8 Kw.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Has an automatic temperature limiter.
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: ELECTRIC BAIN-MARIES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: With the tank, GN 1/1, welded to the countertop, with all rounded internal edges.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With drain tap, located on the front, with safety device, to prevent accidental opening.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Equipped with an adhesive resistance, located at the bottom of the tank, so that the inside of it is completely clean.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Equipped with thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 10.2
