  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION OF REFRIGERATED WALL CABINETS For installation in Food Stores, Supermarkets, Restaurants, Self-service areas,
        etc., for displaying packaged products such as meats, cold cuts, cheeses, vegetables, fruits, dairy products, or beverages, which are
        presented with high visibility thanks to LED lighting under each shelf to enhance the displayed food. Furthermore, it allows the customer
        to take the desired product themselves. Lacquered exterior in color. With double tempered glass on the sides. □ Ecological injected polyurethane
        insulation (CFC-free), with a density of 40 Kgs/m³. Equipped with LED lighting under each shelf. □ Ventilated refrigeration to ensure
        uniform internal temperature. Refrigeration unit located at the bottom. □ Hydrocarbon refrigerant gas R290, offering maximum performance
        to achieve the most eco-friendly energy rating and reduce CO₂ emissions. Controlled by a digital electronic thermometer-thermostat. This
        controller allows temperature and defrost settings. With illuminated on-off switch. Automatic defrost. Operating range +2º to +8ºC, with
        an ambient temperature of +30ºC. With adjustable legs. MODELS WITH 1,380 mm HEIGHT Back panel and base interior in stainless steel 18/10
        AISI 304. □ Front open, with roll-up night curtain. □ With 4 display levels: base plus 3 shelves. □ With 3 adjustable glass shelves. □
        MODELS WITH: Exterior in grey color (RAL-7024). MODELS WITH: Exterior in red color (RAL-3020). Other colors available on request. Please
        consult options. MODELS WITH 2,000 mm HEIGHT Interior in white lacquered steel. □ Exterior in black color (RAL-9005). Equipped with pivoting
        doors made of tempered glass. □ With 5 display levels: base plus 4 shelves. □ With 4 height-adjustable shelves in white lacquered steel.
        □'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.0
      w: 9.0
      h: 25.2
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRIQUE DES MURAUX RÉFRIGÉRÉS Pour installation dans les Magasins d''Alimentation, Supermarchés, Restaurants, Self-services,
        etc., pour l''exposition de produits emballés tels que viandes, charcuteries, fromages, légumes, fruits, produits laitiers ou boissons,
        avec une grande visibilité grâce à un éclairage LED sous chaque étagère, mettant en valeur les aliments exposés. De plus, le client peut
        prendre lui-même le produit souhaité. Extérieur laqué en couleur. Avec vitrages latéraux doubles en verre trempé. □ Isolation en polyuréthane
        injecté écologique (sans CFC), densité de 40 kg/m³. Équipés d’un éclairage LED sous chaque étagère. □ Réfrigération ventilée pour assurer
        une température homogène à l’intérieur. Groupe frigorifique situé dans la partie inférieure. □ Gaz réfrigérant hydrocarbure R290, à rendement
        maximal pour obtenir une classification énergétique écologique et réduire les émissions de CO₂. Commande par thermomètre-thermostat électronique
        numérique. Ce programmateur permet de régler la température et les dégivrages. Avec interrupteur lumineux marche-arrêt. Dégivrage automatique.
        Plage de fonctionnement de +2º à +8ºC, avec une température ambiante de +30ºC. Avec pieds réglables. MODÈLES DE 1 380 mm DE HAUTEUR Arrière
        et base intérieurs en acier inoxydable 18/10 AISI 304. □ Ouverts à l’avant, avec rideau enroulable pour la nuit. □ Avec 4 niveaux d’exposition
        : base plus 3 étagères. □ Avec 3 étagères en verre, réglables en hauteur. □ MODÈLES AVEC: Extérieur en gris (RAL-7024). MODÈLES AVEC:
        Extérieur en rouge (RAL-3020). Autres couleurs disponibles sur demande. Veuillez consulter les options. MODÈLES DE 2 000 mm DE HAUTEUR
        Intérieur en acier laqué blanc. □ Extérieur en noir (RAL-9005). Équipés de portes pivotantes en verre trempé. □ Avec 5 niveaux d’exposition:
