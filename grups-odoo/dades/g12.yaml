    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA DE LOS ARMARIOS VITRINA Destinados para su instalación en Bares, Restaurantes, Pastelerías, etc. Ofreciendo
        una visión panorámica del producto expuesto, ya que es visible desde los 4 lados, lo cual es un reclamo y facilita la venta. Exterior
        en chapa de acero lacada a color. Base interior fabricada en acero inoxidable. Aislamiento de poliuretano inyectado ecológico, (libre
        de CFC), con una densidad de 40 Kgs/m3. Cristales templados y dobles, con cámara de aire, en los 4 costados. Con una puerta pivotante.
        □ Dotadas de iluminación led. Grupo frigorífico situado en la peana inferior. □□ Gas refrigerante de hidrocarburo R290. De máximo rendimiento
        para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato electrónico
        digital. Dicho programador permite ajustar la temperatura y los desescarches. □□ Con interruptor luminoso de marcha-paro. Refrigeración
        ventilada, para conseguir la temperatura homogénea en el interior. Desescarche automático. ARMARIOS VITRINA DE CONSERVACIÓN Régimen de
        trabajo +2 +8º C, con una temperatura ambiente de +30ºC. Con rejillas de acero plastificado, regulables en altura. □ Modelos con patas
        regulables. □ Modelos con 4 ruedas, 2 de ellas con freno. □ ARMARIOS VITRINA DE CONGELACIÓN Régimen de trabajo -18 -22º C, con una temperatura
        ambiente de +30ºC. Con estantes de cristal, regulables en altura. □ Con 4 ruedas, 2 de ellas con freno. □
