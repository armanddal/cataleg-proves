- id: p32
  n: 32
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Cristales templados
        y dobles, con cámara de aire. Con iluminación led. Grupo frigorífico situado en la peana inferior. Gas refrigerante de hidrocarburo R290.
        De máximo rendimiento para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato
        electrónico digital. Dicho programador permite ajustar la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. □
        Desescarche automático. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +25ºC. CONSTRUCCIÓN VITRINAS MOSTRADOR Se pueden
        instalar en cualquier negocio, aunque el lugar ideal, es para Snacks, para exposición y venta de todo tipo de alimentos, como comidas,
        pasteles, etc. y bebidas, al tener visibilidad desde todos los lados. Exterior en chapa de acero lacada en color blanco. □ Base interior-inferior,
        en acero inoxidable AISI 304 18/10. Perfilería en aluminio lacado en color blanco. Con 2 puertas correderas, en la parte posterior, para
        la reposición de los alimentos. □ Con 3 estantes de cristal, regulables en altura y 4 niveles de exposición incluyendo la base interior.
        □ Refrigeración ventilada, para conseguir la temperatura homogénea en el interior. MODELOS CON CRISTAL FRONTAL CURVADO □ Serie 5, con
        cristal frontal fijo. Serie 8, con cristal frontal abatible, para facilitar la limpieza. MODELOS CON CRISTAL FRONTAL RECTO □ Serie 5,
        con cristal frontal fijo. Serie 8, con cristal frontal abatible, para facilitar la limpieza. CONSTRUCCIÓN VITRINAS CERRADAS Diseñadas
        para su colocación, en la parte inferior-frontal de las barras de bar, a las cuales se puede acceder desde la parte de los camareros,
        por medio de puertas pivotantes. Para la exposición de tapas, comidas, etc, que pueden ver los clientes, al disponer de un cristal frontal
        inclinado. □ Exterior e interior fabricados en acero inoxidable AISI 304 18/10. Con puertas pivotantes, con tirador incorporado y burlete
        dotado de cámara de aire, para asegurar la estanqueidad, fácilmente sustituible. Con bisagras de torsión, para el cierre automático, con
        posición de mantenimiento abierto, cuando supera los 95º. Con 2 rejillas de acero plastificado, regulables en altura y tres niveles de
        exposición incluyendo la base interior. □ Cristal frontal inclinado y abatible, para facilitar la limpieza. □ Refrigeración estática.
        Con patas regulables.
      estil:
        color: '#000000'
