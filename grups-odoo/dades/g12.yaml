    - role: text
      text: 'CONSTRUCCIÓN GENÉRICA DE LOS MURALES REFRIGERADOS Para su instalación en Tiendas de Alimentación, Supermercados, Restaurantes, Self-services,
        etc, para la exposición de los productos envasados, tales como carnes, embutidos, quesos, verduras, frutas y lácteos o bebidas, que se
        ofrecen al consumidor, con mucha visibilidad, ya que disponen de iluminación led, debajo de cada estante, para realzar los alimentos expuestos.
        Y además para que el propio cliente pueda coger el producto que desea. Exterior lacado a color. Con cristales dobles, en los laterales,
        templados. □ Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Dotados de iluminación led,
        debajo de cada estante. □ Refrigeración ventilada, para conseguir la temperatura homogénea en el interior. Grupo frigorífico situado en
        la parte inferior. □ Gas refrigerante de hidrocarburo R290. De máximo rendimiento para obtener la calificación energética mas ecológica,
        y reducir las emisiones de CO2. Control por medio de termómetro-termostato electrónico digital. Dicho programador permite ajustar la temperatura
        y los desescarches. Con interruptor luminoso de marcha-paro. Desescarche automático. Régimen de trabajo +2º + 8º C, con una temperatura
        ambiente de +30ºC. Con patas regulables. MODELOS DE 1.380 mm DE ALTURA Trasero mas la base interiores, de acero inoxidable 18/10 AISI
        304. □ Abiertos frontalmente, con cortina enrollable, para la noche. □ Con 4 niveles de exposición, base mas 3 estantes. □ Con los 3 estantes
        de cristal, regulables en altura. □ MODELOS CON: Exterior en color gris (RAL-7024). MODELOS CON: Exterior en color rojo (RAL-3020). Opcionalmente
