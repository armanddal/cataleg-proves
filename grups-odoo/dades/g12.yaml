  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL ARMARIOS FRIGORIFICOS Son ideales para su colocación sobre mostrador, para mantener en frío latas, botellas,
        lácteos o alimentos, y a la vista. Exterior en chapa de acero lacada a color. Cuba interna en material sanitario ABS, con cantos redondeados,
        y guías en los laterales, para la colocación de las rejillas. □ Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una
        densidad de 40 Kgs/m3. Con una puerta batiente, de cristal doble con cámara de aire. Con rejillas de acero plastificadas. Con iluminación
        led. Refrigeración estática Roll-Bond, con ventilador, para conseguir la temperatura homogénea en el interior. □ Grupo frigorífico situado
        en la parte inferior-posterior. Gas refrigerante de hidrocarburo R600a. De máximo rendimiento para obtener la calificación energética
        mas ecológica, y reducir las emisiones de CO2. Control por medio de termostato. Régimen de trabajo +2 +8º C, con una temperatura ambiente
        de +28ºC Con patas antideslizantes, regulables. CONSTRUCCIÓN GENERAL ESCARCHADORES DE COPAS Diseñados para escarchar copas, con lo cual,
        se mantiene mas tiempo fría, la temperatura de la bebida. Interior y exterior en acero inoxidable 18/10 AISI 304. Cuba interna, con cantos
        redondeados, y guías en los laterales, para la colocación de las rejillas. Aislamiento de poliuretano inyectado ecológico, (libre de CFC),
        con una densidad de 40 Kgs/m3. Con una puerta reversible, con tirador incorporado y burlete dotado de cámara de aire, para asegurar la
        estanqueidad, fácilmente sustituible. Con bisagras de torsión, para el cierre automático, con posición de mantenimiento abierto, cuando
        supera los 95º. Con 1 rejilla de acero plastificada, regulable en altura. Grupo frigorífico situado en la parte inferior. □ Refrigeración
        por medio de placa fria, estática. Desescarche automático. Gas refrigerante de hidrocarburo R290. De máximo rendimiento para obtener la
        calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato electrónico digital.
        Dicho programador permite ajustar la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. □ Régimen de trabajo -5
        -10º C, con una temperatura ambiente de +32ºC Con patas antideslizantes, regulables. ESCARCHADOR CON PUERTA DE CRISTAL Con una puerta
        batiente, de cristal doble, con cámara de aire. □ ESCARCHADOR CON PUERTA CIEGA Con una puerta batiente, de acero inoxidable 18/10 AISI
        304. □
