- id: p86
  n: 86
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION OF HORIZONTAL FREEZER CHESTS Designed for intensive, professional use. Exterior in white lacquered steel sheet.
        Interior in white aluminium. Ecological CFC-free injected polyurethane insulation, with a density of 40 kg/m³ and 60 mm thickness. Equipped
        with LED lighting. □ Static refrigeration, by copper coil located inside the sides and base, within the insulation zone. Refrigeration
        unit located at the bottom. □ Hydrocarbon refrigerant gas. Maximum efficiency for the most environmentally friendly energy rating and
        CO₂ emissions reduction. Controlled by an analogue thermostat with fast-freeze setting and door open alarm. □ Manual defrost, with drain
        tube for easier cleaning. Equipped with lock. □ Operating range: -18º to -22ºC, with an ambient temperature of +30ºC. CHESTS WITH SOLID
        FLIP-UP LID For installation in all types of businesses, storage areas or backrooms, to store products that must remain frozen. These
        freezers have large capacity, making them suitable for stock reserves. The internal LED light operates when the flip-up lid is lifted.
        □ Supplied with one basket. Additional baskets available (see accessories). □ CHESTS WITH SLIDING GLASS DOORS GAS □ Designed for stores
        that want to keep frozen goods and ice cream visible, reducing cold loss when doors are opened. Suitable for public view or storage area
        installation. Basket placement possible (see accessories). □ With 4 wheels, 2 of them with brake.'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.0
      w: 9.0
      h: 22.5
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRIQUE DES COFFRES DE CONGÉLATION HORIZONTAUX Conçus pour un usage intensif et professionnel. Extérieur en tôle d''acier
        laqué blanc. Intérieur en aluminium blanc. Isolation en polyuréthane injecté écologique (sans CFC), densité de 40 kg/m³, épaisseur de
        60 mm. Équipés d’un éclairage LED. □ Réfrigération statique par serpentin en cuivre situé à l''intérieur des parois latérales et de la
        base, dans la zone d''isolation. Groupe frigorifique situé dans la partie inférieure. □ Gaz réfrigérant hydrocarbure. Rendement maximal
        pour obtenir la meilleure classe énergétique écologique et réduire les émissions de CO₂. Contrôle via thermostat analogique avec position
        surgélation rapide et alarme en cas d’ouverture prolongée. □ Dégivrage manuel, avec tuyau de vidange pour faciliter le nettoyage. Équipés
        d’une serrure. □ Plage de fonctionnement : -18º à -22ºC, température ambiante de +30ºC. COFFRES AVEC COUVERCLE PLEIN ABATTANT Pour installation
        dans tout type de commerce, réserve ou arrière-boutique, pour stocker des produits devant rester congelés. Grande capacité de stockage,
        idéale comme réserve. L’éclairage LED interne s’allume à l’ouverture du couvercle abattant . □ Fournis avec un panier. Possibilité d''ajouter
        d''autres paniers (voir accessoires). □ COFFRES AVEC PORTES COULISSANTES EN VERRE □ Conçus pour les établissements souhaitant exposer
        les produits congelés et glaces tout en évitant les pertes de froid à l’ouverture. Adaptés à la présentation au public ou à l’usage en
        réserve. Possibilité d''ajouter des paniers (voir accessoires). □ Avec 4 roues, dont 2 avec frein.'
      estil:
        color: '#000000'
        mida: 12.8
