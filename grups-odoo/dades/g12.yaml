  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL Concebidos para su colocación tras barra, para mantener en frio, latas, botellas, etc, que al tener las puertas
        con cristal, facilitan la localización del producto y así mismo, es un reclamo para la venta, al estar iluminados. □ Exterior en chapa
        de acero lacada en negro. □ Cuba interna en aluminio blanco, y con soportes en los laterales, para la regulación y colocación de las rejillas.
        □ Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Con 2 rejillas de acero plastificadas,
        por cada puerta. □ Con iluminación led. Dotados de cerraduras en las puertas de serie. Refrigeración ventilada, para conseguir la temperatura
        homogénea en el interior. □ Grupo frigorífico situado en la parte inferior-posterior. Gas refrigerante de hidrocarburo R600a. De máximo
        rendimiento para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato
        electrónico digital. Dicho programador permite ajustar la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. □
        Desescarche automático. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +32ºC. Con patas antideslizantes, regulables. MODELOS
        CON PUERTAS BATIENTES Con las puertas batientes, con el tirador incorporado y burlete dotado de cámara de aire, para asegurar la estanqueidad,
        fácilmente sustituible. □ Cristales dobles dotados de cámara de aire. Con bisagras de torsión, para el cierre automático, con posición
        de mantenimiento abierto, cuando supera los 95º. MODELOS CON PUERTAS CORREDERAS Son los modelos recomendables, cuando se dispone de poco
        espacio. Con las puertas correderas, y con el tirador incorporado. □ Cristales dobles dotados de cámara de aire.
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 2.5
      w: 18.96
      h: 13.2
