- id: p63
  n: 63
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Ideados para su instalación en Restaurantes, Carnicerías, etc., que quieren ofrecer carnes de gran calidad y
        muy sabrosas, para clientes Gourmet. El proceso de maduración de la carne, que suele durar varias semanas, precisa que la temperatura
        y la humedad, estén controladas. Con ello se consigue que las encimas naturales, actúen sobre los tejidos y  la grasa, mejorando la ternura
        de la carne. Y además se evita el deterioro y que las bacterias dañinas, afecten el sabor natural de la carne. Exterior en chapa de acero
        lacada en color negro. Interior en acero inoxidable 18/10, AISI 304., con cantos redondeados para facilitar la limpieza. Aislamiento de
        poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Cristales templados, dobles, con cámara de aire. Con puertas
        pivotantes, reversibles. □ Dotados de doble iluminación led, con tono rojizo. □ Gas refrigerante de hidrocarburo, R290, de máximo rendimiento
        para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Refrigeración ventilada, para conseguir la temperatura
        homogénea en el interior. Con filtro de carbón activo Control por medio de termómetro-termostato electrónico digital. Dicho programador
        permite ajustar la temperatura y los desescarches. □ También equipan el control digital de la humedad, entre 40% y 95%, sin aportación
        de agua. □ Desescarche automático. Régimen de trabajo -2 + 8º C, con una temperatura ambiente de +30ºC . □ Con los estantes y barra carnicera
        de acero inoxidable 18/10 AISI 304. □ Con patas regulables Opcionalmente se pueden suministrar bandejas con bloques de sal de Himalaya.
        □
      estil:
        color: '#000000'
        mida: 12.8
