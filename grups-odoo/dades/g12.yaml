      text: 'GENERIC CONSTRUCTION OF DISPLAY CABINETS Intended for installation in Bars, Restaurants, Pastry Shops, Supermarkets, etc., offering
        a view of the displayed product, allowing, if desired, the customer to take the desired item by opening the door once decided, and upon
        closing it again, no cold is lost. Exterior in colour-lacquered steel sheet. Eco-friendly injected polyurethane insulation (CFC-free),
        with a density of 40 Kgs/m3. Tempered glass with air chamber. With pivoting doors. □ Equipped with LED lighting. Refrigeration unit located
        at the bottom. □ Hydrocarbon refrigerant gas. Maximum efficiency to achieve the most eco-friendly energy rating and reduce CO2 emissions.
        Controlled by digital electronic thermometer-thermostat. The programmer allows temperature and defrost settings. □ With illuminated on-off
        switch. Automatic defrost. Series 2 REFRIGERATION AND FREEZING Narrow width for installation in small spaces. With adjustable feet. REFRIGERATION:
        With static cooling with support fan. R600a refrigerant gas. Operating range +2 +8ºC, with ambient temperature of +30ºC. With 4 height-adjustable
        plastic-coated steel shelves. □ FREEZING: Static cooling. R290 refrigerant gas. Operating range -18 -22ºC, with ambient temperature of
        +30ºC. With 6 fixed shelves acting as evaporators. □ Series 3 REFRIGERATION Black exterior and stainless steel interior. □ Ventilated
        cooling to achieve uniform internal temperature. R600a refrigerant gas. Operating range +2 +8ºC, with ambient temperature of +30ºC. With
        height-adjustable plastic-coated steel shelves. □ Doors equipped with lock. Con patas regulables. Series 4 REFRIGERATION AND FREEZING
        With adjustable feet. REFRIGERATION: With static cooling with support fan. R600a refrigerant gas. Operating range +2 +8ºC, with ambient
        temperature of +30ºC. With 5 height-adjustable plastic-coated steel shelves. □ FREEZING: Static cooling. R290 refrigerant gas. Operating
        range -18 -22ºC, with ambient temperature of +30ºC. With 5 fixed shelves acting as evaporators. □ Series 5 REFRIGERATION AND FREEZING
        Its modular design allows for linear combinations by joining refrigeration and freezing cabinets. With 4 wheels, 2 of them with brake.
        REFRIGERATION: With static cooling with support fan. R600a refrigerant gas. Operating range +2 +8ºC, with ambient temperature of +30ºC.
