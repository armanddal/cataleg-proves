- id: p64
  n: 64
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
    titol:
      es: E MEAT AGING DISPLAY CABINETS F ARMOIRES EXPOSITRICES DE MATURATION DE VIANDE
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION Designed for installation in restaurants, butcher shops, etc., that wish to offer high-quality, flavorful meats
        for gourmet clients. The meat aging process, which usually lasts several weeks, requires controlled temperature and humidity. This allows
        natural enzymes to act on the tissues and fat, improving the meat’s tenderness. It also prevents spoilage and protects the natural flavor
        of the meat from harmful bacteria. Exterior made of lacquered steel sheet in black. Interior in stainless steel 18/10, AISI 304, with
        rounded corners for easy cleaning. Eco-friendly injected polyurethane insulation (CFC-free), with a density of 40 Kg/m³. Double tempered
        glass with air chamber. With pivoting, reversible doors. □ Equipped with double LED lighting, with a reddish hue. □ Hydrocarbon refrigerant
