- id: p81
  n: 81
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: de
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA DE LAS ISLAS DE CONGELACIÓN Actúan como expositores de producto congelado, para su instalación en supermercados,
        tiendas de alimentación, etc. Con gran visibilidad al disponer de todas las puertas superiores de cristal deslizante y potente luz led,
        para incentivar el producto, con lo que se consigue atraer al consumidor. Su diseño permite su colocación de forma individual o formando
        una isla. □ Exterior e interior en chapa de acero lacada en color blanco. Con paragolpes en sentido longitudinal. □ Aislamiento de poliuretano
        inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3, de 80 mm. de espesor. Dotados de iluminación led. □ Refrigeración
        estática, mediante serpentín de cobre situado en la parte interior de los laterales y base, en la zona del aislamiento. Grupo frigorífico
        situado en la parte inferior. □ Gas refrigerante de hidrocarburo R290. De máximo rendimiento para obtener la calificación energética mas
        ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato electrónico digital. Dicho programador permite ajustar
        la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. Desescarche automático, con desagüe. □ Equipados con puertas
        correderas de cristal curvado y templado, con el marco calefactado. □ Con rejillas divisorias, para la clasificación del producto. □ Régimen
        de trabajo -18º -22º C, con una temperatura ambiente de +30ºC. Equipados con cerradura. Con ruedas reforzadas con freno. ISLAS DE CONGELACIÓN
        CENTRALES Con acceso por ambos lados, que dispone de 4 puertas de cristal (2 por cada lado). □ Colocando varias unidades permite realizar
        una línea central de 1 metro de ancho. □ ISLAS DE CONGELACIÓN MURALES Se pueden instalar contra la pared, una o varias unidades, formando
        una línea de 790 mm. de ancho. □ O la posibilidad de formar una isla, uniéndolas por la parte posterior, en tal caso sería de 1.580 mm.
        de ancho. □
      estil:
        color: '#000000'
        mida: 12.8
