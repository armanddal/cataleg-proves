  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: 'CONSTRUCCIÓN GENÉRICA DE LOS ARMARIOS EXPOSITORES Destinados para su instalación en Bares, Restaurantes, Pastelerías, Supermercados,
        etc. ofreciendo una visión del producto expuesto, permitiendo si se desea, que el propio cliente consumidor, coja el producto deseado,
        abriendo la puerta, una vez decidido y que al cerrarla de nuevo, no pierde frío. Exterior en chapa de acero lacada a color. Aislamiento
        de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Cristales templados, con cámara de aire. Con puertas
        pivotantes. □ Dotados de iluminación led. Grupo frigorífico situado en la parte inferior. □ Gas refrigerante de hidrocarburo. De máximo
        rendimiento para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato
        electrónico digital. Dicho programador permite ajustar la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. Desescarche
        automático. Serie 2 CONSERVACIÓN Y CONGELACIÓN De poca anchura, para la colocación es espacios reducidos. Con patas regulables. CONSERVACIÓN:
        Con frío estático con ventilador de apoyo. Gas refrigerante R600a. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +30ºC.
        Con 4 rejillas de acero plastificado, regulables en altura. □ CONGELACIÓN: Refrigeración estática. Gas refrigerante R290. Régimen de trabajo
        -18 -22º C, con una temperatura ambiente de +30ºC. Con 6 rejillas fijas que actúan como evaporadores. □ Serie 3 CONSERVACIÓN Color exterior
        negro, e interior en acero inoxidable. □ Refrigeración ventilada, para conseguir la temperatura homogénea en el interior. Gas refrigerante
        R600a. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +30ºC. Con rejillas de acero plastificado, regulables en altura. □
        Puertas dotadas de cerradura. Con patas regulables. Serie 4 CONSERVACIÓN Y CONGELACIÓN Con patas regulables. CONSERVACIÓN: Con frío estático
        con ventilador de apoyo. Gas refrigerante R600a. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +30ºC. Con 5 rejillas de
        acero plastificado, regulables en altura. □ CONGELACIÓN: Refrigeración estática. Gas refrigerante R290. Régimen de trabajo -18 -22º C,
        con una temperatura ambiente de +30ºC. Con 5 rejillas fijas que actúan como evaporadores. □ Serie 5 CONSERVACIÓN Y CONGELACIÓN Su modularidad,
        permite hacer conjuntos lineales uniendo armarios de conservación y de congelación. Con 4 ruedas, 2 de ellas con freno. CONSERVACIÓN:
        Con frío estático con ventilador de apoyo. Gas refrigerante R600a. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +30ºC.
        Con 5 rejillas de acero plastificado, regulables en altura. □ CONGELACIÓN: Refrigeración ventilada, para conseguir la temperatura homogénea
        en el interior. Gas refrigerante R290. Régimen de trabajo -18 -22º C, con una temperatura ambiente de +30ºC. Con 5 rejillas fijas que
        actúan como evaporadores. □ Serie 8 CONSERVACIÓN Y CONGELACIÓN Su modularidad, permite hacer conjuntos lineales uniendo armarios de conservación
        y de congelación. Con 4 ruedas, 2 de ellas con freno. Refrigeración ventilada, para conseguir la temperatura homogénea en el interior.
        Gas refrigerante R290. Con 4 rejillas de acero plastificado, regulables en altura. □ CONSERVACIÓN: Régimen de trabajo +2 +8º C, con una
        temperatura ambiente de +30ºC. CONGELACIÓN: Régimen de trabajo -18 -22º C, con una temperatura ambiente de +30ºC.'
