        de régler la température et les dégivrages. □ Avec interrupteur lumineux marche-arrêt. Dégivrage automatique. Série 2 CONSERVATION ET
        CONGÉLATION De faible largeur pour installation dans des espaces réduits. Avec pieds réglables. CONSERVATION: Avec froid statique avec
        ventilateur d’appoint. Gaz réfrigérant R600a. Plage de fonctionnement +2 +8ºC, avec une température ambiante de +30ºC. Avec 4 grilles
