    - role: text
      text: 'GENERIC CONSTRUCTION OF DISPLAY CABINETS Designed for installation in Bars, Restaurants, Pastry Shops, etc. Offering a panoramic
        view of the displayed product, as it is visible from all four sides, which attracts attention and facilitates sales. Exterior in colour-coated
        lacquered steel sheet. Interior base made of stainless steel. Ecological injected polyurethane insulation (CFC-free), with a density of
        40 Kg/m³. Tempered double-glazed glass with air chamber on all four sides. Equipped with one pivoting door. □ Fitted with LED lighting.
        Refrigeration unit located in the bottom base . □□ Refrigerant gas: hydrocarbon R290. Maximum efficiency for optimal energy rating and
        reduced CO₂ emissions. Controlled via digital electronic thermometer-thermostat. This controller allows temperature and defrost settings.
        □□ With illuminated on/off switch. Ventilated refrigeration, for uniform interior temperature. Automatic defrost. CHILLER DISPLAY CABINETS
        Operating range +2 to +8ºC, with ambient temperature up to +30ºC. Adjustable-height plastic-coated steel shelves. □ Models with adjustable
        legs. □ Models with 4 castors, 2 with brake. □ FREEZER DISPLAY CABINETS Operating range -18 to -22ºC, with ambient temperature up to +30ºC.
        With glass shelves, height-adjustable. □ With 4 castors, 2 with brake. □'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE DES VITRINES RÉFRIGÉRÉES Conçues pour une installation dans les Bars, Restaurants, Pâtisseries, etc. Offrant
        une vue panoramique du produit exposé, visible des 4 côtés, ce qui attire l’attention et facilite la vente. Extérieur en tôle d’acier
        laquée en couleur. Base intérieure en acier inoxydable. Isolation en polyuréthane injecté écologique (sans CFC), avec une densité de 40
        Kg/m³. Vitrages trempés et doubles, avec chambre à air, sur les 4 côtés. Avec une porte pivotante. □ Équipées d’un éclairage LED. Groupe
        frigorifique situé dans la base inférieure. □□ Gaz réfrigérant hydrocarboné R290. Rendement maximal pour une classification énergétique
        écologique et une réduction des émissions de CO₂. Commande par thermomètre-thermostat électronique digital. Ce programmateur permet de
        régler la température et les dégivrages. □□ Avec interrupteur lumineux marche/arrêt. Réfrigération ventilée pour assurer une température
        homogène à l’intérieur. Dégivrage automatique. VITRINES DE CONSERVATION Plage de fonctionnement de +2 à +8 ºC, avec une température ambiante
        de +30 ºC. Grilles en acier plastifié, réglables en hauteur. □ Modèles avec pieds réglables. □ Modèles avec 4 roulettes, dont 2 avec frein.
        □ VITRINES DE CONGÉLATION Plage de fonctionnement de -18 à -22 ºC, avec une température ambiante de +30 ºC. Avec des étagères en verre,
        réglables en hauteur. □ Avec 4 roulettes, dont 2 avec frein. □
