- id: p27
  n: 27
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
    titol:
      es: E BACK-BAR REFRIGERATED DISPLAY UNITS F VITRINES RÉFRIGÉRÉES ARRIÈRE-BAR
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION Designed for back-bar placement to keep cans, bottles, etc., cold. The glass doors facilitate product visibility
        and serve as an attractive display for sales, as they are illuminated. □ Exterior made of black lacquered steel sheet. □ Internal cavity
        in white aluminum, with side supports for shelf adjustment and placement. □ Eco-friendly injected polyurethane insulation (CFC-free) with
        a density of 40 kg/m³. Equipped with 2 plastic-coated steel shelves per door. □ LED lighting. Standard door locks. Ventilated refrigeration
        for uniform interior temperature. □ Refrigeration unit located at the lower rear section. Uses R600a hydrocarbon refrigerant, ensuring
        maximum efficiency for an eco-friendly energy rating and reduced CO₂ emissions. Digital electronic thermometer-thermostat for temperature
        and defrost control. □ Illuminated on/off switch. □ Automatic defrosting. Operating temperature range: +2°C to +8°C, with an ambient temperature
        of +32°C. Adjustable, non-slip feet. MODELS WITH SWING DOORS Swing doors with integrated handles and gaskets featuring an air chamber
        for airtight sealing, easily replaceable. □ CristaDouble-glazed glass with an air chamber. Torsion hinges for automatic closing, with
        a stay-open position when exceeding 95°. MODELS WITH SLIDING DOORS Recommended for limited spaces. Sliding doors with integrated handles.
        □ Double-glazed glass with an air chamber.'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRALE Conçus pour être placés derrière un bar afin de maintenir au frais canettes, bouteilles, etc. Les portes en
        verre facilitent la visibilité des produits et servent également d’atout pour la vente grâce à leur éclairage. □ Extérieur en tôle d’acier
        laquée noire. □ Cuve interne en aluminium blanc, avec supports latéraux pour le réglage et la disposition des grilles. □ Isolation en
        polyuréthane injecté écologique (sans CFC) avec une densité de 40 kg/m³. Équipé de 2 grilles en acier plastifié par porte. □ Éclairage
        LED. Serrures de série sur les portes. Réfrigération ventilée pour une température homogène à l’intérieur. □ Groupe frigorifique situé
        dans la partie inférieure arrière. Gaz réfrigérant hydrocarboné R600a, garantissant une efficacité maximale pour une classification énergétique
        plus écologique et une réduction des émissions de CO₂. Contrôle via un thermomètre-thermostat électronique numérique permettant de régler
        la température et le dégivrage. □ Interrupteur lumineux marche/arrêt. □ Dégivrage automatique. Plage de température de fonctionnement:
        +2°C à +8°C, avec une température ambiante de +32°C. Pieds antidérapants réglables. MODÈLES AVEC PORTES BATTANTES Portes battantes avec
        poignées intégrées et joints dotés d’une chambre à air pour assurer l’étanchéité, facilement remplaçables. □ Verre double avec chambre
        à air. Charnières à torsion pour une fermeture automatique, avec position de maintien ouvert au-delà de 95°. MODÈLES AVEC PORTES COULISSANTES
        Recommandés pour les espaces réduits. Portes coulissantes avec poignées intégrées. □ Verre double avec chambre à air.'
      estil:
        color: '#000000'
        mida: 12.8
