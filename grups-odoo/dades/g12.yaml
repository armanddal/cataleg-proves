  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION OF DISPLAY COUNTER SHOWCASES Designed for installation in food stores, supermarkets, restaurants, etc., for
        the display and sale of products offered to the consumer, with visibility from all sides and at customer height. Equipped with high-intensity
        LED lighting to highlight the displayed food. They also function as a counter, thanks to a top surface for the attendant’s work. Smooth
        display surface and worktop made of 18/10 stainless steel AISI 304. Worktop depth: 250 mm. Insulated with eco-friendly injected polyurethane
        (CFC-free), with a density of 40 kg/m³. All glass is tempered. Interior glass shelves for increased visibility. Fitted with LED lighting:
        under the worktop, under the shelf, and on the upper front exterior. □ Storage compartments with pivoting doors. Opening: 440 x 270 mm.
        □ Refrigeration unit located at the bottom. □ Refrigerant gas: R290 hydrocarbon. Maximum efficiency to achieve the most eco-friendly energy
        rating and reduce CO₂ emissions. Controlled by a digital electronic thermometer-thermostat. This controller allows temperature and defrost
        settings. □ With illuminated on/off switch. □ Equipped with socket for scales, etc. □ Automatic defrosting. Operating range: 0 to +8°C,
        with an ambient temperature of +30°C. 30 mm ABS side panels in grey (RAL-7024). □ Lower front in grey (RAL-7024), as standard. □ Upper
        front equipped with bumper. Height-adjustable legs. MODELS WITH: Upper front in grey (RAL-7024). □ MODELS WITH: Upper front in red (RAL-3020).
        □□ Other colours available on request. MODELS WITH STRAIGHT FRONT GLASS Vertical, fixed. □ With flat worktop, 450 mm deep. MODELOS WITH
        CURVED FRONT GLASS Tiltable to facilitate cleaning. □ With flat worktop, 200 mm deep. MODELS WITH STATIC COOLING Prevents food from drying
        out. Display surface: 640 mm wide. MODELS WITH VENTILATED COOLING Ensures uniform temperature inside. Display surface: 740 mm wide.'
      estil:
        color: '#000000'
        mida: 12.8
