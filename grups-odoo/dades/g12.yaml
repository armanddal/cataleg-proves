- id: p73
  n: 73
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Básicamente para su instalación en Marisquerías, Restaurantes, etc, para la exposición y venta, de los productos
        que se ofrecen al consumidor, que normalmente es pescado, pudiendo también usarlas para carnes o postres…, con visibilidad por todos los
        lados, y a la altura del cliente. Con iluminación led, de gran intensidad, para realzar los alimentos expuestos. A su vez, hacen la función
        de mostrador al disponer de una encimera para el trabajo del cocinero o jefe de sala. Encimera de trabajo de 220 mm. Aislamiento de poliuretano
        inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Con todos los cristales templados. Con tapas posteriores, correderas
        de plexiglás, extraíbles, para su limpieza. □ Dotadas de iluminación led. Gas refrigerante de hidrocarburo. De máximo rendimiento para
        obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Refrigeración ambiente y placa fría, estáticas, para
        evitar que se resequen los productos. □ Control por medio de termómetro-termostato electrónico digital. Dicho programador permite ajustar
        la temperatura y los desescarches. □ Con interruptor luminoso de marcha-paro. □ Desescarche automático. Régimen de trabajo +1 +6º C, con
        una temperatura ambiente de +30ºC. MODELOS DE SOBRE-MESA Construcción interior y exterior en acero inoxidable 18/10/2 AISI 316. Grupo
        frigorífico situado en la parte trasera superior. Gas refrigerante R152a. Equipadas con desagüe de gran diámetro para facilitar la limpieza.
        Con cristal curvado corredero, que permite el uso por ambos lados. □ Dotadas de cubetas Gastronorm 1/1 de 65 mm, de profundidad, de serie.
        □ Sobre 4 patas regulables. MODELOS SOBRE SOPORTE TUBULAR Con 4 ruedas giratorias, 2 de ellas con freno. MODELOS SOBRE PEANA CON RUEDAS
        Construcción interior y exterior en acero inoxidable 18/10 AISI 304. Grupo frigorífico situado en la parte inferior. □ Gas refrigerante
        R290. Con depósito para el desagüe. □ Con 4 ruedas giratorias, 2 de ellas con freno. MODELOS CON CRISTAL FRONTAL RECTO Vertical, fijo.
        MODELOS CON CRISTAL FRONTAL CURVADO Abatibles para facilitar la limpieza. □
      estil:
        color: '#000000'
        mida: 12.8
