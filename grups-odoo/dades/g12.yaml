  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRIQUE DES VITRINES-COMPTOIRS Conçues pour être installées dans les épiceries, supermarchés, restaurants, etc., pour
        l’exposition et la vente des produits proposés au consommateur, avec visibilité de tous les côtés et à hauteur du client. Équipées d’un
        éclairage LED de haute intensité pour mettre en valeur les aliments exposés. Elles servent également de comptoir grâce à un plan de travail
        pour l’usage du personnel. Surface d’exposition lisse et plan de travail en acier inoxydable 18/10 AISI 304. Profondeur du plan de travail
        : 250 mm. Isolation en polyuréthane injecté écologique (sans CFC), avec une densité de 40 kg/m³. Tous les vitrages sont en verre trempé.
        Étagères intérieures en verre pour une meilleure visibilité. Éclairage LED intégré : sous le plan de travail, sous l’étagère, et à l’avant
        supérieur extérieur. □ Réserves avec portes pivotantes. Ouverture : 440 x 270 mm. □ Groupe frigorifique situé en partie inférieure. □
        Gaz réfrigérant : hydrocarbure R290. Rendement maximal pour obtenir la classification énergétique la plus écologique et réduire les émissions
        de CO₂. Contrôle par thermomètre-thermostat électronique digital. Le programmateur permet de régler la température et les dégivrages.
        □ Interrupteur lumineux marche/arrêt. □ Prise de courant pour balances, etc. □ Dégivrage automatique. Plage de fonctionnement : 0 à +8°C,
        avec une température ambiante de +30°C. Parois latérales en ABS de 30 mm, coloris gris (RAL-7024). □ Façade inférieure gris (RAL-7024),
        de série. □ Façade supérieure équipée d’un pare-chocs. Pieds réglables en hauteur. MODÈLES AVEC: Façade supérieure gris (RAL-7024). □
        MODÈLES AVEC: Façade supérieure rouge (RAL-3020). □ Autres couleurs disponibles sur demande. MODÈLES AVEC VITRE FRONTALE DROITE Verticale,
        fixe. □ Avec plan de travail plat de 450 mm de profondeur. MODÈLES AVEC VITRE FRONTALE COURBÉE Abattable pour faciliter le nettoyage.
        □ Avec plan de travail plat de 200 mm de profondeur. MODÈLES À RÉFRIGÉRATION STATIQUE Pour éviter le dessèchement des produits. Surface
        d’exposition : 640 mm de largeur. MODÈLES À RÉFRIGÉRATION VENTILÉE Pour une température homogène à l’intérieur. Surface d’exposition :
        740 mm de largeur.'
