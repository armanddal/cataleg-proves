        cristal, para aumentar la visibilidad. Dotadas de iluminación led, debajo encimera, debajo estante y en frontal exterior superior. □ Reservas
        con puertas pivotantes. Hueco 440 x 270 mm. □ Grupo frigorífico situado en la parte inferior. □ Gas refrigerante de hidrocarburo R290.
