  columnes:
  - idioma: de
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Concebidos para uso intenso y profesional. Exterior en chapa de acero lacada en color blanco. Interior en aluminio
        blanco. Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kg./m3, de 60 mm, de espesor. Dotados de
        iluminación led. □ Refrigeración estática, mediante serpentín de cobre situado en la parte interior de los laterales y base, en la zona
        del aislamiento. Grupo frigorífico situado en la parte inferior. □ Gas refrigerante de hidrocarburo. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termostato analógico con posición ultrarrápida
        y alarma en caso de dejar la puerta abierta. □ Con desescarche manual, con tubo de desagüe para facilitar la limpieza. Equipados con cerradura.
        □ Régimen de trabajo -18º -22º C, con una temperatura ambiente de +30ºC. ARCONES CON PUERTA CIEGA ABATIBLE Para su instalación en todo
        tipo de establecimientos, en el almacén o trastienda, para almacenar productos que deben mantenerse congelados. Dichos congeladores disponen
        de gran capacidad, lo cual permite utilizarlos como reserva. La luz interna led, funciona al levantar la puerta abatible. □ Con una cesta,
        en dotación. Opcionalmente se pueden colocar mas cestas (ver accesorios). □ ARCONES CON PUERTAS CORREDERAS DE CRISTAL □ Ideados para establecimientos,
        que desean tener los productos congelados y helados, a la vista, evitando la pérdida de frío, al abrir las puertas, pudiendo colocarse
        a la vista del público, o en el almacén. Posibilidad de colocar cestas (Ver accesorios). □ Con 4 ruedas, 2 de ellas con freno.
      estil:
        color: '#000000'
        mida: 12.8
