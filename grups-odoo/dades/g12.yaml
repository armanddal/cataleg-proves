- id: p33
  n: 33
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION Ecological injected polyurethane insulation (CFC-free), with a density of 40 kg/m³. Tempered double-glazed glass
        with an air chamber. Equipped with LED lighting. Refrigeration unit located in the lower base. Hydrocarbon refrigerant gas R290, offering
        maximum efficiency for the most eco-friendly energy rating and reducing CO₂ emissions. Controlled by a digital electronic thermometer-thermostat,
        allowing temperature and defrost adjustments. □ With illuminated on/off switch. □ Automatic defrosting. Operating range: +2 to +8°C, with
        an ambient temperature of +25°C. DISPLAY SHOWCASE CONSTRUCTION Suitable for any business, but ideal for snack bars, for the display and
        sale of all kinds of food, such as meals, pastries, etc., and beverages, as they are visible from all sides. Exterior made of steel sheet
        lacquered in white. □ Interior lower base made of AISI 304 18/10 stainless steel. Aluminum profiles lacquered in white. Equipped with
        2 sliding doors at the rear for food replenishment. □ Includes 3 adjustable glass shelves, providing 4 display levels, including the interior
        base. □ Ventilated refrigeration to ensure a uniform internal temperature. MODELS WITH CURVED FRONT GLASS □ Series 5: with fixed front
        glass.'
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: 'Series 8: with tilting front glass for easier cleaning. MODELS WITH STRAIGHT FRONT GLASS □ Series 5: with fixed front glass.'
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: 'Series 8: with tilting front glass for easier cleaning. CLOSED SHOWCASE CONSTRUCTION Designed to be placed at the lower front part
        of bar counters, accessible from the bartender''s side via pivoting doors. Used for displaying tapas, meals, etc., which customers can
        view through the inclined front glass. □ Exterior and interior made of AISI 304 18/10 stainless steel. Equipped with pivoting doors with
        integrated handles and gaskets with an air chamber to ensure a tight seal, easily replaceable. With torsion hinges for automatic closing
        and a stay-open position when exceeding 95°. Includes 2 height-adjustable plastic-coated steel shelves, providing 3 display levels, including
        the interior base. □ Inclined and tilting front glass for easier cleaning. □ Static refrigeration.'
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Adjustable legs.
      estil:
        color: '#000000'
        mida: 12.8
