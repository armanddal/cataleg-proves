- id: p82
  n: 82
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION OF FREEZER ISLANDS They function as displays for frozen products, suitable for installation in supermarkets,
        grocery stores, etc. Featuring excellent visibility thanks to all-glass sliding top doors and powerful LED lighting to highlight the products
        and attract consumers. Their design allows individual placement or grouping into an island layout. □ Exterior and interior made of white
        lacquered steel sheet. Fitted with longitudinal bumpers. □ Eco-friendly injected polyurethane insulation (CFC-free), 80 mm thick, with
        a density of 40 kg/m³. Equipped with LED lighting. □ Static refrigeration system using a copper coil placed inside the sidewalls and base,
        within the insulation area. Refrigeration unit located at the bottom. □ Hydrocarbon refrigerant gas R290, offering maximum performance
        for the most eco-friendly energy rating and reduced CO₂ emissions. Controlled via digital electronic thermostat and thermometer. This
        controller allows adjustment of temperature and defrost cycles. □ With illuminated on/off switch. Automatic defrosting with drainage.
        □ Equipped with curved, tempered glass sliding doors with heated frame. □ Includes divider grids for product classification. □ Operating
        range: –18º to –22ºC, with ambient temperature of +30ºC. Equipped with lock. With reinforced wheels and brake. CENTRAL FREEZER ISLANDS
        Accessible from both sides, featuring 4 glass doors (2 on each side). □ Multiple units can be arranged to form a central line 1 metre
        wide. □ WALL FREEZER ISLANDS Can be installed against the wall, one or several units, forming a 790 mm wide line. □ Or they can be joined
        at the back to form an island, in which case the total width is 1,580 mm. □'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.0
      w: 9.0
      h: 24.7
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRIQUE DES ÎLOTS DE CONGÉLATION Ils servent d’exposants pour produits surgelés, destinés à une installation dans
        les supermarchés, magasins d’alimentation, etc. Grande visibilité grâce aux couvercles supérieurs en verre coulissant et à un puissant
        éclairage LED, qui mettent en valeur les produits et attirent les consommateurs. Leur conception permet une installation individuelle
        ou en formation d’îlot. □ Extérieur et intérieur en tôle d’acier laquée blanche. Équipés de pare-chocs longitudinaux. □ Isolation en polyuréthane
        injecté écologique (sans CFC), d’une épaisseur de 80 mm et d’une densité de 40 kg/m³. Équipés d’un éclairage LED. □ Réfrigération statique
        par serpentin en cuivre placé à l’intérieur des parois latérales et de la base, dans la zone d’isolation. Groupe frigorifique situé dans
        la partie inférieure. □ Gaz réfrigérant hydrocarbure R290, offrant un rendement maximal pour une classification énergétique plus écologique
        et une réduction des émissions de CO₂. Contrôle via thermomètre-thermostat électronique numérique. Ce programmateur permet de régler la
        température et les dégivrages. □ Avec interrupteur lumineux marche/arrêt. Dégivrage automatique avec évacuation. □ Équipés de portes coulissantes
        en verre bombé et trempé, avec cadre chauffant. □ Avec grilles de séparation pour le tri des produits. □ Plage de fonctionnement : –18º
        à –22ºC, avec température ambiante de +30ºC. Équipés de serrure. Avec roues renforcées avec frein. ÎLOTS DE CONGÉLATION CENTRAUX Accès
        des deux côtés, avec 4 portes vitrées (2 de chaque côté). □ En plaçant plusieurs unités, il est possible de former une ligne centrale
        de 1 mètre de large. □ ÎLOTS DE CONGÉLATION MURAUX Peuvent être installés contre un mur, une ou plusieurs unités, formant une ligne de
        790 mm de large. □ Ou possibilité de former un îlot en les assemblant par l’arrière, dans ce cas la largeur serait de 1.580 mm. □'
      estil:
        color: '#000000'
        mida: 12.8
