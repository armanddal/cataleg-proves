    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION Basically designed for installation in Seafood Shops, Restaurants, etc., for the display and sale of products
        offered to the customer, which is usually fish, though they can also be used for meat or desserts…, with visibility from all sides and
        at customer height. Equipped with high-intensity LED lighting to enhance the appearance of the displayed food. Additionally, they serve
        as a counter thanks to a worktop for the chef or head waiter. 220 mm worktop. Eco-friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³. All glass panels are tempered. Rear sliding plexiglass covers, removable for cleaning. □ Fitted with LED lighting.
        Hydrocarbon refrigerant gas for maximum performance, highest energy efficiency rating, and reduced CO₂ emissions. Ambient and cold plate
        static cooling, preventing product drying. □ Controlled via a digital electronic thermometer-thermostat. This controller allows adjustment
        of temperature and defrost cycles. □ Illuminated on/off switch. □ Automatic defrost. Operating temperature: +1 to +6ºC, with ambient temperature
        up to +30ºC. COUNTERTOP MODELS Interior and exterior made of AISI 316 18/10/2 stainless steel. Refrigeration unit located at the upper
        rear. Refrigerant gas: R152a. Equipped with large-diameter drainage for easy cleaning. Sliding curved glass, allowing operation from both
        sides. □ Supplied with 65 mm deep Gastronorm 1/1 pans as standard. □ Fitted with 4 adjustable legs. MODELS ON TUBULAR STAND Equipped with
        4 swivel wheels, 2 with brakes. MODELS ON BASE WITH CASTERS Interior and exterior made of AISI 304 18/10 stainless steel. Refrigeration
        unit located at the bottom. □ Refrigerant gas: R290. Includes a drainage tank. □ Equipped with 4 swivel wheels, 2 with brakes. MODELS
        WITH STRAIGHT FRONT GLASS Vertical, fixed. MODELS WITH CURVED FRONT GLASS Tiltable for easy cleaning. □'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.0
      w: 9.0
      h: 25.2
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRIQUE Conçues principalement pour une installation dans des Marisqueries, Restaurants, etc., pour l’exposition et
        la vente des produits proposés au consommateur, généralement du poisson, mais pouvant également être utilisées pour la viande ou les desserts…,
        avec visibilité de tous les côtés et à hauteur du client. Équipées d’un éclairage LED haute intensité pour mettre en valeur les aliments
        exposés. Elles font également office de comptoir grâce à un plan de travail destiné au cuisinier ou au maître d''hôtel. Plan de travail
        de 220 mm. Isolation en polyuréthane injecté écologique (sans CFC), densité 40 kg/m³. Tous les vitrages sont en verre trempé. Portes arrière
        coulissantes en plexiglas, amovibles pour le nettoyage. □ Équipées d’un éclairage LED. Gaz réfrigérant hydrocarbure. Performance maximale
        pour une classification énergétique plus écologique et réduction des émissions de CO2. Réfrigération statique par ambiance et plaque froide,
        évitant le dessèchement des produits. □ Contrôle par thermomètre-thermostat électronique digital. Ce programmateur permet d’ajuster la
        température et les dégivrages. □ Interrupteur lumineux marche/arrêt. □ Dégivrage automatique. Température de fonctionnement : +1 à +6
        °C, avec température ambiante jusqu’à +30 °C. MODÈLES DE COMPTOIR Structure intérieure et extérieure en acier inoxydable AISI 316 18/10/2.
        Groupe frigorifique situé à l’arrière supérieur. Gaz réfrigérant R152a. Équipées d’un système d’évacuation de grand diamètre pour faciliter
        le nettoyage. Vitre courbée coulissante, permettant l’accès des deux côtés. □ Livrées avec bacs Gastronorm 1/1 de 65 mm de profondeur,
        en série. □ Montées sur 4 pieds réglables. MODÈLES SUR SUPPORT TUBULAIRE Avec 4 roulettes pivotantes, dont 2 avec frein. MODÈLES SUR SOCLE
        À ROULETTES Structure intérieure et extérieure en acier inoxydable AISI 304 18/10. Groupe frigorifique situé en partie inférieure. □ Gaz
        réfrigérant R290. Avec bac de récupération pour l’évacuation. □ 4 roulettes pivotantes, dont 2 avec frein. MODÈLES À VITRE FRONTALE DROITE
        Verticale, fixe. MODÈLES À VITRE FRONTALE COURBÉE Abattables pour faciliter le nettoyage. □'
