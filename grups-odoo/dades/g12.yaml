- id: p34
  n: 34
  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRALE Isolation en polyuréthane injecté écologique (sans CFC), avec une densité de 40 kg/m³. Verre trempé double
        avec chambre d''air. Équipé d''un éclairage LED. Groupe frigorifique situé dans la base inférieure. Gaz réfrigérant hydrocarboné R290,
        offrant un rendement maximal pour une classification énergétique plus écologique et réduisant les émissions de CO₂. Contrôle par thermomètre-thermostat
        électronique numérique permettant de régler la température et les dégivrages. □ Avec interrupteur lumineux marche/arrêt. □ Dégivrage automatique.
        Plage de fonctionnement : +2 à +8°C, avec une température ambiante de +25°C. CONSTRUCTION DES VITRINES PRÉSENTOIRS Adaptées à tout type
        de commerce, mais idéales pour les snacks, pour l’exposition et la vente de tout type d’aliments, tels que repas, pâtisseries, etc., et
        boissons, grâce à leur visibilité sous tous les angles. Extérieur en tôle d''acier laquée en blanc. □ Base intérieure inférieure en acier
        inoxydable AISI 304 18/10. Profilés en aluminium laqué blanc. Équipé de 2 portes coulissantes à l’arrière pour le réapprovisionnement
        des aliments. □ Comprend 3 étagères en verre réglables en hauteur, offrant 4 niveaux d''exposition, y compris la base intérieure. □ Réfrigération
        ventilée pour garantir une température homogène à l’intérieur. MODÈLES AVEC VITRE AVANT COURBÉE □ Série 5 : avec vitre avant fixe. Série
        8 : avec vitre avant basculante pour faciliter le nettoyage. MODÈLES AVEC VITRE AVANT DROITE □ Série 5 : avec vitre avant fixe.'
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: 'Série 8 : avec vitre avant basculante pour faciliter le nettoyage. CONSTRUCTION DES VITRINES FERMÉES Conçues pour être placées dans
        la partie inférieure avant des comptoirs de bar, accessibles depuis le côté du barman par des portes pivotantes. Utilisées pour l’exposition
        de tapas, plats, etc., visibles par les clients grâce à la vitre frontale inclinée. □ Extérieur et intérieur en acier inoxydable AISI
        304 18/10. Équipées de portes pivotantes avec poignée intégrée et joint doté d’une chambre d’air assurant l’étanchéité, facilement remplaçable.
        Avec charnières à torsion pour une fermeture automatique et maintien en position ouverte au-delà de 95°. Comprend 2 grilles en acier plastifié
        réglables en hauteur, offrant 3 niveaux d’exposition, y compris la base intérieure. □ Vitre frontale inclinée et basculante pour faciliter
        le nettoyage. □ Réfrigération statique.'
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Pieds réglables.
