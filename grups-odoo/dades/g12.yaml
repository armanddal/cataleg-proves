    titol:
      es: E VERTICAL REFRIGERATED COUNTERTOP DISPLAY CASES F VITRINES VERTICALES RÉFRIGÉRÉES DE COMPTOIR
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION Interior base and top made of stainless steel. These display cases are designed for countertop placement and
        are ideal for impulse sales of offered products. □□ For service, they feature a swing door made of double glass with an air chamber. □
        Equipped with LED lighting. Controlled via a digital electronic thermometer-thermostat, allowing temperature and defrost adjustments.
        Includes an illuminated on/off switch. Ventilated refrigeration ensures a uniform interior temperature. Automatic defrosting. Eco-friendly
        injected polyurethane insulation (CFC-free) with a density of 40 kg/m³. Compressor located at the bottom. □ Hydrocarbon refrigerant gas
        R600a, offering maximum efficiency for the most eco-friendly energy rating and reduced CO2 emissions. Operating range: +2 to +8ºC, with
        an ambient temperature of +28ºC. Fitted with adjustable, non-slip feet . RECTANGULAR REFRIGERATED DISPLAY CASES Base made of white lacquered
        sheet metal with PVC supports. □ Double-glazed glass on all four sides, providing a 360-degree panoramic view. Adjustable-height plastic-coated
        steel shelves. □ CIRCULAR REFRIGERATED DISPLAY CASES WITH FIXED SHELVES Base made of stainless steel with black PVC supports. □ Curved
        double-glazed glass, offering a 360-degree panoramic view. Includes four levels: the base plus three round glass shelves, adjustable in
        height. □ CIRCULAR REFRIGERATED DISPLAY CASES WITH ROTATING SHELVES Base made of stainless steel with black PVC supports. Curved double-glazed
        glass, offering a 360-degree panoramic view. Equipped with four rotating round glass shelves.'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRALE Base et plafond intérieurs en acier inoxydable. Ces vitrines sont conçues pour être placées sur un comptoir
        et sont idéales pour la vente impulsive des produits proposés. □□ Pour le service, elles disposent d’une porte battante en verre double
        avec chambre d’air. □ Équipées d’un éclairage LED. Contrôle via un thermomètre-thermostat électronique numérique, permettant d''ajuster
        la température et le dégivrage. Interrupteur lumineux marche/arrêt. Réfrigération ventilée pour assurer une température homogène à l''intérieur.
        Dégivrage automatique. Isolation en polyuréthane injecté écologique (sans CFC), avec une densité de 40 kg/m³. Compresseur situé dans la
        partie inférieure. □ Gaz réfrigérant hydrocarboné R600a, offrant un rendement maximal pour une classification énergétique plus écologique
        et une réduction des émissions de CO2. Plage de fonctionnement : +2 à +8ºC, avec une température ambiante de +28ºC. Pieds antidérapants
        réglables. VITRINES RÉFRIGÉRÉES RECTANGULAIRES Base en tôle laquée blanche avec montants en PVC. □ Verre à double vitrage sur les quatre
        côtés, offrant une vue panoramique à 360 degrés. Étagères réglables en hauteur, en acier plastifié. □ VITRINES RÉFRIGÉRÉES CIRCULAIRES
        AVEC ÉTAGÈRES FIXES Base en acier inoxydable avec montants en PVC noir. □ Verre incurvé à double vitrage, offrant une vue panoramique
        à 360 degrés. Composées de quatre niveaux : la base et trois étagères rondes en verre, réglables en hauteur. □ VITRINES RÉFRIGÉRÉES CIRCULAIRES
        AVEC ÉTAGÈRES ROTATIVES Base en acier inoxydable avec montants en PVC noir. Verre incurvé à double vitrage, offrant une vue panoramique
        à 360 degrés. Équipées de quatre étagères rondes en verre rotatives.'
