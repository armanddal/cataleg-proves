  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION OF REFRIGERATED CABINETS They are ideal for countertop placement, to keep cans, bottles, dairy products, or
        food cold and visible. Exterior made of color-coated steel sheet. Interior basin made of sanitary ABS material, with rounded corners and
        side guides for placing the grids. □ Ecological injected polyurethane insulation (CFC-free), with a density of 40 kg/m³. Equipped with
        a hinged door, double glass with an air chamber. With plastic-coated steel grids. With LED lighting. Static Roll-Bond cooling system,
        with a fan, to maintain a homogeneous temperature inside . □ Refrigeration unit located at the lower rear. Hydrocarbon refrigerant gas
        R600a. High performance to achieve the most ecological energy rating and reduce CO2 emissions. Controlled by a thermostat. Operating temperature
        range: +2 to +8ºC, with an ambient temperature of +28ºC. With adjustable anti-slip feet. GENERAL CONSTRUCTION OF GLASS CHILLERS Designed
        to frost glasses, keeping the beverage colder for longer. Interior and exterior made of 18/10 AISI 304 stainless steel. Internal basin,
        with rounded corners, and side guides for placing the grids. Ecological injected polyurethane insulation (CFC-free), with a density of
        40 kg/m³. Equipped with a reversible door, with an integrated handle and air chamber gasket, ensuring airtightness, easily replaceable.
        With torsion hinges for automatic closing, with an open maintenance position when it exceeds 95º. With 1 adjustable plastic-coated steel
        grid. Refrigeration unit located at the bottom. □ Cooling by means of a static cold plate. Automatic defrost. Hydrocarbon refrigerant
        gas R290. High performance to achieve the most ecological energy rating and reduce CO2 emissions. Controlled by an electronic digital
        thermometer-thermostat. This programmer allows adjusting the temperature and defrost cycles. □ With a light switch for on/off control.
        □ Operating temperature range: -5 to -10ºC, with an ambient temperature of +32ºC. With adjustable anti-slip feet. GLASS CHILLER WITH GLASS
        DOOR With a hinged door, double glass with an air chamber. □ GLASS CHILLER WITH BLIND DOOR With a hinged door made of 18/10 AISI 304 stainless
        steel. □'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRALE DES ARMOIRES RÉFRIGÉRÉES Elles sont idéales pour être placées sur un comptoir, afin de maintenir au frais des
        canettes, des bouteilles, des produits laitiers ou des aliments, et de les rendre visibles. Extérieur en tôle d''acier laquée de couleur.
        Bac intérieur en matériau ABS sanitaire, avec des coins arrondis et des guides latéraux pour le placement des grilles. □ Isolation en
        polyuréthane injecté écologique (sans CFC), avec une densité de 40 kg/m³. Avec porte battante, en verre double avec chambre à air. Avec
        grilles en acier plastifié. Avec éclairage LED. Réfrigération statique Roll-Bond, avec ventilateur, pour obtenir une température homogène
        à l''intérieur. □ Groupe frigorifique situé dans la partie inférieure arrière. Gaz réfrigérant hydrocarboné R600a. Performance maximale
        pour obtenir la meilleure classification énergétique écologique et réduire les émissions de CO2. Contrôle par thermostat. Plage de température
        de fonctionnement : +2 à +8°C, avec une température ambiante de +28°C. Avec pieds antidérapants, réglables. CONSTRUCTION GÉNÉRALE DES
        GLACIERS À VERRES Conçus pour givrer les verres, ce qui permet de maintenir plus longtemps la température froide de la boisson. Intérieur
        et extérieur en acier inoxydable 18/10 AISI 304. Bac intérieur, avec coins arrondis, et guides latéraux pour le placement des grilles.
        Isolation en polyuréthane injecté écologique (sans CFC), avec une densité de 40 kg/m³. Avec porte réversible, avec poignée intégrée et
        joint doté de chambre à air pour assurer l''étanchéité, facilement remplaçable. Avec charnières de torsion pour la fermeture automatique,
        avec position de maintien ouverte lorsque la porte dépasse 95º. Avec 1 grille en acier plastifié, réglable en hauteur. Groupe frigorifique
        situé en bas. □ Réfrigération par plaque froide statique. Dégivrage automatique. Gaz réfrigérant hydrocarboné R290. Performance maximale
        pour obtenir la meilleure classification énergétique écologique et réduire les émissions de CO2. Contrôle par thermostat électronique
        numérique. Ce programmateur permet d''ajuster la température et les cycles de dégivrage. □ Avec interrupteur lumineux marche/arrêt. □
        Plage de température de fonctionnement : -5 à -10°C, avec une température ambiante de +32°C. Avec pieds antidérapants, réglables. GLACIER
        À VERRE AVEC PORTE EN VERRE Avec une porte battante, en verre double avec chambre à air. □ GLACIER À VERRE AVEC PORTE CIELE Avec une porte
        battante en acier inoxydable 18/10 AISI 304. □'
      estil:
        color: '#000000'
        mida: 12.8
