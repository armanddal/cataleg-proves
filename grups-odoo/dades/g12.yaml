  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL Base y techo interiores de acero inoxidable. Estas vitrinas están ideadas, para su colocación sobre mostrador
        y son ideales para la venta por impulso, de los productos ofrecidos. □□ Para el servicio, disponen de una puerta batiente, de cristal
        doble con cámara de aire. □ Con iluminación led. Control por medio de termómetro-termostato electrónico digital. Dicho programador permite
        ajustar la temperatura y los desescarches. Con interruptor luminoso de marcha-paro Refrigeración ventilada, para conseguir la temperatura
        homogénea en el interior. Desescarche automático. Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de
        40 Kgs/m3. Compresor situado en la parte inferior. □ Gas refrigerante de hidrocarburo R600a. De máximo rendimiento para obtener la calificación
        energética mas ecológica, y reducir las emisiones de CO2. Régimen de trabajo +2 +8º C, con una temperatura ambiente de +28ºC Con patas
        antideslizantes, regulables. VITRINAS REFRIGERADAS RECTANGULARES Base fabricada en chapa lacada en color blanco y montantes de PVC. □
        Con cristal de doble cámara en los 4 lados, con vista panorámica de 360 grados. Con rejillas, de acero plastificado, regulables en altura.
        □ VITRINAS REFRIGERADAS CIRCULARES, CON ESTANTES FIJOS Base fabricada en acero inoxidable y montantes de PVC de color negro. □ Con cristal
        curvado de cristal de doble cámara, con vista panorámica de 360 grados. Con 4 niveles, la base mas 3 estantes redondos, de cristal, regulables
        en altura. □ VITRINAS REFRIGERADAS CIRCULARES, CON ESTANTES GIRATORIOS Base fabricada en acero inoxidable y montantes de PVC de color
        negro. Con cristal curvado de cristal de doble cámara, con vista panorámica de 360 grados. Con 4 estantes giratorios, redondos, de cristal.
      estil:
        color: '#000000'
        mida: 12.8
