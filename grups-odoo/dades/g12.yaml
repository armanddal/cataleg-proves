    - role: text
      text: 'With an illuminated on/off switch. Ventilated refrigeration ensures a homogeneous temperature inside. Automatic defrosting. Eco-friendly
        injected polyurethane insulation (CFC-free) with a density of 40 kg/m³. Hydrocarbon refrigerant gas R600a, offering maximum efficiency
        for the most eco-friendly energy rating and reducing CO₂ emissions. Operating range: +2 to +8ºC, with an ambient temperature of +28ºC.
        Equipped with adjustable, non-slip feet. REFRIGERATED DISPLAY CASES WITH CURVED GLASS Made of tempered, curved glass on the customer side.
        □ Compressor located at the bottom. □ Glass side panels for maximum product visibility. Three display levels: base plus two height-adjustable
        shelves. □ REFRIGERATED DISPLAY CASES WITH STRAIGHT GLASS Equipped with sliding doors made of double glass with an air chamber on the
        customer side. □ Compressor located on the left side when viewed from the service area. □ Glass side panel on the opposite side of the
        compressor. Two display levels: base plus one height-adjustable shelf. □ HEATED DISPLAY WITH CURVED GLASS Exterior and interior made of
        stainless steel. Made of tempered, curved glass on the customer side. □ For service, they have sliding doors made of double glass with
        an air chamber. □ Glass side panels for maximum product visibility. Lower tray for water evaporation to prevent food from drying out.
        □ Equipped with LED lighting. Controlled via a mechanical thermostat. With an illuminated on/off switch. Ventilated heating ensures a
        homogeneous temperature inside. Adjustable operating range from +30 to +90ºC. Three display levels: base plus two height-adjustable shelves.
        □ Equipped with adjustable, non-slip feet.'
