  tipus: informacio_general
  capcalera:
    banda: assets/g12/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERAL DE LAS VITRINAS REFRIGERADAS
      estil:
        color: '#006699'
        negreta: true
        mida: 11.0
    - role: text
      text: Exterior e interior de acero inoxidable.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Con cuba interior embutida, para facilitar la limpieza, donde se pueden colocar cubetas GN de 1/3 - 40 de fondo.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Para el servicio, disponen de puertas correderas, extraibles para la limpieza.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Con iluminación led.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Control por medio de termómetro-termostato electrónico digital. Dicho programador permite ajustar la temperatura y los desescarches.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Con interruptor luminoso de marcha-paro.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Refrigeración estática, por medio de serpentín de cobre, adosado en la cuba y ubicado en la zona inferior aislada.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m³.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Compresor de 1/6 HP, situado en la parte derecha, visto desde la zona del cliente.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Gas refrigerante de hidrocarburo R152a. De máximo rendimiento para obtener la calificación energética mas ecológica, y reducir las
        emisiones de CO2.
      estil:
        color: '#000000'
        mida: 11.0
    - role: text
      text: Con patas antideslizantes.
      estil:
        color: '#000000'
        mida: 11.0
