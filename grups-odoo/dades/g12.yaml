  - idioma: en
    paragrafs:
    - role: text
      text: VITRINAS REFRIGERADAS MURALES, DE SOBRE TRASBARRA E WALL-MOUNTED REFRIGERATED DISPLAY UNITS FOR BACK COUNTER
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: F VITRINES RÉFRIGÉRÉES MURALES POUR ARRIÈRE-BAR
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.116
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Esta vitrina, está concebida, para su instalación mural, encima de un mueble tras barra, que al estar en posición elevada,
        hace que los productos expuestos, sean muy visibles para los clientes, que lo ven reflejado, a través del espejo inclinado □que dispone
        en la parte superior y también facilita el servicio al camarero. Construcción interior y exterior en acero inoxidable AISI 304, 18/10.
        Aislamiento de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kgs/m3. Con ambos laterales de cristal. □ Con 2
        cristales correderos, templados. □ Con 2 estantes de cristal, regulables en altura. □ Con la base inclinada, donde se pueden colocar,
        bandejas o recipientes GN (no incluidos). □ Con iluminación led, en la parte superior. Grupo frigorífico situado en el techo de la vitrina.
        Refrigeración ventilada, para conseguir la temperatura homogénea en el interior. Gas refrigerante de hidrocarburo R290. De máximo rendimiento
        para obtener la calificación energética mas ecológica, y reducir las emisiones de CO2. Control por medio de termómetro-termostato electrónico
        digital. Dicho programador permite ajustar la temperatura y los desescarches. Con interruptor luminoso de marcha-paro. Desescarche automático.
        Régimen de trabajo +3 +8º C, con una temperatura ambiente de +25ºC. Con patas regulables.
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 2.5
      w: 11.7
      h: 12.7
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION This showcase is designed for wall installation above a back-bar counter, ensuring that the displayed products are highly
        visible to customers due to its elevated position. The inclined mirror □on the upper part enhances visibility and also facilitates service
        for the bartender. Interior and exterior construction in AISI 304 stainless steel, 18/10. Ecological injected polyurethane insulation
        (CFC-free) with a density of 40 kg/m³. Both sides made of glass. □ Equipped with 2 tempered sliding glass panels. □ Includes 2 height-adjustable
        glass shelves. □ Features an inclined base suitable for trays or GN containers (not included). □ LED lighting at the top. Refrigeration
        unit located on the ceiling of the showcase. Ventilated refrigeration to ensure a uniform temperature inside. Uses R290 hydrocarbon refrigerant
        for maximum efficiency, achieving the most eco-friendly energy rating and reducing CO₂ emissions. Controlled via a digital electronic
        thermometer-thermostat. The built-in programmer allows for temperature adjustments and defrosting settings. Equipped with an illuminated
        on/off switch. Automatic defrosting. Operating temperature: +3 to +8°C, with an ambient temperature of +25°C. Adjustable feet.'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 1.0
      y: 16.073
      w: 9.0
      h: 12.2
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Cette vitrine est conçue pour une installation murale au-dessus d’un meuble arrière-bar, garantissant une grande visibilité
        des produits exposés grâce à sa position surélevée. Le miroir incliné □situé sur la partie supérieure améliore la visibilité et facilite
        également le service du barman. Construction intérieure et extérieure en acier inoxydable AISI 304, 18/10. Isolation en polyuréthane injecté
        écologique (sans CFC) avec une densité de 40 kg/m³. Les deux côtés en verre. □ Équipée de 2 panneaux coulissants en verre trempé. □ Comprend
        2 étagères en verre réglables en hauteur. □ Base inclinée permettant de placer des plateaux ou des bacs GN (non inclus). □ Éclairage LED
        dans la partie supérieure. Groupe frigorifique situé au plafond de la vitrine. Réfrigération ventilée pour garantir une température homogène
        à l’intérieur. Gaz réfrigérant hydrocarbure R290 pour un rendement maximal, assurant la classification énergétique la plus écologique
        et réduisant les émissions de CO₂. Contrôle par thermomètre-thermostat électronique numérique. Le programmateur intégré permet de régler
        la température et les dégivrages. Interrupteur lumineux marche/arrêt. Dégivrage automatique. Plage de température : +3 à +8°C, avec une
        température ambiante de +25°C. Pieds réglables.'
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 10.301
      y: 16.073
      w: 9.6
      h: 12.2
