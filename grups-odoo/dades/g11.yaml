    - role: text
      text: Exterior e interior en acero inoxidable AISI-304, 18/10. Cubas internas con paragolpes. □ Aislamiento de poliuretano inyectado ecológico
        (libre de CFC), con una densidad de 40 Kgs./m3, de 80 mm de espesor. Bisagras en las puertas. Con posición de mantenimiento abierta, cuando
        supera los 95°. □ Puertas con tirador incorporado, con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la
        estanqueidad. Fácilmente substituibles. □ Puertas con cerradura. Grupos frigoríficos sobre-dimensionados, con desescarche automático.
        Frio ventilado para conseguir la temperatura homogénea en el interior. □ Con el grupo frigorífico en la parte superior. Gas refrigerante
        hidrocarburo R290. De máximo rendimiento para obtener la calificación energética mas ecológica, y para reducir las emisiones de CO2. Con
        termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas máxima y mínima, así como los desescarches,
        automáticamente, con el fin de optimizar el máximo rendimiento del frigorífico. Con pulsador táctil de marcha-paro. Dotados de una rampa
        de acero inoxidable reforzada, para facilitar la entrada de los carros. □ Con un 1 carro por puerta, EN DOTACIÓN, con 20 pares de guías.
        □ Capacidad 20 EN 400x600. Separación entre guías 75 mm. Con 4 ruedas giratorias, dos de ellas con freno. ARMARIOS DE CONSERVACIÓN Régimen
        de trabajo 0 + 4°C, con una temperatura ambiente de +38°C. ARMARIOS DE CONGÉLACIÓN Para el mantenimiento de congelados. El producto debe
