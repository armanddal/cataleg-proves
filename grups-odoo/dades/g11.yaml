      es: □ REFRIGERATED / FREEZER UNDERCOUNTERS WITH DRAWERS □ MEUBLES BAS RÉFRIGÉRÉS / CONGÉLATEURS À TIROIRS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION 700 mm deep. Exterior and interior made of stainless steel. Galvanized steel back panel. Environmentally friendly injected
        polyurethane insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 50 mm. Equipped with 1 perforated drawer to facilitate
        ventilation. Fitted with stainless steel telescopic sliding runners, allowing 100% extension. □ Suitable for GN 1/1-150 containers. Magnetic
        closing system with an air-chamber gasket, easily replaceable. □ Oversized refrigeration unit located in the lower part of the cabinet,
        with automatic defrost. The unit can be removed to facilitate maintenance and condenser cleaning. □ Ventilated refrigeration. R290 hydrocarbon
        refrigerant gas. High-efficiency refrigerant for achieving the most environmentally friendly energy rating and reducing CO₂ emissions.
        Convertible refrigeration/freezer model. Simply press the selector button to switch the temperature from refrigeration (0 to 4°C) to freezing
        (-18 to -21°C), at an ambient temperature of +36°C. Equipped with a digital electronic thermometer-thermostat. This controller allows
        both maximum and minimum temperatures to be adjusted, optimizing refrigerator performance to the fullest. On/off switch. 4 swivel castors
        (2 with brakes).
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.254
      y: 3.101
      w: 8.805
      h: 24.099
