    titol:
      en: REFRIGERATED / FREEZER COUNTERS WITH DRAWERS □ TABLES RÉFRIGÉRÉES / CONGÉLATEURS À TIROIRS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION 700 mm deep. Exterior and interior made of stainless steel. Galvanized steel back panel. Environmentally friendly injected
        polyurethane insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 50 mm. Equipped with 2 perforated drawers to facilitate
        ventilation. Fitted with stainless steel telescopic sliding runners, allowing 100% extension. □ Suitable for GN 1/1-150 containers. Magnetic
        closing system with air-chamber gaskets, easily replaceable. □ Oversized refrigeration units located in the lower part of the cabinet,
        with automatic defrost. These units can be removed to facilitate maintenance and condenser cleaning. □ Ventilated refrigeration.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: R290 hydrocarbon refrigerant gas. High-efficiency refrigerant for achieving the most environmentally friendly energy rating and reducing
        CO₂ emissions. Convertible refrigeration/freezer model. Simply press the selector button to change the temperature, allowing one drawer
        to operate as a refrigerator (0 to 4°C) and the other as a freezer (-18 to -21°C), at an ambient temperature of +36°C. Equipped with 2
        digital electronic thermometer-thermostats. These controllers allow both maximum and minimum temperatures to be adjusted, optimizing refrigerator
        performance to the fullest. □ On/off switch. 4 swivel castors (2 with brakes).
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.157
      h: 20.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Profondeur de 700 mm. Extérieur et intérieur en acier inoxydable. Dos en acier galvanisé. Isolation en polyuréthane injecté
        écologique (sans CFC), d'une densité de 40 kg/m³ et d'une épaisseur de 50 mm. Équipée de 2 tiroirs perforés pour faciliter la ventilation.
        Munis de glissières télescopiques en acier inoxydable permettant une ouverture à 100 %. □ Capacité pour bacs GN 1/1-150. Fermeture magnétique
        assurée par des joints à chambre d'air, facilement remplaçables. □ Groupes frigorifiques surdimensionnés, situés dans la partie inférieure
        du meuble, avec dégivrage automatique. Ces groupes sont extractibles afin de faciliter les opérations d'entretien et le nettoyage du condenseur.
        □ Réfrigération ventilée. Gaz réfrigérant à hydrocarbure R290. Très haute performance pour obtenir la meilleure classification énergétique
        écologique et réduire les émissions de CO₂. Modèle réfrigération/congélation convertible. Il suffit d'appuyer sur le bouton de sélection
        pour modifier la température, permettant d'utiliser un tiroir en réfrigération (0 à 4°C) et l'autre en congélation (-18 à -21°C), à une
        température ambiante de +36°C. Équipée de 2 thermomètres-thermostats électroniques numériques. Ces régulateurs permettent de régler les
        températures maximale et minimale afin d'optimiser au maximum les performances du réfrigérateur. □ Interrupteur marche/arrêt. Équipée
        de 4 roulettes pivotantes (dont 2 avec frein).
      estil:
        color: '#000000'
        mida: 14.0
