    - role: text
      text: CONSTRUCCIÓN GENÉRICA De 700 mm. de profundidad. Exterior e interior de acero inoxidable. El trasero es de acero galvanizado. Cuba
        interna con los cantos redondeados para facilitar la limpieza y desagüe en la base. □ Aislamiento de poliuretano inyectado ecológico (libre
        de CFC), con una densidad de 40 Kgs/m3 y de 50 mm. de espesor. Bisagras de torsión, en todas las puertas. Con posición de mantenimiento
        abierta, cuando supera los 95 grados. □ Puertas con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad.
        Fácilmente substituibles. □ Las reservas, son GN 1/1, y llevan en dotación una rejilla de 325x530 por puerta. Opcionalmente, se pueden
        colocar recipientes GN (Ver GRUPO 16) Grupos frigoríficos sobre-dimensionados, situados en la parte inferior del mueble, con desescarche
        automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador. □ Con frío estático.
        Gas refrigerante hidrocarburo. De máximo rendimiento para obtener la calificación energética mas ecológica, y para reducir las emisiones
        de CO2. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, con el fin
        de optimizar al máximo el rendimiento del frigorífico. Con interruptor de marcha-paro. Con cerradura, situada en la parte inferior de
        las puertas. □ Con zócalo en la base del mueble y pies regulables. MESAS FRÍAS DE CONSERVACIÓN Temperatura de trabajo 0 +4ºC, con una
        temperatura ambiente de +36ºC. MESAS FRÍAS DE CONGELACIÓN Son para mantenimiento de congelados. El producto debe estar previamente congelado.
        Temperatura de trabajo -18 -20ºC, con una temperatura ambiente de +36ºC.
