  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN De 700 mm. de profundidad. Exterior e interior de acero inoxidable. El trasero es de acero galvanizado. Con la encimera
        de acero inoxidable, con el canto frontal redondeado. Cuba interna con los cantos redondeados para facilitar la limpieza y desagüe en
        la base. □ Aislamiento de poliuretano inyectado ecológico (libre de CFC), con una densidad de 40 Kgs/m3 y de 50 mm. de espesor. Cajones
        perforados para facilitar la ventilación. Dotados de guías correderas telescópicas, de acero inoxidable, que permiten la abertura al 100%.
        □ Puertas con bisagras de torsión. Con posición de mantenimiento abierta, cuando supera los 95 grados. □ Puertas y cajones, con cierre
        magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Son GN 1/1, y llevan
        en dotación una rejilla de 325x530 por puerta □. Opcionalmente, se pueden colocar recipientes GN (Ver GRUPO 16). Grupos frigoríficos sobre-dimensionados,
        situados en la parte inferior del mueble, con desescarche automático. Dichos grupos permiten su extracción para facilitar el servicio
        de mantenimiento y limpieza del condensador. □ Con frío estático. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y para reducir las emisiones de CO2. Temperatura de trabajo 0 +4ºC, con una temperatura ambiente
        de +36ºC. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, con el fin
        de optimizar al máximo el rendimiento del frigorífico. Con interruptor de marcha-paro. Con cerradura, situada en la parte inferior. □
        Con zócalo en la base del mueble y pies regulables.
      estil:
