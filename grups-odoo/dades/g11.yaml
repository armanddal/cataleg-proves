        doors. □ With a plinth at the base of the cabinet and adjustable feet. MODEL WITH INGREDIENTS REFRIGERATOR □ Operates independently from
        the refrigerated table. Supplied with 6 GN 1/4-150 containers. With a tempered glass display case, closed on 3 sides, and countertop,
        attached to the refrigerator. □ The glass countertop can be used as a shelf.'
