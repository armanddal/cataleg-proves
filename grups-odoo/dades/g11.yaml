    titol:
      es: □ REFRIGERATED AND FREEZER TABLES □ TABLES RÉFRIGÉRÉES DE CONSERVATION ET DE CONGÉLATION
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERIC CONSTRUCTION 700 mm. deep. Stainless steel exterior and interior. The back is made of galvanised steel. Internal tank with
        rounded edges for easy cleaning and drainage at the base. □ Ecological injected polyurethane insulation (CFC-free), with a density of
        40 kg/m3 and 50 mm thick. Torsion hinges on all doors. With hold-open position, when it exceeds 95 degrees. □ Doors with magnetic closing,
        by means of weatherstrips equipped with air chamber, to ensure watertightness. Easily replaceable. □ Reserves are GN 1/1, and are supplied
        with a 325x530 grid per door. Optionally, GN containers can be fitted (see GROUP 16). Oversized refrigeration units, located in the lower
        part of the cabinet, with automatic defrosting. These groups can be removed to facilitate maintenance and cleaning of the condenser. □
        With static cooling. Hydrocarbon refrigerant gas. Maximum performance to obtain the most ecological energy rating, and to reduce CO2 emissions.
        With digital electronic thermometer-thermostat. This programmer allows the maximum and minimum temperatures to be adjusted in order to
