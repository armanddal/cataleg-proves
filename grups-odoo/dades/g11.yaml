  - idioma: en
    paragrafs:
    - role: text
      text: 'Exterior and interior in AISI-304, 18/10 stainless steel. Internal compartments with protective bumpers. □ Ecological injected polyurethane
        insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 80 mm. Door hinges. With open maintenance position when exceeding
        95°. □ Doors with integrated handle, with magnetic closing by means of air-chamber gaskets, to ensure airtightness. Easily replaceable.
        □ Doors with lock. Oversized refrigeration units, with automatic defrosting. Ventilated cooling to achieve an even temperature inside.
        □ With the refrigeration unit at the top. R290 hydrocarbon refrigerant gas. Maximum performance to achieve the most eco-friendly energy
        rating and reduce CO₂ emissions. With digital electronic thermometer-thermostat. This programmer allows the maximum and minimum temperatures,
        as well as defrost cycles, to be adjusted automatically in order to optimise the refrigerator’s performance. With touch-sensitive ON/OFF
        button. Equipped with a reinforced stainless steel ramp to facilitate trolley entry. □ With 1 trolley per door, SUPPLIED AS STANDARD,
        with 20 pairs of guides. □ Capacity: 20 EN 400x600. Guide spacing: 75 mm. With 4 swivel castors, two with brakes. STORAGE REFRIGERATED
        CABINETS Operating range from 0 to +4°C, with an ambient temperature of +38°C. FREEZER CABINETS For the storage of frozen products. The
        product must be previously frozen. Operating range from -18 to -22°C, with an ambient temperature of +38°C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.106
      y: 3.101
      w: 9.0
      h: 25.3
  - idioma: fr
    paragrafs:
    - role: text
      text: 'Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Cuves intérieures avec butoirs de protection. □ Isolation en polyuréthane
        injecté écologique (sans CFC), d’une densité de 40 kg/m³ et d’une épaisseur de 80 mm. Charnières sur les portes. Avec position de maintien
        ouverte au-delà de 95°. □ Portes avec poignée intégrée, à fermeture magnétique, au moyen de joints à chambre d’air, afin de garantir l’étanchéité.
        Facilement remplaçables. □ Portes avec serrure. Groupes frigorifiques surdimensionnés, avec dégivrage automatique. Froid ventilé pour
        obtenir une température homogène à l’intérieur. □ Avec le groupe frigorifique dans la partie supérieure. Gaz réfrigérant hydrocarbure
        R290. Rendement maximal pour obtenir le classement énergétique le plus écologique et réduire les émissions de CO₂. Avec thermomètre-thermostat
        électronique numérique. Ce programmateur permet de régler automatiquement les températures maximale et minimale, ainsi que les cycles
        de dégivrage, afin d’optimiser au maximum les performances du réfrigérateur. Avec bouton tactile marche-arrêt. Équipés d’une rampe renforcée
        en acier inoxydable, pour faciliter l’entrée des chariots. □ Avec 1 chariot par porte, FOURNI DE SÉRIE, avec 20 paires de glissières.
        □ Capacité : 20 EN 400x600. Espacement entre les glissières : 75 mm. Avec 4 roulettes pivotantes, dont deux avec frein. ARMOIRES DE CONSERVATION
        Plage de fonctionnement de 0 à +4 °C, avec une température ambiante de +38 °C. ARMOIRES DE CONGÉLATION Pour la conservation de produits
        surgelés. Le produit doit être préalablement congelé. Plage de fonctionnement de -18 à -22 °C, avec une température ambiante de +38 °C.'
      estil:
        color: '#000000'
        mida: 14.0
