    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable. El trasero es de acero galvanizado. Cuba interna con los cantos redondedos para
        facilitar la limpieza y desagüe en el interior de la cámara. □ Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad
        de 40 Kgs./m3. Bisagras de torsión, en todas las puertas. Con posición de mantenimiento abierta, cuando supera los 95 grados. □ Puertas
        con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ En dotación
        1 Rejilla GN 1/1, por cada puerta. Grupos frigoríﬁcos sobre-dimensionados, con desescarche automático. Dichos grupos permiten su extracción
        para facilitar el servicio de mantenimiento y limpieza del condensador con la máxima comodidad. □ Gas refrigerante hidrocarburo. De máximo
        rendimiento para obtener la caliﬁcación energética mas ecológica y para reducir la emisiones de CO2. Con frío estático. Temperatura de
        trabajo 0 +4º C, con una temperatura ambiente de +36º C. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar
        las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de optimizar al máximo el rendimiento del frigoríﬁco.
        Con interruptor luminoso de marcha-paro. La profundidad son 700 mm. Con encimera de granito. □ Con hueco en la parte posterior de la encimera,
        para colocar recipientes GN 1/6-150. El frío proviene de la cámara inferior. Así mismo disponen de un estante elevado, que a la vez cubre
        los ingredientes. □ Hay modelos con los recipientes en dotación. Con cerradura situada en la parte inferior de las puertas. □ Con zócalo
        en la base del mueble y pies regulables.
