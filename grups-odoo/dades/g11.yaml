        remplaçables. □ Portes avec sens d'ouverture réversible. □ Équipé d'une serrure. Éclairage intérieur. Groupes frigorifiques surdimensionnés
        avec dégivrage automatique. Froid ventilé pour garantir une température homogène à l'intérieur. □ Groupe frigorifique situé en partie
        supérieure. Gaz réfrigérant hydrocarbure R290, offrant un rendement maximal pour obtenir la classification énergétique la plus écologique
        et réduire les émissions de CO₂. Plage de fonctionnement de -18 °C à -25 °C, pour une température ambiante de +38 °C. Conçu pour la conservation
        de produits surgelés. Le produit doit être préalablement congelé. Thermomètre-thermostat électronique digital. Ce régulateur permet d'ajuster
        automatiquement les températures maximale et minimale ainsi que los dégivrages, afin d'optimiser au maximum le rendement du réfrigérateur.
        Interrupteur lumineux marche/arrêt. Glissières en « U » pour le positionnement des grilles à la hauteur souhaitée. Grilles de 600x800
        fournies de série. Il est également possible de placer 2 grilles de 600x400 à chaque niveau. Capacité 54 bacs à glace de 5 litres (non
        inclus dans le prix). □
