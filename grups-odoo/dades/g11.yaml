  - idioma: es
    paragrafs:
    - role: text
      text: □ PIZZA PREPARATION REFRIGERATED TABLES WITH 400x600 DOORS □ TABLES RÉFRIGÉRÉES POUR LA PRÉPARATION DE PIZZAS AVEC PORTES EN 400x600
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 3.696
