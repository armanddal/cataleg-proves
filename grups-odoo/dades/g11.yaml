  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. Rear panels made of galvanised steel. Internal compartments
        with rounded corners. □ To facilitate cleaning and drainage at the bottom. Environmentally friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³ and a thickness of 70 mm. Height-adjustable stainless steel legs. Torsion hinges on all doors, with a hold-open
        position when opened beyond 95°. □ Doors with integrated handles and magnetic closure, using air-chamber gaskets to ensure an airtight
        seal. Easily replaceable. □ Reversible door opening. □ Interior lighting. Oversized refrigeration units with automatic defrosting. Fan-assisted
        cooling to ensure an even temperature throughout the interior. □ R290 hydrocarbon refrigerant. High efficiency to achieve the most environmentally
        friendly energy rating and reduce CO₂ emissions. Electronic digital thermometer-thermostat. This controller allows the maximum and minimum
        temperatures to be set, as well as automatic defrost cycles, to optimise the refrigerator’s performance. Fitted with a touch-sensitive
        on/off switch. Plastic-coated wire shelves, height-adjustable every 70 mm using a rack system. Supplied with 3 shelves per cabinet section.
        Door lock. STORAGE CABINETS Double glazing with an air gap. □ Operating temperature range: 0 to +4°C, at an ambient temperature of +38°C.
        FREEZER CABINETS Triple glazing with air gaps. □ Designed for storing frozen products. Products must be frozen beforehand. Operating temperature
        range: -18 to -22°C, at an ambient temperature of +38°C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Panneaux arrière en acier galvanisé. Cuves intérieures à
        angles arrondis. □ Pour faciliter le nettoyage et l’évacuation de l’eau au fond. Isolation en polyuréthane injecté écologique (sans CFC),
        d’une densité de 40 kg/m³ et d’une épaisseur de 70 mm. Pieds en acier inoxydable réglables en hauteur. Charnières à torsion sur toutes
        les portes, avec maintien en position ouverte au-delà de 95°. □ Portes avec poignée intégrée et fermeture magnétique, équipées de joints
        à chambre d’air garantissant l’étanchéité. Facilement remplaçables. □ Portes réversibles. □ Éclairage intérieur. Groupes frigorifiques
        surdimensionnés avec dégivrage automatique. Froid ventilé pour garantir une température homogène à l’intérieur. □ Gaz réfrigérant hydrocarboné
        R290. Haut rendement permettant d’obtenir la meilleure classe énergétique en matière de respect de l’environnement et de réduire les émissions
        de CO₂. Thermomètre-thermostat électronique numérique. Ce programmateur permet de régler les températures maximale et minimale, ainsi
        que les cycles de dégivrage automatique, afin d’optimiser les performances du réfrigérateur. Avec interrupteur tactile marche-arrêt. Grilles
        en fil métallique plastifié, réglables en hauteur tous les 70 mm au moyen d’une crémaillère. Fournies à raison de 3 unités par compartiment.
        Serrure sur les portes. ARMOIRES DE CONSERVATION Double vitrage avec lame d’air. □ Plage de température de fonctionnement : de 0 à +4°C,
        à une température ambiante de +38°C. ARMOIRES DE CONGÉLATION Triple vitrage avec lames d’air. □ Destinées à la conservation de produits
        surgelés. Les produits doivent être préalablement congelés. Plage de température de fonctionnement : de -18 à -22°C, à une température
        ambiante de +38°C.'
