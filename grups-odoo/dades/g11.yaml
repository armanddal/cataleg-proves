    titol:
      es: MESAS FRÍAS DE PREPARACIÓN DE BOCADILLOS Y PIZZAS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior de acero inoxidable 18/10 AISI-304. El trasero es de acero galvanizado. La encimera, también en acero
        inoxidable, y en la parte posterior, disponen de un cabezal elevado de 150 mm, para colocar recipientes GN 1/4-150, con los ingredientes.
        □ Superficie de trabajo de 375 mm. de ancho. □ Hay modelos con los recipientes en dotación. El frío proviene de la cámara inferior. Equipan
        una tapa abatible, en dos tramos, de acero inoxidable, con dos posiciones, abierta o cerrada, de manera que cuando no se usa, los alimentos
        quedan protegidos higiénicamente y además se mantienen refrigerados. Cuba interna con cantos redondeados para facilitar la limpieza. □
        Y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40 Kgs/m3, de 60 mm. de espesor.
        Con patas regulables de acero inoxidable. Bisagras de torsión, en las puertas. Con posición de mantenimiento abierta, cuando supera los
        95º. Puertas con tirador incorporado, con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad.
        Fácilmente substituibles. □ Grupos frigoríﬁcos sobre-dimensionados, con desescarche automático. Dichos grupos permiten su extracción para
        facilitar el servicio de mantenimiento y limpieza del condensador. Frío ventilado para conseguir la temperatura homogénea en el interior
        de la cámara. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica, y para reducir
        la emisiones de CO2. Temperatura de trabajo 0 +4° C, con una temperatura ambiente de +36º C. Con termómetro-termostato electrónico digital.
        Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de optimizar
        al máximo, el rendimiento del frigoríﬁco. Con pulsador táctil de marcha-paro. Se suministran en dotación, con una rejilla por puerta.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.5
      w: 18.96
      h: 14.123
