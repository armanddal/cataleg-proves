        avec poignée intégrée, à fermeture magnétique, au moyen de coupe-bise avec chambre à air, pour assurer l’étanchéité. Facilement remplaçable.
        □ Ventilé frais pour atteindre une température homogène à l’intérieur de la chambre. Ils prennent moins de longueur, car ils n’ont pas
        de groupe de réfrigérateurs intégrés, ce qui évite le bruit et les pannes dues à l’absorption de graisse et de saleté lors du nettoyage
        des sols. Ils ont une façade de commandes, où se trouve le thermomètre-thermostat et l’interrupteur marche / arrêt. Ils sont équipés d’un
        détendeur, pour son raccordement à la conduite de gaz réfrigérant, qui provient du compresseur. Le groupe réfrigérateur, il est conseillé
        de le placer à l’extérieur, ce qui les rend plus performants. Cet assemblage doit être effectué par un installateur en réfrigération.
        Ils sont fournis avec une grille par porte. TABLES RÉFRIGÉRÉES Température de fonctionnement : 0 à +4°C, avec une température ambiante
        de +36°C. TABLES DE CONGÉLATION Avec cadres de portes chauffants pour éviter la formation de givre. Destinées à la conservation des produits
        congelés. Le produit doit être préalablement congelé. Température de fonctionnement : -18 à -20°C, avec une température ambiante de +36°C.'
