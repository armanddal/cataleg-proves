- id: p94
  n: 94
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Exterior e interior en acero inoxidable 18/10 AISI-304. Aislamiento de poliuretano inyectado ecológico (libre
        de CFC) con una densidad de 40 Kgs/m3, de 40 mm. de espesor. El frío es estático, mediante serpentín de cobre, adosado a la pared interna
        de la cuba, en el espacio del aislamiento, lo cual facilita la limpieza de la misma. Gas refrigerante hidrocarburo R600a. De máximo rendimiento
        para obtener la caliﬁcación energética mas ecológica, y para reducir las emisiones de CO2. Temperatura de trabajo +4 +8° C, con una temperatura
        ambiente de +36° C. Con termómetro-termostato electrónico digital, con el cual se pueden ajustar las temperaturas, máxima y mínima. Con
        interruptor luminoso de marcha-paro. Se pueden usar para ingredientes de pizza, o de bocadillos o de ensaladas. Llevan 4 patas regulables,
        de 20 mm., pero opcionalmente, se pueden suministrar con un kit de patas de 100/120 mm., para poder colocarlas en cualquier mesa de trabajo
        □. Ver ACCESORIOS. Normalmente, se colocan encima de los laterales de granito de las mesas de preparación de pizzas. □ REFRIGERADORES
        DE INGREDIENTES CON VITRINA Con una vitrina de cristal templado, cerrado a 3 caras y encimera, fijado al refrigerador. □ La encimera de
        cristal, se puede usar como estante. Hay modelos sin los recipientes GN, y otros modelos que los llevan como dotación. REFRIGERADORES
        DE INGREDIENTES CON TAPA Equipados con una tapa de acero inoxidable, abatible, que se mantiene elevada, durante el servicio. □ Cuando
        la tapa está cerrada, actúa como un frigorífico, por lo que no es necesario retirar los ingredientes, cuando no se usa. Hay modelos sin
        los recipientes GN, y otros modelos que los llevan como dotación. □ GENERIC CONSTRUCTION Exterior and interior in 18/10 AISI-304 stainless
        steel. Ecological injected polyurethane insulation (CFC-free) with a density of 40 kg/m3, 40 mm thick. The cooling is static, by means
        of a copper coil, attached to the internal wall of the tank, in the insulation space, which facilitates its cleaning. Hydrocarbon refrigerant
        gas R600a. Maximum performance to obtain the most ecological energy qualiﬁcation, and to reduce CO2 emissions. Working temperature +4
        +8° C, with an ambient temperature of +36° C. With digital electronic thermometer-thermostat, with which the maximum and minimum temperatures
        can be adjusted. With illuminated on/off switch. Can be used for pizza toppings, sandwich toppings or salad toppings. They have 4 adjustable
        legs of 20 mm, but optionally, they can be supplied with a set of legs of 100/120 mm, so that they can be placed on any work table □.
        See ACCESSORIES. Normally, they are placed on top of the granite sides of the pizza preparation tables. □ INGREDIENT REFRIGERATORS WITH
        DISPLAY CASE With a tempered glass display cabinet, closed on 3 sides and worktop, fixed to the refrigerator. □ The glass top can be used
        as a shelf. There are models without GN containers and other models with GN containers as standard. INGREDIENT REFRIGERATORS WITH LID
        Equipped with a stainless steel hinged lid, which remains raised during service. □ When the lid is closed, it acts as a refrigerator,
        so there is no need to remove the ingredients when not in use. There are models without GN containers, and other models with GN containers
        as standard. □ CONSTRUCTION GÉNÉRIQUE Extérieur et intérieur en acier inoxydable 18/10 AISI-304. Isolation écologique en polyuréthane
        injecté (sans CFC) d'une densité de 40 kg/m3, d'une épaisseur de 40 mm. Le refroidissement est statique, au moyen d'un serpentin en cuivre,
        fixé à la paroi interne du réservoir, dans l'espace d'isolation, ce qui facilite son nettoyage. Gaz réfrigérant hydrocarbure R600a. Performance
        maximale pour obtenir la qualiﬁcation énergétique la plus écologique, et pour réduire les émissions de CO2. Température de travail +4
        +8° C, avec une température ambiante de +36° C. Avec thermomètre-thermostat électronique numérique, permettant de régler les températures
        maximale et minimale. Avec interrupteur marche/arrêt éclairé.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Peut être utilisé comme garniture de pizza, de sandwich ou de salade. Ils ont 4 pieds réglables de 20 mm, mais en option, ils peuvent
        être fournis avec un jeu de pieds de 100/120 mm, de sorte qu'ils peuvent être placés sur n'importe quelle table de travail □. Voir ACCESSOIRES.
        Normalement, elles sont placées sur les côtés en granit des tables de préparation des pizzas. □ REFROIDISSEURS D'INGRÉDIENTS AVEC VITRINE
        Avec une vitrine en verre trempé, fermée sur 3 côtés et un plan de travail, fixée au réfrigérateur. □ Le plateau en verre peut être utilisé
        comme une étagère. Il existe des modèles sans conteneurs GN et d'autres modèles avec des conteneurs GN de série. REFROIDISSEURS D'INGRÉDIENTS
        AVEC COUVERCLE Équipé d'un couvercle à charnière en acier inoxydable, qui reste relevé pendant le service. □ Lorsque le couvercle est
        fermé, il fait office de réfrigérateur. Il n'est donc pas nécessaire de retirer les ingrédients lorsqu'ils ne sont pas utilisés. Il existe
        des modèles sans conteneurs GN, et d'autres modèles avec des conteneurs GN de série.
      estil:
        color: '#000000'
        mida: 14.0
