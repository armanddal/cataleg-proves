      text: 'CONSTRUCTION Exterior and interior made of 18/10 AISI 304 stainless steel. Eco-friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³ and a thickness of 60 mm. With removable top for easy cleaning. Equipped with a refrigeration unit featuring
        an air-cooled condenser. R290 refrigerant gas. Static cooling provided by an internal stainless steel tube evaporator. Water inlet with
        a maximum temperature of 15°C. Automatic water filling through a Ø 1/2’’ inlet with float valve. With internal water agitator. Safety
        overflow Ø 3/4’’. With Ø 1/2’’ water drain tap. Operating temperature: +1 to +3°C, with an ambient temperature of +36°C. With digital
        electronic thermometer-thermostat. With main power switch and ON/OFF switch. With adjustable legs. It is recommended to install a water
        filter on the water supply line. □ Dimensions according to capacity in litres. □□'
