      text: CONSTRUCCIÓN Encimeras de acero inoxidable. Traseros de acero galvanizado. Cuba interna con los cantos redondeados para facilitar
        la limpieza y desagüe en el interior de la cámara. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40
        Kgs./m3. Con puertas correderas en la encimera. □ Con rejillas separadoras, verticalmente. Grupos frigoríﬁcos sobre-dimensionados. Desescarche
        manual. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador con la máxima comodidad.
        □ Frío estático. Gas refrigerante hidrocarburo R600a. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica, y para
        reducir las emisiones de CO2. Temperatura de trabajo +1 +8º C, con una temperatura ambiente de +36º C. Con termostato analógico. Con interruptor
        luminoso de marcha-paro. Con patas regulables de acero inoxidable. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.5
      w: 18.775
      h: 10.8
  - idioma: en
    paragrafs:
    - role: text
      text: MAKING Stainless Steel Countertops . Galvanized steel rear. Internal tank with rounded edges to facilitate cleaning and drainage inside
        the chamber. Ecological injected polyurethane insulation (CFC-free) with a density of 40 Kgs./m3. With sliding doors on the counter. □
        With separating grids, vertically. Oversized refrigerator groups. Manual defrost. These groups allow their extraction to facilitate the
        service of maintenance and cleaning of the condenser with the maximum comfort. □ Static cold. Hydrocarbon refrigerant gas R600a. Maximum
        performance to obtain the most ecological energy rating, and to reduce CO2 emissions. Working temperature +1 + 8º C, with an ambient temperature
        of + 36º C. With analog thermostat. With light start-stop switch. With stainless steel adjustable legs.
      estil:
