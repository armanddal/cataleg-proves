        assurée par un joint à chambre d'air, facilement remplaçable. □ Groupe frigorifique surdimensionné, situé dans la partie inférieure du
        meuble, avec dégivrage automatique. Ce groupe est extractible afin de faciliter les opérations d'entretien et le nettoyage du condenseur.
        □ Réfrigération ventilée. Gaz réfrigérant à hydrocarbure R290. Très haute performance pour obtenir la meilleure classification énergétique
        écologique et réduire les émissions de CO₂. Modèle réfrigération/congélation convertible. Il suffit d'appuyer sur le bouton de sélection
        pour passer du mode réfrigération (0 à 4°C) au mode congélation (-18 à -21°C), à une température ambiante de +36°C. Équipée d'un thermomètre-thermostat
        électronique numérique. Ce régulateur permet de régler les températures maximale et minimale afin d'optimiser au maximum les performances
        du réfrigérateur. Interrupteur marche/arrêt. Équipée de 4 roulettes pivotantes (dont 2 avec frein).
