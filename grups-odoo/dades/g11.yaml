      text: CONSTRUCCIÓN Es el expositor ideal, para las cervecerías ya que el cliente puede ver los barriles de los distintos tipos de cerveza,
        refrigerados. □ También se pueden exhibir botellines o latas, de gran variedad de marcas y tipos de cerveza, en 3 niveles de exposición.
        □ En dotación se suministran 2 estantes por puerta. □ Con luz led, para resaltar el producto. □ Exterior e interior de acero inoxidable.
        El trasero es de acero galvanizado. Cuba interna con cantos redondeados para facilitar la limpieza. □ Y desagüe en la base. Aislamiento
        de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40 Kgs/m3, de 60 mm. de espesor. Bisagras de torsión, en las puertas.
        Con posición de mantenimiento abierta, cuando supera los 95º. Puertas con cristal doble, con cierre magnético, mediante burletes dotados
        de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Grupos frigoríﬁcos sobre-dimensionados, con desescarche
        automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador. Frío ventilado
        para conseguir la temperatura homogénea en el interior de la cámara. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener
        la caliﬁcación energética mas ecológica, y para reducir la emisiones de CO2. Temperatura de trabajo 0 +4º C, con una temperatura ambiente
        de +36º C. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, así como
        los desescarches automáticamente, con el ﬁn de optimizar al máximo, el rendimiento del frigoríﬁco. Con pulsador táctil marcha-paro. Con
        patas regulables.
