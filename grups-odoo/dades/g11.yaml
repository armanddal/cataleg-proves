    titol:
      es: □ REFRIGERATED COUNTERS WITH DRAWERS AND DOORS □ TABLES RÉFRIGÉRÉES DE CONSERVATION AVEC TIROIRS ET PORTES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: MAKING Exterior and interior in 18/10 AISI-304 stainless steel. The rear is galvanized steel. Worktops with rounded front Edge with
        100 mm rear bib. □ Internal tank with rounded edges to facilitate cleaning. □ And drain at the base. Ecological injected polyurethane
        insulation (CFC-free) with a density of 40 Kgs / m3, 60 mm. of thickness. With adjustable stainless steel legs. Torsion hinges on the
        doors. With open maintenance position, when it exceeds 95º. Doors with integrated handle. □ Perforated drawers for easy ventilation. Equipped
        with telescopic sliding guides, in stainless steel, that allow 100% opening. □ Doors and drawers with magnetic sealing by means of easily
        replaceable air-chamber gaskets. □ automatic defrost. These groups allow its extraction to facilitate the service of maintenance and cleaning
        of the condenser. Cool ventilated to achieve a homogeneous temperature inside the chamber. R290 hydrocarbon refrigerant gas. Maximum performance
        to obtain the most ecological energy rating, and to reduce CO2 emissions. Working temperature 0 + 4º C, with an ambient temperature of
        + 36º C. With digital electronic thermometer-thermostat. This programmer allows to adjust the temperatures, maximum and minimum, as well
        as the defrosts automatically, in order to optimize to the maximum, the performance of the refrigerator. With light start-stop switch.
        They are supplied with one grid per door.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.002
      y: 3.204
      w: 8.773
      h: 24.631
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI-304. L’arrière est en acier galvanisé. Plans de travail avec bord
        avant arrondi et avec bavette arrière de 100 mm. □ Réservoir interne aux bords arrondis pour faciliter le nettoyage. □ Et égouttez à la
        base. Isolation écologique en polyuréthane injecté (sans CFC) avec une densité de 40 Kgs / m3, 60 mm. épais. Avec pieds réglables en acier
        inoxydable. La torsion s’articule sur les portes. Avec position de maintenance ouverte, lorsqu’elle dépasse 95 °. Portes avec poignée
        intégrée. □ Tiroirs perforés pour une ventilation facile. Equipé de guides coulissants télescopiques, en acier inoxydable, qui permettent
        une ouverture à 100%. □ Portes et tiroirs avec fermeture magnétique au moyen de joints à chambre d'air, facilement remplaçables. □ Unités
        de réfrigération surdimensionnées, avec dégivrage automatique. Ces groupes permettent son extraction pour faciliter le service d’entretien
        et de nettoyage du condenseur. Ventilé frais pour atteindre une température homogène à l’intérieur de la chambre. Gaz réfrigérant hydrocarboné
        R290. Des performances maximales pour obtenir la cote énergétique la plus écologique et réduire les émissions de CO2. Température de travail
        0 + 4º C, avec une température ambiante de + 36º C. Avec thermomètre-thermostat électronique numérique. Ce programmateur permet d’ajuster
        automatiquement les températures, maximum et minimum, ainsi que les dégivrages, aﬁn d’optimiser au maximum les performances du réfrigérateur.
        Avec interrupteur marche / arrêt léger. Ils sont fournis avec une grille par porte.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.705
      y: 3.204
      w: 8.929
      h: 24.631
