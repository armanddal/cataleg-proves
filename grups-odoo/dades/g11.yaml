- id: p75
  n: 75
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
    serie: SERIE 2
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.149
    titol:
      es: □ REFRIGERATED SANDWICH AND PIZZA PREPARATION COUNTERS □ TABLES RÉFRIGÉRÉES POUR LA PRÉPARATION DE SANDWICHS ET DE PIZZAS
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#006699'
        negreta: true
        mida: 14.0
    - role: text
      text: 700 mm deep.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Exterior and interior in stainless steel. Galvanised steel back panel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Inner well with rounded corners for easy cleaning and a drain outlet in the base. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Eco-friendly injected polyurethane insulation (CFC-free), with a density of 40 kg/m³ and 50 mm thickness.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Torsion hinges on all doors, with a stay-open position when opened beyond 95°. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Doors fitted with magnetic gaskets incorporating an air chamber to ensure a perfect seal. Easy to replace. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: The refrigerated storage compartment is GN 1/1 compatible and supplied with one 325 × 530 mm shelf per door. GN containers are available
        as an option (see GROUP 16).
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: The stainless steel worktop incorporates a raised rear well, 130 mm above the worktop, designed to accommodate GN containers. Refrigeration
        is provided from the lower refrigerated compartment.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Models with GN containers INCLUDED are also available. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Fitted with a two-position stainless steel hinged lid (open or closed). When not in use, it hygienically protects the food while keeping
        it refrigerated. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Oversized refrigeration units, located in the lower section of the cabinet, with automatic defrost. These units are removable to facilitate
        servicing and condenser cleaning. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Static refrigeration.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: R290 hydrocarbon refrigerant. High-efficiency refrigerant for achieving the highest energy rating while reducing CO₂ emissions.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: 'Operating temperature: 0 to +4°C with an ambient temperature of +36°C.'
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With digital electronic thermometer-thermostat. This controller allows the maximum and minimum temperatures to be adjusted to optimise
        refrigerator performance.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With ON/OFF switch.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With lock located at the bottom of the doors. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With plinth base and adjustable feet.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 8.967
      h: 25.299
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Profondeur de 700 mm. Extérieur et intérieur en acier inoxydable. Dos en acier galvanisé. Cuve intérieure avec angles
        arrondis pour faciliter le nettoyage et évacuation au fond. □ Isolation en polyuréthane injecté écologique (sans CFC), d''une densité
        de 40 kg/m³ et d''une épaisseur de 50 mm. Charnières à torsion sur toutes les portes, avec position de maintien en ouverture au-delà de
        95°. □ Portes avec fermeture magnétique par joints équipés d''une chambre d''air, assurant une parfaite étanchéité. Joints facilement
        remplaçables. □ Les réserves sont compatibles GN 1/1 et sont livrées avec une grille de 325 × 530 mm par porte. Des bacs GN peuvent être
        installés en option (voir GROUPE 16). Le plan de travail en acier inoxydable est équipé, dans sa partie arrière, d''un logement surélevé
        de 130 mm destiné à recevoir des bacs GN. Le froid provient du compartiment réfrigéré inférieur. Des modèles avec bacs GN FOURNIS sont
        également disponibles. □ Équipées d''un couvercle basculant en acier inoxydable à deux positions (ouvert ou fermé). Lorsqu''il n''est
        pas utilisé, il protège les aliments de manière hygiénique tout en les maintenant réfrigérés. □ Groupes frigorifiques surdimensionnés,
        placés dans la partie inférieure du meuble, avec dégivrage automatique. Ces groupes sont extractibles afin de faciliter les opérations
        d''entretien et le nettoyage du condenseur. □ Réfrigération statique. Gaz réfrigérant à hydrocarbure R290. Très haut rendement permettant
        d''obtenir la meilleure classification énergétique tout en réduisant les émissions de CO₂. Température de fonctionnement : 0 à +4°C avec
        une température ambiante de +36°C. Avec thermomètre-thermostat électronique numérique. Ce régulateur permet de régler les températures
        maximale et minimale afin d''optimiser les performances du réfrigérateur. Avec interrupteur marche/arrêt. Avec serrure située dans la
        partie inférieure des portes. □ Avec socle de base et pieds réglables.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 9.967
      y: 3.101
      w: 9.8
      h: 25.4
