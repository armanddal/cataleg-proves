    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304, 18/10. Los traseros son de acero galvanizado. Cubas internas con los
        cantos redondeados. □ para facilitar la limpieza y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC),
        con una densidad de 40 Kgs./m3, de 70 mm de espesor. Con patas de acero inoxidable, regulables en altura. Bisagras de torsión en todas
        las puertas. Con posición de mantenimiento abierta, cuando supera los 95°. □ Puertas con tirador incorporado, con cierre magnético, mediante
        burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Puertas con apertura reversible. □ Con
        luz interior. Grupos frigoríficos en la parte inferior. Con desescarche automático. Frío ventilado para conseguir la temperatura homogénea
        en el interior. □ Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la calificación energética mas ecológica, y para
        reducir las emisiones de CO2. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas máxima
        y mínima, así como los desescarches, automáticamente, con el fin de optimizar el máximo rendimiento del frigorífico. Con interruptor táctil
        de marcha-paro. Rejillas de varilla plastificada, regulables en altura cada 70 mm., mediante una cremallera. Con dotación de 3 unidades
        por cuerpo. ARMARIOS DE CONSERVACIÓN Régimen de trabajo 0 + 4°C, con una temperatura ambiente de +38°C. ARMARIOS DE CONGELACIÓN Para mantenimiento
        de congelados. El producto debe estar previamente congelado. Temperatura de trabajo -18° -22°C, con una temperatura ambiente de + 38°C.
