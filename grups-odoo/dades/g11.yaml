        gaskets to ensure a tight seal. Easily replaceable. □ Supplied with 1 GN 1/1 shelf per door. Oversized refrigeration units, with automatic
        defrosting. These units can be removed to facilitate maintenance and condenser cleaning with maximum convenience. □ Hydrocarbon refrigerant
        gas. Maximum performance to achieve the most ecological energy rating and reduce CO₂ emissions. With static cooling. Operating temperature
        0 +4° C, with an ambient temperature of +36° C. With digital electronic thermometer-thermostat. This controller allows the maximum and
        minimum temperatures to be adjusted, as well as automatic defrosting, in order to optimize the refrigerator''s performance to the maximum.
