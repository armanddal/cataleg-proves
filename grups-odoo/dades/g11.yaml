      text: Doors with built-in handle, with magnetic closure, by means of weatherstripping with an air chamber, to ensure watertightness. Easily
        replaceable. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Oversized refrigeration units, with automatic defrost. These groups allow its extraction to facilitate the service of maintenance
