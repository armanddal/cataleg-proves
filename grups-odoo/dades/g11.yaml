      text: CONSTRUCCIÓN Exterior e interior de acero inoxidable 18/10 AISI-304. El trasero es de acero galvanizado. Encimeras con canto frontal
        redondeado, murales, con peto posterior de 100 mm. □ Cuba interna con cantos redondeados para facilitar la limpieza. □ Y desagüe en la
        base. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40 Kgs/m3, de 60 mm. de espesor. Con patas regulables
        de acero inoxidable. Bisagras de torsión, en las puertas. Con posición de mantenimiento abierta, cuando supera los 95º. Puertas con tirador
        incorporado, con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles.
        □ Frío ventilado para conseguir la temperatura homogénea en el interior de la cámara. Ocupan menos longitud, al no llevar grupo frigoríﬁco
        incorporado, con lo que se evita el ruido del mismo, y las averías por la absorción de grasas y suciedad, cuando se limpian los suelos.
        Disponen de un frontal de mandos, donde está el termómetro-termostato, y el interruptor de marcha-paro. Equipan una válvula de expansión,
        para su conexión a la tubería del gas refrigerante, que viene del compresor. El grupo frigoríﬁco, es aconsejable colocarlo en el exterior,
        lo cual hace que rindan mas. Y recomendamos pongan el gas R290. Dicho montaje debe efectuarlo un instalador frigorista. Se suministran
        en dotación, con una rejilla por puerta. MESAS DE CONSERVACIÓN Temperatura de trabajo 0 + 4ºC, con una temperatura ambiente de +36ºC.
        MESAS DE CONGELACIÓN Con los marcos de las puertas calefactados, para evitar el hielo. Son para mantenimiento de congelados. El producto
        debe estar previamente congelado. Temperatura de trabajo -18 -20ºC, con una temperatura ambiente de +36ºC.
