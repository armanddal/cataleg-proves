  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Comptoirs en acier inoxydable. Arrière en acier galvanisé. Réservoir interne avec bords arrondis pour faciliter le nettoyage
        et le drainage à l’intérieur de la chambre. Isolation écologique en polyuréthane injecté (sans CFC) avec une densité de 40 Kgs./m3. Avec
        portes coulissantes sur le comptoir. □ Avec des grilles de séparation, verticalement. Groupes réfrigérants surdimensionnés. Dégivrage
        manuel. Ces groupes permettent leur extraction pour faciliter le service d’entretien et de nettoyage du condenseur avec le maximum de
