        granit. □ Cuve intérieure avec angles arrondis pour faciliter le nettoyage et l’évacuation de l’eau à l’intérieur de la chambre. □ Isolation
        en polyuréthane injecté écologique (sans CFC), d’une densité de 40 kg/m³. Avec pieds réglables en acier inoxydable. Charnières à torsion
        sur toutes les portes. Avec position de maintien ouverte lorsqu’elles dépassent 95 degrés. Portes avec fermeture magnétique, au moyen
        de joints équipés d’une chambre à air, pour assurer l’étanchéité. Facilement remplaçables. □ Groupes frigorifiques surdimensionnés, avec
        dégivrage automatique. Ces groupes peuvent être extraits afin de faciliter les opérations de maintenance et le nettoyage du condenseur
        avec un maximum de confort. Gaz réfrigérant hydrocarbure R290. À haut rendement pour obtenir la classification énergétique la plus écologique
        et réduire les émissions de CO2. Froid ventilé pour obtenir une température homogène à l’intérieur de la chambre. Avec thermomètre-thermostat
        électronique numérique. Ce programmateur permet de régler les températures maximale et minimale, ainsi que les dégivrages automatiquement,
        afin d’optimiser au maximum les performances du réfrigérateur. Avec interrupteur tactile marche-arrêt. Avec un tiroir neutre à droite.
