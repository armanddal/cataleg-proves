    titol:
      es: □ REFRIGERATED STORAGE AND FREEZER CABINETS □ ARMOIRES RÉFRIGÉRÉES DE CONSERVATION ET DE CONGÉLATION
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION Stainless steel AISI-304, 18/10 interior and exterior. Galvanized steel rear panels. Internal tanks with rounded corners
        □ to facilitate cleaning and a drain at the base. Eco-friendly injected polyurethane insulation (CFC-free), with a density of 40 kg/m³
        and a thickness of 70 mm. Stainless steel feet, adjustable in height. Torsion hinges on all doors, with an open-hold position when opening
        exceeds 95°. □ Doors with integrated handle and magnetic closure using gaskets equipped with an air chamber to ensure airtightness. Easily
        replaceable. □ Doors with reversible opening. □ Internal lighting. Refrigeration units located at the bottom. Automatic defrost. Ventilated
        cooling to achieve a homogeneous temperature inside. □ Hydrocarbon refrigerant gas R290, with maximum performance to achieve the most
        eco-friendly energy rating and to reduce CO₂ emissions. Digital electronic thermometer-thermostat. This programmer allows adjusting maximum
        and minimum temperatures, as well as defrosting automatically, to optimize the maximum performance of the refrigerator. With touch-sensitive
        on-off switch. Plastic-coated wire shelves, height-adjustable every 70 mm using a rack system. Provided with 3 units per section. STORAGE
        CABINETS Working range 0°C to +4°C, with an ambient temperature of +38°C. FREEZER CABINETS For frozen food maintenance. The product must
        be previously frozen. Working temperature -18°C to -22°C, with an ambient temperature of +38°C.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Intérieur et extérieur en acier inoxydable AISI-304, 18/10. Panneaux arrière en acier galvanisé. Cuves internes avec
        angles arrondis □ pour faciliter le nettoyage et vidange à la base. Isolation en polyuréthane injecté écologique (sans CFC), d'une densité
        de 40 kg/m³ et d'une épaisseur de 70 mm. Pieds en acier inoxydable, réglables en hauteur. Charnières à torsion sur toutes les portes,
        avec position de maintien ouverte lorsque l'ouverture dépasse 95°. □ Portes avec poignée intégrée et fermeture magnétique par joints à
        chambre d'air pour assurer l'étanchéité. Facilement remplaçables. □ Portes avec sens d'ouverture réversible. □ Éclairage intérieur. Groupes
        frigorifiques situés en partie inférieure. Dégivrage automatique. Froid ventilé pour garantir une température homogène à l'intérieur.
        □ Gaz réfrigérant hydrocarbure R290, offrant un rendement maximal pour obtenir la classification énergétique la plus écologique et réduire
        les émissions de CO₂. Thermomètre-thermostat électronique digital. Ce régulateur permet d'ajuster automatiquement les températures maximale
        et minimale ainsi que les dégivrages, afin d'optimiser au maximum le rendement du réfrigérateur. Avec Interrupteur tactique marche/arrêt.
        Grilles en fil plastifié, réglables en hauteur tous les 70 mm à l'aide d'un système de crémaillère. Fournies à raison de 3 unités par
        compartiment. ARMOIRES DE CONSERVATION Plage de fonctionnement de 0 °C à +4 °C, pour une température ambiante de +38 °C. ARMOIRES DE CONGÉLATION
        Conçues pour la conservation de produits surgelés. Le produit doit être préalablement congelé. Température de fonctionnement de -18 °C
        à -22 °C, pour une température ambiante de +38 °C.
      estil:
        color: '#000000'
        mida: 14.0
