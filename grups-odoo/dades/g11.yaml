        □ pour faciliter le nettoyage, avec évacuation en partie basse. Isolation en polyuréthane injecté écologique (sans CFC), d’une densité
        de 40 kg/m³ et d’une épaisseur de 70 mm. Équipés de pieds en acier inoxydable réglables en hauteur. Charnières à torsion sur les portes.
        Position de maintien en ouverture au-delà de 95°. □ Portes avec poignée intégrée et fermeture magnétique, au moyen de joints à chambre
        d’air garantissant l’étanchéité. Facilement remplaçables. □ Portes réversibles. □ Avec serrure. Éclairage intérieur. Groupes frigorifiques
        surdimensionnés, avec dégivrage automatique. Froid ventilé pour assurer une température homogène à l’intérieur. □ Groupe frigorifique
        situé en partie supérieure. Gaz réfrigérant hydrocarbure R290, offrant un rendement maximal pour obtenir la classe énergétique la plus
        écologique et réduire les émissions de CO₂. Thermomètre-thermostat électronique numérique. Ce programmateur permet de régler les températures
        minimale et maximale ainsi que les cycles de dégivrage automatiques, afin d’optimiser les performances du réfrigérateur. Interrupteur
        marche-arrêt lumineux. Parois latérales avec glissières intégrées. □ Équipés de 3 clayettes par porte. ARMOIRES DE CONSERVATION Température
        de fonctionnement : de 0 à +4 °C, pour une température ambiante de +38 °C. ARMOIRES DE CONGÉLATION Destinées à la conservation de produits
        congelés. Le produit doit être préalablement congelé. Température de fonctionnement : de −18 à −22 °C, pour une température ambiante de
        +38 °C.'
