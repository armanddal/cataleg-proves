    titol:
      es: □ REFRIGERATED SALAD PREPARATION COUNTERS (GASTRO-CHEFF) □ TABLES RÉFRIGÉRÉES POUR LA PRÉPARATION DES SALADES (GASTRO-CHEFF)
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION 700 mm deep. Exterior and interior in stainless steel. Galvanised steel back panel. Inner well with rounded corners
        for easy cleaning and a drain outlet in the base. □ Eco-friendly injected polyurethane insulation (CFC-free), with a density of 40 kg/m³
        and 50 mm thickness. Torsion hinges on all doors, with a stay-open position when opened beyond 95°. □ Doors fitted with magnetic gaskets
        incorporating an air chamber to ensure a perfect seal. Easy to replace. □ The refrigerated storage compartment is GN 1/1 compatible and
        supplied with one 325 × 530 mm shelf per door. GN containers are available as an option (see GROUP 16). The top is fitted with a telescopic
        stainless steel hinged lid to cover the food when not in use, while allowing the worktop to be used as a preparation table. □ The top
        is completely open to accommodate GN 1/1 containers in any desired configuration (see GROUP 16). Refrigeration is provided from the lower
        refrigerated compartment. At the front of the worktop there is a polyethylene chopping board for salad preparation. Models with GN containers
        INCLUDED are also available. Oversized refrigeration units, located in the lower section of the cabinet, with automatic defrost. These
        units are removable to facilitate servicing and condenser cleaning. □ Static refrigeration. R290 hydrocarbon refrigerant. High-efficiency
        refrigerant for achieving the highest energy rating while reducing CO₂ emissions. Operating temperature: 0 to +4°C, with an ambient temperature
        of +36°C. With digital electronic thermometer-thermostat. This controller allows the maximum and minimum temperatures to be adjusted to
        optimise refrigerator performance. With ON/OFF switch. With lock located at the bottom of the doors. □ With plinth base and adjustable
        feet.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 8.967
      h: 25.5
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Profondeur de 700 mm. Extérieur et intérieur en acier inoxydable. Dos en acier galvanisé. Cuve intérieure avec angles
        arrondis pour faciliter le nettoyage et évacuation au fond. □ Isolation en polyuréthane injecté écologique (sans CFC), d''une densité
        de 40 kg/m³ et d''une épaisseur de 50 mm. Charnières à torsion sur toutes les portes, avec position de maintien en ouverture au-delà de
        95°. □ Portes avec fermeture magnétique par joints équipés d''une chambre d''air, assurant une parfaite étanchéité. Joints facilement
        remplaçables. □ Les réserves sont compatibles GN 1/1 et sont livrées avec une grille de 325 × 530 mm par porte. Des bacs GN peuvent être
        installés en option (voir GROUPE 16). Le dessus est équipé d''un couvercle basculant télescopique en acier inoxydable permettant de protéger
        les aliments lorsqu''il n''est pas utilisé, tout en servant de plan de travail. □ Le dessus est entièrement ouvert afin de recevoir des
        bacs GN 1/1 dans toutes les combinaisons souhaitées (voir GROUPE 16). Le froid provient du compartiment réfrigéré inférieur. À l''avant
        du plan de travail se trouve une planche à découper en polyéthylène pour la préparation des salades. Des modèles avec bacs GN FOURNIS
        sont également disponibles. Groupes frigorifiques surdimensionnés, placés dans la partie inférieure du meuble, avec dégivrage automatique.
        Ces groupes sont extractibles afin de faciliter les opérations d''entretien et le nettoyage du condenseur. □ Réfrigération statique. Gaz
        réfrigérant hydrocarboné R290. Très haut rendement permettant d''obtenir la meilleure classification énergétique tout en réduisant les
        émissions de CO₂. Température de fonctionnement : 0 à +4°C, avec une température ambiante de +36°C. Avec thermomètre-thermostat électronique
        numérique. Ce régulateur permet de régler les températures maximale et minimale afin d''optimiser les performances du réfrigérateur. Avec
        interrupteur marche/arrêt. Avec serrure située dans la partie inférieure des portes. □ Avec socle de base et pieds réglables.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.885
      y: 3.101
      w: 8.932
      h: 25.7
