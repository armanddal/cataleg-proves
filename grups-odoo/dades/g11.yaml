        la emisiones de CO2. Frío ventilado para conseguir la temperatura homogénea en el interior de la cámara. Con termómetro-termostato electrónico
        digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de
        optimizar al máximo el rendimiento del frigoríﬁco. Con interruptor táctil de marcha-paro. Con un cajón neutro, a la derecha. □
