  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN De 700 mm. de profundidad. Exterior e interior de acero inoxidable. El trasero es de acero galvanizado. Aislamiento de
        poliuretano inyectado ecológico (libre de CFC), con una densidad de 40 Kgs/m3 y de 50 mm. de espesor. Con 1 cajón perforado para facilitar
        la ventilación. Dotado de guías correderas telescópicas, de acero inoxidable, que permite la abertura al 100%. □ Con capacidad para recipientes
        GN 1/1-150 Con cierre magnético, mediante burlete con cámara de aire, fácilmente sustituible. □ Grupos frigoríficos sobre-dimensionados,
        situados en la parte inferior del mueble, con desescarche automático. Dichos grupos permiten su extracción para facilitar el servicio
        de mantenimiento y limpieza del condensador. □ Con frío ventilado. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y para reducir las emisiones de CO2. Son de conservación/congelación. Basta con presionar el
        pulsador, para el cambio de temperatura, de conservación (0 a 4°C) a congelación (-18 -21°C), con una temperatura ambiente de +36°C. Con
        termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, con el fin de optimizar
        al máximo el rendimiento del frigorífico. Con interruptor de marcha-paro. Con 4 ruedas giratorias (2 con freno).
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.712
      w: 19.0
