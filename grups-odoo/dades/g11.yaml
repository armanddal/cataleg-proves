  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. Rear panels made of galvanised steel. Internal compartments
        with rounded corners. □ to facilitate cleaning and drainage at the bottom. Eco-friendly injected polyurethane insulation (CFC-free), with
        a density of 40 kg/m³ and a thickness of 70 mm. Height-adjustable stainless steel feet. Torsion-spring hinges on all doors, with a hold-open
        position when opened beyond 95°. □ Doors with integrated handles and magnetic closure, ensuring an airtight seal by means of air-chamber
        gaskets. Easily replaceable. □ Reversible door opening. □ Interior lighting. Refrigeration units located at the top. Automatic defrosting.
        Fan-assisted cooling to ensure an even temperature throughout the interior. □ Hydrocarbon refrigerant gas, providing maximum efficiency
        to achieve the most environmentally friendly energy rating and reduce CO₂ emissions. Digital electronic thermometer-thermostat. This controller
        allows the maximum and minimum temperatures to be set, as well as automatic defrost cycles, in order to optimise refrigeration performance.
        With touch-sensitive on/off button. Plastic-coated wire shelves, height-adjustable every 70 mm using a rack system. Supplied with 3 shelves
        per compartment. Door locks. REFRIGERATED STORAGE CABINETS Double glazing with an air gap. □ Operating temperature range: 0 to +4°C, at
        an ambient temperature of +32°C. FREEZER CABINETS Triple glazing with air gaps. For storing frozen products. Products must be frozen beforehand.
        Operating temperature range: -18 to -20°C, at an ambient temperature of +32°C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Panneaux arrière en acier galvanisé. Cuves intérieures avec
        angles arrondis. □ pour faciliter le nettoyage et l’évacuation de l’eau au fond. Isolation en polyuréthane écologique injecté (sans CFC),
        d’une densité de 40 kg/m³ et d’une épaisseur de 70 mm. Pieds en acier inoxydable, réglables en hauteur. Charnières à ressort de torsion
        sur toutes les portes, avec maintien en position ouverte au-delà de 95°. □ Portes avec poignée intégrée et fermeture magnétique, assurant
        l’étanchéité grâce à des joints à chambre d’air. Facilement remplaçables. □ Portes réversibles. □ Éclairage intérieur. Groupes frigorifiques
        situés dans la partie supérieure. Dégivrage automatique. Froid ventilé pour garantir une température homogène à l’intérieur. □ Gaz réfrigérant
        hydrocarbure, offrant un rendement maximal afin d’obtenir la classification énergétique la plus écologique et de réduire les émissions
        de CO₂. Thermomètre-thermostat électronique numérique. Ce programmateur permet de régler les températures maximale et minimale ainsi que
        les cycles de dégivrage automatiques, afin d’optimiser les performances du réfrigérateur. Avec Interrupteur tactile marche/arrêt. Grilles
        en fil métallique plastifié, réglables en hauteur tous les 70 mm au moyen d’une crémaillère. Fournies à raison de 3 unités par compartiment.
        Serrure sur les portes. ARMOIRES DE CONSERVATION Double vitrage avec lame d’air. □ Plage de fonctionnement : de 0 à +4 °C, pour une température
        ambiante de +32 °C. ARMOIRES DE CONGÉLATION Triple vitrage avec lames d’air. Pour la conservation des produits surgelés. Les produits
        doivent être préalablement congelés. Plage de fonctionnement : de -18 à -20 °C, pour une température ambiante de +32 °C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.301
      y: 3.101
      w: 9.6
      h: 25.5
