    titol:
      es: MESAS FRÍAS DE PREPARACIÓN DE BOCADILLOS Y PIZZAS
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#006699'
        negreta: true
        mida: 14.0
    - role: text
      text: De 700 mm. de profundidad.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Exterior e interior de acero inoxidable. El trasero es de acero galvanizado.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cuba interna con los cantos redondeados para facilitar la limpieza y desagüe en la base. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Aislamiento de poliuretano inyectado ecológico (libre de CFC), con una densidad de 40 Kgs/m3 y de 50 mm. de espesor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bisagras de torsión, en todas las puertas. Con posición de mantenimiento abierta, cuando supera los 95 grados. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puertas con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles.
        □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Las reservas, son GN 1/1, y llevan en dotación una rejilla de 325x530 por puerta. Opcionalmente, se pueden colocar recipientes GN
        (Ver GRUPO 16)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La encimera es de acero inoxidable y en la parte posterior, disponen de un hueco elevado 130 mm. de la misma, para colocar recipientes
        GN. El frío proviene de la cámara inferior.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Hay modelos, con los recipientes en DOTACIÓN. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipan una tapa abatible, de acero inoxidable, con dos posiciones, abierta o cerrada, de manera que cuando no se usa, los alimentos
        quedan protegidos higiénicamente y además se mantienen refrigerados. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Grupos frigoríficos sobre-dimensionados, situados en la parte inferior del mueble, con desescarche automático. Dichos grupos permiten
        su extracción para facilitar el servicio de mantenimiento y limpieza del condensador. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con frío estático.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la calificación energética mas ecológica, y para reducir las
        emisiones de CO2.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Temperatura de trabajo 0 +4°C, con una temperatura ambiente de +36°C.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, con el fin de
        optimizar al máximo el rendimiento del frigorífico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con interruptor de marcha-paro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con cerradura, situada en la parte inferior de las puertas. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con zócalo en la base del mueble y pies regulables.
      estil:
        color: '#000000'
        mida: 14.0
