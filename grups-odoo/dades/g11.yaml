- id: p54
  n: 54
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
    titol:
      es: □ REFRIGERATED BEER KEG TABLES □ TABLES RÉFRIGÉRÉES POUR FÛTS DE BIÈRE
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'MAKING It is the ideal display unit for breweries and bars, allowing customers to see the different types of beer kegs while they
        are refrigerated. □ It can also be used to display bottles or cans from a wide variety of beer brands and types on three display levels.
        □ Supplied as standard with 2 shelves per door. □ Equipped with LED lighting to enhance product presentation. □ Exterior and interior
        in stainless steel. Galvanized steel back panel. Internal base with rounded corners for easy cleaning. □ Drain at the bottom. Eco-friendly
        injected polyurethane insulation (CFC-free), density 40 kg/m³, 60 mm thick. Torsion hinges on the doors with a stay-open position beyond
        95°. Double-glazed glass doors with magnetic sealing by means of easily replaceable air-chamber gaskets, ensuring perfect airtightness.
        □ Oversized refrigeration units with automatic defrost. The refrigeration unit can be removed to facilitate maintenance and condenser
        cleaning. Ventilated refrigeration system to ensure a uniform temperature throughout the cabinet. R290 hydrocarbon refrigerant. High-efficiency
        refrigerant for achieving the most environmentally friendly energy rating and reducing CO₂ emissions. Operating temperature: 0 to +4 °C,
        with an ambient temperature of +36 °C. Digital electronic thermostat-thermometer. The controller allows the adjustment of maximum and
        minimum temperatures, as well as automatic defrost cycles, to optimize refrigerator performance. Touch-sensitive ON/OFF switch. With adjustable
        legs.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.002
      y: 2.569
      w: 9.2
      h: 25.402
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION C''est le présentoir idéal pour les brasseries, permettant aux clients de voir les différents types de fûts de bière
        tout en étant réfrigérés. □ Il permet également d''exposer des bouteilles ou des canettes d''une grande variété de marques et de types
        de bière sur trois niveaux de présentation. □ Livré en standard avec 2 clayettes par porte. □ Équipé d''un éclairage LED pour mettre le
        produit en valeur. □ Extérieur et intérieur en acier inoxydable. Arrière en acier galvanisé. Cuve intérieure avec angles arrondis pour
        faciliter le nettoyage. □ Évacuation au fond de la cuve. Isolation en polyuréthane injecté écologique (sans CFC), densité de 40 kg/m³,
        épaisseur de 60 mm. Charnières à torsion sur les portes, avec position de maintien en ouverture au-delà de 95°. Portes à double vitrage
        avec fermeture magnétique au moyen de joints à chambre d''air, facilement remplaçables, garantissant une parfaite étanchéité. □ Groupes
        frigorifiques surdimensionnés avec dégivrage automatique. Les groupes sont extractibles afin de faciliter les opérations d''entretien
        et le nettoyage du condenseur. Froid ventilé assurant une température homogène à l''intérieur de l''enceinte. Fluide frigorigène hydrocarbure
        R290. Très haut rendement pour obtenir la meilleure classification énergétique écologique et réduire les émissions de CO₂. Température
        de fonctionnement : de 0 à +4 °C, avec une température ambiante de +36 °C. Thermomètre-thermostat électronique numérique. Ce régulateur
        permet de régler les températures maximale et minimale ainsi que les cycles de dégivrage automatiques afin d''optimiser les performances
        de l''appareil. Interrupteur marche/arrêt à commande tactile. Avec pieds réglables.'
      estil:
        color: '#000000'
        mida: 14.0
