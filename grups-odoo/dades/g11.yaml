    - role: text
      text: Cool ventilated to achieve a homogeneous temperature inside the chamber.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: R290 hydrocarbon refrigerant gas. Maximum performance to obtain the most ecological energy rating, and to reduce CO2 emissions.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With digital electronic thermometer-thermostat. This programmer allows to adjust the temperatures, maximum and minimum, as well as
