  - idioma: en
    paragrafs:
    - role: text
      text: Creadas, para gran producción de hielo triturado (escamas), necesario en Hoteles, Restaurantes, Discotecas, Pescaderias, Supermercados,
        Hospitales, Industria, etc. CONSTRUCCIÓN Se trata de un fabricador de hielo, que va colocado encima de un depósito. (Se suministra en
        dos piezas). □ El fabricador está construido, exteriormente en acero inox. 18/10 AISI 304. El interior es de ABS alimentario. El aislamiento
        de poliuretano inyectado ecológico (libre de CFC), con una densidad de 40 Kgs./m³. Equipo frigorífico tropicalizado, pudiendo trabajar
        con una temperatura ambiente de +21ºC, y con la entrada del agua a +15ºC. Gas refrigerante R290. Refrigeración del condensador por aire.
        El hielo que producen esta triturado, troceado, convertido en escamas. □ La producción es en Kgs. por día. El depósito de gran capacidad,
        también está construido exteriormente en acero inox. 18/10 AISI 304, i el interior en ABS alimentario.□ Muy bien aislado, para evitar
        la fusión del hielo troceado almacenado. Con puerta batiente en acero inoxidable, □ y también aislada. Con patas regulables de acero inoxidable.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.607
      w: 6.6
      h: 21.7
  - idioma: de
    paragrafs:
    - role: text
      text: Designed for the high-volume production of flake ice, essential for Hotels, Restaurants, Nightclubs, Fishmongers, Supermarkets, Hospitals,
        Industry, etc. CONSTRUCTION This ice maker is designed to be installed on top of a storage bin. (Supplied in two separate units). □ The
        ice maker has an exterior constructed in 18/10 AISI 304 stainless steel. The interior is made of food-grade ABS. Eco-friendly injected
        polyurethane insulation (CFC-free), with a density of 40 kg/m³. Tropicalized refrigeration unit, designed to operate with an ambient temperature
        of +21°C and a water inlet temperature of +15°C. R290 refrigerant gas. Air-cooled condenser. The ice produced is crushed into flakes.
        □ Production capacity is expressed in kg per day. The high-capacity storage bin is also constructed externally in 18/10 AISI 304 stainless
        steel, with a food-grade ABS interior. □ Highly insulated to prevent the stored flake ice from melting. With insulated stainless steel
        hinged door. □ With adjustable stainless steel legs.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 7.504
      y: 2.607
      w: 6.5
      h: 21.7
  - idioma: de
    paragrafs:
    - role: text
      text: Conçus pour une grande production de glace en écailles, indispensable dans les Hôtels, Restaurants, Discothèques, Poissonneries, Supermarchés,
        Hôpitaux, Industrie, etc. CONSTRUCTION Il s'agit d'un fabricant de glace conçu pour être installé sur un bac de stockage. (Livré en deux
        éléments). □ Le fabricant est construit extérieurement en acier inoxydable 18/10 AISI 304. L'intérieur est en ABS alimentaire. Isolation
        en polyuréthane injecté écologique (sans CFC), d'une densité de 40 kg/m³. Groupe frigorifique tropicalisé, pouvant fonctionner avec une
        température ambiante de +21°C et une température d'entrée d'eau de +15°C. Gaz réfrigérant R290. Condenseur refroidi par air. La glace
        produite est de la glace en écailles. □ La production est exprimée en kg par jour. Le bac de stockage de grande capacité est également
        construit extérieurement en acier inoxydable 18/10 AISI 304, avec un intérieur en ABS alimentaire. □ Très bien isolé afin d'éviter la
        fonte de la glace en écailles stockée. Avec porte battante isolée en acier inoxydable. □ Avec pieds réglables en acier inoxydable.
