        au moyen d’un serpentin en cuivre fixé à la paroi intérieure de la cuve, dans l’espace de l’isolation, ce qui facilite son nettoyage.
        Avec une vitrine en verre trempé, fermée sur 3 côtés et avec plan de travail, fixée au réfrigérateur. □ Le plan de travail en verre peut
        être utilisé comme étagère.
