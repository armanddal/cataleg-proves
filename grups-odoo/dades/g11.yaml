        the condenser. Cool ventilated to achieve a homogeneous temperature inside the chamber. R290 hydrocarbon refrigerant gas. Maximum performance
        to obtain the most ecological energy rating, and to reduce CO2 emissions. Working temperature 0 + 4º C, with an ambient temperature of
        + 36º C. With digital electronic thermometer-thermostat. This programmer allows to adjust the temperatures, maximum and minimum, as well
        as the defrosts automatically, in order to optimize to the maximum, the performance of the refrigerator. With light start-stop switch.
