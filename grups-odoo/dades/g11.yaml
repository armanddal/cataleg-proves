  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN De 700 mm. de profundidad. Exterior e interior de acero inoxidable. El trasero es de acero galvanizado. Cuba interna
        con los cantos redondeados para facilitar la limpieza y desagüe en la base. □ Aislamiento de poliuretano inyectado ecológico (libre de
        CFC), con una densidad de 40 Kgs/m3 y de 50 mm. de espesor. Bisagras de torsión, en todas las puertas. Con posición de mantenimiento abierta,
        cuando supera los 95 grados. □ Puertas con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad.
        Fácilmente substituibles. □ Las reservas, son GN 1/1, y llevan en dotación una rejilla de 325x530 por puerta. Opcionalmente, se pueden
        colocar recipientes GN (Ver GRUPO 16). Disponen de una vitrina cerrada a tres caras, con un estante intermedio de cristal. □ Diseñadas
        para la exposición y venta en KEBAPS. La encimera está totalmente abierta para colocar, opcionalmente, recipientes GN 1/1, con las combinaciones
        que deseen. (Ver GRUPO 16). El frío proviene de la cámara inferior. En la parte anterior de la encimera, dispone de una placa de polietileno,
        para el corte y preparación de las ensaladas. Hay modelos con los recipientes en DOTACIÓN. Grupos frigoríficos sobre-dimensionados, situados
        en la parte inferior del mueble, con desescarche automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento
        y limpieza del condensador. □ Con frío estático. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la calificación
        energética mas ecológica, y para reducir las emisiones de CO2. Temperatura de trabajo 0 +4°C, con una temperatura ambiente de +36°C. Con
        termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, con el fin de optimizar
        al máximo el rendimiento del frigorífico. Con interruptor de marcha-paro. Con cerradura, situada en la parte inferior de las puertas.
        □ Con zócalo en la base del mueble y pies regulables.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.754
      w: 19.0
      h: 15.431
