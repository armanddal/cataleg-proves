      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior in 18/10 AISI-304 stainless steel. Rear panel in galvanized steel. With granite worktop, backsplash
        and sides. □ Depth: 800 mm. Internal tank with rounded corners to facilitate cleaning and drainage inside the chamber. □ Eco-friendly
        injected polyurethane insulation (CFC-free), with a density of 40 kg/m³. With adjustable stainless steel feet. Torsion hinges on all doors.
        With hold-open position when the doors open beyond 95 degrees. Doors with magnetic closure, using air-chamber gaskets to ensure a tight
        seal. Easily replaceable. □ Oversized refrigeration units, with automatic defrosting. These units can be removed to facilitate maintenance
        and condenser cleaning with maximum convenience. R290 hydrocarbon refrigerant gas. High-efficiency refrigerant to achieve the most environmentally
        friendly energy rating and reduce CO2 emissions. Ventilated refrigeration to ensure a uniform temperature inside the chamber. Operating
        temperature 0 +4° C, with an ambient temperature of +36° C. With digital electronic thermometer-thermostat. This controller allows the
        maximum and minimum temperatures to be adjusted, as well as automatic defrost cycles, in order to optimise the refrigerator’s performance
        to the maximum. With touch-sensitive on-off switch. Supplied with 7 pairs of guides per door for EN 400x600 trays. MODELS WITH INGREDIENT
        REFRIGERATOR □ Independent operation from the refrigerated table. Supplied with GN 1/3-150 containers. Static refrigeration by means of
        a copper coil attached to the internal wall of the tank, within the insulation space, which facilitates cleaning. With a tempered glass
        display case, enclosed on 3 sides, and a countertop fixed to the refrigerator. □ The glass countertop can be used as a shelf.'
