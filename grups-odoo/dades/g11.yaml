  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. Rear panels made of galvanised steel. Internal compartments
        with rounded corners. □ To facilitate cleaning and drainage at the bottom. Environmentally friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³ and a thickness of 70 mm. Height-adjustable stainless steel legs. Torsion hinges on all doors, with a hold-open
        position when opened beyond 95°. □ Doors with integrated handles and magnetic closure, using air-chamber gaskets to ensure an airtight
        seal. Easily replaceable. □ Reversible door opening. □ Interior lighting. Refrigeration units located at the top. Automatic defrosting.
        R290 hydrocarbon refrigerant. High efficiency to achieve the most environmentally friendly energy rating and reduce CO₂ emissions. Electronic
        digital thermometer-thermostat. This controller allows the maximum and minimum temperatures to be set, as well as automatic defrost cycles,
        to optimise the refrigerator’s performance. Fitted with an illuminated on/off switch. Supplied with 7 PVC drawers featuring perforated
        stainless steel false bottoms (400 × 600 × 120 mm). □ Supplied pre-programmed for an operating temperature range of -5 to +2°C, at an
        ambient temperature of +32°C. The settings can be modified.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Panneaux arrière en acier galvanisé. Cuves intérieures à
        angles arrondis. □ Pour faciliter le nettoyage et l’évacuation de l’eau au fond. Isolation en polyuréthane injecté écologique (sans CFC),
        d’une densité de 40 kg/m³ et d’une épaisseur de 70 mm. Pieds en acier inoxydable réglables en hauteur. Charnières à torsion sur toutes
        les portes, avec maintien en position ouverte au-delà de 95°. □ Portes avec poignée intégrée et fermeture magnétique, équipées de joints
        à chambre d’air garantissant l’étanchéité. Facilement remplaçables. □ Portes réversibles. □ Éclairage intérieur. Groupes frigorifiques
        situés dans la partie supérieure. Dégivrage automatique. Gaz réfrigérant hydrocarboné R290. Haut rendement permettant d’obtenir la meilleure
        classe énergétique en matière de respect de l’environnement et de réduire les émissions de CO₂. Thermomètre-thermostat électronique numérique.
        Ce programmateur permet de régler les températures maximale et minimale, ainsi que les cycles de dégivrage automatique, afin d’optimiser
        les performances du réfrigérateur. Avec interrupteur lumineux marche-arrêt. Fournis avec 7 tiroirs en PVC dotés d’un double fond perforé
        en acier inoxydable (400 × 600 × 120 mm). □ Fournis préprogrammés pour une plage de température de fonctionnement de -5 à +2°C, à une
        température ambiante de +32°C. Cette programmation peut être modifiée.
      estil:
        color: '#000000'
        mida: 14.0
