  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Interior in AISI-304, 18/10 stainless steel. Back in galvanized steel. Internal compartments with rounded edges for
        easy cleaning. □ Ecological injected polyurethane insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 80 mm. Height-adjustable
        legs. Torsion hinges on the doors, with a maintenance position that keeps the doors open beyond 95°. □ Doors with integrated handles and
        magnetic closing, fitted with air-chamber gaskets to ensure airtightness. Easily replaceable. □ Doors with reversible opening. □ Interior
        lighting. □ Refrigeration units located at the bottom. R290 hydrocarbon refrigerant gas. High-efficiency performance to achieve the most
        eco-friendly energy rating and reduce CO₂ emissions. Digital electronic thermometer-thermostat. The controller allows the maximum and
        minimum temperatures, as well as defrost cycles, to be set automatically, optimising refrigeration performance. Acoustic alarm when the
        door is left open. Designed for the storage of frozen products. Products must be pre-frozen. Operating temperature: -18 to -25°C, with
        an ambient temperature of +38°C. MODEL 7588.6TE6 Exterior in grey lacquered sheet steel. Static cooling with fan assistance. Manual defrosting
        by switching off the refrigeration unit. Supplied with 8 plastic-coated GN 2/1 grilles. Capacity: 48 × 5-litre ice-cream tubs (not included).
        □ MODEL 7V88.6XE6 Stainless steel exterior. Ventilated cooling for an even temperature throughout the interior. Automatic defrosting.
        Supplied with 7 plastic-coated GN 2/1 grilles. Capacity: 42 × 5-litre ice-cream tubs (not included). □'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.106
      y: 3.101
      w: 9.0
      h: 25.3
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Intérieur en acier inoxydable AISI-304, 18/10. Dos en acier galvanisé. Cuves intérieures à angles arrondis pour faciliter
        le nettoyage. □ Isolation en polyuréthane injecté écologique (sans CFC), d’une densité de 40 kg/m³ et d’une épaisseur de 80 mm. Pieds
        réglables en hauteur. Charnières à torsion sur les portes, avec position de maintien ouverte au-delà de 95°. □ Portes avec poignée intégrée
        et fermeture magnétique, équipées de joints à chambre d’air pour garantir l’étanchéité. Facilement remplaçables. □ Portes à ouverture
        réversible. □ Éclairage intérieur. □ Groupes frigorifiques situés dans la partie inférieure. Gaz réfrigérant hydrocarbure R290. Rendement
        élevé pour obtenir le classement énergétique le plus écologique et réduire les émissions de CO₂. Thermomètre-thermostat électronique numérique.
        Le programmateur permet de régler automatiquement les températures maximale et minimale, ainsi que les cycles de dégivrage, afin d’optimiser
        les performances frigorifiques. Alarme acoustique lorsque la porte reste ouverte. Conçus pour la conservation de produits surgelés. Les
        produits doivent être préalablement congelés. Température de fonctionnement : de -18 à -25 °C, avec une température ambiante de +38 °C.
        MODÈLE 7588.6TE6 Extérieur en tôle d’acier laquée grise. Froid statique avec ventilation d’assistance. Dégivrage manuel par arrêt du groupe
        frigorifique. Fournis avec 8 grilles plastifiées GN 2/1. Capacité : 48 bacs à glace de 5 litres (non inclus). □ MODÈLE 7V88.6XE6 Extérieur
        en acier inoxydable. Froid ventilé pour obtenir une température homogène à l’intérieur. Dégivrage automatique. Fournis avec 7 grilles
        plastifiées GN 2/1. Capacité : 42 bacs à glace de 5 litres (non inclus). □'
      estil:
        color: '#000000'
        mida: 14.0
