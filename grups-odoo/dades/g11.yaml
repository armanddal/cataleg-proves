    titol:
      es: □ REFRIGERATED BACK BAR COUNTERS WITH GLASS DOORS □ ARRIÈRE-COMPTOIRS RÉFRIGÉRÉS AVEC PORTES VITRÉES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: MAKING Outside and inside in 18/10 AISI-304 stainless steel. The rear is galvanized steel. Worktops with rounded front edge. Murals,
        with 100 mm rear bib. □ Internal tank with rounded edges to facilitate cleaning. □ And drain at the base. Ecological injected polyurethane
        insulation (CFC-free) with a density of 40 Kgs / m3, 60 mm. of thickness. With adjustable stainless steel legs. Torsion hinges on the
        doors. With open maintenance position, when it exceeds 95º. Doors with built-in handle, with magnetic closure, by means of weatherstripping
        provided with an air chamber, to ensure sealing. Easily replaceable. □ With lock on each door. □ With led light. With neutral drawer,
        located on top of the compressor. OPTIONALLY, said drawer can be pica-marro. □ See ACCESSORIES., Since if you wish, you can place the
        coffee machine on top of the cabinet. Oversized refrigeration units, with automatic defrost. These groups allow its extraction to facilitate
        the service of maintenance and cleaning of the condenser. Cool ventilated to achieve a homogeneous temperature inside the chamber. R290
        hydrocarbon refrigerant gas. Maximum performance to obtain the most ecological energy rating, and to reduce CO2 emissions. Working temperature
        0 + 4º C, with an ambient temperature of + 36º C. With digital electronic thermometer-thermostat. This programmer allows to adjust the
        temperatures, maximum and minimum, as well as the defrosts automatically, in order to optimize to the maximum, the performance of the
        refrigerator. With light start-stop switch. They are supplied with two screens per door. They are manufactured with a depth of 600 mm.
        They are designed to be placed on the wall of the bar area, therefore they have a height of 1,050 mm. and they are combined with the coffee
        furniture and behind-the-counter crockery, of the same height. (See GROUP 14-NEUTRAL ELEMENTS).
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.939
      y: 2.569
      w: 9.3
      h: 26.0
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI-304. L’arrière est en acier galvanisé. Plans de travail avec bord
        avant arrondi. Murales, avec dossard de 100 mm. □ Réservoir interne aux bords arrondis pour faciliter le nettoyage. □ Et égouttez à la
        base. Isolation écologique en polyuréthane injecté (sans CFC) avec une densité de 40 Kgs / m3, 60 mm. épais. Avec pieds réglables en acier
        inoxydable. La torsion s’articule sur les portes. Avec position de maintenance ouverte, lorsqu’elle dépasse 95 °. Portes avec poignée
        intégrée, à fermeture magnétique, au moyen de coupe-bise munis d’une chambre à air, pour assurer l’étanchéité. Facilement remplaçable.
        □ Avec serrure sur chaque porte. □ Avec lumière led. Avec tiroir neutre, situé sur le dessus du compresseur. FACULTATIVEMENT, ledit tiroir
        peut être pica-marro. □ Voir ACCESSOIRES., Puisque si vous le souhaitez, vous pouvez placer la machine à café sur le dessus du meuble.
        Unités de réfrigération surdimensionnées, avec dégivrage automatique. Ces groupes permettent son extraction pour faciliter le service
        d’entretien et de nettoyage du condenseur. Ventilé frais pour atteindre une température homogène à l’intérieur de la chambre. Gaz réfrigérant
        hydrocarboné R290. Des performances maximales pour obtenir la cote énergétique la plus écologique et réduire les émissions de CO2. Température
        de travail 0 + 4º C, avec une température ambiante de + 36º C. Avec thermomètre-thermostat électronique numérique. Ce programmateur permet
        d’ajuster automatiquement les températures, maximum et minimum, ainsi que les dégivrages, afin d’optimiser au maximum les performances
        du réfrigérateur. Avec interrupteur marche / arrêt léger. Ils sont fournis avec deux grille par porte. Ils sont fabriqués avec une profondeur
        de 600 mm. Ils sont conçus pour être placés sur le mur de la zone du bar, ils ont donc une hauteur de 1050 mm. et ils sont combinés avec
        les meubles de café et la vaisselle derrière le comptoir, de la même hauteur. (Voir GROUPE 14-ÉLÉMENTS NEUTRES).
      estil:
        color: '#000000'
        mida: 14.0
