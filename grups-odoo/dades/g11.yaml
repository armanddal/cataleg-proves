      text: Ecological injected polyurethane insulation (CFC-free) with a density of 40 Kgs / m3, 60 mm. of thickness.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Torsion hinges on the doors. With open maintenance position, when it exceeds 95º.
      estil:
        color: '#000000'
