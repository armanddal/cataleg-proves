      es: ARMARIOS FRIGORÍFICOS ESTÁTICOS, DE CONSERVACIÓN Y DE CONGELACIÓN, CON PUERTAS DE CRISTAL
  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Se fabrican modelos con exterior en acero inoxidable, o en lacado blanco. El trasero siempre en galvanizado.
        Cuba interna color blanco, en material sanitario ABS, □ con los cantos redondeados. Aislamiento de poliuretano inyectado ecológico (libre
        de CFC), con una densidad de 40 Kgs./m3, de 50 mm de espesor. Con pies regulables. Puerta reversible, con cierre magnético, mediante burletes
        dotados de cámara de aire, para asegurar la estanqueidad. Facilmente substituibles. □ Dotados de cerradura. □ Gas refrigerante hidrocarburo
        de máximo rendimiento para obtener la caliﬁcación energética mas ecológica, y para reducir las emisiones de CO2. Frío estático, en todos
        los modelos, y desescarche manual. Grupo frigoríﬁco situado en la parte inferior-posterior. Con termómetro-termostato electrónico digital,
        que permite ajustar las temperaturas deseadas, máxima y mínima. □ Con interruptor luminoso de marcha-paro. Equipados con luz interior.
        ARMARIOS DE CONSERVACIÓN Con la puerta con cristal doble y cámara de aire. Con desagüe inferior. Disponen de un ventilador interior para
        conseguir la temperatura homogénea en la cámara. Temperatura de trabajo 0º + 4ºC, con una temperatura ambiente de +36ºC. Con rejillas
        extraíbles, que se pueden colocar en distintas alturas, en las guías de que disponen los laterales de ABS. □ ARMARIOS DE CONGELACIÓN Con
        la puerta con cristal triple y cámaras de aire. Además equipan una resistencia anti-vaho. Temperatura de trabajo -18° - 22°C, con una
        temperatura ambiente de + 36°C. Con rejillas evaporadoras ﬁjas. □
      estil:
