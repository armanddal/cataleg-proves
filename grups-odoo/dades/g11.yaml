    - role: text
      text: MAKING Stainless Steel Countertops . Galvanized steel rear. Internal tank with rounded edges to facilitate cleaning and drainage inside
        the chamber. Ecological injected polyurethane insulation (CFC-free) with a density of 40 Kgs./m3. With sliding doors on the counter. □
        With separating grids, vertically. With drawers in the lower section, allowing soft drinks with lower demand to be stored and easily accessed,
        while keeping them clearly visible when the drawer is opened. □ Perforated drawers to facilitate air circulation. Fitted with stainless
        steel telescopic runners that allow 100% drawer extension. □ Magnetic sealing by means of easily replaceable air-chamber gaskets. Oversized
        refrigerator groups. Manual defrost. These groups allow their extraction to facilitate the service of maintenance and cleaning of the
        condenser with the maximum comfort. □ Static cold. Hydrocarbon refrigerant gas. Maximum performance to obtain the most ecological energy
        rating, and to reduce CO2 emissions. Working temperature +1 + 8º C, with an ambient temperature of + 36º C. With analog thermostat. With
        light start-stop switch. With stainless steel adjustable legs. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.886
      y: 3.252
      w: 9.286
      h: 22.61
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Comptoirs en acier inoxydable. Arrière en acier galvanisé. Réservoir interne avec bords arrondis pour faciliter le nettoyage
        et le drainage à l’intérieur de la chambre. Isolation écologique en polyuréthane injecté (sans CFC) avec une densité de 40 Kgs./m3. Avec
        portes coulissantes sur le comptoir. □ Avec des grilles de séparation, verticalement. Avec des tiroirs dans la partie inférieure, permettant
        de stocker les boissons rafraîchissantes les moins demandées et d'y accéder facilement, tout en les gardant visibles à l'ouverture du
        tiroir. □ Tiroirs perforés pour faciliter la circulation de l'air. Équipés de glissières télescopiques en acier inoxydable permettant
        une ouverture à 100 %. □ Fermeture magnétique au moyen de joints à chambre d'air, facilement remplaçables. Groupes réfrigérants surdimensionnés.
        Dégivrage manuel. Ces groupes permettent leur extraction pour faciliter le service d’entretien et de nettoyage du condenseur avec le maximum
        de confort. □ Froid statique. Gaz réfrigérant hydrocarbure. Des performances maximales pour obtenir la cote énergétique la plus écologique
        et réduire les émissions de CO2. Température de travail +1 + 8º C, avec une température ambiante de + 36º C. Avec thermostat analogique.
        Avec interrupteur marche / arrêt léger. Avec pieds réglables en acier inoxydable. □
