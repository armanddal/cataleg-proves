    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304, 18/10. Los traseros son de acero galvanizado. Cubas internas con los
        cantos redondeados. □ para facilitar la limpieza y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC),
        con una densidad de 40 Kgs./m3, de 75 mm de espesor. Con patas de acero inoxidable, regulables en altura. Bisagras de torsión en todas
        las puertas. Con posición de mantenimiento abierta, cuando supera los 95º. □ Puertas con tirador incorporado, con cierre magnético, mediante
        burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Puertas con apertura reversible. □ Con
        luz interior. Grupos frigoríficos sobre-dimensionados, con desescarche automático. Frio ventilado para conseguir la temperatura homogénea
        en el interior. □ Con el grupo frigorífico en la parte superior. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y para reducir las emisiones de CO2. Temperatura de trabajo 0 + 4°C, con una temperatura ambiente
        de +38°C. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar las temperaturas máxima y mínima, así como
        los desescarches, automáticamente, con el fin de optimizar el máximo rendimiento del frigorífico. Con pulsador táctil de marcha-paro.
        Con cristal doble con cámara de aire. □ Con cerradura en las puertas. Con 20 pares de guías, por puerta, en dotación, con separación entre
        ellas de 60 mm. □
      estil:
        color: '#000000'
        mida: 14.0
