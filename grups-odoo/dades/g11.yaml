  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: La Serie 5 BAKERY, es la que optimiza más, el espació, al ser muy estrecha, con la misma capacidad EN 400x600, lo que la hace única,
        cuando se dispone de espacios reducidos. CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304, 18/10. Los traseros son de acero
        galvanizado. Cubas internas con los cantos redondeados. □ para facilitar la limpieza y desagüe en la base. Aislamiento de poliuretano
        inyectado ecológico (libre de CFC), con una densidad de 40 Kgs./m3, de 55 mm de espesor. Con patas de acero inoxidable, regulables en
        altura. Bisagras de torsión en todas las puertas. Con posición de mantenimiento abierta, cuando supera los 95º. □ Puertas con cierre magnético,
        mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Puertas con apertura reversible.
        □ Grupos frigoríficos en la parte inferior. Con desescarche automático. Frío ventilado para conseguir la temperatura homogénea en el interior.
        □ Régimen de trabajo 0 + 4°C, con una temperatura ambiente de +38°C. Gas refrigerante hidrocarburo. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y para reducir las emisiones de CO2. Con termómetro-termostato electrónico digital. Dicho programador
        permite ajustar las temperaturas máxima y mínima, así como los desescarches, automáticamente, con el fin de optimizar el máximo rendimiento
        del frigorífico. Con pulsador táctil de marcha-paro. Rejillas regulables en altura cada 70 mm., mediante una cremallera. Con dotación
        de 3 pares de guías y 3 rejillas EN 400x600 por puerta. Con cristal doble con cámara de aire. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
