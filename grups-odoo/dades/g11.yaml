- id: p78
  n: 78
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
    serie: SERIE 8
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.0
    titol:
      es: □ REFRIGERATED SANDWICH AND PIZZA PREPARATION COUNTERS □ TABLES RÉFRIGÉRÉES POUR LA PRÉPARATION DE SANDWICHS ET DE PIZZAS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'MAKING Exterior and interior in 18/10 AISI 304 stainless steel. Galvanised steel back panel. The worktop, also in stainless steel,
        features a 150 mm raised refrigerated ingredient display at the rear for GN 1/4-150 containers. □ Working surface 375 mm wide. □ Models
        with GN containers INCLUDED are also available. Refrigeration is provided from the lower refrigerated compartment. Fitted with a two-section
        stainless steel hinged lid with two positions (open or closed). When not in use, it hygienically protects the ingredients while keeping
        them refrigerated. Inner well with rounded corners for easy cleaning. □ Drain outlet in the base. Eco-friendly injected polyurethane insulation
        (CFC-free), with a density of 40 kg/m³ and 60 mm thickness. With adjustable stainless steel legs. Torsion hinges on the doors, with a
        stay-open position when opened beyond 95°. Doors with integrated handle and magnetic gasket incorporating an air chamber to ensure a perfect
        seal. Easy to replace. □ Oversized refrigeration units with automatic defrost. These units are removable to facilitate servicing and condenser
        cleaning. Ventilated refrigeration for a uniform temperature throughout the cabinet. R290 hydrocarbon refrigerant. High-efficiency refrigerant
        for achieving the highest energy rating while reducing CO₂ emissions. Operating temperature: 0 to +4°C, with an ambient temperature of
        +36°C. With digital electronic thermometer-thermostat. This controller allows automatic adjustment of the maximum and minimum temperatures,
        as well as the defrost cycles, to optimise refrigerator performance. With touch ON/OFF switch. Supplied as standard with one shelf per
        door.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.002
      y: 3.125
      w: 8.991
      h: 24.266
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI 304. Dos en acier galvanisé. Le plan de travail, également en
        acier inoxydable, dispose à l''arrière d''un compartiment surélevé de 150 mm pour recevoir des bacs GN 1/4-150 contenant les ingrédients.
        □ Surface de travail de 375 mm de largeur. □ Des modèles avec bacs GN FOURNIS sont également disponibles. Le froid provient du compartiment
        réfrigéré inférieur. Équipées d''un couvercle basculant en deux parties, en acier inoxydable, à deux positions (ouvert ou fermé). Lorsqu''il
        n''est pas utilisé, il protège les ingrédients de manière hygiénique tout en les maintenant réfrigérés. Cuve intérieure avec angles arrondis
        pour faciliter le nettoyage. □ Évacuation au fond. Isolation en polyuréthane injecté écologique (sans CFC), d''une densité de 40 kg/m³
        et d''une épaisseur de 60 mm. Avec pieds réglables en acier inoxydable. Charnières à torsion sur les portes, avec position de maintien
        en ouverture au-delà de 95°. Portes avec poignée intégrée et fermeture magnétique par joints équipés d''une chambre d''air, assurant une
        parfaite étanchéité. Joints facilement remplaçables. □ Groupes frigorifiques surdimensionnés avec dégivrage automatique. Ces groupes sont
        extractibles afin de faciliter les opérations d''entretien et le nettoyage du condenseur. Réfrigération ventilée garantissant une température
        homogène à l''intérieur de la chambre. Gaz réfrigérant à hydrocarbures R290. Très haut rendement permettant d''obtenir la meilleure classification
        énergétique tout en réduisant les émissions de CO₂. Température de fonctionnement : 0 à +4°C, avec une température ambiante de +36°C.
        Avec thermomètre-thermostat électronique numérique. Ce régulateur permet de gérer automatiquement les températures maximale et minimale
        ainsi que les cycles de dégivrage, afin d''optimiser les performances du réfrigérateur. Avec bouton tactile marche/arrêt. Livrées de série
        avec une grille par porte.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 9.993
      y: 3.125
      w: 9.724
      h: 24.266
