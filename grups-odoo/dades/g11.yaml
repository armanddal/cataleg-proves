- id: p134
  n: 134
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
    serie: SERIE 2
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.0
    titol:
      es: □ REFRIGERATED CABINETS, STATIC, CONSERVATION AND FREEZING, WITH GLASS DOORS □ ARMOIRES RÉFRIGÉRÉES STATIQUES, CONSERVATION ET CONGÉLATION,
        AVEC PORTES EN VERRE
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION Models are available with either a stainless steel exterior or a white lacquered finish. The back panel is always
        made of galvanised steel. White internal compartment made of food-grade ABS plastic, □ with rounded edges. Eco-friendly injected polyurethane
        insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 50 mm. Adjustable feet. Reversible door with magnetic closure, using
        air-chamber gaskets to ensure an airtight seal. Easily replaceable. □ Fitted with a lock. □ Hydrocarbon refrigerant, depending on the
        model, offering maximum efficiency to achieve the most environmentally friendly energy rating and reduce CO₂ emissions. Static cooling
        in all models, with manual defrost. Refrigeration unit located at the bottom rear. Electronic digital thermometer-thermostat allowing
        the desired maximum and minimum temperatures to be set. □ Illuminated on/off switch. Fitted with interior lighting. REFRIGERATED STORAGE
        CABINETS Door with double glazing and an air gap. Bottom drain. Fitted with an internal fan to ensure an even temperature throughout the
        compartment. Operating temperature: 0 to +4°C, at an ambient temperature of +36°C. Removable shelves that can be positioned at different
        heights using the guides fitted to the ABS side panels. □ FREEZER CABINETS Door with triple glazing and air gaps. Also fitted with an
        anti-condensation heating element. Operating temperature: −18 to −22°C, at an ambient temperature of +36°C. Fitted with fixed evaporator
        shelves. □'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION GÉNÉRALE Modèles disponibles avec extérieur en acier inoxydable ou finition laquée blanche. Panneau arrière toujours
        en acier galvanisé. Cuve intérieure blanche en ABS de qualité alimentaire, 1 avec angles arrondis. Isolation en polyuréthane injecté écologique
        (sans CFC), d’une densité de 40 kg/m³ et d’une épaisseur de 50 mm. Pieds réglables. Porte réversible avec fermeture magnétique, au moyen
        de joints à chambre d’air garantissant l’étanchéité. Facilement remplaçables. □ Équipés d’une serrure. □ Gaz réfrigérants hydrocarbures
        offrant un rendement maximal pour obtenir la classe énergétique la plus écologique et réduire les émissions de CO₂. Froid statique sur
        tous les modèles, avec dégivrage manuel. Groupe frigorifique situé en partie inférieure arrière. Thermomètre-thermostat électronique numérique
        permettant de régler les températures minimale et maximale souhaitées. □ Interrupteur marche-arrêt lumineux. Éclairage intérieur. ARMOIRES
        DE CONSERVATION Porte à double vitrage avec lame d’air. Évacuation inférieure. Équipées d’un ventilateur intérieur pour assurer une température
        homogène dans l’enceinte. Température de fonctionnement : de 0 à +4 °C, pour une température ambiante de +36 °C. Clayettes amovibles pouvant
        être positionnées à différentes hauteurs grâce aux glissières intégrées aux parois latérales en ABS. □ ARMOIRES DE CONGÉLATION Porte à
        triple vitrage avec lames d’air. Équipées également d’une résistance antibuée. Température de fonctionnement : de −18 à −22 °C, pour une
        température ambiante de +36 °C. Équipées de clayettes évaporatrices fixes. □'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.301
      y: 3.101
      w: 9.6
      h: 25.5
