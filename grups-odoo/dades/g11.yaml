        d'un ventilateur interne pour garantir une température homogène dans la chambre. Température de fonctionnement de 0 °C à +4°C, pour une
        température ambiante de +36°C. Grilles amovibles pouvant être positionnées à différentes hauteurs sur les glissières intégrées aux parois
        latérales en ABS. □ Sur le modèle de 600 litres, il est possible de placer des bacs GN 2/1 ou jusqu'à 6 bacs à poisson. □ Dans ce cas,
