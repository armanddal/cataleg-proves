      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: Son máquinas ideadas, para gran producción de cubitos de hielo, en Hoteles, Restaurantes, Discotecas etc. CONSTRUCCIÓN Se trata de
        un fabricador de cubitos de hielo, que va colocado encima de un depósito. (Se suministra en dos piezas). □ El fabricador está construido,
        exteriormente en acero inox. 18/10 AISI 304. El interior es de ABS alimentario. El aislamiento de poliuretano inyectado ecológico (libre
        de CFC), con una densidad de 40 Kgs/m3. Equipo frigorífico tropicalizado, pudiendo trabajar con una temperatura ambiente de +21ºC, y con
        la entrada del agua a +15ºC. Gas refrigerante R290. Refrigeración del condensador por aire. Los cubitos son macizos de 42 gramos. □ Los
        cubitos se fabrican por inyección del agua, mediante difusores metálicos. Producción es en Kgs, y en cubitos al día. El depósito de gran
        capacidad, también está construido exteriormente en acero inox. 18/10 AISI 304, i el interior en ABS alimentario. □ Muy bien aislado,
        para evitar la fusión de los cubitos almacenados. Con puerta batiente en ABS, color gris, también aislada. Con patas regulables de acero
        inoxidable.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.607
      w: 6.5
      h: 21.7
  - idioma: fr
    paragrafs:
    - role: text
      text: Designed for high-volume ice cube production in hotels, restaurants, nightclubs, etc. CONSTRUCTION This ice cube maker is designed
        to be installed on top of a storage bin (supplied in two separate units). □ The ice maker has an exterior made of AISI 304 18/10 stainless
        steel. The interior is made of food-grade ABS. Eco-friendly injected polyurethane insulation (CFC-free), with a density of 40 kg/m³. Tropicalized
        refrigeration system, designed to operate with an ambient temperature of +21 °C and a water inlet temperature of +15 °C. R290 refrigerant
        gas. Air-cooled condenser. Produces solid 42 g ice cubes. □ Ice cubes are produced by water injection through metal diffusers. Production
        capacity is specified in kilograms and number of ice cubes per day. The high-capacity storage bin is also constructed with an AISI 304
        18/10 stainless steel exterior and a food-grade ABS interior. □ Highly insulated to minimize the melting of stored ice cubes. Insulated
        grey ABS swing door. Supplied with adjustable stainless steel legs.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 7.504
      y: 2.607
      w: 6.5
      h: 21.7
  - idioma: de
    paragrafs:
    - role: text
      text: Conçus pour une production importante de glaçons dans les hôtels, restaurants, discothèques, etc. CONSTRUCTION Il s'agit d'un fabricant
        de glaçons destiné à être installé sur un bac de stockage (livré en deux éléments). □ Le fabricant est réalisé extérieurement en acier
        inoxydable AISI 304 18/10. L'intérieur est en ABS alimentaire. Isolation en polyuréthane injecté écologique (sans CFC), d'une densité
        de 40 kg/m³. Groupe frigorifique tropicalisé, conçu pour fonctionner avec une température ambiante de +21 °C et une température d'arrivée
        d'eau de +15 °C. Fluide frigorigène R290. Condenseur refroidi par air. Produit des glaçons pleins de 42 g. □ Les glaçons sont fabriqués
        par injection d'eau au moyen de diffuseurs métalliques. La capacité de production est indiquée en kilogrammes et en nombre de glaçons
        par jour. Le bac de stockage de grande capacité est également réalisé avec un extérieur en acier inoxydable AISI 304 18/10 et un intérieur
        en ABS alimentaire. □ Très bien isolé afin de limiter la fonte des glaçons stockés. Porte battante en ABS gris, également isolée. Équipé
        de pieds réglables en acier inoxydable.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 14.0
      y: 2.607
      w: 6.5
      h: 21.7
