    - role: text
      text: □ REFRIGERATED STORAGE CABINETS WITH GLASS DOORS FOR EN 400x600 □ ARMOIRES RÉFRIGÉRÉES DE CONSERVATION AVEC PORTES EN VERRE EN 400x600
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 3.696
      y: 0.25
      w: 17.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. The backs are made of galvanized steel. Internal compartments
        with rounded edges. □ to facilitate cleaning and drainage at the base. Ecological injected polyurethane insulation (CFC-free), with a
        density of 40 kg/m³ and a thickness of 75 mm. With stainless steel legs, height adjustable. Torsion hinges on all doors. With open maintenance
        position when exceeding 95°. □ Doors with integrated handle, with magnetic closing by means of air-chamber gaskets, to ensure airtightness.
        Easily replaceable. □ Doors with reversible opening. □ With interior light. Oversized refrigeration units, with automatic defrosting.
        Ventilated cooling to achieve an even temperature inside. □ With the refrigeration unit at the top. R290 hydrocarbon refrigerant gas.
        Maximum performance to achieve the most eco-friendly energy rating and reduce CO₂ emissions. Operating temperature from 0 to +4°C, with
        an ambient temperature of +38°C. With digital electronic thermometer-thermostat. This programmer allows the maximum and minimum temperatures,
        as well as defrost cycles, to be adjusted automatically in order to optimise the refrigerator’s performance. With touch-sensitive ON/OFF
        button. With double glazing with air chamber. □ With door locks. Supplied with 20 pairs of guides per door, with a 60 mm spacing between
        them. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.106
      y: 3.101
      w: 9.0
      h: 25.3
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Les dos sont en acier galvanisé. Cuves intérieures à angles
        arrondis. □ pour faciliter le nettoyage et l’évacuation de l’eau à la base. Isolation en polyuréthane injecté écologique (sans CFC), d’une
        densité de 40 kg/m³ et d’une épaisseur de 75 mm. Avec pieds en acier inoxydable, réglables en hauteur. Charnières à torsion sur toutes
        les portes. Avec position de maintien ouverte au-delà de 95°. □ Portes avec poignée intégrée, à fermeture magnétique, au moyen de joints
        à chambre d’air, afin de garantir l’étanchéité. Facilement remplaçables. □ Portes à ouverture réversible. □ Avec éclairage intérieur.
        Groupes frigorifiques surdimensionnés, avec dégivrage automatique. Froid ventilé pour obtenir une température homogène à l’intérieur.
        □ Avec le groupe frigorifique dans la partie supérieure. Gaz réfrigérant hydrocarbure R290. Rendement maximal pour obtenir le classement
        énergétique le plus écologique et réduire les émissions de CO₂. Température de fonctionnement de 0 à +4 °C, avec une température ambiante
        de +38 °C. Avec thermomètre-thermostat électronique numérique. Ce programmateur permet de régler automatiquement les températures maximale
        et minimale, ainsi que les cycles de dégivrage, afin d’optimiser au maximum les performances du réfrigérateur. Avec bouton tactile marche-arrêt.
        Avec double vitrage avec chambre d’air. □ Avec serrure sur les portes. Avec 20 paires de glissières par porte, fournies de série, avec
        un espacement de 60 mm entre elles. □
      estil:
        color: '#000000'
        mida: 14.0
