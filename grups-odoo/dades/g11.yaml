      text: CONSTRUCTION Exterior and interior in 18/10 AISI-304 stainless steel. Rear panel in galvanized steel. With granite worktop. □ Internal
        tank with rounded corners to facilitate cleaning and drainage inside the chamber. □ Eco-friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³. With adjustable stainless steel feet. Torsion hinges on all doors. With hold-open position when the doors
        open beyond 95 degrees. Doors with magnetic closure, using air-chamber gaskets to ensure a tight seal. Easily replaceable. □ Oversized
        refrigeration units, with automatic defrosting. These units can be removed to facilitate maintenance and condenser cleaning with maximum
        convenience. R290 hydrocarbon refrigerant gas. High-efficiency refrigerant to achieve the most environmentally friendly energy rating
        and reduce CO2 emissions. Ventilated refrigeration to ensure a uniform temperature inside the chamber. With digital electronic thermometer-thermostat.
        This controller allows the maximum and minimum temperatures to be adjusted, as well as automatic defrost cycles, in order to optimise
        the refrigerator’s performance to the maximum. With touch-sensitive on-off switch. With a neutral drawer on the right. □
