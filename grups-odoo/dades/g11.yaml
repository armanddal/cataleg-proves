- id: p23
  n: 23
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
    serie: SERIE 2
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.0
    titol:
      en: REFRIGERATED COUNTERS WITH DRAWERS AND DOORS □ TABLES RÉFRIGÉRÉES DE CONSERVATION AVEC TIROIRS ET PORTES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION 700 mm. deep. Interior and exterior in stainless steel. Rear panel in galvanised steel. Stainless steel worktop with
        rounded front edge. Internal well with rounded corners for easy cleaning and drain outlet at the bottom. □ Eco-friendly injected polyurethane
        insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 50 mm. Perforated drawers to improve ventilation. Fitted with stainless
        steel telescopic runners allowing 100% extension. □ Doors fitted with torsion hinges, featuring a hold-open position beyond 95°. □ Doors
        and drawers with magnetic closing, featuring air-chamber gaskets to ensure a perfect seal. Easily replaceable. □ GN 1/1 compartments,
        supplied with one 325 × 530 mm shelf per door □. GN containers can be fitted as an option (see GROUP 16). Oversized refrigeration units
        located at the bottom of the cabinet, with automatic defrost. The refrigeration units are removable to facilitate servicing and condenser
        cleaning. □ Static cooling. R290 hydrocarbon refrigerant, providing maximum efficiency to achieve the highest ecological energy rating
        while reducing CO₂ emissions. Operating temperature: 0 to +4 °C at an ambient temperature of +36 °C. Digital electronic thermostat and
        thermometer. The controller allows the maximum and minimum temperatures to be adjusted in order to optimise refrigerator performance.
        On/off switch. Lock located in the lower section. □ Base plinth and adjustable feet.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 8.297
      h: 25.045
  - idioma: es
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Profondeur de 700 mm. Extérieur et intérieur en acier inoxydable. Arrière en acier galvanisé. Plan de travail en acier
        inoxydable avec bord avant arrondi. Cuve intérieure avec angles arrondis pour faciliter le nettoyage et évacuation au fond. □ Isolation
        en polyuréthane injecté écologique (sans CFC), d''une densité de 40 kg/m³ et d''une épaisseur de 50 mm. Tiroirs perforés pour favoriser
        la ventilation. Équipés de glissières télescopiques en acier inoxydable permettant une ouverture à 100 %. □ Portes avec charnières à torsion.
        Position de maintien en ouverture au-delà de 95°. □ Portes et tiroirs à fermeture magnétique, équipés de joints à chambre d''air garantissant
        une parfaite étanchéité. Facilement remplaçables. □ Compartiments au format GN 1/1, équipés d''une grille de 325 × 530 mm par porte □.
        Des bacs GN peuvent être installés en option (voir GROUPE 16). Groupes frigorifiques surdimensionnés, installés dans la partie inférieure
        du meuble, avec dégivrage automatique. Les groupes sont extractibles afin de faciliter les opérations de maintenance et le nettoyage du
        condenseur. □ Refroidissement statique. Fluide frigorigène hydrocarbure R290, à haut rendement, permettant d''obtenir la meilleure classification
        énergétique et de réduire les émissions de CO₂. Température de fonctionnement : de 0 à +4 °C, pour une température ambiante de +36 °C.
        Thermomètre-thermostat électronique numérique. Le contrôleur permet de régler les températures minimale et maximale afin d''optimiser
        les performances de l''appareil. Interrupteur marche/arrêt. Serrure située dans la partie inférieure. □ Socle à la base du meuble et pieds
        réglables.'
      estil:
        color: '#000000'
        mida: 14.0
