- id: p38
  n: 38
  tipus: informacio_general
  capcalera:
    banda: assets/g11/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior de acero inoxidable 18/10 AISI-304. El trasero es de acero galvanizado. Encimeras con canto frontal
        redondeado. Murales, con peto posterior de 100 mm. □ Cuba interna con cantos redondeados para facilitar la limpieza. □ Y desagüe en la
        base. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40 Kgs/m3, de 60 mm. de espesor. Con patas regulables
        de acero inoxidable. Bisagras de torsión, en las puertas. Con posición de mantenimiento abierta, cuando supera los 95º. Puertas con tirador
        incorporado, con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles.
        □ Con cajón neutro, ubicado encima del compresor. OPCIONALMENTE, dicho cajón, puede ser pica-marro. □ Ver ACCESORIOS., ya que si lo desean,
        pueden colocar la máquina del café encima del mueble. Grupos frigoríﬁcos sobre-dimensionados, con desescarche automático. Dichos grupos
        permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador. Frío ventilado para conseguir la temperatura
        homogénea en el interior de la cámara. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética
        mas ecológica, y para reducir la emisiones de CO2. Temperatura de trabajo 0 +4º C, con una temperatura ambiente de +36º C. Con termómetro-termostato
        electrónico digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con
        el ﬁn de optimizar al máximo, el rendimiento del frigoríﬁco. Con interruptor luminoso de marcha-paro. Se suministran en dotación, con
        dos rejillas por puerta. Se fabrican con una profundidad de 600 mm. Están concebidos para su colocación en la pared de la zona del bar,
        por ello tienen una altura de 1.050 mm. y hacen conjunto con los muebles cafeteros y vajilleros de tras-barra, de la misma altura. (Ver
        GRUPO 14-ELEMENTOS NEUTROS).
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.5
      w: 18.865
      h: 14.0
