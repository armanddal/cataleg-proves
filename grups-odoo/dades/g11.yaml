  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior de acero inoxidable 18/10 AISI-304. El trasero es de acero galvanizado. Cuba interna con cantos redondeados
        para facilitar la limpieza. □ Y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de
        40 Kgs/m3, de 60 mm. de espesor. Con patas regulables de acero inoxidable. Cajones perforados para facilitar la ventilación. Dotados de
        guías correderas telescópicas, de acero inoxidable, que permiten la apertura al 100%. □ Con cierre magnético, mediante burletes con cámara
        de aire, fácilmente substituibles. Grupos frigoríﬁcos sobre-dimensionados, con desescarche automático. Dichos grupos permiten su extracción
        para facilitar el servicio de mantenimiento y limpieza del condensador. Frío ventilado para conseguir la temperatura homogénea en el interior
        de la cámara. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica, y para reducir
        la emisiones de CO2. Temperatura de trabajo 0 +4º C, con una temperatura ambiente de +36º C. Con termómetro-termostato electrónico digital.
        Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de optimizar
        al máximo, el rendimiento del frigoríﬁco. Con interruptor luminoso de marcha-paro.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.514
      w: 12.4
      h: 12.1
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior made of AISI-304 18/10 stainless steel. Galvanized steel back panel. Internal well with rounded
        corners for easy cleaning. □ Drain located at the bottom. Environmentally friendly injected polyurethane insulation (CFC-free), with a
        density of 40 kg/m³ and a thickness of 60 mm. With adjustable stainless steel legs. Perforated drawers to facilitate ventilation. Fitted
        with stainless steel telescopic sliding runners, allowing 100% extensión. □ Magnetic closing system with air-chamber gaskets, easily replaceable.
        Oversized refrigeration units with automatic defrost. These units can be removed to facilitate maintenance and condenser cleaning. Ventilated
        refrigeration to ensure a uniform temperature throughout the cabinet. R290 hydrocarbon refrigerant gas. High-efficiency refrigerant for
        achieving the most environmentally friendly energy rating and reducing CO₂ emissions. Operating temperature: 0 to +4°C, at an ambient
        temperature of +36°C. Equipped with a digital electronic thermometer-thermostat. This controller allows automatic adjustment of maximum
        and minimum temperatures, as well as automatic defrost cycles, to optimize refrigerator performance to the fullest. Illuminated on/off
        switch.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 15.108
      w: 8.6
      h: 13.7
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI-304. Dos en acier galvanisé. Cuve intérieure avec angles arrondis
        pour faciliter le nettoyage. □ Évacuation au fond de la cuve. Isolation en polyuréthane injecté écologique (sans CFC), d''une densité
        de 40 kg/m³ et d''une épaisseur de 60 mm. Équipé de pieds réglables en acier inoxydable. Tiroirs perforés pour faciliter la ventilation.
        Munis de glissières télescopiques en acier inoxydable permettant une ouverture à 100 %. □ Fermeture magnétique assurée par des joints
        à chambre d''air, facilement remplaçables. Groupes frigorifiques surdimensionnés avec dégivrage automatique. Ces groupes sont extractibles
        afin de faciliter les opérations d''entretien et le nettoyage du condenseur. Réfrigération ventilée garantissant une température homogène
        à l''intérieur de la chambre. Gaz réfrigérant à hydrocarbure R290. Très haute performance pour obtenir la meilleure classification énergétique
        écologique et réduire les émissions de CO₂. Température de fonctionnement : 0 à +4°C, à une température ambiante de +36°C. Équipé d''un
        thermomètre-thermostat électronique numérique. Ce régulateur permet de régler automatiquement les températures maximale et minimale, ainsi
        que les cycles de dégivrage, afin d''optimiser au maximum les performances du réfrigérateur. Interrupteur lumineux marche/arrêt.'
      estil:
        color: '#000000'
        mida: 14.0
