      y: 0.25
      w: 18.55
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304. 18/10. El trasero es de acero galvanizado. Con encimera de acero inoxidable
        AISI-304. Cuba interna con los cantos redondedos para facilitar la limpieza y desagüe en el interior de la cámara. □ Aislamiento de poliuretano
        inyectado ecológico (libre de CFC) con una densidad de 40 Kgs./m3. Con patas regulables de acero inoxidable. Bisagras de torsión, en todas
        las puertas. Con posición de mantenimiento abierta, cuando supera los 95 grados. Puertas con cierre magnético, mediante burletes dotados
        de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Grupos frigoríﬁcos sobre-dimensionados, con desescarche
        automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador con la máxima
        comodidad. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica y para reducir
        la emisiones de CO2. Frío ventilado para conseguir la temperatura homogénea en el interior de la cámara. Con termómetro-termostato electrónico
        digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de
        optimizar al máximo el rendimiento del frigoríﬁco. Con interruptor táctil de marcha-paro.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.607
      w: 6.6
      h: 21.7
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Exterior and interior in 18/10 AISI-304 stainless steel. Rear panel in galvanized steel. With AISI-304 stainless steel
        worktop. Internal tank with rounded corners to facilitate cleaning and drainage inside the chamber. □ Eco-friendly injected polyurethane
        insulation (CFC-free), with a density of 40 kg/m³. With adjustable stainless steel feet. Torsion hinges on all doors. With hold-open position
        when the doors open beyond 95 degrees. Doors with magnetic closure, using air-chamber gaskets to ensure a tight seal. Easily replaceable.
        □ Oversized refrigeration units, with automatic defrosting. These units can be removed to facilitate maintenance and condenser cleaning
        with maximum convenience. R290 hydrocarbon refrigerant gas. High-efficiency refrigerant to achieve the most environmentally friendly energy
        rating and reduce CO2 emissions. Ventilated refrigeration to ensure a uniform temperature inside the chamber. With digital electronic
        thermometer-thermostat. This controller allows the maximum and minimum temperatures to be adjusted, as well as automatic defrost cycles,
        in order to optimise the refrigerator’s performance to the maximum. With touch-sensitive on-off switch.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 7.504
      y: 2.607
      w: 6.5
      h: 21.7
  - idioma: de
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI-304. Panneau arrière en acier galvanisé. Avec plan de travail en
        acier inoxydable AISI-304. Cuve intérieure avec angles arrondis pour faciliter le nettoyage et l’évacuation de l’eau à l’intérieur de
        la chambre. □ Isolation en polyuréthane injecté écologique (sans CFC), d’une densité de 40 kg/m³. Avec pieds réglables en acier inoxydable.
        Charnières à torsion sur toutes les portes. Avec position de maintien ouverte lorsqu’elles dépassent 95 degrés. Portes avec fermeture
        magnétique, au moyen de joints équipés d’une chambre à air, pour assurer l’étanchéité. Facilement remplaçables. □ Groupes frigorifiques
        surdimensionnés, avec dégivrage automatique. Ces groupes peuvent être extraits afin de faciliter les opérations de maintenance et le nettoyage
        du condenseur avec un maximum de confort. Gaz réfrigérant hydrocarbure R290. À haut rendement pour obtenir la classification énergétique
        la plus écologique et réduire les émissions de CO2. Froid ventilé pour obtenir une température homogène à l’intérieur de la chambre. Avec
        thermomètre-thermostat électronique numérique. Ce programmateur permet de régler les températures maximale et minimale, ainsi que les
        dégivrages automatiquement, afin d’optimiser au maximum les performances du réfrigérateur. Avec interrupteur tactile marche-arrêt.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 14.0
      y: 2.607
      w: 6.5
      h: 21.7
