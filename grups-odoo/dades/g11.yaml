  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Encimeras de acero inoxidable. Traseros de acero galvanizado. Cuba interna con los cantos redondeados para facilitar
        la limpieza y desagüe en el interior de la cámara. Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40
        Kgs./m3. Con puertas correderas en la encimera. □ Con rejillas separadoras, verticalmente. Con cajones en la parte inferior, lo cual permite
        colocar los refrescos, que tienen menos demanda, y acceder a ellos, con la comodidad, que representa tenerlos a la vista con la apertura
        del cajón. □ Cajones perforados para facilitar la ventilación. Dotados de guías correderas telescópicas, de acero inoxidable, que permiten
        la apertura al 100%. □ Con cierre magnético, mediante burletes con cámara de aire, fácilmente substituibles. Grupos frigoríﬁcos sobre-dimensionados.
        Desescarche manual. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador con la
        máxima comodidad. □ Frío estático. Gas refrigerante hidrocarburo. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica,
        y para reducir las emisiones de CO2. Temperatura de trabajo +1 +8º C, con una temperatura ambiente de +36º C. Con termostato analógico.
        Con interruptor luminoso de marcha-paro. Con patas regulables de acero inoxidable. □
