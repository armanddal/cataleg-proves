      h: 2.0
    titol:
      es: □ REFRIGERATED STORAGE CABINETS WITH FISH COMPARTMENT □ ARMOIRES RÉFRIGÉRÉES DE CONSERVATION AVEC COMPARTIMENT POUR POISSON
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior in AISI-304 18/10 stainless steel. Back panels in galvanised steel. Internal compartments with
        rounded edges □ to facilitate cleaning, with drainage at the bottom. Eco-friendly injected polyurethane insulation (CFC-free), with a
        density of 40 kg/m³ and a thickness of 70 mm. Fitted with height-adjustable stainless steel feet. Torsion hinges on all doors. Hold-open
        position when opened beyond 95°. □ Doors with integrated handles and magnetic closure, using air-chamber gaskets to ensure an airtight
        seal. Easily replaceable. □ Reversible doors. □ Interior lighting. Refrigeration units located at the bottom. Automatic defrost. Ventilated
        cooling to ensure an even temperature throughout the interior. □ Operating temperature: 0 to +4°C, at an ambient temperature of +38°C.
        R290 hydrocarbon refrigerant, offering maximum efficiency to achieve the most environmentally friendly energy rating and reduce CO₂ emissions.
        Electronic digital thermometer-thermostat. This controller allows the maximum and minimum temperatures to be adjusted, as well as automatic
        defrost cycles, in order to optimise the refrigerator’s performance. With a touch on/off switch. Plastic-coated rod shelves, height-adjustable
        every 70 mm using a rack system. Fitted with a sealed compartment with static cooling, always located behind a small door at the bottom.
        Supplied with 3 PVC drawers, with perforated stainless steel double bottom (530 × 460 × 100 mm). □'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Les parties arrière sont en acier galvanisé. Cuves intérieures
        à angles arrondis □ pour faciliter le nettoyage, avec évacuation en partie basse. Isolation en polyuréthane injecté écologique (sans CFC),
        d’une densité de 40 kg/m³ et d’une épaisseur de 70 mm. Équipés de pieds en acier inoxydable réglables en hauteur. Charnières à torsion
        sur toutes les portes. Position de maintien en ouverture au-delà de 95°. □ Portes avec poignée intégrée et fermeture magnétique, au moyen
        de joints à chambre d’air garantissant l’étanchéité. Facilement remplaçables. □ Portes réversibles. □ Éclairage intérieur. Groupes frigorifiques
        situés en partie basse. Dégivrage automatique. Froid ventilé pour assurer une température homogène à l’intérieur. □ Température de fonctionnement
        : de 0 à +4 °C, pour une température ambiante de +38 °C. Gaz réfrigérant hydrocarbure R290, offrant un rendement maximal pour obtenir
        la classe énergétique la plus écologique et réduire les émissions de CO₂. Thermomètre-thermostat électronique numérique. Ce programmateur
        permet de régler les températures minimale et maximale ainsi que les cycles de dégivrage automatiques, afin d’optimiser les performances
        du réfrigérateur. Avec interrupteur tactile marche/arrêt. Clayettes en fil plastifié, réglables en hauteur tous les 70 mm au moyen d’une
        crémaillère. Équipés d’un compartiment étanche à froid statique, toujours situé derrière une petite porte en partie basse. Équipés de
        3 tiroirs en PVC, avec double fond perforé en acier inoxydable (530 × 460 × 100 mm). □'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.301
      y: 3.101
      w: 9.6
      h: 25.5
