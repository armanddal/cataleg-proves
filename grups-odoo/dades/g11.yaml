        l’espace d’isolation, ce qui facilite son nettoyage. Avec une vitrine en verre trempé, fermée sur 3 côtés, et un plan de travail fixé
        au réfrigérateur. 4 Le plan de travail en verre peut être utilisé comme étagère. MEUBLE NEUTRE Avec 5 tiroirs pour la fermentation des
        pâtons de pizza.
