        cantos redondeados □ para facilitar la limpieza y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC), con
        una densidad de 40 Kgs./m3, de 70 mm de espesor. Con patas de acero inoxidable, regulables en altura. Bisagras de torsión en todas las
        puertas. Con posición de mantenimiento abierta, cuando supera los 95°. □ Puertas con tirador incorporado, con cierre magnético, mediante
        burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Puertas con apertura reversible. □ Grupos
        frigoríficos sobre-dimensionados, con desescarche automático. Frio ventilado para conseguir la temperatura homogénea en el interior. □
        Con el grupo frigorífico en la parte superior. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la calificación
        energética mas ecológica, y para reducir las emisiones de CO2. Con termómetro-termostato electrónico digital. Dicho programador permite
        ajustar las temperaturas máxima y mínima, así como los desescarches, automáticamente, con el fin de optimizar el máximo rendimiento del
        frigorífico. Con pulsador táctil de marcha-paro. Con guías, en forma de “U”, para la colocación de las rejillas, a la altura deseada.
        Rejillas regulables en altura cada 70 mm., mediante una cremallera. ARMARIOS DE CONSERVACIÓN Temperatura de trabajo 0 + 4°C, con una temperatura
        ambiente de +38°C. ARMARIOS DE CONGELACIÓN Para mantenimiento de congelados. El producto debe estar previamente congelado. Régimen de
        trabajo –18 –22°C, con una temperatura ambiente de +38°C.
