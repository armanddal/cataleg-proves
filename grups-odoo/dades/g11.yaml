    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304, 18/10. Los traseros son de acero galvanizado. Cubas internas con los
        cantos redondeados. □ para facilitar la limpieza y desagüe en la base. Aislamiento de poliuretano inyectado ecológico (libre de CFC),
        con una densidad de 40 Kgs./m3, de 70 mm de espesor. Con patas de acero inoxidable, regulables en altura. Bisagras de torsión en todas
        las puertas. Con posición de mantenimiento abierta, cuando supera los 95°. □ Puertas con tirador incorporado, con cierre magnético, mediante
        burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Puertas con apertura reversible. □ Grupos
        frigoríficos en la parte inferior. Con desescarche automático. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener
        la calificación energética mas ecológica, y para reducir las emisiones de CO2. Con termómetro-termostato electrónico digital. Dicho programador
        permite ajustar las temperaturas máxima y mínima, así como los desescarches, automáticamente, con el fin de optimizar el máximo rendimiento
        del frigorífico. Con interruptor luminoso de marcha-paro. Con dotación de cajones de PVC, con doble fondo perforado de acero inox. □ Se
        suministran programados, para un régimen de trabajo -5 +2°C, con una temperatura ambiente de +32°C. Dicha programación puede modificarse.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 2.5
      w: 18.96
      h: 9.4
