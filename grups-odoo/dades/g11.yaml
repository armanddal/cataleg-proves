        y para reducir la emisiones de CO2. Frío ventilado para conseguir la temperatura homogénea en el interior de la cámara. Temperatura de
        trabajo 0 +4° C, con una temperatura ambiente de +36° C. Con termómetro-termostato electrónico digital. Dicho programador permite ajustar
