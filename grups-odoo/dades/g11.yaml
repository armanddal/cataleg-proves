  - idioma: es
    paragrafs:
    - role: text
      text: □ REFRIGERATED AND FREEZER STORAGE CABINETS EN 400x600 □ ARMOIRES RÉFRIGÉRÉES, DE CONSERVATION ET DE CONGÉLATION EN 400x600
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 3.696
      y: 0.25
      w: 17.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: 'The Series 5 BAKERY is the one that optimises space the most, thanks to its narrow width, while offering the same EN 400x600 capacity,
        making it unique when space is limited. CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. Rear panels in galvanised
        steel. Internal compartments with rounded corners □ to facilitate cleaning and drainage at the base. Ecological injected polyurethane
        insulation (CFC-free), with a density of 40 kg/m³ and a thickness of 55 mm. With stainless steel feet, height-adjustable. Torsion hinges
        on all doors. With a maintenance-open position when the door exceeds 95°. □ Doors with integrated handle and magnetic closure, using air-chamber
        gaskets to ensure airtightness. Easily replaceable. □ Reversible door opening. □ Oversized refrigeration units, with automatic defrosting.
        Ventilated refrigeration to ensure an even temperature throughout the interior. □ Hydrocarbon refrigerant gas. Maximum performance to
        achieve the most ecological energy rating and reduce CO₂ emissions. With digital electronic thermometer-thermostat. This controller allows
        the maximum and minimum temperatures, as well as defrosting cycles, to be adjusted automatically, in order to optimise the refrigerator’s
        performance to the maximum. With touch-sensitive on/off push button. Height-adjustable shelves every 70 mm by means of a rack system.
        Supplied with 3 pairs of guides and 3 EN 400x600 shelves per door. STORAGE REFRIGERATED CABINETS Operating temperature: 0 +4 °C, with
        an ambient temperature of +38 °C. FREEZER CABINETS For the storage of frozen products. The product must be previously frozen. Operating
        range: -22 -18 °C, with an ambient temperature of +38 °C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.106
      y: 3.101
      w: 9.0
      h: 25.3
  - idioma: fr
    paragrafs:
    - role: text
      text: 'La Série 5 BAKERY est celle qui optimise le mieux l’espace, grâce à sa faible largeur, tout en offrant la même capacité EN 400x600,
        ce qui la rend unique lorsque l’espace disponible est réduit. CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10.
        Les parties arrière sont en acier galvanisé. Cuves intérieures avec angles arrondis □ pour faciliter le nettoyage et l’évacuation à la
        base. Isolation en polyuréthane injecté écologique (sans CFC), d’une densité de 40 kg/m³ et d’une épaisseur de 55 mm. Avec pieds en acier
        inoxydable, réglables en hauteur. Charnières à torsion sur toutes les portes. Avec position de maintien en ouverture lorsque la porte
        dépasse 95°. □ Portes avec poignée intégrée, à fermeture magnétique, au moyen de joints à chambre d’air pour assurer l’étanchéité. Facilement
        remplaçables. □ Portes à ouverture réversible. □ Groupes frigorifiques surdimensionnés, avec dégivrage automatique. Froid ventilé pour
        obtenir une température homogène à l’intérieur. □ Gaz réfrigérant hydrocarboné. Rendement maximal pour obtenir la classification énergétique
        la plus écologique et réduire les émissions de CO₂. Avec thermomètre-thermostat électronique numérique. Ce programmateur permet de régler
        automatiquement les températures maximale et minimale, ainsi que les dégivrages, afin d’optimiser au maximum le rendement du réfrigérateur.
        Avec bouton-poussoir tactile marche-arrêt. Grilles réglables en hauteur tous les 70 mm, au moyen d’une crémaillère. Avec 3 paires de glissières
        et 3 grilles EN 400x600 par porte. ARMOIRES DE CONSERVATION Température de fonctionnement : 0 +4 °C, avec une température ambiante de
        +38 °C. ARMOIRES DE CONGÉLATION Pour la conservation des produits congelés. Le produit doit être préalablement congelé. Plage de fonctionnement
        : -22 -18 °C, avec une température ambiante de +38 °C.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.173
      y: 3.101
      w: 9.2
      h: 25.2
