    - role: text
      text: □ ARMOIRES RÉFRIGÉRÉES MIXTES DE CONSERVATION (GN 2/1) AVEC COMPARTIMENT DE CONGÉLATION (400×600)
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 3.607
      y: 0.39
      w: 17.3
      h: 1.489
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION Exterior and interior in AISI-304, 18/10 stainless steel. Rear panels in galvanised steel. Internal compartments with
        rounded corners. □ To facilitate cleaning and drainage at the base. Environmentally friendly injected polyurethane insulation (CFC-free),
        with a density of 40 kg/m³ and a thickness of 70 mm. Stainless steel legs, height-adjustable. Torsion hinges on all doors. With hold-open
        position when the door opens beyond 95°. □ Doors with integrated handle and magnetic closure, with air-chamber gaskets to ensure airtightness.
        Easily replaceable. □ Reversible doors. □ Interior light. Refrigeration units located at the top. Automatic defrosting. Fan-assisted cooling
        to ensure an even temperature throughout the interior. □ R290 hydrocarbon refrigerant gas. Maximum efficiency to achieve the most environmentally
        friendly energy rating and reduce CO₂ emissions. Electronic digital thermometer-thermostat. This controller allows the maximum and minimum
        temperatures, as well as defrost cycles, to be set automatically in order to optimise refrigerator performance. Touch-sensitive ON/OFF
        button. Plastic-coated wire shelves, height-adjustable every 70 mm. Operating range from 0 to +4°C, with an ambient temperature of +38°C.
        For holding frozen products. The product must be previously frozen. Operating range from -18 to -22°C, with an ambient temperature of
        +38°C. Equipped with a sealed compartment with static cooling, always located behind a small door in the lower section. Fitted with 3
        PVC drawers, with perforated stainless steel double base (400×600×120). □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 9.0
      h: 24.9
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable AISI-304, 18/10. Dos en acier galvanisé. Cuves intérieures avec angles arrondis.
        □ pour faciliter le nettoyage et l’évacuation de l’eau à la base. Isolation en polyuréthane injecté écologique (sans CFC), d’une densité
        de 40 kg/m³ et d’une épaisseur de 70 mm. Pieds en acier inoxydable, réglables en hauteur. Charnières à torsion sur toutes les portes.
        Avec position de maintien en ouverture lorsqu’elles dépassent 95°. □ Portes avec poignée intégrée et fermeture magnétique, au moyen de
        joints équipés d’une chambre à air, afin d’assurer l’étanchéité. Facilement remplaçables. □ Portes réversibles. □ Éclairage intérieur.
        Groupes frigorifiques en partie supérieure. Dégivrage automatique. Froid ventilé pour obtenir une température homogène à l’intérieur.
        □ Gaz réfrigérant hydrocarbure R290. Offre un rendement maximal afin d’obtenir la classification énergétique la plus écologique et de
        réduire les émissions de CO₂. Thermomètre-thermostat électronique numérique. Ce programmateur permet de régler automatiquement les températures
        maximale et minimale, ainsi que les cycles de dégivrage, afin d’optimiser les performances du réfrigérateur. Bouton tactile marche-arrêt.
        Grilles en fil plastifié, réglables en hauteur tous les 70 mm. Plage de fonctionnement de 0 à +4 °C, avec une température ambiante de
        +38 °C. Pour le maintien des produits surgelés. Le produit doit être préalablement congelé. Plage de fonctionnement de -18 à -22 °C, avec
        une température ambiante de +38 °C. Compartiment étanche, à froid statique, toujours situé derrière une petite porte dans la partie inférieure.
        Équipés de 3 tiroirs en PVC, avec double fond perforé en acier inoxydable (400×600×120). □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 10.301
      y: 3.101
      w: 9.6
      h: 25.5
