  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN Exterior e interior en acero inoxidable AISI-304. 18/10. El trasero es de acero galvanizado. Con encimera, peto y laterales
        de granito. □ La profundidad, son 800 mm. Cuba interna con los cantos redondedos para facilitar la limpieza y desagüe en el interior de
        la cámara. □ Aislamiento de poliuretano inyectado ecológico (libre de CFC) con una densidad de 40 Kgs./m3. Con patas regulables de acero
        inoxidable. Bisagras de torsión, en todas las puertas. Con posición de mantenimiento abierta, cuando supera los 95 grados. Puertas con
        cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente substituibles. □ Grupos frigoríﬁcos
        sobre-dimensionados, con desescarche automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza
        del condensador con la máxima comodidad. Gas refrigerante hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética
        mas ecológica y para reducir la emisiones de CO2. Frío ventilado para conseguir la temperatura homogénea en el interior de la cámara.
        Temperatura de trabajo 0 +4° C, con una temperatura ambiente de +36° C. Con termómetro-termostato electrónico digital. Dicho programador
        permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente, con el ﬁn de optimizar al máximo el rendimiento
        del frigoríﬁco. Con interruptor táctil de marcha-paro. En dotación con 7 pares de guías por Puerta para la colocación de latas EN 400x600.
        MODELOS CON REFRIGERADOR DE INGREDIENTES □ De funcionamiento independiente a la mesa fría. Con los recipientes GN 1/3-150 en dotación.
        El frío es estático, mediante serpentín de cobre, adosado a la pared interna de la cuba, en el espacio del aislamiento, lo cual facilita
        la limpieza de la misma. Con una vitrina de cristal templado, cerrado a 3 caras y encimera, fijado al refrigerador. □ La encimera de cristal,
        se puede usar como estante. MUEBLE NEUTRO Con 5 cajones para la fermentación de la masa de las bolas de pizza.
