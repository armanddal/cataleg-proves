      es: □ REFRIGERATED PIZZA PREPARATION TABLES □ TABLES RÉFRIGÉRÉES POUR LA PRÉPARATION DE PIZZAS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Exterior and interior in stainless steel. The back is made of galvanized steel. Internal tank with rounded corners to
        facilitate cleaning and drainage inside the cabinet. □ Ecological injected polyurethane insulation (CFC-free), with a density of 40 kg/m³.
        Torsion hinges on all doors. With a maintenance-open position when the door exceeds 95 degrees. □ Doors with magnetic closure, using air-chamber
        gaskets to ensure a tight seal. Easily replaceable. □ Supplied with 1 GN 1/1 shelf per door. Over-sized refrigeration units, with automatic
        defrosting. These units can be removed to facilitate maintenance and condenser cleaning with maximum convenience. □ Hydrocarbon refrigerant
        gas. Maximum performance to achieve the most ecological energy rating and reduce CO₂ emissions. With static cooling. Operating temperature
        0 +4° C, with an ambient temperature of +36° C. With digital electronic thermometer-thermostat. This controller allows the maximum and
        minimum temperatures to be adjusted, as well as automatic defrosting, in order to optimize the refrigerator''s performance to the maximum.
        With illuminated on/off switch. Depth: 700 mm. With granite countertop. □ With an opening at the rear of the countertop for placing GN
        1/6-150 containers. Cooling comes from the lower cabinet. They also feature a raised shelf, which at the same time covers the ingredients.
        □ Some models are supplied with the containers. With a lock located at the bottom of the doors. □ With a plinth at the base of the cabinet
        and adjustable feet.'
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.101
      w: 8.746
      h: 24.737
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION Extérieur et intérieur en acier inoxydable. L’arrière est en acier galvanisé. Cuve intérieure avec angles arrondis pour
        faciliter le nettoyage et évacuation à l’intérieur de la chambre. □ Isolation en polyuréthane injecté écologique (sans CFC), d’une densité
        de 40 kg/m³. Charnières à torsion sur toutes les portes. Avec position de maintien en ouverture lorsque l’angle dépasse 95 degrés. □ Portes
        à fermeture magnétique, au moyen de joints à chambre d’air, afin d’assurer une parfaite étanchéité. Facilement remplaçables. □ Équipement
        standard : 1 grille GN 1/1 par porte. Groupes frigorifiques surdimensionnés, avec dégivrage automatique. Ces groupes peuvent être extraits
        afin de faciliter les opérations de maintenance et le nettoyage du condenseur dans un maximum de confort. □ Gaz réfrigérant hydrocarboné.
        À haut rendement pour obtenir la meilleure classe énergétique écologique et réduire les émissions de CO₂. Avec froid statique. Température
        de fonctionnement de 0 à +4 °C, avec une température ambiante de +36 °C. Avec thermomètre-thermostat électronique numérique. Ce programmateur
        permet de régler les températures maximale et minimale, ainsi que les dégivrages automatiquement, afin d’optimiser au maximum les performances
        du réfrigérateur. Avec interrupteur lumineux marche-arrêt. Profondeur : 700 mm. Avec plan de travail en granit. □ Avec ouverture à l’arrière
        du plan de travail pour placer des bacs GN 1/6-150. Le froid provient de la chambre inférieure. Ils disposent également d’une étagère
        surélevée qui sert également à couvrir les ingrédients. □ Certains modèles sont fournis avec les bacs. Avec serrure située dans la partie
        inférieure des portes. □ Avec socle à la base du meuble et pieds réglables.'
      estil:
        color: '#000000'
        mida: 14.0
