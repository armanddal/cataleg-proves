        con una densidad de 40 Kgs./m³, y un espesor de 60 mm. Con encimera desmontable para la limpieza. Dotados del grupo frigorífico, con condensador
        refrigerado por aire. Gas refrigerante R290. Frío por serpentín, interior, de tubo de acero inoxidable. Entrada agua, a temperatura máxima
        de 15ºC. Llenado automático, de agua, Ø 1/2’’, con boya. Con agitador interior del agua. Rebosadero de seguridad Ø 3/4’’. Con grifo de
        salida de agua, Ø 1/2’’. Régimen de trabajo +1 + 3ºC, con una temperatura ambiente de +36ºC. Con termómetro-termostato electrónico digital.
        Con interruptores de línea y marcha/paro. Con patas regulables. Es recomendable instalar en la red de entrada de agua un filtro. □ Medidas
        según capacidad en litros. □□
