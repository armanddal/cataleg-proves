# Diccionari editable: hash de la imatge (sha1, 10 primers caràcters) -> què significa.
# nom   = nom del fitxer d'aquesta icona a assets/<gN>/
# clau  = significat quan és la icona de CAPÇALERA d'una columna de taula
# valor = significat quan és una icona dins d'una CEL·LA o enganxada a una FOTO/etiqueta
# phash = hash perceptual (dHash 16x16, hex): permet reconèixer la MATEIXA icona recodificada en un altre grup
#         (cada .pub recodifica les imatges i el sha1 canvia). L'extractor tria l'entrada amb phash més pròxim (<= 30 bits).
# nova: true = entrada afegida en generalitzar a G3-G5 (no era al pilot del grup 2); "grups" = on s'ha vist;
#         "hashes_vistos" = sha1 de les variants de la mateixa icona; "nota" = com s'ha nomenat.
