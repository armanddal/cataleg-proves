- id: p18
  n: 18
  tipus: informacio_general
  capcalera:
    banda: assets/g14/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE Le tout en acier inoxydable AISI 304 18/10. Avec des pieds réglables qui permettent d'augmenter la hauteur
        de 850 à 900 mm. TABLES MURALES Plans de travail avec bavette 100 mm, renforcée.□ En option, des bavettes latérales peuvent être installées
        (voir ACCESSOIRES) □ TABLES CENTRALES Plans de travail sans bavette, renforcés. TABLES SANS ÉTAGÈRE INFÉRIEURE Avec pattes attachées,
        sur trois côtés, laissant la partie inférieure libre, pour placer les poubelles, tonneaux, chariots, etc. □ TABLES AVEC ÉTAGÈRE INFÉRIEURE
        Plans de travail renforcée, à 150 mm du sol, pour faciliter le nettoyage. En option, des étagères supplémentaires peuvent être placées
        (voir ACCESSOIRES) TABLES AVEC DEUX ÉTAGÈRES INFÉRIEURES Étagères renforcées, celui à moins de 150 mm, du sol. TABLES DE CHEFF Avec 1
        évier embouti, avec tous les bords arrondis, pour un nettoyage facile, 500x400x250. □ Équipé d'une vanne de vidange et d'un tube de trop-plein.
        Plans de travail avec bavette 100 mm, renforcée. TABLES CHEFF, SANS ÉTAGÈRE INFÉRIEURE Avec pattes attachées, sur trois côtés, laissant
        la partie inférieure libre, pour le placement de poubelles, chariots, etc. □ TABLES CHEFF, AVEC UNE ÉTAGÈRE INFÉRIEURE Plans de travail
        renforcée à 150 mm du sol pour faciliter le nettoyage. LIVRAISON DÉMONTÉE Ils sont assemblés en 5 minutes maximum. Ils sont moins chers,
        en raison de la différence de coût de transport. Ils prennent moins de place dans l'entrepôt. LIVRAISON ASSEMBLÉE Toutes les mesures peuvent
        être fournies assemblées. Lors de la passation de la commande, ils doivent indiquer le code correspondant. COMPLÉMENTS POUR LES TABLES
        DE TRAVAIL Construction en acier inoxydable AISI 304 18/10. Ils peuvent être installés, sur n'importe quelle table, à droite ou à gauche.
        TIROIRS 460x450x150 (extérieur), avec guides télescopiques, qui permettent une ouverture totale. Pour le montage, suspendu sous le plan
        de travail. □ BOUCLE 3 TIROIRS 290x430x110, (intérieur), avec guides télescopiques, qui permettent une ouverture totale. Pour le montage,
        au-dessus de l'étagère inférieure. □ TIROIR DE GRANDE CAPACITÉ Conçu pour différents usages, comme une trémie à pain, ou pour placer les
        déchets dans son sac correspondant. □ Avec 2 paires de guides télescopiques, qui permettent une ouverture totale. Pour le montage, au-dessus
        de l'étagère inférieure. □ JEU DE GUIDES Pour GN-1/1 ou EN-400x600. Pour le montage sur le dessus de l'étagère inférieure. □ TABLES DE
        SNACK Conçu pour placer des appareils de cuisson de 600 ou 700 mm de profondeur sur le plan de travail. 600/650 mm de hauteur. Plans de
        travail sans bavette pour faciliter le raccordement des appareils au gaz, électricité, etc. Avec étagère inférieure, renforcée. TABLES
        AVEC TROU DE VIDANGE Plans de travail mural, avec bavette de 100 mm. Avec aneau en caoutchouc alimentaire amovible. □ En bas, libre de
        placer la poubelle, directement au sol, jusqu'à 500 mm, Ø. (Voir Poubelles sur roues, dans le GROUPE 13). Avec une porte pivotante. □
        TABLES AVEC 3 TIROIRS Plans de travail mural, avec bavette de 100 mm. 290x430x110 (intérieur), avec guides télescopiques, qui permettent
        une ouverture totale. TABLES D'ANGLE Plans de travail avec bavoirs, des deux côtés, 100 mm. Avec étagère inférieure. ÉTAGÈRES SUR LE HAUT
        DE LA TABLE Construit en acier inoxydable AISI 304 18/10 Munis de pieds tubulaires ronds Ø 30 mm, ils sont livrés démontés. MODÈLE SIMPLE
        Avec 1 étagère à 400 mm du plateau de table. MODÈLE DOUBLE Avec 2 étagères. Le premier à 330 mm, et le second à 700, du plateau de table.
        AFFICHAGE DE LUMIÈRE CHAUDE Avec interrupteur d'éclairage, marche-arrêt. □ Avec lampes halogènes R7s-15, avec protection en verre. En
        ayant de la lumière, il est visible lorsqu'il est en marche, évitant la consommation lorsqu'il n'est pas utilisé. Idéal pour garder les
        plats au chaud, jusqu’à ce qu’ils soient ramassés. Il peut être fourni monté sur l'étagère, sur demande, lors de la passation de la commande.
        Ou il peut également être installé sur n'importe quelle étagère existante.
      estil:
        color: '#000000'
        mida: 13.5
