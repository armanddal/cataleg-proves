      text: CONSTRUCTION GÉNÉRIQUE En acier inoxydable 18/10 AISI 304. Avec des pieds réglables. TABLES DE TRAVAIL AUXILIAIRES Conçus pour des
        usages spécifiques, comme le placement de petites machines. MOD/COD. 10100G08. Pour un computer, une caisse enregistreuse, etc. Avec un
        tiroir □ et une étagère inférieure. MOD/COD. 10204470. Pour friteuse, grill, etc. Avec 2 étagères inférieures. MOD/COD. 10224470. Pour
        trancheur, cutter etc. Hauteur 650. Avec 1 étagère inférieure. MOD/COD. 10784470. Pour trancheur de jambon. Avec support, (acier inoxydable),
        pour fixation, qui permet de tourner ou d'incliner le jambon. □ Avec 2 étagères inférieures. MODÈLES pour la préparation de la viande
        ou du poisson. Avec plan de travail en polyéthylène, avec trou pour déchets. (Mod/cod. 10404470 couleur rouge. 10704470 couleur bleu,
        10604470 couleur blanche) □ Espace en bas avec pieds joints, pour le placement de la poubelle. Hauteur maximale de 780 mm. TABLES DE DÉCOUPE
        AVEC PLAN DE TRAVAIL EN POLYÉTHYLÈNE Polyéthylène, qualité P-500. Sur demande, ils sont fabriqués avec des plaques de couleurs différentes,
        conformément à la réglementation, pour éviter la contamination et le mélange des saveurs, sans variation de prix. Le blanc pour les produits
        divers, le pain, etc., le rouge pour les viandes, le vert pour les légumes et le bleu pour le poisson. □ MODÈLES POUR COUPER ET DÉCOUPER,
        500x500, 400x600, 500x700 et 1000x500. La plaque de polyéthylène a une épaisseur de 50 mm. Très robuste, avec des pieds joints. Les modèles
        standard sont blanc et rouge. MOD/COD. 14126001 et 14030G08. Idéal pour une utilisation intensive dans la découpe et le découpage de la
        viande/du poisson. Il s'agit de tables dont l'ensemble du plan de travail est en polyéthylène blanc (standard), de 20 mm d'épaisseur.
        Ils peuvent être muraux ou centraux. Avec étagère inférieure. MODÈLES AVEC PLAN DE TRAVAIL EN ACIER INOXYDABLE/POLYÉTHYLÈNE □ Avec le
        dos du plan de travail, en acier inoxydable, avec 100 mm. Partie avant du plan de travail, en polyéthylène blanc (standard), épaisseur
        20 mm. Modèles avec pieds joints ou avec étagère inférieure. TABLES DE RECYCLAGE Pour une classification correcte des déchets. Pour un
        montage mural. Plan de travail en acier inoxydable, avec des anneaux de différentes couleurs, en fonction du produit à recycler. Les anneaux
        sont fournis dans la couleur indiquée sur la photo du modèle, mais si vous souhaitez d'autres couleurs, veuillez l'indiquer lors de la
        commande. Sans variation de prix. Disponible en rouge (organique), jaune (plastique), bleu (papier) et vert (verre). □ Les couvercles
        en acier inoxydable sont disponibles, EN OPTION (voir accessoires) □ Espace en bas pour les poubelles jusqu'à 95 litres (hauteur max.
        780 mm). Modèles ouverts et modèles avec portes. En option, des poubelles en acier inoxydable peuvent être fournis (voir GROUPE 13) ARMOIRES
        POUR LES VESTIARIES Tout en acier inoxydable. Avec un toit incliné pour un nettoyage facile. □ Avec deux étagères intérieures (une étagère
        supérieure plus la base). Avec une barre pour placer les cintres. Portes avec ventilation et serrure.
