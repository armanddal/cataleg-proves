- id: p52
  n: 52
  tipus: informacio_general
  capcalera:
    banda: assets/g14/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION Completely made of 18/10 stainless steel AISI 304. They are supplied with the screws and plugs, for their fixation.
        SMOOTH WALL SHELVES Ideal for the placement of products, dishes, etc., that are interesting to have nearby. With dismantled gussets. □
        TUBE WALL SHELVES Conceived for its installation, on top of sinks, and to place pots, or containers. SHELVES FOR MICROWAVE, SALAMANDERS
        With 60 mm hole. for the wiring pass. □ With inverted gussets, which act as lateral protection. These gussets, due to their height, are
        supplied disassembled. WALL SHELVES UNDER HOOD Designed for the placement of containers, with food, which are kept hot, taking advantage
        of the heat of the kitchens. Supplied with GN 1/1 stainless steel grills, removable for cleaning. □ HANGING BARS Made of Ø 30 tube, with
        supports welded at their ends, for fixing to the wall. Ideal for hanging hams and sausages. They can also be installed in cold rooms.
        BRACKETS FOR HANGING KITCHEN UTENSILS Made of Ø 8 tube, with cylindrical supports, for fixing to the wall. It is normally installed, near
        the kitchen itself, to have the utensils used by the cook nearby. ADJUSTABLE WALL SHELVES They are made up of two vertical posts, which
        are fixed to the wall. Said uprights have grooves for placing the shelves at the desired height. □ SMOOTH SHELVES You can place the ones
        you want, according to needs. INCLINED SHELVES For the placement of 4 GN containers. Included. □ Normally, they are placed at the bottom
        of the adjustable shelf, to have the ingredients we need close by, for the preparations.
      estil:
        color: '#000000'
        mida: 13.5
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE Entièrement fabriqué en acier inoxydable 18/10 AISI 304.Ils sont fournis avec les vis et chevilles, pour leur
        fixation. ÉTAGÈRES MURALES LISSE Idéal pour le placement de produits, plats, etc., qu'il est intéressant d'avoir à proximité. Avec goussets
        démontées. □ ÉTAGÈRES MURALES TUBE Conçu pour son installation, au-dessus des éviers, et pour placer des pots, ou des récipients. ÉTAGÈRES
        POUR MICRO-ONDES, SALAMANDRES Avec trou de 60 mm. pour le passage de câblage. □ Avec goussets inversés, qui agissent comme protection
        latérale. Ces goussets, en raison de leur hauteur, sont livrés démontés. ÉTAGÈRES MURALES SOUS HOTTE Conçu pour le placement de récipients,
        avec des aliments, qui sont maintenus au chaud, en profitant de la chaleur des cuisines. Livré avec grilles en acier inoxydable GN 1/1,
        amovibles pour le nettoyage. □ BARRES SUSPENDUES En tube Ø 30, avec supports soudés à leurs extrémités, pour fixation au mur. Idéal pour
        suspendre jambons et saucisses. Ils peuvent également être installés dans des chambres froides. BARRES POUR SUSPENDRE LES USTENSILES DE
        CUISINE En tube Ø 8, avec supports cylindriques, pour fixation au mur. Il est normalement installé, près de la cuisine elle-même, pour
        avoir à proximité les ustensiles utilisés par le cuisinier. ÉTAGÈRES MURALES RÉGLABLES Ils sont constitués de deux poteaux verticaux,
        fixés au mur. Lesdits montants présentent des rainures pour placer les étagères à la hauteur souhaitée. □ ÉTAGÈRES LISSES Vous pouvez
        placer ceux que vous voulez, selon les besoins. ÉTAGÈRES INCLINÉES Pour le placement de 4 conteneurs GN. Inclus. □ Normalement, ils sont
        placés dans la partie inférieure de l'étagère réglable, pour avoir les ingrédients dont nous avons besoin à proximité, pour les préparations.
      estil:
        color: '#000000'
        mida: 13.5
    pos:
      x: 10.65
      y: 2.694
      w: 9.85
      h: 25.6
