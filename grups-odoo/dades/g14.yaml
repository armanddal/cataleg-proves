  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCION GENÉRICA Totalmente de acero inoxidable 18/10 AISI 304. Se suministran con los tornillos y tacos, para su fijación. ESTANTES
        MURALES LISOS Ideales para la colocación de los productos, platos etc, que interesa tener cerca. Con las cartelas desmontadas. □ ESTANTES
        MURALES DE TUBO Concebidos para su instalación, encima de fregaderos, y colocar ollas, o recipientes. ESTANTES PARA MICROONDAS-GRATINADORES
        Con orificio de 60 mm. para el pase del cableado. □ Con las cartelas, invertidas, que hacen de protección lateral. Dichas cartelas, debido
        a su altura, se suministran desmontadas. ESTANTES MURALES BAJO CAMPANA Diseñados para la colocación de recipientes, con alimentos, que
        se mantienen calientes, aprovechando la calor de las cocinas. En dotación, con parrillas GN 1/1, de acero inoxidable, desmontables para
        su limpieza. □ BARRAS DE COLGAR De tubo de Ø 30, con soportes soldados en sus extremos, para su fijación a la pared. Ideales para colgar
        jamones y embutidos. También se pueden instalar en cámaras frigoríficas. BARRAS PARA COLGAR UTENSILIOS DE COCINA De tubo de Ø 8, con soportes
        cilíndricos, para su fijación a la pared. Se instala normalmente, cerca de la propia cocina, para tener cerca, los utensilios que usa
        el cocinero. ESTANTERÍAS MURALES REGULABLES Están formadas por dos montantes verticales, que se fijan a la pared. Dichos montantes disponen
        de ranuras, para la colocación de los estantes, a la altura deseada. □ ESTANTES LISOS Se pueden colocar los que se desee, según necesidades.
        ESTANTES INCLINADOS Para 4 recipientes GN. Incluidos. □ Normalmente, se colocan en la parte inferior de la estantería regulable, para
        tener cerca los ingredientes que necesitamos, para las preparaciones.
      estil:
        color: '#000000'
        mida: 13.5
    pos:
      x: 0.75
      y: 2.5
      w: 9.8
      h: 26.0
