  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 16.0
    - role: text
      text: Todo en acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 16.0
    - role: titol
      text: MUEBLES TRASBARRA
      estil:
        color: '#800080'
        negreta: true
        mida: 16.0
    - role: text
      text: Están concebidos para su colocación en la pared frontal del bar. Diseñados a juego con los contra-mostradores refrigerados, con puertas
        ciegas o con cristal, lo cual permite, múltiples combinaciones, de acuerdo con las necesidades. Todos los muebles, tienen el mismo lomo
        frontal, con punto redondeado, y peto. También el mismo pulido Scotch, y calidad del acero inoxidable, así como las mismas patas regulables.
      estil:
        color: '#000000'
        mida: 16.0
    - role: titol
      text: MUEBLES CAFETEROS
      estil:
        color: '#800080'
        negreta: true
        mida: 16.0
    - role: text
      text: Encimeras con peto de 100 mm, reforzadas, con orificio para el paso de las acometidas de electricidad y agua de la cafetera y molino
        del café.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con tolva para el poso del café, abatible, con apertura hasta los 120°. Con barra para soltar el marro, desmontable.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Debajo dispone de una puerta pivotante, para el depurador, cuyo trasero esta abierto para facilitar las acometidas.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con cajones, con guías telescópicas, que permiten su apertura total.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con 2 estantes, la base, mas uno intermedio, regulable en altura.
      estil:
        color: '#000000'
        mida: 16.0
    - role: titol
      text: MUEBLES CON ESTANTES
      estil:
        color: '#800080'
        negreta: true
        mida: 16.0
    - role: text
      text: Encimera con peto de 100 mm, reforzada.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con 3 estantes, la base mas dos intermedios regulables.
      estil:
        color: '#000000'
        mida: 16.0
    - role: titol
      text: MUEBLES PARA TERRAZAS
      estil:
        color: '#800080'
        negreta: true
        mida: 16.0
    - role: text
      text: Diseñados para su colocación en las terrazas, de establecimientos de hostelería, para el servicio de bebidas, comidas, etc., así como
        la recogida de vajilla. En su encimera se pueden colocar cajas registradoras, cafeteras etc.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con peto posterior de 150 mm, que protege de la caída accidental, de lo que está encima de la misma.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con cajones, con guias telescópicas, que permiten su apertura total.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con puertas pivotantes. En su interior 2 estantes, la base mas uno intermedio, regulable en altura.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Equipados con 4 ruedas de Ø 125 mm, 2 de ellas con freno.
      estil:
        color: '#000000'
        mida: 16.0
    - role: text
      text: Con asa para su conducción y soporte para las bandejas de los camareros.
