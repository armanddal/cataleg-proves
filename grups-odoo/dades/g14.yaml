  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA En acero inoxidable 18/10 AISI 304. Con patas regulables. MESAS DE TRABAJO AUXILIARES Ideadas para usos específicos,
        como para la colocación de pequeña maquinaria. MOD/COD. 10100G08. Para un ordenador, caja registradora etc. Con un cajón □ y estante inferior.
        MOD/COD. 10204470. Para freidora, plancha etc. Con 2 estantes inferiores. MOD/COD. 10224470. Para cortadora de fiambres, cutter etc. De
        altura 650. Con 1 estante inferior. MOD/COD. 10784470. Para cortar jamón. Con soporte, (de acero inox.), para la fijación, que permite
        girar o inclinar el jamón. □ Con 2 estantes inferiores. MODELOS para la preparación de carne o pescado. Con encimera en polietileno, con
        taladro para desperdicios. (Mod/cod. 10404470 color rojo. 10704470 color azul, 10604470 color blanco) □ Debajo libre con patas unidas,
        para la colocación del cubo de basura. Alto máx. 780 mm. MESAS DE CORTE CON ENCIMERA DE POLIETILENO Polietileno, de calidad P-500. Bajo
        pedido se fabrican con placas de distinto color, de acuerdo con la normativa, para evitar la contaminación y mezcla de sabores, sin variación
        de precio. Blanco para varios, pan etc, Rojo para carnes, Verde para verduras y Azul para pescados. □ MODELOS PARA PICAR Y TROCEAR, de
        500x500, 400x600, 500x700 y 1000x500. La placa de polietileno es de 50 mm de espesor Muy robustos, con las patas unidas. Los modelos standard,
        son el blanco y el rojo. MOD/COD. 14126001 y 14030G08. Ideales para el uso intensivo de corte y despiece de carnes/pescados. Son mesas
        con toda la encimera de polietileno color blanco (standard), de 20 mm, de espesor. Se pueden colocar murales o centrales. Con estante
        inferior. MODELOS CON ENCIMERA INOX/POLIETILENO □ Con la parte posterior de la encimera, en acero inox, con peto de 100 mm. Parte delantera
        de la encimera, en polietileno color blanco (standard), de 20 mm, de espesor. Modelos con patas unidas o con estante inferior. MESAS DE
        RECICLADO Para la clasificación correcta de los desperdicios. Para su colocación mural. Encimeras de acero. Inox, con aros de desbarace
        de distintos colores, según el producto a reciclar. Se suministran con los aros del color, que se ven en la foto del modelo, pero si desean
        otros colores, lo deben indicar al pasar el pedido. Sin variación de precio. Disponemos de color rojo (orgánico), amarillo (plástico),
        azul (papel) y verde (cristal). □ Disponemos de tapas de acero inox, OPCIONALES (ver accesorios) □ Espacio en la parte inferior para los
        cubos de basura, de hasta 95 litros (Alto máx. 780 mm) Modelos abiertos y modelos con puertas. OPCIONALMENTE, se pueden suministrar cubos
        de acero inox. (Ver GRUPO 13) TAQUILLAS Totalmente de acero inox. Con techo inclinado para facilitar la limpieza. □ Con dos estantes interiores.
        (Uno superior, mas la base) Con barra para colocar perchas. Puertas con ventilación y cerradura.
      estil:
        color: '#000000'
        mida: 13.5
