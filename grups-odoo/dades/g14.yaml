        color: '#000000'
        mida: 13.5
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CHARIOTS À ASSIETTES Fabriqué en acier peint époxy gris. Avec 4 roues Ø 125 mm, dont deux avec freins. Et avec des pare-chocs. Capacité
        100 assiettes. 4 pour chaque niveau. Conçu de telle manière que, facilement, la structure peut être modifiée, pour placer des assiettes,
        jusqu'à un maximum de Ø 330 mm. Avec 25 niveaux, avec une séparation entre les assiettes, 60 mm. Avec poignée verticale pour la conduite.
        □ En option, il peut être fourni avec une couverture en PVC de 200 microns avec fermeture éclair. □ CONSTRUCTION DES CHARIOTS GÉNÉRIQUE
        En acier inoxydable 18/10 AISI 304 Avec 4 roues pivotantes, dont deux avec freins. Avec pare-chocs. CHARIOTS DE LAVAGE Conçu pour laver
        les légumes. Il peut également être utilisé pour le transport de nourriture. Cuve 600x500x300 mm, avec tous les bords arrondis. Avec robinet
        de vidange et double fond perforé. □ CHARIOTS POUR SOLIDES Conçu pour les boulangeries, pâtisseries. Pour stocker la farine, les légumineuses,
        etc ... Récipient étanche, avec tous les bords arrondis pour faciliter le nettoyage. Avec couvercle pivotant à deux côtés et amovible.
        □ Capacité 135 litres. CHARIOTS AVEC ÉTAGÈRES Conçu pour le transport, jusqu'à un total de 200 Kg. répartis entre les étagères. Etagères
        très robustes, du fait qu'elles sont enboutis, avec des bords arrondis. Fourni démonté. En option, des supports pour les couverts □ et
        □ ou le sac poubelle peuvent être fixés. □ (voir ACCESSOIRES) CHARIOT AVEC ÉTAGÈRE, Mod/cod. 92000620 Renforcé pour transporter jusqu'à
        300 Kgs. Avec poignée tube amovible Ø 30 mm.
