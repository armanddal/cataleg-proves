  - idioma: es
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION In 18/10 AISI 304 stainless steel. With adjustable legs. AUXILIARY WORK TABLES Designed for specific uses, such
        as for the placement of small machinery. MOD/COD. 10100G08. For a computer, cash register etc. With one drawer □ and lower shelf. MOD/COD.
        10204470. For deep fryer, griddle, etc. With 2 lower shelves. MOD/COD. 10224470. For slicer, cutter etc. Height 650 mm. With 1 lower shelf.
        MOD/COD. 10784470. For cutting ham. With support, (stainless steel), for fixing, which allows to turn or tilt the ham. □ With 2 lower
        shelves. MODELS for the preparation of meat or fish. With polyethylene worktop, with waste hole. (Mod/cod. 10404470 red colour. 10704470
        blue colour, 10604470 white colour) □ Free bottom with joined feet, to place the waste bin. Max. height 780 mm. POLYETHYLENE CUTTING TABLES
        Polyethylene, P-500 quality. On request, they are manufactured with plates of different colours, according to the regulations, to avoid
        contamination and mixing of flavours, without price variation. White for various, bread etc., Red for meats, Green for vegetables and
        Blue for fish. □ MODELS FOR CHOPPING, 500x500, 400x600, 500x700 and 1000x500. The polyethylene plate is 50 mm thick. Very robust, with
        joined legs. The standard models are white and red. MOD/COD. 14126001 and 14030G08. Ideal for intensive use in the cutting and quartering
        of meat/fish. They are tables with all the worktop in white polyethylene (standard), 20 mm thick. They can be wall-mounted or central.
        With lower shelf. MODELS WITH STAINLESS STEEL/POLYETHYLENE WORKTOP □ With the back of the worktop, in stainless steel, with 100 mm. Front
        part of the worktop, in white polyethylene (standard), 20 mm thick. Models with joined legs or with lower shelf. RECYCLING TABLES For
        the correct classification of waste. For wall installation. Worktops stainless steel, with rings of different colors, depending on the
        product to be recycled. They are supplied with the rings in the colour shown in the photo of the model, but if you require other colours,
        please indicate this when placing the order. Without variation of price. Available in red (organic), yellow (plastic), blue (paper) and
        green (glass) □ We have stainless steel lids, OPTIONAL (see accessories) □ Space at the bottom for waste bins up to 95 litres (max. height
        780 mm) Open models and models with doors. OPTIONALLY, stainless steel bins can be supplied (see GROUP 13) LOCKERS CLOTHING All stainless
        steel. With sloping roof for easy cleaning. □ With two interior shelves (one upper shelf plus the base). With bar to place hangers. Doors
        with ventilation and lock.
      estil:
        color: '#000000'
        mida: 13.5
