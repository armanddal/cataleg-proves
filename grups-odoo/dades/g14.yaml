      text: Son mas económicas, debido a la diferencia de coste del transporte.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Ocupan menos espacio, en el almacén.
      estil:
        color: '#000000'
        mida: 12.9
