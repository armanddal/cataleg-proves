  - idioma: en
    paragrafs:
    - role: text
      text: DISHES TROLLEYS Made of gray epoxy painted steel. With 4 wheels, Ø 125 mm, two of them with brakes. And with para-chocks. Capacity
        100 dishes. 4 for each level. Designed in such a way that, easily, the structure can be modified to place plates, up to a maximum of Ø
        330 mm. With 25 levels, with a separation between plates, 60 mm. With vertical handle for driving. □ Optionally, it can be supplied with
        a 200 micron PVC cover with zip fastener. □ GENERIC TROLLEYS CONSTRUCTION In 18/10 stainless steel AISI 304 With 4 swivel wheels, two
        of them with brakes. With para-chocks. WASHING TROLLEYS Designed for washing vegetables. It can also be used for food transport. 600x500x300
        mm tank, with all rounded edges. With drain tap, and double perforated bottom. □ TROLLEYS FOR SOLIDS Designed for bakeries, pastry shops.
        To store flour, legumes, etc ... Watertight container, with all rounded edges to facilitate cleaning. With two-sided pivoting lid, and
        removable. □ Capacity 135 liters. TROLLEYS WITH SHELVES Designed for transport, up to a total of 200 Kgs. distributed among the shelves.
        Very robust shelves, due to the fact that they are embedded, with rounded edges. Supplied disassembled. Optionally, supports for cutlery
        □ and □ or garbage bag can be attached. □ (See ACCESSORIES) TROLLEY WITH A SHELF, Mod/cod. 92000620 Reinforced to transport up to 300
        Kgs. With removable Ø 30 mm tube handle.
