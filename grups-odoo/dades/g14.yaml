      text: STAINLESS STEEL SHELVES GENERIC CONSTRUCTION Quality 18/10 - AISI 304. With 4 angular uprights, 2 mm. thick, perforated every 100
        mm. □ With adjustable feet. 1.5mm thick shelves. Fixation of the shelves, by means of screws, included, of stainless steel. WITH SMOOTH
        SHELVES Very robust, to support weight. WITH WINE SHELVES With slots to ensure storage. DURALUMINUM SHELVES Designed to be placed in cold
        rooms or warehouses. With double uprights (ladders), in 28x28 mm square tube duralumin, perforated every 150 mm □ With adjustable feet.
        □ With shelves, made up of very robust stiles, made of duralumin and food-grade polypropylene racks, removable for washing. □ Each shelf
        is equipped with 4 anchoring pieces. □ All of this is easy to assemble, without tools. The shelves are supplied in a pack, with uprights
        and shelves, always straight, which allows modifications to be made when changing places. But if you want to form the corner shelf, without
        the intermediate upright, we have an angle bracket, which rests on each shelf, of the straight shelf. They will need as many supports
        as shelves. □ In this case the supply can be made, requesting the uprights (stairs) and the shelves that they want. DURALUMINUM BENCHES
        They are shelves of the same material as the shelves, 250 mm. high, for the placement of products, and that are not in contact with the
        ground, and thus comply with health regulations. □
