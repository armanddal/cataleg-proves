  - idioma: es
    paragrafs:
    - role: text
      text: ESTANTERÍAS DE ACERO INOXIDABLE CONSTRUCCIÓN GENÉRICA Calidad 18/10 - AISI 304. Con 4 montantes angulares, de 2 mm. de espesor, perforados
        cada 100 mm. □ Con patas regulables. Estantes de 1,5 mm de espesor. Fijación de los estantes, mediante tornillería, incluida, de acero
        inoxidable. CON ESTANTES LISOS Muy robustos, para soportar peso. CON ESTANTES PARA VINOS Con ranuras para asegurar su almacenaje. ESTANTERÍAS
        DE DURALUMINO Ideadas para colocar en cámaras frigoríficas, o almacenes. Con montantes dobles (escaleras), de duraluminio de tubo cuadrado
        de 28x28 mm, perforados cada 150 mm □ Con patas regulables. □ Con estantes, formados por largueros muy robustos, de duraluminio y parrillas
        de polipropileno alimenticio, desmontables para su lavado. □ Cada estante esta dotado de 4 piezas de anclaje. □ Todo ello de fácil montaje,
        sin herramientas. Las estanterías, se suministran en un pack, de montantes y estantes, siempre rectas, lo cual permite realizar modificaciones,
        al cambiarlas de lugar. Pero si desean formar la estantería angular, sin el montante intermedio, disponemos de un soporte en ángulo, que
        se apoya en cada estante, de la estantería recta.□ Precisaran tantos soportes como estantes. En tal caso el suministro se puede realizar,
        solicitando los montantes (escaleras) y los estantes que deseen. BANCADAS DE DURALUMINIO Son estantes del mismo material que las estanterías,
        de 250 mm. de altura, para la colocación de productos, y que no estén en contacto con el suelo, y así cumplir la normativa sanitaria.
        □
