- id: p59
  n: 59
  tipus: informacio_general
  capcalera:
    banda: assets/g5/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '900'
    logo_serie: assets/g5/logo-serie-master.png
    titol:
      es: PLANCHAS-FRYTOP Y BARBACOAS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.2
    - role: text
      text: En acero inoxidable AISI 304, interior y exterior.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Patas regulables en todos los aparatos.
      estil:
        color: '#000000'
        mida: 12.2
    - role: titol
      text: PLANCHAS-FRYTOP GAS O ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.2
    - role: text
      text: Los modelos a gas y con placas de hierro, con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de
        seguridad y termopar.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con quemadores tubulares de acero inoxidable.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Modelos a gas y con placas de cromo duro, con válvula termostática y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Todas los modelos a gas con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Modelos eléctricos con termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: OPCIONALMENTE, se pueden solicitar con control electrónico de temperatura, sólo los frytop eléctricos sobre soporte. Ver ACCCESORIOS.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con resistencias blindadas de acero inoxidable, montadas en cajones debidamente aislados.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Todos los modelos con cajón recoge grasas en el frontal y tapón de estanqueidad cónico.
      refs:
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 12.2
    - role: titol
      text: PLACAS–FRYTOP
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.2
    - role: text
      text: Encimeras embutidas, con cantos redondeados, de acero inoxidable AISI 304, de 2 mm. de espesor.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con peto desmontable para facilitar la limpieza.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Los modelos con placas de hierro, de 15 mm. de espesor, soldadas en todo su contorno, superior e inferior, para su máxima higiene.
        Con desagüe frontal.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: La superficie de dichas placas, pueden ser lisas, ranuradas totalmente, o mixtas (2/3 lisa y 1/3 ranurada), solo en los modelos de
        800 mm. de ancho.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Los modelos con placas de cromo de 15 mm. de espesor, rectificadas y con baño de cromo duro de 50 micras. Soldadas en todo su contorno,
        superior e inferior, para su máxima higiene. Con desagüe frontal.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Se suministran con una espátula-cúter para su limpieza, la cual se debe usar sin golpear, sólo deslizando la cuchilla por la encimera.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: La forma de limpieza, es una vez parada la plancha y al cabo de 30/45 minutos (aún caliente), se deben colocar cubitos de hielo,  los
        cuales se evaporarán inmediatamente. Entonces la espátula-cúter deberá pasarse suavemente, para eliminar al máximo la grasa, y seguidamente
        un paño húmedo. No poner desengrasante hasta el día siguiente antes de poner la plancha en marcha y quedará la superficie brillante como
        nueva.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Dichas placas siempre son lisas
      estil:
        color: '#000000'
        mida: 12.2
    - role: titol
      text: BARBACOAS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.2
    - role: text
      text: Funcionamiento mediante quemadores tubulares de acero inoxidable, que calientan la piedra volcánica, que se halla situada encima de
        una rejilla-soporte de acero inoxidable. Al calentar la piedra, hace la función de auténtica brasa.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Equipan parrillas, formadas por perfiles en “V” siempre de acero inoxidable, de 400 mm. de ancho (una o dos unidades, según modelo),
        las cuales son ideales para carnes, verduras, etc. En ACCESORIOS, pueden ver como opción , las parrillas especiales para pescado, (que
        están construidas con perfiles redondos)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con un sistema que permite la colocación de parrilla en 2 posiciones, utilizando para ello las asas de baquelita de que dispone la
        parrilla y con peto alrededor de la parrilla, para evitar salpicaduras.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Con cajón recoge-grasas.
      estil:
        color: '#000000'
        mida: 12.2
    - role: titol
      text: SOPORTES ABIERTOS o CON PUERTAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.2
    - role: text
      text: Los frytops van sobre soporte abierto, disponen de un estante inferior.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: OPCIONALMENTE, se pueden colocar puertas, las cuales son reversibles. (Cod. 4A200913) que encontrarán en ACCESORIOS.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Las barbacoas a gas, llevan puertas de serie.
      estil:
        color: '#000000'
        mida: 12.2
    pos:
      x: 0.5
      y: 3.0
      w: 14.1
      h: 25.0
