- id: p43
  n: 43
  tipus: informacio_general
  capcalera:
    banda: assets/g5/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '900'
    logo_serie: assets/g5/logo-serie-master.png
    titol:
      es: E TILTING PAN, MARMITES F SAUTESES BASCULANTES ET MARMITES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERAL CONSTRUCTION In stainless steel AISI 304, interior and exterior. 2 mm countertops. of thickness. Adjustable legs in all models.
        GAS OR ELECTRIC TILTING BRAD PANS With stainless steel vats, with the bottom of 12 mm. of thickness. With rounded edges, to facilitate
        cleaning, and with design for the emptying of food, when tilting. □ The tipping of the tank is carried out by means of a handwheel, which
        is operated manually, to raise or lower it. There are models with motorized tilting. With lid equipped with a closing or opening pressure
        spring, and its corresponding handle. With spout for water filling, □ with the tap control on the front. The gas model, with tubular stainless
        steel burners. With thermostatic valve, adjustable from 100 to 300ºC, and maintenance pilot. With safety coil and thermocouple. With piezo-electric
        ignition. They have a peephole. The electric model, with shielded stainless steel resistors, mounted in properly insulated drawers. With
        thermostat adjustable up to 300ºC and pilot indicator of operation. GAS OR ELECTRIC DIRECT AND INDIRECT BOILING PANS With embedded countertop,
        to which a cylindrical tank is welded, with the bottom in stainless steel AISI 316, with all rounded edges, to facilitate cleaning. With
        cover equipped with a vertical closing or opening pressure spring and its corresponding handle. □ With 2-inch front drain tap. Indirect
        cooking, with double chamber for water, and thus prevent food from sticking to the bottom and sides of the tank. They are also equipped
        with a safety group and control manometer. □ The filling of the chamber is carried out, by means of the available pipe, which is rotatable
        and in turn is used for filling the tank, with hot or cold water. □ The gas model heats by means of stainless steel tubular burners. With
        brass tap, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple. With piezo-electric ignition.
        It has a front sight glass. The electric model, works with a resistor, armored stainless steel, submerged in the water chamber itself.
        Controlled by means of a switch, with 4 positions and pilot operation indicator. With start-stop switch. OPTIONALLY, perforated baskets
        can be supplied, with 3 mm holes. Ø. See in ACCESSORIES. □
      estil:
        color: '#000000'
        mida: 9.7
    pos:
      x: 1.01
      y: 3.166
      w: 8.79
      h: 25.35
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable AISI 304, intérieur et extérieur. Comptoirs de 2 mm. épais Jambes réglables dans tous les modèles.
        SAUTEUSES BASCULANTES À GAZ OU ELECTRIQUES Avec des cuves en acier inoxydable, avec le fond de 12 mm. épais Avec des bords arrondis pour
        faciliter le nettoyage et avec une conception pour vider les aliments lors de l'inclinaison. □ Le basculement du réservoir est effectué
        à l'aide d'un volant à main, actionné manuellement, pour le monter ou le baisser. Il existe des modèles à inclinaison motorisée. Avec
        couvercle muni d’un ressort de pression de fermeture ou d’ouverture et de la poignée correspondante. Avec bec verseur pour le remplissage
        d'eau, □ avec la commande de robinet à l'avant. Le modèle à gaz, avec des brûleurs tubulaires en acier inoxydable. Avec vanne thermostatique,
        réglable de 100 à 300ºC, et pilote de maintenance. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Ils ont un
        judas. Le modèle électrique, avec des résistances blindées en acier inoxydable, est monté dans des tiroirs correctement isolés. Avec thermostat
        réglable jusqu'à 300ºC et indicateur de fonctionnement. MARMITES DIRECTS ET INDIRECTS DE GAZ OU D'ÉLECTRICITÉ Avec plan de travail incorporé,
        auquel est soudé un réservoir cylindrique, avec le fond en acier inoxydable AISI 316, avec tous les bords arrondis, pour faciliter le
        nettoyage. Avec couvercle équipé d'un ressort de pression de fermeture ou d'ouverture vertical et de la poignée correspondante. □ Avec
        robinet d'évacuation avant de 2 pouces. Cuisson indirecte, avec double chambre pour l'eau, empêchant ainsi les aliments de coller au fond
        et aux côtés du réservoir. Ils sont également équipés d'un groupe de sécurité et d'un manomètre de contrôle. □ Le remplissage de la chambre
        est effectué au moyen du tuyau disponible qui peut tourner et qui sert à son tour au remplissage du réservoir avec de l'eau chaude ou
        froide. □ Le modèle à gaz chauffe au moyen de brûleurs tubulaires en acier inoxydable. Avec robinet en laiton, équipé de positions de
        réglage maximum, minimum et pilote. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Il a une lunette de visée.
        Le modèle électrique fonctionne avec une résistance, en acier inoxydable blindé, immergé dans la chambre à eau elle-même. Contrôlé à l'aide
        d'un commutateur, avec 4 positions et indicateur de fonctionnement du pilote. Avec interrupteur marche-arrêt. OPTIONNELLEMENT, des paniers
        perforés peuvent être fournis, avec des trous de 3 mm. Ø. Voir dans ACCESSOIRES. □
      estil:
        color: '#000000'
        mida: 9.7
    pos:
      x: 10.5
      y: 3.166
      w: 10.0
      h: 25.35
