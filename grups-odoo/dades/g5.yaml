    - role: text
      text: In stainless steel AISI 304, interior and exterior.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Adjustable legs in all appliances.
      estil:
        color: '#000000'
        mida: 10.5
    - role: titol
      text: GAS OR ELECTRIC FRYTOPS PLATES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.5
    - role: text
      text: Gas models with iron plates, with brass taps, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With tubular stainless steel burners.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Gas models with hard chrome plates, with thermostatic valve and maintenance pilot. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: All gas models with piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Electric models with thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: OPTIONALLY, can be requested with electronic temperature control, only electric frytop on support. See ACCESSORIES.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With armored stainless steel resistors, mounted in drawers properly insulated.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: All models with drawer collects grease on the front and conical sealing cap.
      refs:
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 10.5
    - role: titol
      text: PLATES–FRYTOP
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.5
    - role: text
      text: Built-in countertops, with rounded edges, in stainless steel AISI 304, 2 mm. thick
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With removable bib for easy cleaning
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: The models with iron plates, 15 mm. thick, welded all around, upper and lower, for maximum hygiene. With front drain.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: The surface of these plates can be smooth, fully grooved, or mixed (2/3 smooth and 1/3 grooved), only on 800 mm models. Wide.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: The models with 15 mm chrome plates. thick, ground and with 50 micron hard chrome plating. Welded in all its contour, upper and lower,
        for maximum hygiene. With front drain.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: They are supplied with a spatula-cutter for cleaning, which should be used without hitting, just by sliding the blade over the countertop.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: The cleaning method, once the iron is stopped and after 30/45 minutes (still hot), ice cubes should be placed, which will evaporate
        immediately. Then the spatula-cutter should be passed gently, to remove the maximum fat, and then a damp cloth. Do not put degreaser until
        the next day before starting the iron and the surface will be shiny as new.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: These plates are always smooth
      estil:
        color: '#000000'
        mida: 10.5
    - role: titol
      text: GAS BARBECUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.5
    - role: text
      text: Operation by means of stainless steel tubular burners, which heat the volcanic stone, which is located above a stainless steel support
        grid. When heating the stone, it acts as an authentic grill.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With brass taps, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: They are equipped with grills, formed by “V” profiles, always made of stainless steel, 400 mm. wide (one or two units, depending on
        model), which are ideal for meats, vegetables, etc. In ACCESSORIES, you can see as an option, special grills for fish, (which are built
        with round profiles)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With a system that allows the placement of a grill in 2 positions, using the bakelite handles available on the grill and with bib
        around the grill, to avoid splashing.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: With fat collection drawer.
      estil:
        color: '#000000'
        mida: 10.5
    - role: titol
      text: OPEN OR DOOR SUPPORTS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.5
    - role: text
      text: The frytops which go on open support, have a lower shelf.
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: OPTIONALLY, doors can be placed, which are reversible. (Cod. 4A200913) that you will find in ACCESSORIES.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.5
    - role: text
      text: Gas barbecues have standard doors.
      estil:
        color: '#000000'
        mida: 10.5
