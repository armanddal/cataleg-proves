- id: p46
  n: 46
  tipus: informacio_general
  capcalera:
    banda: assets/g5/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '900'
    logo_serie: assets/g5/logo-serie-master.png
    titol:
      es: MESAS, BASES HORNOS Y SOPORTES E TABLES, OVEN BASES AND SUPPORTS F TABLES, BASES DE FOUR ET SUPPORTS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: 'CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Encimeras de 2 mm. de espesor. Patas regulables en todos los modelos.
        MESAS DE APOYO Hay modelos con cajón, con guías correderas.  El mod/cod. 38307693, dispone de un estante de sobremesa, para la colocación
        de una salamandra, microondas etc. □ BASES HORNOS ELÉCTRICOS De altura 600 mm., realizados para soportar dos aparatos de sobre-mesa de
        400 mm. O uno de 800 mm. □ Puertas y contra-puertas embutidas, de acero inoxidable, debidamente aisladas con fibra de vidrio, y tirador.□
        Puertas con bisagras reforzadas, con cierre a presión mediante muelle. Marcos dotados de junta, con cámara de aire, de acero inoxidable
        AISI 304, trenzado, con fibra de vidrio, FIBERGLASS, resistente a altas temperaturas (hasta 540º C), para evitar la pérdida de calor y
        el calentamiento de los mandos de las encimeras. El modelo a convección, es para GN 1/1. Con motor-ventilador y resistencia circular,
        en la pared posterior del horno. Con termostato de 50 a 275º C y temporizador, de 0-5-10-15-20-30-40-50 minutos. Así mismo piloto indicador
        de funcionamiento.□ Como dotación equipan una rejilla GN 1/1, de 530x325 mm. El modelo estático, es para GN 2/1. Equipados con un termostato
        para el horno y conmutador para el grill, con pilotos indicadores. El funcionamiento puede ser independiente.4 Con resistencias blindadas
        de acero inoxidable. Como dotación equipan una rejilla GN 2/1, de 530x650 mm. SOPORTES ABIERTOS Y CON PUERTAS Los muebles están fabricados
        para colocar encima de ellos los elementos de cocción, formando un conjunto. OPCIONALMENTE, se pueden colocar guías para GN 1/1, para
        el almacenamiento de dichos recipientes. □ También ofrecemos un elemento calefactor, que se coloca en la Base del soporte con puerta/s,
        para mantener alimentos calientes. □ Todo ello lo encontraran en las páginas de ACCESORIOS. SOPORTES CON MONTANTES Sobre los cuales se
        pueden montar los elementos que deseen, con la zona inferior libre, lo cual facilita la limpieza. Se ofrecen cinco opciones: (2M). El
        que lleva dos montantes, uno en cada extremo. (1M). El que lleva un montante en un lado, y las viguetas se soportan con un equipo de pie,
        como por ejemplo una freidora.., en el otro. (PU). Es la versión puente, ya que consta de dos viguetas, que van de un equipo de pie a
        otro. (MU). Es un soporte mural, longitudinal, por el interior del cual pueden pasar las acometidas, de gas, agua y electricidad. (SC).
        Es un soporte central, longitudinal. “CANTILEVER”, sobre el cual, se colocan los equipos suspendidos, por ambos lados, para las cocinas
        situadas en posición central. Por el interior del cual, pueden pasar las acometidas, de gas, agua y electricidad. TAMBIEN FABRICAMOS,
        PARA COLOCAR ENCIMA ELEMENTOS DE SOBRE-MESA De altura 600 mm. MESAS CALIENTES. Ver en Catalogo GRUPO-7 EQUIPOS CALIENTES RESERVAS FRIAS.
        Ver en Catalogo GRUPO-11 FRÍO INDUSTRIAL'
