- id: p04
  n: 4
  tipus: informacio_general
  capcalera:
    banda: assets/g5/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '900'
    logo_serie: assets/g5/logo-serie-master.png
    titol:
      es: HORNILLOS, PLACAS RADIANTES, COCINAS SOBRE SOPORTE ABIERTO Y SOBRE HORNOS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENERAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: En acero inoxidable AISI-304.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Encimeras embutidas, de 2 mm. de espesor , con cantos redondeados para facilitar la limpieza.
      refs:
      - 1
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con patas regulables.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: ENCIMERAS DE COCINAS Y HORNILLOS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con quemadores de fundición, de 9 y 5,5 Kw., de potencia (según modelo) y alto rendimiento.
      refs:
      - 4
      - 5
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Dichos quemadores y corona, son desmontables para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con robustas parrillas de fundición vitrificadas.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Equipa bandejas recojegrasas individuales.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: ENCIMERAS COCINAS CON PLACA RADIANTE A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con grifo de latón, dotado de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con quemadores de 11 Kw. Dichos quemadores y corona, son desmontables, para facilitar la limpieza.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con placas de fundición, con difusores, para repartir el calor por toda la placa. Con aro central, extraíble, que si se desea, se
        puede utilizar como fuego abierto, para el calentamiento directo de la olla.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con las cocinas, con placa radiante, se puede trabajar en toda la superficie de la misma, cocinando o manteniendo los alimentos, según
        se aproxime el recipiente, mas o menos al aro central, ya que se dispone de diferentes temperaturas. Además permite utilizar mas número
        de recipientes y de todos los tamaños.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Fabricamos modelos, combinados con fuegos abiertos tradicionales.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: ENCIMERAS DE COCINAS Y HORNILLOS ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con conmutadores, con 6 niveles de potencia y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Equipan placas cuadradas de fundición, de 300x300 mm., de 4 Kw. de potencia, cada una.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con dispositivo automático de seguridad, que pára la placa, en caso de no tener ningún elemento en ella.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: ENCIMERAS DE COCINAS Y HORNILLOS VITROCERÁMICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Encimera de cristal Schott de 6 mm de espesor.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Dicho cristal es muy fácil de limpiar, al ser totalmente plano.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con conmutadores con 2 niveles de potencia y pilotos indicadores de funcionamiento.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con resistencias de wolframio, de 3,4 Kw.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Dispone de limitador automático de temperatura.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: SOPORTES ABIERTOS EN COCINAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con estante inferior.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: OPCIONALMENTE, pueden equipar...
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Kits de guías, para recipientes GN 1/1 (Cod. 4A205939)
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Puertas reversibles (Cod. 4A200913) 10
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Elemento calefactor (Cod. 4A550611), 11 para utilizar como armario caliente el soporte. Dicho elemento se coloca encima del estante
        inferior.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Todo ello lo encontrarán en las páginas de ACCESORIOS.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: CONSTRUCCION GENERAL DE LOS HORNOS PARA COCINAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Interior construido también en acero inoxidable AISI 304.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Puertas y contra-puertas, embutidas, de acero inoxidable AISI 304, debidamente aisladas, con fibra de vidrio, con tirador. 12
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Puertas con bisagras reforzadas con cierre a presión mediante muelle.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Marcos dotados de junta, con cámara de aire, de acero inoxidable AISI 304, trenzado, con fibra de vidrio, FIBERGLASS, resistente a
        altas temperaturas. (Hasta 540 ºC), para evitar la pérdida de calor y el calentamiento de los mandos de la encimera
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: HORNOS PARA COCINAS A GAS, GN 2/1 o CHE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con válvula termostática y piloto de mantenimiento, con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con quemador tubular debajo de la plancha del horno.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Como dotación, equipan una rejilla GN 2/1, de 530x650 mm. El mod/cod. 34630313, con horno CHE, con una rejilla de 883x603 mm.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: HORNOS ESTÁTICOS ELÉCTRICOS, PARA COCINAS, GN 2/1 o CHE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Equipados con un termostato para el horno y un conmutador para el grill, con pilotos indicadores. El funcionamiento puede ser independiente.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con resistencias blindadas de acero inoxidable.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Como dotación, equipan una rejilla GN 2/1, de 530x650 mm.
      estil:
        color: '#000000'
        mida: 9.0
    - role: titol
      text: HORNOS A CONVECCIÓN ELÉCTRICOS, PARA COCINAS A GAS, ELÉCTRICAS o VITROCERÁMICAS, GN 1/1
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.0
    - role: text
      text: Con motor ventilador y resistencia circular, en la pared posterior del horno. 13
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Con termostato de 0-50 a 275 ºC, y temporizador, de 0-5-10-15-20-30-40-50 minutos. Así mismo con piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 9.0
    - role: text
      text: Como dotación equipan una rejilla GN 1/1, de 530x325 mm.
      estil:
        color: '#000000'
        mida: 9.0
