  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: STRUCTURE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.7
    - role: text
      text: In stainless steel, interior and exterior.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: 2 mm countertops. of thickness.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Adjustable legs in all appliances.
      estil:
        color: '#000000'
        mida: 9.7
    - role: titol
      text: GAS AND ELECTRIC FRYERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.7
    - role: text
      text: All fryers with chrome steel baskets and covers with handle.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Fryers on stand, equipped with door/s as standard.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With vats fully welded to the countertop, embedded to facilitate cleaning and also prevent the oil from overflowing.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With perforated grid to avoid going food to the bottom.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: The fryers on support, carry the drain tap in the lower area, and are equipped with a tank for emptying the oil, with a filter to
        retain impurities.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With generous cold zone, which increases the duration of the oil.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Gas models, with a clean tank, without tubes, only the protectors of the bulbs of thermostats
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With stainless steel burners, which are located under the tank and insulated in the combustion chamber.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: On express request, gas fryers can be supplied, with heat exchange tubes, inside the tank / s, without price variation. In this case,
        the burners are cast iron, torch type, with the same power, as the clean bowl.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With thermostatic valve and maintenance pilot. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Electric models on support, with a very easy to clean tank, for having a mechanism, so that the resistances can rotate, to the vertical
        position.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: All resistors are armored stainless steel.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With safety thermostat that stops the fryer in case of abnormal increase in oil temperature.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: OPTIONALLY, can be requested, with electronic temperature control, (only electric fryers on stand). See ACCESSORIES.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 9.7
    - role: titol
      text: ELECTRIC FRIED CONSERVATORS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.7
    - role: text
      text: They are manufactured, on tabletop or on open support.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Equipped with a bowl GN 1 / 1-150, with double perforated and curved bottom to facilitate the collection of fried foods, all removable
        for cleaning.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With a ceramic resistance, located on the upper screen.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Equipped with an energy regulator, to adjust the desired temperature and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.7
    - role: titol
      text: ELECTRIC BAIN-MARIES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.7
    - role: text
      text: They are manufactured, on tabletop or on open support.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With the tanks, to locate 4 or 8 GN 1/3 depending on the model, welded to the countertop, with all rounded internal edges.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With drain tap, located on the front, with safety device, to prevent accidental opening.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Equipped with an adhesive resistance, located at the bottom of the tank, so that the inside of it is completely clean.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Equipped with thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: OPTIONALLY, we have a double perforated stainless steel bottom, see in ACCESSORIES, for the maintenance of food in pots, directly.
        Or if they wish, they can place different combinations of GN containers. (See catalog GROUP-16)
      estil:
        color: '#000000'
        mida: 9.7
    - role: titol
      text: GAS AND ELECTRIC PASTA COOKERS ON SUPPORT
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.7
    - role: text
      text: They are manufactured with 1 tank or 2 tanks.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: The supports are equipped with door / s as standard.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With GN 1/1 vats, made of AISI 316 stainless steel, welded to the embedded countertop, for easy cleaning.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With perforated grid to avoid food going to the bottom.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: It has filling and emptying taps.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With overflow to avoid the spillage of water and at the same time the evacuation of the starch from the paste, which floats.
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: Gas models, with stainless steel tubular burner
      estil:
        color: '#000000'
        mida: 9.7
    - role: text
      text: With brass tap, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple. With piezo-electric
        ignition. Electric models, equipped with a stainless steel resistance, armored. Equipped with switch-thermostat and pilot operation. OPTIONALLY,
        can be requested with electronic temperature control.4 Likewise, we have packs, perforated baskets with handle / s completely made of
        stainless steel. See in ACCESSORIES. 8
      estil:
        color: '#000000'
        mida: 9.7
