- id: p42
  n: 42
  tipus: informacio_general
  capcalera:
    banda: assets/g5/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '900'
    logo_serie: assets/g5/logo-serie-master.png
    titol:
      es: SARTENES BASCULANTES Y MARMITAS E TILTING PAN, MARMITES F SAUTESES BASCULANTES ET MARMITES
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Encimeras de 2 mm. de espesor. Patas regulables en todos los modelos.
        SARTENES BASCULANTES A GAS O ELÉCTRICAS Con cubas de acero inoxidable, con el fondo de 12 mm. de espesor. Con cantos redondeados, para
        facilitar la limpieza, y con diseño para el vaciado de los alimentos, al bascular. □ La basculación de la cuba se realiza, mediante un
        volante, que se acciona manualmente, para hacer subir o bajar la misma. Existen los modelos con la basculación motorizada. Con tapa dotada
        de muelle de presión de cierre o apertura, y su correspondiente asa. Con caño para el llenado de agua, □ con el mando del grifo en el
        frontal. El modelo a gas, con quemadores tubulares de acero inoxidable. Con válvula termostática, regulable de 100 a 300ºC, y piloto de
        mantenimiento. Con bobina de seguridad y termopar. Con encendido piezo-eléctrico. Disponen de mirilla frontal. El modelo eléctrico, con
        resistencias blindadas de acero inoxidable, montadas en cajones debidamente aislados. Con termostato regulable hasta 300ºC y piloto indicador
        de funcionamiento. MARMITAS DIRECTAS E INDIRECTAS A GAS O ELÉCTRICAS Con encimera embutida, a la cual esta soldada una cuba cilíndrica,
        con el fondo en acero inoxidable AISI 316, con todos los cantos redondeados, para facilitar la limpieza. Con tapa dotada de muelle de
        presión de cierre o apertura vertical y su correspondiente asa. □ Con grifo de desagüe frontal, de 2 pulgadas. Las de cocción indirecta,
        con doble cámara para el agua, y así evitar que los alimentos se peguen en el fondo y en los laterales de la cuba. Así mismo van equipadas
        con un grupo de seguridad y manómetro de control. □ El llenado de la cámara, se realiza, mediante  el caño de que dispone, el cual es
        giratorio y a su vez se usa para el llenado de la cuba, de agua fría o caliente. □ El modelo a gas, calienta por medio de quemadores tubulares
        de acero inoxidable. Con grifo de latón, dotado de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar. Con
        encendido piezo-eléctrico. Dispone de mirilla frontal. El modelo eléctrico, funciona con una resistencia, de acero inoxidable blindada,
        sumergida en la propia cámara de agua.  Controlada por medio de un conmutador, con 4 posiciones y piloto indicador de funcionamiento.
        Con interruptor de marcha-paro. OPCIONALMENTE, se pueden suministrar cestas perforadas con taladros de 3 mm. Ø. Ver en ACCESORIOS. □
      estil:
        color: '#000000'
        mida: 9.7
    pos:
      x: 0.5
      y: 3.0
      w: 12.9
      h: 25.395
