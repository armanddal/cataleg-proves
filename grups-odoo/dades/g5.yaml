        mida: 10.2
    - role: text
      text: Ils sont fournis avec un couteau-spatule pour le nettoyage, qui doit être utilisé sans frapper, simplement en faisant glisser la lame
        sur le comptoir.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: La méthode de nettoyage, une fois que le fer est arrêté et après 30/45 minutes (encore chaud), il faut placer des glaçons qui s’évaporent
        immédiatement. Ensuite, le coupeur de spatule doit être passé en douceur, pour éliminer le maximum de graisse, puis un chiffon humide.
        Ne mettez pas de dégraissant avant le lendemain, avant de mettre le fer en marche. La surface sera comme neuve.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Ces plaques sont toujours lisses
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: BARBECUE À GAZ
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: Fonctionnement au moyen de brûleurs tubulaires en acier inoxydable, qui chauffent la pierre volcanique , situés au-dessus d’une grille
        de support en acier inoxydable. En chauffant la pierre, elle agit comme un grill authentique.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec robinets en laiton, équipés de positions de réglage maximum, minimum et pilote. Avec bobine de sécurité et thermocouple.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec allumage piézo-électrique.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Ils sont équipés de grilles formées de profilés en «V», toujours en acier inoxydable de 400 mm. large (une ou deux unités, selon le
        modèle), idéal pour les viandes, les légumes, etc. Dans ACCESSOIRES, vous pouvez voir en option des grilles spéciales pour le poisson
        (construites avec des profils ronds)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec un système qui permet de placer un gril dans 2 positions, en utilisant les poignées en bakélite disponibles sur le gril et avec
        un bavoir autour du gril pour éviter les éclaboussures.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec tiroir de récupération des graisses.
      estil:
        color: '#000000'
        mida: 10.2
    - role: titol
      text: SUPPORTS OUVERTS OU DE PORTE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.2
    - role: text
      text: Les frytops qui fonctionnent sur un support ouvert, ont une étagère inférieure.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: OPTIONNELLEMENT, les portes peuvent être placées, qui sont réversibles. (Cod. 4A200913) que vous trouverez dans ACCESSOIRES.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Les barbecues à gaz ont des portes standard.
      estil:
        color: '#000000'
        mida: 10.2
