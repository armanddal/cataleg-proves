  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable, intérieur et extérieur. Comptoirs de 2 mm. épais Jambes réglables dans tous les appareils. FRITEUSES
        À GAZ ET ÉLECTRIQUES Toutes les friteuses avec des paniers en acier chromé et des couvercles avec poignée. Friteuses sur pied, équipées
        de porte/s en standard. Avec des cuves entièrement soudées au comptoir, intégrées pour faciliter le nettoyage et éviter le débordement
        de l'huile. 1 Avec grille perforée pour éviter de déposer de la nourriture au fond. Les friteuses sur support portent le robinet de vidange
        dans la zone inférieure et sont équipées d'un réservoir pour vider l'huile, avec un filtre pour retenir les impuretés. Avec zone froide
        généreuse, ce qui augmente la durée de l'huile. Modèles à gaz, avec un réservoir propre, sans tubes, uniquement les protecteurs des ampoules
        des thermostats 2 Avec des brûleurs en acier inoxydable, situés sous le réservoir et isolés dans la chambre de combustion. Sur demande
        expresse, les friteuses à gaz peuvent être fournies avec des tubes d'échange de chaleur à l'intérieur du / des réservoir (s), sans variation
        de prix. Dans ce cas, les brûleurs sont en fonte, de type torche, avec la même puissance, que le bol propre. Avec vanne thermostatique
        et pilote de maintenance. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Modèles électriques sur support, avec
        un réservoir très facile à nettoyer, pour avoir un mécanisme, de sorte que les résistances puissent tourner, en position verticale. 3
        Toutes les résistances sont en acier inoxydable blindé. Avec thermostat et indicateur de fonctionnement de la veilleuse. Avec thermostat
        de sécurité qui arrête la friteuse en cas d’augmentation anormale de la température de l’huile. OPTIONNELLEMENT, sur demande, avec contrôle
        électronique de la température (friteuses électriques uniquement sur pied). Voir ACCESSOIRES. 4 RÉSERVES POUR FRITES ÉLECTRIQUES Ils sont
        fabriqués, sur table ou sur support ouvert. Équipé d'un bol GN 1 / 1-150, avec double fond perforé et incurvé pour faciliter la collecte
        des aliments frits, tous amovibles pour le nettoyage. Avec une résistance en céramique, situé sur l'écran supérieur. 5 Équipé d'un régulateur
        d'énergie, pour ajuster la température désirée et l'indicateur de fonctionnement du pilote. BAINS-MARIE ÉLECTRIQUES Ils sont fabriqués,
        sur table ou sur support ouvert. Avec les réservoirs, pour mettre 4 ou 8 GN 1/3 selon le modèle, soudé au comptoir, avec tous les bords
        intérieurs arrondis. 6 Avec robinet de vidange, situé à l'avant, avec dispositif de sécurité, pour empêcher toute ouverture accidentelle.
        Équipé d'une résistance adhésive, situé au bas de la cuve, de sorte que l'intérieur de celle-ci soit parfaitement propre. Équipé d'un
        thermostat et d'un indicateur de fonctionnement de la veilleuse. OPTIONNELLEMENT, nous avons un fond en acier inoxydable double perforé,
        voir dans ACCESSOIRES, pour le maintien de la nourriture dans des pots, directement. Ou s'ils le souhaitent, ils peuvent placer différentes
        combinaisons de conteneurs GN. (Voir catalogue GROUPE 16) CUISEUR A PÂTES À GAZ ET ÉLECTRIQUES SUR SUPPORT Ils sont fabriqués avec 1 réservoir
        ou 2 réservoirs. Les supports sont équipés de porte / s en standard. Avec les cuves GN 1/1, en acier inoxydable AISI 316, soudées au plan
        de travail intégré, facilitant le nettoyage. 7 Avec grille perforée pour éviter que les aliments ne tombent au fond. Il dispose de 7 robinets
        de remplissage et de vidange. Avec trop-plein pour éviter le déversement d'eau et en même temps l'évacuation de l'amidon de la pâte, qui
        flotte. Modèles à gaz, avec brûleur tubulaire en acier inoxydable Avec robinet en laiton, équipé de positions de réglage maximum, minimum
        et pilote. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Modèles électriques, équipés d'une résistance en acier
        inoxydable, blindés. Equipé d'interrupteur-thermostat et d'opération pilote. EN OPTION, peut être demandé avec contrôle électronique de
        la température. 4 De même, nous avons des paniers perforés avec poignée / s entièrement en acier inoxydable. Voir dans ACCESSOIRES. 8
      estil:
        color: '#000000'
        mida: 9.7
