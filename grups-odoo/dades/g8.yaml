      text: Disponen de humidificador regulable, especialmente importante para la cocción de pan y bollería.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puertas pivotantes, dotadas de bisagras reforzadas, que se bloquean cuando superan los 95°.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dichas puertas con doble cristal templado, pudiendo abrir el interno para su limpieza y con una bandeja para la recogida de agua condensada
        en le cristal, para evitar que caiga al suelo, cuando se abre la puerta.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Marcos de los hornos con burlete de silicona, con cámara de aire, para asegurar el cierre hermético y evitar fugas de calor y vapor.
        Fácilmente substituible.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Guías para latas EN o recipientes GN, indistintamente. Separación entre guías 65 mm. Opcionalmente, están disponibles las guías laterales
        con mayor distancia entre ellas, de 90 mm.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bajo pedido, se pueden suministrar con ducha de lavado. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 2. A GAS O ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Son a convección, con panel mecánico.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con motores-ventiladores, con dos velocidades, con inversor de giro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 5. A GAS O ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Pueden funcionar a convección, con aire caliente, o mixtos, con vapor, según se seleccione.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con pantalla táctil (TOUCH SCREEN), de 7 pulgadas. Programable.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con recetas cargadas mediante USB.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Motores-ventiladores controlados electrónicamente, con 3 velocidades, con inversor de giro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, pueden trabajar con sonda al corazón. (Ver ACCESORIOS)
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cocción Delta T, para conseguir cocciones homogéneas, debido al control entre la temperatura interna del producto y la de la cámara
        de cocción. Muy importante, cuando se trata de piezas de gran tamaño, que necesitan una cocción lenta. Imprescindible disponer de sonda
        al corazón.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Los modelos “W”, con lavado automático, con 4 programas. El detergente desengrasante recomendado. (Ver ACCESORIOS).
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: A petición expresa, se puede suministrar la Serie 5, con los mandos a la derecha, sin cargo adicional.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
