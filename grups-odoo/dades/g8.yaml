      - role: titol
        text: PRECIOS
      - role: titol
        text: Los precios de la presente tarifa son P.V.P. (Impuestos no incluidos - IVA)
    icona: assets/g8/condicions-icona-p55-1.png
  - pos:
      x: 2.5
