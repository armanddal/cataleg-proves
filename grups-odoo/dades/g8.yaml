  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.6
    - role: text
      text: Exterior and interior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: With 4 adjustable legs.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Pivoting doors, equipped with reinforced hinges, which lock when they exceed 95°.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: These doors with double tempered glass, being able to open the internal one for cleaning □ and with a tray for collecting condensed
        water on the glass, to prevent it from falling to the ground when the door is opened. □
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Furnace frames with silicone weatherstripping, with air chamber, to ensure the hermetic seal and avoid heat and steam leaks. Easily
        replaceable. □
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: GN container guides, easily removable for easy cleaning.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Separation between guides 72 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, they can be supplied with a washing shower, with a retractable hose. □ (See ACCESSORIES), except models with trolley,
        which is supplied.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: It can operate as convection, hot air, steam only, or mixed convection-steam, as selected.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: With 7 inch TOUCH SCREEN. Programmable, with capacity for 99 recipes with 9 cooking phases for each one. □
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: With recipes loaded via USB. □
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Humidity control, especially important for cooking vegetables, fish, etc. As for bread or pastries ...
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Electronically controlled fan motors with 6 speeds, with reversal of rotation. □
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: With led light, located on the door itself and timed.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Optionally, they can work with a probe to the heart. □ (See ACCESSORIES).
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Delta T cooking, to achieve homogeneous cooking due to the control between the internal temperature of the product and the cooking
        chamber. Very important, when it comes to large pieces that need slow cooking. It is essential to have a heart probe.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Ideal for use as a chickens roaster, using special racks for it. □ (See ACCESSORIES).
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: With automatic washing, with 4 programs. The recommended degreasing detergent. □ (See ACCESSORIES).
      estil:
        color: '#000000'
        mida: 13.6
    - role: titol
      text: GAS MODELS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.6
    - role: text
      text: With the PREMIX burner system, high efficiency and maximum performance. □
      estil:
        color: '#000000'
        mida: 13.6
