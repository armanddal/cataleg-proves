    titol:
      es: HORNOS CONVECCIÓN Y MIXTOS - VAPOR DIRECTO, GAS Y ELÉCTRICOS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Exterior e interior en acero inoxidable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con 4 patas regulables.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puertas pivotantes, dotadas de bisagras reforzadas, que se bloquean cuando superan los 95°.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dichas puertas con doble cristal templado, pudiendo abrir el interno para su limpieza y con una bandeja para la recogida de agua condensada
        en le cristal, para evitar que caiga al suelo, cuando se abre la puerta.
      refs:
      - 1
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Marcos de los hornos con burlete de silicona, con cámara de aire, para asegurar el cierre hermético y evitar fugas de calor y vapor.
        Fácilmente substituible.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Guías para recipientes GN, fácilmente desmontables para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Separación entre guías 72 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, se pueden suministrar con ducha de lavado, con manguera retráctil. (Ver ACCESORIOS), excepto modelos con carro, que
        va en dotación.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puede funcionar como convección, con aire caliente, sólo con vapor, o mixtos convección-vapor, según se seleccione.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con PANTALLA TÁCTIL (TOUCH SCREEN) de 7 pulgadas. Programable, con capacidad para 99 recetas con 9 fases de cocción para cada una.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con recetas cargadas mediante USB.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Control de humedad, especialmente importante tanto para la cocción de verduras, pescados, etc. Como para el pan o bollería...
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Motores-ventiladores controlados electrónicamente, con 6 velocidades, con inversión de giro.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con luz led, situada en la propia puerta y temporizada.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, pueden trabajar con sonda al corazón. (Ver ACCESORIOS).
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cocción Delta T, para conseguir cocciones homogéneas debido al control entre la temperatura interna del producto y la cámara de cocción.
        Muy importante, cuando se trata de piezas de gran tamaño, que necesitan una cocción lenta. Imprescindible disponer de sonda al corazón.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Ideal, para su uso como asador de pollos, utilizando para ello las rejillas especiales. (Ver ACCESORIOS).
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con lavado automático, con 4 programas. El detergente desengrasante recomendado. (Ver ACCESORIOS).
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MODELOS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con el quemador sistema PREMIX, de alta eficiencia y máximo rendimiento.
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.25
      w: 19.0
      h: 24.7
