  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: HORNOS ESTÁTICOS A GAS Construcción en acero inoxidable 18/10 AISI-304. Con patas regulables. Con quemadores tubulares debajo de la
        plancha del horno. Con encendido piezo-eléctrico. Puertas con bisagras reforzadas, con cierre a presión mediante muelle. Interior hornos
        en acero inoxidable. Marcos dotados de junta, con cámara de aire, de acero inoxidable AISI-304, trenzado, con fibra de vidrio, FIBERGLASS,
        resistente a altas temperaturas. (Hasta 540 ºC), para evitar la pérdida de calor. Puertas y contra-puertas, embutidas, de acero inoxidable
        AISI-304, debidamente aisladas, con fibra de vidrio. Con tirador. □ Con válvula termostática y piloto de mantenimiento, con bobina de
        seguridad y termopar. Como dotación equipan una rejilla. HORNOS ESTÁTICOS ELÉCTRICOS CON GRILL Construcción en acero inoxidable 18/10
        AISI-304, exterior e interior. Con patas regulables. Marcos dotados de junta, con cámara de aire, de acero inoxidable AISI-304, trenzado,
        con fibra de vidrio, FIBERGLASS, resistente a altas temperaturas. (Hasta 540 ºC), para evitar la pérdida de calor. Puertas con bisagras
        reforzadas, con cierre a presión mediante muelle. Puertas y contra-puertas, embutidas, de acero inoxidable AISI-304, debidamente aisladas,
        con fibra de vidrio. Con tirador. □ Con resistencias blindadas debajo de la plancha del horno, controladas por un termostato y piloto
        indicador de funcionamiento. Asimismo, disponen de grill eléctrico, compuesto de otra resistencia de acero inoxidable, blindada, de funcionamiento
        independiente, con un conmutador y piloto indicador de funcionamiento. □ Como dotación equipan una rejilla GN 2/1 de 530x650 mm. CONSTRUCCIÓN
        GENERICA HORNOS A PIZZAS Exterior, frontal de acero inoxidable. Resto en acero pintado en epoxi. Interior de chapa aluminizada. Con puertas,
        exterior e interior, de acero inoxidable, contra-balanceadas, equipadas de cristal templado, para el control de la pizza, durante la cocción.□
        Con luz interior. □ Superficie de cocción de las cámaras de piedra refractaria.□ HORNOS DE PIZZAS A GAS Se fabrican con una cámara, pero,
        opcionalmente, mediante una conexión de las salidas de humos, se puede colocar otro horno en la parte superior. □ (ver ACCESORIOS). Con
        quemadores tubulares, situados debajo de la piedra refractaria, los cuales, debido al diseño de la cámara, generan una convección natural
        para la cocción de las pizzas, tanto en la parte inferior como la superior, pudiendo controlar la temperatura independientemente. □ Para
        pizzas de hasta 300 mm. Ø, ó latas EN de 400x600. Con válvulas termostáticas, con bobina de seguridad, termopar y piloto de mantenimiento.
        Con encendido piezo-eléctrico. Con termómetro digital, indicador de la temperatura, hasta 450ºC. HORNOS DE PIZZAS ELÉCTRICOS Con resistencias
        de acero inoxidable, blindadas, debajo la superficie de cocción o techo. □ Con 2 termostatos independientes por cámara, con sendos pilotos
        indicadores de funcionamiento. Para pizzas de hasta 360 mm Ø MODELOS 51G10012 (1 cámara/1 pizza) y 51G20012 (2 cámaras/1+1 pizza) Ideales
        como complemento para bares, por su reducido espacio. Se pueden colocar sobre un estante mural. Rango de temperatura 320°C MODELOS 51100121
        (1 cámara/2 pizzas) y 51200121 (2 camaras/2+2 pizzas) Con los mandos en la parte inferior, □ con el fin de ocupar menos longitud. Adecuados
        para Snacks, para poder completar los menús. Rango de temperatura 400°C También disponen de capacidad para latas EN de 400x600, y así
        poder hacer pan o asados. El modelo 51200121, dispone de dos cámaras, pero con 3 resistencias. La central funciona para la dos, pudiendo
        cocinar en una y calentar en la otra. □ RESTO DE MODELOS Disponen de capacidad para latas EN de 400x600 Con termómetro analógico para
        control de temperatura. □ Rango de temperatura 450°C
