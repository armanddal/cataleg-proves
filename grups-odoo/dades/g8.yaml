    - role: titol
      text: MESAS Y ARMARIOS SOPORTE HORNOS / CARROS HORNOS 20 GN / ARMARIOS DE FERMENTACIÓN / MANTENEDORES-REGENERADORES ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA Exterior e interior en acero inoxidable 18/10 AISI-304. Con patas regulables. MESAS SOPORTE HORNOS O REGENERADORES
        Con guias para almacenar utensilios EN ó GN. □ Opcionalmente se pueden colocar 4 ruedas, 2 de ellas con freno. (Ver ACCESORIOS) ARMARIOS
        SOPORTE HORNOS Cerrados, con laterales y trasero inox. Modelos con guías para almacenar utensilios EN ó GN. □ Modelos, con estante intermedio,
        regulable en altura mas la base. Y puertas correderas. □ Opcionalmente se pueden colocar 4 ruedas, 2 de ellas con freno. (Ver ACCESORIOS)
        CARROS PARA HORNOS DE 20 GN Con 4 ruedas, 2 de ellas con freno. Con 20 pares de guías para colocar los recipientes GN. Con asa extraíble,
        para su conducción e introducción o extracción del horno. Dotados de bandeja para recoger los líquidos, y así evitar su caída al suelo,
        cuando se extraen del horno. Una unidad, va en dotación, con el horno, pero se pueden solicitar mas carros, para la cocción en serie,
        o el abatimiento de temperatura y posteriormente el almacenaje en cámaras frigoríficas. ARMARIOS DE FERMENTACIÓN Con guías para utensilios
        EN. □ Calor por medio de resistencias blindadas de acero inoxidable. Controlados por termostato de 0 a 85ºC y piloto indicador de funcionamiento.
        Con puertas de cristal templado. Equipados con bandeja para agua, y así producir humedad. □ MODELO 80839169 Con puertas de acero inoxidable.
        MODELO 80939169 Con motor-ventilador, para mejor reparto del calor, en el interior de la cámara. Con mecanismo para la pulverización de
        agua y así crear humedad. MODELO 80606017 Con termómetro-termostato, electrónico digital. Con mecanismo para el llenado del depósito del
        agua, por medio de un pulsador. MANTENEDORES/REGENERADORES DE TEMPERATURA La regeneración de alimentos se puede hacer desde +2º ó -18ºC.
        Gracias al sistema rápido de regeneración, se consigue la seguridad higiénica de los alimentos preparados y enfriados anteriormente. Dotados
        de motores-ventiladores, con inversor de giro, que aseguran la igualdad de temperatura en el interior de la cámara. □ Con resistencias
        blindadas, de acero inoxidable, las cuales son de forma circular, alrededor del ventilador. Con termostato analógico y piloto indicador
        de funcionamiento. Con termostato de seguridad. Equipados con un interruptor/selector, de la temperatura deseada +140 ó +160°C. Con avisador
        acústico de fin de ciclo. Equipado con micro en la puerta, que pára el funcionamiento, cuando se abre la misma. Con puerta de acero inoxidable,
        debidamente aislada, con cierre a presión. Marco con burlete de silicona, para asegurar el cierre hermético y evitar fugas de calor. Fácilmente
        substituible. □
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 3.25
      w: 19.0
      h: 24.7
