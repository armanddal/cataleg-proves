    titol:
      en: CONVECTION AND MIXED OVENS - DIRECT, ELECTRIC STEAM
      fr: FOURS À CONVECTION ET MIXTES - VAPEUR DIRECTE, ÉLECTRIQUES
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Exterior and interior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With 4 adjustable legs.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: The Mini series are ovens designed to optimize space, and are ideal in small kitchens. Only 520 mm. Wide.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Pivoting doors, equipped with reinforced hinges, which lock when they exceed 95 °, and reversible.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: These doors with double tempered glass, being able to open the internal one for cleaning and with a tray for collecting condensed
        water on the glass, to prevent it from falling to the ground when the door is opened.
      refs:
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Furnace frames with silicone weatherstripping, with air chamber, to ensure the hermetic seal and avoid heat and steam leaks. Easily
        replaceable.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: GN 1/1 container guides, easily removable for easy cleaning.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Separation between guides 65 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, they can be supplied with a washing shower. (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: It can operate as convection, hot air, steam only, or mixed convection-steam, as selected.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With touch screen (TOUCH SCREEN), 7 inches. Programmable, with capacity for 99 recipes with 9 cooking phases for each one.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With recipes loaded via USB.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Humidity control, especially important for cooking vegetables, fish, etc. As for bread or pastries ...
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Electronically controlled fan motors with 3 speeds, with reversal of rotation.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With automatic washing, with 4 programs. The recommended degreasing detergent. (See ACCESSORIES).
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With led light, located on the door itself and timed.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, they can work with a probe to the heart. (See ACCESSORIES)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Delta T cooking, to achieve homogeneous cooking due to the control between the internal temperature of the product and the cooking
        chamber. Very important, when it comes to large pieces that need slow cooking. It is essential to have a heart probe.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.25
      w: 9.35
      h: 24.7
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.6
    - role: text
      text: Extérieur et intérieur en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Avec 4 pieds réglables.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Les séries Mini sont des fours conçus pour optimiser l'espace et sont idéales dans les petites cuisines. Seulement 520 mm. large.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Portes pivotantes, équipées de charnières renforcées, qui se verrouillent lorsqu'elles dépassent 95 °, et réversible.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Ces portes en verre trempé double, pouvant ouvrir la porte intérieure pour le nettoyage et avec un bac pour recueillir l'eau condensée
        sur la vitre, pour éviter qu'elle ne tombe au sol lors de l'ouverture de la porte.
      refs:
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Cadres de four avec coupe-froid en silicone, avec chambre à air, pour assurer l'étanchéité et éviter les fuites de chaleur et de vapeur.
        Facilement remplaçable.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Guides de récipients GN 1/1, facilement amovibles pour un nettoyage facile.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Séparation entre guides 65 mm.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: En option, ils peuvent être fournis avec une douche de lavage. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Il peut fonctionner comme convection, air chaud, vapeur uniquement ou vapeur convection mixte, selon la sélection.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Avec écran tactile (ÉCRAN TACTILE), 7 pouces. Programmable, avec une capacité de 99 recettes avec 9 phases de cuisson pour chacune.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Avec des recettes chargées via USB.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Contrôle de l'humidité, particulièrement important pour la cuisson des légumes, du poisson, etc. Quant au pain ou aux pâtisseries
        ...
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Moteurs de ventilateur à commande électronique à 3 vitesses, avec inversion de rotation.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Avec lavage automatique, avec 4 programmes. Le détergent dégraissant recommandé. (voir ACCESSOIRES).
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Avec lumière LED, située sur la porte elle-même et chronométrée.
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: En option, ils peuvent travailler avec une sonde au cœur. (voir ACCESSOIRES)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 13.6
    - role: text
      text: Cuisson Delta T, pour obtenir une cuisson homogène grâce au contrôle entre la température interne du produit et la chambre de cuisson.
        Très important, lorsqu'il s'agit de gros morceaux qui nécessitent une cuisson lente. Il est essentiel d'avoir une sonde cardiaque.
      estil:
        color: '#000000'
        mida: 13.6
