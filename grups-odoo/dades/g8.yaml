        color: '#000000'
        mida: 12.9
    - role: text
      text: Portes pivotantes, équipées de charnières renforcées, qui se verrouillent lorsqu'elles dépassent 95°.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Lesdites portes sont en verre trempé double, pouvant ouvrir l'intérieur pour le nettoyage □ et avec un bac pour recueillir l'eau condensée
        sur le verre, pour l'empêcher de tomber au sol lors de l'ouverture de la porte.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Cadres de four avec coupe-froid en silicone, avec chambre à air, pour assurer l'étanchéité hermétique et éviter les fuites de chaleur
        et de vapeur. Facilement remplaçable. □
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Guides pour boîtes EN ou conteneurs GN, interchangeables. Séparation entre guides 65 mm. En option, les guides latéraux avec une plus
        grande distance entre eux sont disponibles, de 90 mm. □
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Sur demande, ils peuvent être fournis avec une douche de lavage. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 12.9
    - role: titol
      text: SÉRIE 2. A GAZ OU ÉLECTRIQUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.9
    - role: text
      text: Ils sont à convection, avec un panneau mécanique. □
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Avec moteurs-ventilateurs, à deux vitesses, avec inverseur.
      estil:
        color: '#000000'
        mida: 12.9
    - role: titol
      text: SÉRIE 5. A GAZ OU ÉLECTRIQUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.9
    - role: text
      text: Ils peuvent fonctionner à convection, à air chaud ou mélangés à de la vapeur, selon le choix.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Avec écran tactile (ÉCRAN TACTILE), 7 pouces. Programmable. □
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Avec des recettes chargées via USB.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Motoventilateurs à commande électronique, à 3 vitesses, avec inverseur de rotation.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: En option, ils peuvent travailler avec une sonde au cœur. □ (voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Cuisson Delta T, pour obtenir une cuisson homogène, grâce au contrôle entre la température interne du produit et celle de la chambre
        de cuisson. Très important, lorsqu'il s'agit de gros morceaux qui nécessitent une cuisson lente. Il est essentiel d'avoir une sonde au
        coeur.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Les modèles «W», avec lavage automatique, avec 4 programmes. Le détergent dégraissant recommandé. □ (Voir ACCESSOIRES).
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Sur demande expresse, la série 5 peut être fournie, avec les commandes à droite, sans frais supplémentaires. □
      estil:
        color: '#000000'
        mida: 12.9
