- id: p15
  n: 15
  tipus: informacio_general
  capcalera:
    banda: assets/g8/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: SERIE / MINI
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.275
    titol:
      es: HORNOS CONVECCIÓN Y MIXTOS - VAPOR DIRECTO, ELÉCTRICOS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Exterior e interior en acero inoxidable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con 4 patas regulables.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La serie Mini, son unos hornos diseñados para optimizar el espacio, y es ideal, en cocinas pequeñas. Sólo 520 mm. de ancho.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puertas pivotantes, dotadas de bisagras reforzadas, que se bloquean cuando superan los 95°, y reversibles.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dichas puertas con doble cristal templado, pudiendo abrir el interno para su limpieza y con una bandeja para la recogida de agua condensada
        en le cristal, para evitar que caiga al suelo, cuando se abre la puerta.
      refs:
      - 2
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Marcos de los hornos con burlete de silicona, con cámara de aire, para asegurar el cierre hermético y evitar fugas de calor y vapor.
        Fácilmente substituible.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Guías para recipientes GN 1/1, fácilmente desmontables para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Separación entre guías 65 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, se pueden suministrar con ducha de lavado. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puede funcionar como convección, con aire caliente, sólo con vapor, o mixtos convección-vapor, según se seleccione.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con pantalla táctil (TOUCH SCREEN), de 7 pulgadas. Programable, con capacidad para 99 recetas con 9 fases de cocción para cada una.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con recetas cargadas mediante USB.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Control de humedad, especialmente importante tanto para la cocción de verduras, pescados, etc. Como para el pan o bollería...
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Motores-ventiladores controlados electrónicamente, con 3 velocidades, con inversión de giro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con lavado automático, con 4 programas. El detergente desengrasante recomendado. (Ver ACCESORIOS).
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con luz led, situada en la propia puerta y temporizada.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, pueden trabajar con sonda al corazón. (Ver ACCESORIOS)
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cocción Delta T, para conseguir cocciones homogéneas debido al control entre la temperatura interna del producto y la cámara de cocción.
        Muy importante, cuando se trata de piezas de gran tamaño, que necesitan una cocción lenta. Imprescindible disponer de sonda al corazón.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 1.0
      y: 3.25
      w: 19.0
      h: 24.7
