  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: □ TABLES AND CABINETS OVEN SUPPORT / 20 GN OVEN TROLLEYS / FERMENTATION CABINETS / ELECTRIC REGENERATING-CONSERVATORS □ TABLES ET
        ARMOIRES SUPPORT DE FOUR / CHARIOTS DE FOUR 20 GN / ARMOIRES DE FERMENTATION / CONSERVATEURS-RÉGÉNÉRATEURS ÉLECTRIQUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERIC CONSTRUCTION Exterior and interior in 18/10 AISI-304 stainless steel. With adjustable legs. TABLES SUPPORTING OVENS OR REGENERATORS
        With guides to store EN or GN utensils. □ Optionally 4 wheels can be placed, 2 of them with brakes. (See ACCESSORIES) OVEN SUPPORT CABINETS
        Closed, with stainless steel sides and rear. Models with guides to store EN or GN utensils. □ Models, with intermediate shelf, adjustable
        in height plus the base. And sliding doors. □ Optionally 4 wheels can be placed, 2 of them with brakes. (See ACCESSORIES) TROLLEYS FOR
        20 GN OVENS With 4 wheels, 2 of them with brakes. With 20 pairs of guides to place the GN containers. With removable handle, for its conduction
        and introduction or extraction from the oven. Equipped with a tray to collect liquids, and thus avoid falling to the ground, when they
        are removed from the oven. One unit is supplied with the oven, but more trolleys can be requested, for series cooking, or the lowering
        of temperature and later storage in cold chambers. FERMENTATION CABINETS With guides for EN or GN utensils. □ Heat through stainless steel
        armored resistors. Controlled by thermostat from 0 to 85ºC and pilot indicator of operation. With tempered glass doors. Equipped with
        a water tray to produce humidity. □ MODEL 80939159 With stainless steel doors. MODEL 80939169 With motor-fan, for better distribution
        of heat, inside the chamber. With mechanism for spraying water and thus creating humidity. MODEL 80606017 With thermometer-thermostat,
        digital electronic. With mechanism for filling the water tank, by means of a button. TEMPERATURE HOLDERS / REGENERATORS Food regeneration
        can be done from + 2º or -18ºC. Thanks to the rapid regeneration system, the hygienic safety of previously prepared and cooled foods is
        achieved. Equipped with motor-fans, with rotation inverter, which ensure temperature equality inside the chamber. □ With stainless steel
        armored resistors, which are circular in shape, around the fan. With analog thermostat and pilot indicator light. With safety thermostat.
        Equipped with a switch / selector, of the desired temperature +140 or + 160°C. With acoustic end-of-cycle warning. Equipped with micro
        in the door, to stop the operation, when the door is opened. With stainless steel door, properly insulated, with snap closure. Frame with
        silicone weatherstrip, to ensure the hermetic seal and avoid heat leakage. Easily replaceable. □
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 3.25
      w: 9.35
      h: 24.7
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION GÉNÉRIQUE Extérieur et intérieur en acier inoxydable 18/10 AISI-304. Avec pieds réglables. TABLES SUPPORT DES FOURS OU
        DES RÉGÉNÉRATEURS Avec des guides pour ranger les ustensiles EN ou GN. □ En option, 4 roues peuvent être placées, dont 2 avec freins.
        (Voir ACCESSOIRES) ARMOIRES DE SUPPORT DE FOUR Fermé, avec côtés et arrière en acier inoxydable. Modèles avec guides pour ranger les ustensiles
        EN ou GN. □ Modèles, avec étagère intermédiaire, réglable en hauteur plus la base. Et des portes coulissantes. □ En option, 4 roues peuvent
        être placées, dont 2 avec freins. (Voir ACCESSOIRES) CHARIOTS POUR FOURS 20 GN Avec 4 roues, dont 2 avec freins. Avec 20 paires de guides
        pour placer les conteneurs GN. Avec poignée amovible, pour sa conduction et son introduction ou son extraction du four. Equipé d'un plateau
        pour collecter les liquides, et ainsi éviter de tomber au sol, lorsqu'ils sont retirés du four. Une unité est fournie avec le four, mais
        plus de chariots peuvent être demandés, pour la cuisson en série, ou l'abaissement de la température et le stockage ultérieur dans des
        chambres froides. ARMOIRES DE FERMENTATION Avec guides pour ustensiles EN ou GN. □ Chaleur à travers des résistances blindées en acier
        inoxydable. Contrôlé par thermostat de 0 à 85ºC et indicateur pilote de fonctionnement. Avec portes en verre trempé. Equipé d'un bac à
        eau pour produire de l'humidité. □ MODÈLE 80939159 Avec portes en acier inoxydable. MODÈLE 80939169 Avec moteur-ventilateur, pour une
        meilleure répartition de la chaleur, à l'intérieur de la chambre. Avec mécanisme pour pulvériser de l'eau et créer ainsi de l'humidité.
        MODÈLE 80606017 Avec thermomètre-thermostat, électronique numérique. Avec mécanisme de remplissage du réservoir d'eau, au moyen d'un bouton.
        MAINTENEURS DE LA TEMPÉRATURE / RÉGÉNÉRATEURS La régénération des aliments peut se faire à partir de + 2º ou -18ºC. Grâce au système de
        régénération rapide, la sécurité hygiénique des aliments préalablement préparés et refroidis est atteinte. Équipé de moteurs-ventilateurs,
        avec inverseur de rotation, qui assurent l'égalité de température à l'intérieur de la chambre. □ Avec des résistances blindées en acier
        inoxydable, de forme circulaire, autour du ventilateur. Avec thermostat analogique et voyant lumineux. Avec thermostat de sécurité. Equipé
        d'un interrupteur / sélecteur, de la température souhaitée +140 ou + 160°C. Avec avertissement acoustique de fin de cycle. Equipé de micro
        dans la porte, pour arrêter le fonctionnement, lorsque la porte est ouverte. Avec porte en acier inoxydable, correctement isolée, avec
        fermeture à pression. Cadre avec joint d'étanchéité en silicone, pour assurer l'étanchéité et éviter les fuites de chaleur. Facilement
        remplaçable. □
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 10.65
      y: 3.25
      w: 9.35
      h: 24.7
