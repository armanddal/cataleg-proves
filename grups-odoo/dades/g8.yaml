    banda: assets/g8/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: □ FOURS DE BRASA, AVEC CHARBON VÉGÉTAL, COULEUR NOIRE, ACIER INOXYDABLE OU AVEC PORTE EN VERRE ET TABLES CHARBONNIÈRES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: titol
      text: UN FOUR À CHARBON VEGETALE OU DE PETITS MORCEAUX DE BOIS DE FEU, OFFRE LA SAVEUR AUTHENTIQUE DE BRASA, AVEC SON ARÔME, JUICY ET TEXTURE
        POUR GOÛTER, PARFAIT ... À TOUS LES TYPES DE NOURRITURE, COMME VIANDE, POISSON, LÉGUMES, etc. AVEC L'AVANTAGE, IL PEUT ÊTRE INSTALLÉ À
        L'INTÉRIEUR DE TOUTE CUISINE, SANS AVOIR À SUPPORTER LES HAUTES TEMPÉRATURES, QUI LIBÈRENT LES BARBECUES OUVERTES. ET AUSSI AVEC UNE CONSOMMATION
        MINIMALE DE CHARBON, SI LES DEUX SYSTÈMES BRASA SONT COMPARÉS. CONSTRUCTION GÉNÉRIQUE DES FOURS Intérieur en fonte, pour résister à des
        températures de 350º C. Avec pieds réglables. Isolation avec un véritable système de refroidissement, qui réduit la température extérieure
        et la consommation de charbon, jusqu'à 25%, par rapport aux autres fours. Avec 7 paires de guides latéraux pour placer la grille dans
        la position souhaitée. Vous pouvez travailler avec deux grilles en même temps, à différents niveaux, augmentant ainsi la production. □
        En option, vous pouvez mettre un séparateur, de sorte que vous pouvez placer des demi-grilles, de différents modèles. □ (voir ACCESSOIRES)
        Ils sont fournis avec un grill, pour un usage général (viande, poisson, légumes ...) mais en option, nous avons des grilles côtelées,
        type tuile, idéales pour les viandes grasses (agneau, poulet, canard ... ) et plaques. (Voir ACCESSOIRES) Ils disposent d'un canal de
        collecte des huiles et graisses qui sont déposées dans un tiroir d'extraction frontal. □ De toute évidence, ils ne sont collectés que
        lors de l'utilisation de la grille nervurée ou de la plaque. Standard, avec régulateur d'air et pare-feu interne. □, ce qui permet de
        les placer sous la hotte. Cependant, dans la plupart des pays, ses réglementations exigent que la hotte aspirante soit indépendante des
        fumées des combustibles solides (bois de chauffage, charbon ...) et que le pare-flammes soit visible à l'extérieur du four. Dans un tel
        cas, vous trouverez LE KIT coupe-flamme externe. □ (voir ACCESSOIRES) Le charbon est déposé dans la trémie à charbon. □ Pour l'allumage,
        vous devez ouvrir le régulateur d'air, situé en haut, en déplacer la poignée vers la gauche, comme indiqué, □ et en même temps ouvrir
        le tirage inférieur, (tiroir à cendres), d'environ 8 cm. □, pour faciliter la circulation de l'air. Ensuite, fermez la porte du four et
        laissez le charbon s'enflammer et se stabiliser. Un poker est fourni, que nous utiliserons, pour bien répartir la braise dans le bac à
        charbon. Dans 30 minutes, le four sera en état d'utilisation. À ce stade, nous fermerons le tirage inférieur (tiroir à cendres) et placerons
        en même temps la poignée du régulateur d'air, en position droite. (CLOSE) Il est équipé d'un thermomètre analogique, □, d'une grande précision,
        pour connaître à tout moment la température de fonctionnement, et si nécessaire, ajouter plus de charbon, si la température baisse. Le
        four est maintenant prêt à fonctionner et vous pouvez placer les aliments sur le gril. Fourni avec une longue pince à épiler, 300 mm.,
        Avec laquelle nous pouvons tourner, puis extraire la nourriture. Dans ACCESSOIRES, vous trouverez des plaques, des grilles pour différents
        usages. Ainsi que des cages en inox pour rôtir des petits aliments (crevettes, champignons, légumes ...) et des cages à poisson qui s'ouvrent
        en deux et permettent de retourner les aliments. □ FOURS NOIRS AVEC PORTE EN VERRE PLIANT Extérieur construit en acier peint en noir,
        en époxy. Avec une porte pliante, avec double verre trempé, équipée de charnières robustes, qui permettent une ouverture à 90°, et avec
        une poignée en acier inoxydable. FOURS EN ACIER INOXYDABLE Extérieur en acier inoxydable. Avec une porte pliante, dont l'extérieur est
        en acier inoxydable, isolé avec de la fibre de verre, équipé de charnières robustes qui permettent une ouverture à 90° et d'une poignée.
        FOURS AVEC PORTE VITRÉE RÉLÉVABLE Extérieur en acier inoxydable. Equipé d'une porte, avec un système d'ouverture rélévable, ce qui représente
        un grand avantage, car lorsqu'il est ouvert, il ne perturbe pas le travail du cuisinier, car il est maintenu en haut. □ Avec verre panoramique,
        résistant aux températures élevées, qui vous permet de contrôler la cuisson des aliments, sans avoir besoin d'ouvrir la porte, avec l'économie
        de charbon qui en résulte, car il ne perd pas de température dans la chambre. Ledit verre, le lendemain, avant de commencer les travaux,
        peut être facilement nettoyé avec n'importe quel produit sur le marché. Et si le four fait face au public, ayant la porte vitrée, il offre
        une attraction, en voyant comment les aliments sont rôtis. En dotation, une table avant, □, est fournie, ce qui permet au cuisinier de
        placer plus facilement, sur le dessus, un plateau ou un autre récipient. Cette table agit comme un plateau et possède une grille amovible,
        de sorte que les huiles ou les graisses ne tombent pas sur le sol et sont faciles à nettoyer. L'ensemble de la table avant est amovible
        avec vos mains. TABLES CHARBONNIÈRES Renforcé, pour supporter le poids du four. Construit en acier peint en noir, en époxy. Equipé de
        4 roues très résistantes, dont 2 avec freins. En dotation, ils sont fournis avec une pelle pour charger le charbon dans le four.
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
