  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: FOURS À GAZ STATIQUES Construction en acier inoxydable 18/10 AISI-304. Avec pieds réglables. Avec brûleurs tubulaires sous la plaque
        du four. Avec allumage piézo-électrique. Portes avec charnières renforcées, avec fermeture à pression. Fours intérieurs en acier inoxydable.
        Cadres avec joint, avec chambre à air, en acier inoxydable AISI-304, tressé, avec fibre de verre, FIBERGLASS, résistant aux températures
        élevées. (Jusqu'à 540 ºC), pour éviter les pertes de chaleur. Portes et contre-portes incrustées en acier inoxydable AISI-304, dûment
        isolées, en fibre de verre. Avec poignée. □ Avec vanne thermostatique et pilote de maintenance, avec bobine de sécurité et thermocouple.
        Ils sont équipés d'une grille. FOURS ÉLECTRIQUES STATIQUES AVEC GRIL Construction en acier inoxydable 18/10 AISI-304, extérieur et intérieur.
        Avec pieds réglables. Cadres avec joint, avec chambre à air, en acier inoxydable AISI-304, tressé, avec fibre de verre, FIBERGLASS, résistant
        aux températures élevées. (Jusqu'à 540 ºC), pour éviter les pertes de chaleur. Portes avec charnières renforcées, avec fermeture à pression.
        Portes et contre-portes incrustées en acier inoxydable AISI-304, dûment isolées, en fibre de verre. Avec poignée. □ Avec éléments chauffants
        blindés sous la plaque du four, contrôlés par un thermostat et un voyant lumineux de fonctionnement. Ils ont également un gril électrique,
        composé d'une autre résistance en acier inoxydable, blindé, de fonctionnement indépendant, avec un interrupteur et un voyant lumineux
        pour le fonctionnement. □ Ils sont équipés d'une grille GN 2/1 de 530x650 mm. CONSTRUCTION GÉNÉRIQUE DE FOURS À PIZZA Extérieur, façade
        en acier inoxydable. Repos en acier peint époxy. Intérieur en tôle aluminisée. Avec portes, extérieur et intérieur, en acier inoxydable,
        à contrepoids, équipées de verre trempé, pour contrôler la pizza pendant la cuisson.□ Avec lumière intérieure. □ Surface de cuisson des
        chambres en pierre réfractaire □ FOURS À PIZZA À GAZ Ils sont fabriqués avec une chambre, mais, en option, en connectant les sorties de
        fumée, un autre four peut être placé sur le dessus. □ (voir ACCESSOIRES). Avec des brûleurs tubulaires, situés sous la pierre réfractaire,
        qui, en raison de la conception de la chambre, génèrent une convection naturelle pour la cuisson des pizzas, à la fois en bas et en haut,
        pouvant contrôler la température indépendamment. □ Pour pizzas jusqu'à 300 mm. Ø ou boîtes EN 400x600. Avec vannes thermostatiques, avec
        bobine de sécurité, thermocouple et pilote de maintenance. Avec allumage piézo-électrique. Avec thermomètre numérique, indicateur de température,
        jusqu'à 450ºC. FOURS À PIZZA ÉLECTRIQUES Avec éléments chauffants blindés en acier inoxydable, sous la surface de cuisson ou le plafond.
        □ Avec 2 thermostats indépendants par chambre, avec deux voyants de fonctionnement séparés. Pour pizzas jusqu'à 360 mm Ø MODÈLES 51G10012
        (1 chambre / 1 pizza) et 51G20012 (2 chambres / 1 + 1 pizza) Idéal en complément des bars, en raison de son petit espace. Ils peuvent
        être placés sur une étagère murale. Plage de température 320°C MODÈLES 51100121 (1 chambre / 2 pizzas) et 51200121 (2 chambres / 2 + 2
        pizzas) Avec les commandes en bas, □ afin de prendre moins de longueur. Convient pour les collations, pour pouvoir compléter les menus.
        Plage de température 400°C Ils ont également une capacité de boîtes EN de 400x600, de sorte qu'ils peuvent faire du pain ou des rôtis.
        Le modèle 51200121, possède deux chambres, mais avec 3 résistances. La centrale fonctionne pour les deux, pouvant cuisiner dans l'un et
        chauffer dans l'autre. □ RESTE DE MODÈLES Ils ont une capacité de boîtes EN de 400x600 Avec thermomètre analogique pour le contrôle de
        la température. □ Plage de température 450°C
