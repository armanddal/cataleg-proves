- id: p38
  n: 38
  tipus: informacio_general
  capcalera:
    banda: assets/g8/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: STATIC GAS OVENS 18/10 AISI-304 stainless steel construction. With adjustable legs. With tubular burners under the oven plate. With
        piezo-electric ignition. Doors with reinforced hinges, with snap-lock closure by spring. Interior stainless steel ovens. Frames with gasket,
        with air chamber, in AISI-304 stainless steel, braided, with FIBERGLASS, resistant to high temperatures. (Up to 540 ºC), to avoid heat
        loss. Inlaid doors and counter-doors in AISI-304 stainless steel, duly insulated, with fiberglass. With handle. □ With thermostatic valve
        and maintenance pilot, with safety coil and thermocouple. They are equipped with an grid. STATIC ELECTRIC OVENS WITH GRILL 18/10 AISI-304
        stainless steel construction, exterior and interior. With adjustable legs. Frames with gasket, with air chamber, in AISI-304 stainless
        steel, braided, with FIBERGLASS, resistant to high temperatures. (Up to 540 ºC), to avoid heat loss. Doors with reinforced hinges, with
        snap-lock closure by spring. Inlaid doors and counter-doors in AISI-304 stainless steel, duly insulated, with fiberglass. With handle.
        □ With armored heating elements under the oven plate, controlled by a thermostat and indicator light for operation. They also have an
        electric grill, made up of another stainless steel resistance, shielded, of independent operation, with a switch and indicator light for
        operation. □ They are equipped with a GN 2/1 grid of 530x650 mm. GENERIC CONSTRUCTION OF PIZZA OVENS Exterior, stainless steel front.
        Rest in epoxy painted steel. Aluminized sheet interior. With doors, exterior and interior, in stainless steel, counterbalanced, equipped
        with tempered glass, to control the pizza during cooking. □ With interior light. □ Cooking surface of the refractory stone chambers. □
        GAS PIZZA OVENS They are manufactured with a chamber, but, optionally, by connecting the smoke outlets, another oven can be placed on
        top. □ (see ACCESSORIES). With tubular burners, located under the refractory stone, which, due to the design of the chamber, generate
        a natural convection for cooking the pizzas, both at the bottom and the top, being able to control the temperature independently. □ For
        pizzas up to 300 mm. Ø, or 400x600 EN cans. With thermostatic valves, with safety coil, thermocouple and maintenance pilot. With piezo-electric
        ignition. With digital thermometer, temperature indicator, up to 450ºC. ELECTRIC PIZZA OVENS With stainless steel armored heating elements,
        below the cooking surface or ceiling. □ With 2 independent thermostats per chamber, with two separate indicator lights for operation.
        For pizzas up to 360 mm Ø MODELS 51G10012 (1 camera / 1 pizza) and 51G20012 (2 cameras / 1 + 1 pizza) Ideal as a complement to bars, due
        to its small space. They can be placed on a wall shelf. Temperature range 320°C MODELS 51100121 (1 chamber / 2 pizzas) and 51200121 (2
        cameras / 2 + 2 pizzas) With the controls at the bottom, □ in order to take up less length. Suitable for Snacks, to be able to complete
        the menus. Temperature range 400°C They also have capacity for EN cans of 400x600, so that they can make bread or roasts. Model 51200121,
        has two cameras, but with 3 resistances. The central works for both, being able to cook in one and heat in the other. □ REST OF MODELS
        They have capacity for EN cans of 400x600 With analog thermometer for temperature control. □ Temperature range 450°C
