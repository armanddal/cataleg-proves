- id: p46
  n: 46
  tipus: informacio_general
  capcalera:
    banda: assets/g8/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: □ CHARCOAL OVENS, WITH VEGETABLE CARBON, BLACK COLOR, STAINLESS STEEL OR WITH GLASS DOOR AND CARBON TABLES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: titol
      text: A VEGETABLE CHARCOAL OVEN OR SMALL PIECES OF FIREWOOD, OFFERS THE AUTHENTIC FLAVOR OF BRASA, WITH ITS AROMA, JUICY AND TEXTURE TO
        TASTE, PERFECT ... TO ALL KINDS OF FOOD, LIKE MEAT, FISH, VEGETABLES, etc. WITH THE ADVANTAGE, THAT IT CAN BE INSTALLED INSIDE ANY KITCHEN,
        WITHOUT HAVING TO SUPPORT THE HIGH TEMPERATURES, WHICH RELEASE THE OPEN BARBECUES. AND ALSO WITH A MINIMUM CONSUMPTION OF COAL, IF THE
        TWO BRASA SYSTEMS ARE COMPARED. GENERIC CONSTRUCTION OVENS Cast iron interior, to withstand temperatures of 350º C. With adjustable legs.
        Insulation with a genuine cooling system, which reduces the external temperature and the consumption of coal, up to 25%, in relation to
        other furnaces. With 7 pairs of lateral guides to place the grill in the desired position. You can work with two racks at the same time,
        at different levels, thereby increasing production. □ Optionally, you can put a separator, so that you can place half grills, of different
        models. □ (See ACCESSORIES) They are supplied with a rod grill, for general use (meat, fish, vegetables ...) but optionally, we have ribbed
        grills, tile-type, ideal for fatty meats (lamb, chicken, duck ... ) and plates. (See ACCESSORIES) They have a channel for collecting oils
        and fats, which are deposited in a front extraction drawer. □ Obviously, they are only collected when using the ribbed grill or the griddle.
        Standard, with air regulator and internal firewall. □, which allows them to be placed under the hood. However, in most countries, its
        regulations require that the extractor hood be independent for fumes from solid fuels (firewood, coal ...) and that the flame arrester
        is visible outside the oven. In such a case, you will find THE external flame cutter KIT. □ (See ACCESSORIES) The coal is deposited in
        the coal hopper. □ For ignition, the air regulator, located at the top, must be opened, moving the handle to the left, as indicated, □
        and at the same time open the lower draft, (ash drawer), about 8 cm . □, to facilitate air circulation. Next, close the oven door and
        let the charcoal ignite and stabilize. A poker is supplied, which we will use, to spread the ember well, throughout the coal bin. In 30
        minutes, the oven will be in use condition. At that time, we will close the lower draft (ash drawer) and at the same time place the air
        regulator handle, in the right position. (CLOSE) It is equipped with an analog thermometer, □, of great precision, to know at all times
        the working temperature, and if necessary, add more carbon, if the temperature drops. The oven is now ready to work, and you can place
        the food on the grill. Supplied with long tweezers, 300 mm., With which we can turn, and then extract the food. In ACCESSORIES, you will
        find plates, grills for various uses. As well as stainless steel cages for roasting small foods, (shrimp, mushrooms, vegetables ...) and
        fish cages, which open in half, and allow food to be turned. □ BLACK OVENS WITH FOLDING GLASS DOOR Exterior built with black painted steel,
        in epoxy. With a folding door, with double tempered glass, equipped with robust hinges, which allow 90 ° opening, and with a stainless
        steel handle. STAINLESS STEEL OVENS Exterior in stainless steel. With a folding door, the exterior of which is made of stainless steel,
        insulated with fiberglass, equipped with robust hinges, which allow 90 ° opening, and with a handle. OVENS WITH ELEVATING GLASS DOOR Exterior
        in stainless steel. Equipped with a door, with a lifting opening system, which represents a great advantage, since when it is open, it
        does not disturb the work of the cook, since it is kept on top. □ With panoramic glass, resistant to high temperatures, which allows you
        to control the cooking of food, without the need to open the door, with the consequent saving of carbon, since it does not lose temperature
        in the chamber. Said glass, the next day, before starting work, can be easily cleaned with any product on the market. And if the oven
        is facing the public, having the glass door, it offers an attraction, seeing how food is roasted. As endowment, a front table, □, is supplied,
        which makes it easier for the cook to place, on top, a tray or other container. This table acts as a tray and has a removable grid, so
        that oils or fats do not fall on the floor and are easy to clean. The set of the front table is removable with your hands. COAL TABLES
        Reinforced, to support the weight of the oven. Built in black painted steel, in epoxy. Equipped with 4 very resistant wheels, 2 of them
        with brakes. Supplied, they are supplied with a shovel, for loading coal into the oven.
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 3.25
      w: 19.0
      h: 24.7
