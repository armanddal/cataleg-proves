- id: p44
  n: 44
  tipus: informacio_general
  capcalera:
    banda: assets/g8/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: HORNOS DE BRASA, CON CARBÓN VEGETAL, DE COLOR NEGRO, DE ACERO INOXIDABLE O CON PUERTA DE CRISTAL Y MESAS CARBONERAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: es
    paragrafs:
    - role: titol
      text: UN HORNO DE CARBÓN VEGETAL O PEQUEÑOS TROZOS DE LEÑA, OFRECE EL AUTÉNTICO SABOR A BRASA, CON SU AROMA, JUGOSIDAD Y TEXTURA AL GUSTO,
        PERFECTOS... A TODA CLASE DE ALIMENTOS, COMO CARNES, PESCADOS, VERDURAS, PAN etc. CON LA VENTAJA, DE QUE SE PUEDE INSTALAR EN EL INTERIOR
        DE CUALQUIER COCINA, SIN TENER QUE SOPORTAR LAS ELEVADAS TEMPERATURAS, QUE DESPRENDEN LAS BARBACOAS ABIERTAS. Y ADEMÁS CON UN CONSUMO
        MÍNIMO DE CARBÓN, SI SE COMPARAN LOS DOS SISTEMAS DE BRASA. CONSTRUCCIÓN GENÉRICA HORNOS Interior de hierro fundido, para soportar temperaturas
        de 350º C. Con patas regulables. Aislamiento con sistema de refrigeración genuino, lo que reduce la temperatura exterior, y el consumo
        de carbón, hasta un 25%, en relación con otros hornos. Con 7 pares de guías laterales para colocar la parrilla en la posición deseada.
        Se puede trabajar con dos parrillas a la vez, en distintos niveles, con lo que se aumenta la producción. □ Opcionalmente, se puede, poner
        un separador, de manera que se pueden colocar medias parrillas, de distintos modelos. □ (Ver ACCESORIOS) En dotación se suministran con
        una parrilla de varilla, de uso general, (carne, pescado, verduras...) pero opcionalmente, disponemos de parrillas acanaladas, tipo teja,
        ideales para las carnes grasas, (cordero, pollo, pato...) y de planchas. (Ver ACCESORIOS) Disponen de canal para la recogida de los aceites
        y grasas, los cuales se depositan en un cajón de extracción frontal. □ Evidentemente, solo se recogen cuando se usa la parrilla acanalada
        o la plancha. De Serie, con regulador de aire y cortafuegos interno. □, lo cual permite, que se puedan colocar debajo de la campana. No
        obstante en la mayoría de países, sus normativas exigen que la campana extractora sea independiente para humos provenientes de combustibles
        sólidos (leña, carbón..) y que el cortallamas, este visible en el exterior del horno. En tal caso, encontrarán EL KIT cortallamas externo.
        □ (Ver ACCESORIOS) El carbón se deposita en la tolva carbonera. □ Para el encendido, se debe abrir el regulador de aire, situado en la
        parte superior, moviendo la maneta hacia la izquierda, como indica, □ y a la vez abrir el tiro inferior, (cajón de la ceniza), unos 8
        cms. □, para facilitar la circulación del aire. Seguidamente, cerrar la puerta del horno y dejar que el carbón prenda y se estabilice.
        En dotación, va un atizador, el cual utilizaremos, para extender bien la brasa, por toda la tolva carbonera. En 30 minutos, el horno estará
        en condición de uso. Llegado ese momento, cerraremos el tiro inferior (cajón de la ceniza) y a la vez colocaremos la maneta del regulador
        de aire, en la posición derecha (CLOSE). Está equipado con un termómetro analógico, □, de gran precisión, para saber en todo momento la
        temperatura de trabajo, y en caso necesario, añadir mas carbón, si la temperatura desciende. Ya está el horno listo para trabajar, pudiendo
        colocar los alimentos en la parrilla. En dotación se suministran unas pinzas largas, de 300 mm., con la cuales podremos voltear, y luego
        extraer los alimentos. En ACCESORIOS, encontraran, planchas, parrillas para varios usos. Así como Jaulas de acero inoxidable para asar
        alimentos pequeños, (gambas, setas, verduras....) y Jaulas para pescados, que se abren por la mitad, y permiten voltear los alimentos.
        □ HORNOS COLOR NEGRO CON PUERTA DE CRISTAL ABATIBLE Exterior construido con acero pintado en color negro, en epoxi. Con puerta abatible,
        con doble cristal templado, dotada de robustas bisagras, que permiten la apertura de 90º, y con una asa, de acero inoxidable. HORNOS DE
        ACERO INOXIDABLE Exterior en acero inoxidable. Con puerta abatible, cuyo exterior es de acero inoxidable, aislada con fibra de vidrio,
        dotada de robustas bisagras, que permiten la apertura de 90º, y con una asa. HORNOS CON PUERTA DE CRISTAL ELEVABLE Exterior en acero inoxidable.
        Equipados con una puerta, con un sistema de apertura elevable, lo cual representa una gran ventaja, ya que cuando está abierta, no molesta,
        para la labor del cocinero, ya que se mantiene, en la parte superior. □ Con cristal panorámico, resistente a las altas temperaturas, lo
        que permite controlar la cocción de los alimentos, sin la necesidad de abrir la puerta, con el consiguiente ahorro de carbón, ya que no
        pierde temperatura de la cámara. Dicho cristal, al día siguiente, antes de empezar el trabajo, se puede limpiar fácilmente, con cualquier
        producto de los existentes en el mercado. Y si el horno está de cara al público, al tener la puerta de cristal, ofrece una atracción,
        al ver como se asan los alimentos. Como dotación, se suministra una mesa frontal, □ , lo cual facilita, al cocinero, poder colocar, encima,
        una bandeja u otro recipiente. Dicha mesa hace la función de bandeja y dispone de una rejilla extraíble, para que los aceites o grasas,
        no caigan al suelo y sea fácil de limpiar. El conjunto de la mesa frontal, es desmontable, con las manos. MESAS CARBONERAS Reforzadas,
        para soportar el peso del horno. Construidas en acero pintado en color negro, en epoxi. Equipadas con 4 ruedas muy resistentes, 2 de ellas
        con freno. En dotación, se suministran con una pala, para la carga de carbón al horno.
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
    pos:
      x: 1.0
      y: 3.25
      w: 19.0
      h: 24.7
