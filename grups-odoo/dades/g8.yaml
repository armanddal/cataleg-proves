- id: p10
  n: 10
  tipus: informacio_general
  capcalera:
    banda: assets/g8/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: SERIE / 2 - 5
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.275
    titol:
      en: CONVECTION AND MIXED OVENS - DIRECT, GAS AND ELECTRIC STEAM
      fr: FOURS À CONVECTION ET MIXTES - VAPEUR DIRECTE, GAZ ET ÉLECTRIQUE
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERIC CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: Exterior and interior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: With 4 adjustable legs.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: With interior light
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: They have an adjustable humidifier, especially important for the baking of bread and pastries.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Pivot doors, fitted with reinforced hinges, which lock when they exceed 95°.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Said doors with double tempered glass, being able to open the internal for cleaning □ and with a tray for collecting condensed water
        on the glass, to prevent it from falling to the ground when the door is opened.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Furnace frames with silicone weatherstripping, with air chamber, to ensure the hermetic seal and avoid heat and steam leaks. Easily
        replaceable. □
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Guides for EN cans or GN containers, interchangeably. Separation between guides 65 mm. Optionally, the lateral guides with greater
        distance between them are available, from 90 mm. □
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: On request, they can be supplied with a washing shower. (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 2. GAS OR ELECTRICAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: They are convection, with a mechanical panel. □
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: With motor-fans, with two speeds, with a reverser.
      estil:
        color: '#000000'
        mida: 13.0
    - role: titol
      text: SERIES 5. A GAS OR ELECTRICAL
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.0
    - role: text
      text: They can operate with convection, hot air, or mixed, with steam, as selected.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: With touch screen (TOUCH SCREEN), 7 inches. Programmable. □
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: With recipes loaded via USB.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Electronically controlled motor-fans, with 3 speeds, with turn inverter.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Optionally, they can work with a probe to the heart. □ (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Delta T cooking, to achieve homogeneous cooking, due to the control between the internal temperature of the product and that of the
        cooking chamber. Very important, when it comes to large pieces that need slow cooking. It is essential to have a heart probe.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: The “W” models, with automatic washing, with 4 programs. The recommended degreasing detergent. □ (See ACCESSORIES).
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Upon express request, the 5 Series can be supplied, with the controls on the right, at no additional charge. □
      estil:
        color: '#000000'
        mida: 13.0
    pos:
      x: 1.0
      y: 3.25
      w: 9.35
      h: 24.7
