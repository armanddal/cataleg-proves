    - role: titol
      text: CONSTRUCTION Extérieur et intérieur en acier inoxydable 18/10 AISI-304. Avec 4 pieds réglables. Portes pivotantes, équipées de charnières
        renforcées, qui se verrouillent lorsqu'elles dépassent 95°. Ces portes en verre trempé double, pouvant ouvrir la porte intérieure pour
        le nettoyage □ et avec un bac pour recueillir l'eau condensée sur la vitre, pour éviter qu'elle ne tombe au sol lors de l'ouverture de
        la porte. □ Cadres de four avec coupe-froid en silicone, avec chambre à air, pour assurer l'étanchéité et éviter les fuites de chaleur
        et de vapeur. Facilement remplaçable. □ Guides de récipients GN, facilement amovibles pour un nettoyage facile. Séparation entre guides
        72 mm. En option, ils peuvent être fournis avec une douche de lavage, avec un tuyau rétractable. □ (voir ACCESSOIRES), à l'exception des
        modèles avec chariot, qui est fourni. Il peut fonctionner comme convection, air chaud, vapeur uniquement ou vapeur convection mixte, selon
        la sélection. Avec ÉCRAN TACTILE de 7 pouces. Programmable, avec une capacité de 99 recettes avec 9 phases de cuisson pour chacune. □
        Avec des recettes chargées via USB. □ Contrôle de l'humidité, particulièrement important pour la cuisson des légumes, du poisson, etc.
        Quant au pain ou aux pâtisseries ... Moteurs de ventilateur à commande électronique à 6 vitesses, avec inversion de rotation. □ Avec lumière
        LED, située sur la porte elle-même et chronométrée. En option, ils peuvent travailler avec une sonde au cœur. □ (voir ACCESSOIRES). Cuisson
        Delta T, pour obtenir une cuisson homogène grâce au contrôle entre la température interne du produit et la chambre de cuisson. Très important,
        lorsqu'il s'agit de gros morceaux qui nécessitent une cuisson lente. Il est essentiel d'avoir une sonde au coeur. Idéal pour une utilisation
        comme rôtissoire à poulets, en utilisant des grilles spéciales pour cela. □ (Voir ACCESSOIRES). Avec lavage automatique, avec 4 programmes.
        Le détergent dégraissant recommandé. □ (voir ACCESSOIRES). MODÈLES À GAZ Avec le système de brûleur PREMIX, haute efficacité et performances
        maximales. □
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 13.2
