    - role: text
      text: Extérieur et intérieur en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Avec 4 pieds réglables.
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Avec lumière intérieur
      estil:
        color: '#000000'
        mida: 12.9
    - role: text
      text: Ils ont un humidificateur réglable, particulièrement important pour la cuisson du pain et des pâtisseries.
