- id: p05
  n: 5
  tipus: informacio_general
  capcalera:
    banda: assets/g16/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERIC CONSTRUCTION CRUSHERS/BLENDERS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: They are made up of the motor unit, which has an ergonomic handle, whose housing is made of highly resistant food-grade PVC, with
        vents and the crusher or blender, made of 18/10 stainless steel, AISI-304, which are removable. and interchangeable.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: MOTOR UNIT, which works by pressing the button and stops when it is released.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Mod / cod. 170052XM, is fixed speed (13000 r.p.m.). Very manageable due to its size.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Other models have a speed variator (250/1500 r.p.m.) when the blender is used and (2500/11000) r.p.m., for the crusher.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: CRUSHERS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Ideal for mixing, soups, vegetable purees, sauces, mayonnaise etc.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: They are removable, threaded, to facilitate cleaning in the sink or dishwasher.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: They are manufactured in different lengths, 300, 400, 500 and 600 mm, which can optionally be supplied, (see COMPONENTS)
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: The blade, also made of stainless steel, easily replaceable.
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: BLENDERS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: To beat creams, eggs, cream, etc.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: They are removable, threaded, to facilitate cleaning.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: 350 mm long, allowing a 200 mm immersion.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: GENERIC CONSTRUCTION OF SLICERS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Made of aluminum with anodized finish.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: They work by gravity, as the carriage is inclined towards the blade.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Designed to facilitate cleaning.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: With fixed protector, around the cutting disc, to avoid user accidents.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Cutting disc, adjustable, according to the desired thickness, by means of a rotary knob, located on the front base of the slicers.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: They incorporate a fixed sharpener, easy to use, which allows the cutting disc to be in perfect condition.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: The trolley, where the cold cuts are placed, is mounted on self-lubricating bronze bushings, with a transparent plastic protector,
        to avoid the projection of food during use.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Likewise, it has an arm with spikes, to fix the cold meat to the trolley, and at the same time, to actuate it, forwards and backwards,
        with total safety for the user.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: With start-stop switch.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: SERIES 5
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Leash transmission.
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: SERIES 8
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Transmission by means of gears.
      estil:
        color: '#000000'
        mida: 13.1
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE DES BROYEURS/ MÉLANGEURS
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Ils sont constitués du groupe moteur, qui a une poignée ergonomique, dont le boîtier est en PVC de qualité alimentaire très résistant,
        avec des grilles de ventilation et le broyeur ou mélangeur, en acier inoxydable 18/10, AISI-304, qui sont amovible et interchangeable.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: GROUPE MOTEUR, qui fonctionne en appuyant sur le bouton et s'arrête lorsqu'il est relâché.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Mod / cod. 170052XM, est une vitesse fixe (13000 r.p.m.). Très gérable en raison de sa taille.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: D'autres modèles ont un variateur de vitesse (250/1500 r.p.m.) lorsque le mélangeur est utilisé et (2500/11000 r.p.m.), pour le broyeur.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: BROYEURS
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Idéal pour mélanger, soupes, purées de légumes, sauces, mayonnaise etc.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Ils sont amovibles, filetés, pour faciliter le nettoyage dans l'évier ou le lave-vaisselle.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Ils sont fabriqués en différentes longueurs, 300, 400, 500 et 600 mm, qui peuvent être fournis en option, (voir COMPOSANTS)
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: La lame, également en acier inoxydable, est facilement remplaçable.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: MÉLANGEURS
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Pour battre les crèmes, les œufs, la crème, etc.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Ils sont amovibles, filetés, pour faciliter le nettoyage.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: 350 mm de long, permettant une immersion de 200 mm.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE DES TRANCHEUSES
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Fabriqué en aluminium avec finition anodisée.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Ils fonctionnent par gravité, car le chariot est incliné vers la lame.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Conçu pour faciliter le nettoyage.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Avec protecteur fixe, autour du disque de coupe, pour éviter les accidents de l'utilisateur.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Disque de coupe, réglable, selon l'épaisseur souhaitée, au moyen d'un bouton rotatif, situé sur la base avant de la trancheuse.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Ils intègrent un affûteur fixe facile à utiliser qui permet au disque de coupe d'être en parfait état.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Le chariot, où sont placées les viandes froides, est monté sur des bagues en bronze autolubrifiantes, avec un protecteur en plastique
        transparent, pour éviter la projection d'aliments pendant l'utilisation.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: De même, il dispose d'un bras avec des pointes, pour fixer la viande froide au chariot, et en même temps, pour l'actionner, en avant
        et en arrière, en toute sécurité pour l'utilisateur.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: Avec interrupteur marche-arrêt.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: SÉRIE 5
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Transmission par courroie.
      estil:
        color: '#000000'
        mida: 12.8
    - role: text
      text: SÉRIE 8
      estil:
        color: '#800080'
        negreta: true
        mida: 12.8
    - role: text
      text: Transmission au moyen d'engrenages.
      estil:
        color: '#000000'
        mida: 12.8
    pos:
      x: 10.65
      y: 2.694
      w: 9.85
      h: 25.6
  fotos: []
