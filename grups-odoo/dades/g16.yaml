- id: p26
  n: 26
  tipus: informacio_general
  capcalera:
    banda: assets/g16/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN DE LAS PELADORAS DE PATATAS Exterior de acero inoxidable 18/10 AISI-304. Tapa superior en policarbonato transparente
        para visualizar el estado de las patatas. □ Con micro-interruptores de seguridad, para evitar accidentes del usuario, en tapa superior
        y en la puerta de salida. Apertura de la puerta de salida, del producto, accionada por un pulsador. Equipadas con temporizador de 0 a
        4 minutos. Entrada del agua a presión, automática, para la eliminación de los residuos de la peladura, a través del desagüe, de Ø 90 mm.
        Con potente motor, para el giro del plato abrasivo, extraíble, para su limpieza o substitución. □ Opcionalmente, se puede colocar abrasivo
        en los laterales. El mod/cod.17052FPP, viene de serie. □ Ver ACCESORIOS. Se suministran monofásicas o trifásicas, debiendo indicar el
        voltaje al pasar el pedido. Montado sobre soporte tubular. □ Opcionalmente, se puede colocar, en el par de guías, que lleva el soporte,
        un cajón, con filtro, para recoger los residuos sólidos. (Excepto mod/cod. 17005PPP) □. Ver ACCESORIOS. E CONSTRUCTION OF THE POTATO PEELERS
        18/10 AISI-304 stainless steel exterior. Top cover in transparent polycarbonate to display the status of the potatoes.□ With safety micro-switches,
        to avoid user accidents, on the top cover and on the exit door. Opening of the exit door of the product, activated by a button. Equipped
        with a 0 to 4 minute timer. Automatic pressurized water inlet to remove peeling residues through the Ø 90 mm drain. With powerful motor
        to rotate the removable abrasive plate for cleaning or replacement. □ Optionally, abrasive can be placed on the sides. The mod / cod.17052FPP,
        comes standard. □ See ACCESSORIES. They are supplied single-phase or three-phase, and the voltage must be indicated when placing the order.
        Mounted on tubular support. □ Optionally, a drawer, with filter, can be placed in the pair of guides, which carries the support, to collect
        solid waste. (Except mod/cod. 17005PPP) □. See ACCESSORIES. F CONSTRUCTION DES ÉPLUCHEURS DE POMMES DE TERRE Extérieur en acier inoxydable
        AISI-304 18/10. Couvercle supérieur en polycarbonate transparent pour afficher l'état des pommes de terre.□ Avec micro-interrupteurs de
        sécurité, pour éviter les accidents de l'utilisateur, sur le capot supérieur et sur la porte de sortie. Ouverture de la porte de sortie
        du produit, activée par un bouton. Équipé d'une minuterie de 0 à 4 minutes. Arrivée d'eau sous pression automatique pour éliminer les
        résidus de pelage par le drain Ø 90 mm. Avec moteur puissant pour faire tourner la plaque abrasive amovible pour le nettoyage ou le remplacement.
        □ En option, un abrasif peut être placé sur les côtés. Le mod / cod.17052FPP, est livré en standard. □ Voir ACCESSOIRES. Ils sont fournis
        monophasés ou triphasés, et la tension doit être indiquée lors de la commande. Monté sur support tubulaire. □ En option, un tiroir, avec
        filtre, peut être placé sur la paire de guides, qui porte le support, pour collecter les déchets solides. (Sauf mod/cod. 17005PPP) □.
        Voir ACCESSOIRES.
