  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION In stainless steel interior and exterior. With 6 mm schott glass. of thickness. Said glass is very easy to clean. □ With
        non-slip support feet. TABLE-TOP INDUCTION HOBS The cooking zone of these plates does not burn, since induction technology consists of
        heating by magnetic waves, through a generator. Therefore, containers, pans, pots, etc. should be used. special with the bottom of the
        same of ferric material. And when it does not detect, said container, it stops automatically, in 60 seconds. Such a system is expensive,
        but it pays for itself quickly, since the consumption of electrical energy drops 40% compared to an electric stove and 50% compared to
        a gas stove. The cooking time is consequently reduced to half of the other systems, and also has the advantage of increasing or decreasing
        the temperature instantly. It also does not consume anything when the container is removed, not requiring maintenance pilots or minimum
        positions, which is also an energy saving. Digital control panel with display to indicate the temperature. □ With start-stop button. With
        rotary knob for power control. □ With function selector, keep or heat. WOK MODEL With the concave schott glass, to house the frying pan
        with a cylindrical base. □ The frying pan is supplied as standard. □ GLASS CERAMIC STOVES Quick heat transfer. With tungsten resistors
        With analog energy regulators and operation indicator light. □
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 24.506
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable intérieur et extérieur. Avec verre schott de 6 mm. d'épaisseur. Ce verre est très facile à nettoyer.
        □ Avec pieds de support antidérapants. PLAQUES À INDUCTION SUR TABLE La zone de cuisson de ces plaques ne brûle pas, car la technologie
        à induction consiste à chauffer par ondes magnétiques, à travers un générateur. Par conséquent, des récipients, des casseroles, etc. doivent
        être utilisés avec le fond de matière ferrique. Et quand il ne détecte pas, dit casserole, il s'arrête automatiquement, en 60 secondes.
        Un tel système est coûteux, mais il se rentabilise rapidement, puisque la consommation d'énergie électrique baisse de 40% par rapport
        à une cuisinière électrique et de 50% par rapport à une cuisinière à gaz. Le temps de cuisson est par conséquent réduit de moitié par
        rapport aux autres systèmes, et présente également l'avantage d'augmenter ou de diminuer la température instantanément. Il ne consomme
        rien non plus, lorsque la casserole est retiré, ne nécessitant pas de pilotes de maintenance ou de positions minimales, ce qui est également
        une économie d'énergie. Panneau de commande numérique avec affichage pour indiquer la température. □ Avec bouton marche-arrêt. Avec bouton
        rotatif pour le contrôle de la puissance. □ Avec sélecteur de fonction, conserver ou chauffer. MODÈLE WOK Avec le verre schott concave,
        pour loger la poêle à fond cylindrique. □ La poêle est fournie en standard. □ CUISINIÈRES EN VITROCÉRAMIQUE Transfert de chaleur rapide.
        Avec résistances en tungstène Avec régulateurs d'énergie analogiques et voyant de fonctionnement. □
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
