    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN DE LAS PICADORAS DE CARNE
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Carrocería en acero inoxidable 18/10 AISI-304, con rejillas de ventilación.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cuerpo picador en aluminio anodizado brillante. Mod/cod. 17345100, totalmente de acero inoxidable. Todos ellos desmontables para facilitar
        la limpieza y la higiene de los elementos en contacto con la carne.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cuchilla con autoafilado y placa perforada en acero inoxidable, con taladros de 6 mm.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bandeja en acero inoxidable, con tolva de entrada de Ø 50 mm, con empujador de material plástico alimentario.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dotadas de bandeja de recogida de la carne picada, en acero inoxidable.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con motor auto-ventilado de gran potencia.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Accionado por medio de un interruptor marcha-paro, con la maniobra a 24 voltios.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Montadas sobre 4 patas regulables.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCCIÓN DE LAS SIERRAS DE CINTA
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: De uso industrial, diseñadas para el corte limpio, de carne, huesos, alimentos congelados, etc., con suma facilidad y máxima seguridad
        para el usuario.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Para su colocación sobre mesa.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Construcción de la estructura en aluminio, con acabado anodizado, sobre una base de acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con sierra de cinta de alta calidad, fácil de substituir, cuando está gastada. Ver en ACCESORIOS, los packs de cintas de recambio,
        que ofrecemos.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con tensor de la cinta, situado en la parte superior.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con protector de acero inoxidable, con un mango de baquelita para ejercer presión sobre el alimento a cortar, y así evitar accidentes
        laborales.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Ancho de corte hasta 180 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Banco de trabajo y tope regulable del ancho del corte, ambos de acero inoxidable.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con motor de gran potencia y máximo rendimiento.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Se pueden suministrar monofásicas o trifásicas, debiendo indicar el voltaje al pasar el pedido.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con interruptor, marcha paro, y pulsador de emergencia, que detiene la sierra al presionarlo y que funcionan a baja tensión por seguridad.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Montadas sobre 4 patas de goma antideslizante.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.75
      y: 2.5
      w: 14.223
      h: 19.378
