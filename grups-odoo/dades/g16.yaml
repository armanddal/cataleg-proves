- id: p23
  n: 23
  tipus: informacio_general
  capcalera:
    banda: assets/g16/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION OF MEAT GRINDERS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: 18/10 AISI-304 stainless steel body, with ventilation grills.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Shiny anodized aluminum chopper body. Mod/cod. 17345100, entirely made of stainless steel. All of them removable to facilitate cleaning
        and hygiene of the elements in contact with meat.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Self-sharpening blade and perforated plate in stainless steel, with 6 mm holes.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Stainless steel tray, with Ø 50 mm inlet hopper, with food plastic pusher.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipped with a stainless steel minced meat collection tray.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With high power self-ventilated motor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Activated by means of a start-stop switch, with the maneuver at 24 volts.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Mounted on 4 adjustable feet.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCTION OF BAND SAWS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: For industrial use, designed for clean cutting of meat, bones, frozen foods, etc., with great ease and maximum safety for the user.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: For placement on the table.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Aluminum structure construction, with anodized finish, on a 18/10 AISI 304 stainless steel base.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With high quality band saw, easy to replace, when it is worn out. See ACCESSORIES, the packs of spare ribbons that we offer.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With saw tensioner, located at the top.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With a stainless steel protector, with a Bakelite handle to exert pressure on the food to be cut, and thus avoid work accidents.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cutting width up to 180 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Workbench and adjustable cutting width stop, both made of stainless steel.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With a powerful engine and maximum performance.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: They can be supplied single-phase or three-phase, having to indicate the voltage when placing the order.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With switch, stop start, and emergency button, which stops the saw when pressed and which works at low voltage for safety.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Mounted on 4 non-slip rubber feet.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION DES HACHOIRS À VIANDE
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Corps en acier inoxydable 18/10 AISI-304, avec grilles de ventilation.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Corps de hachoirs à viande en aluminium anodisé brillant. Mod/cod. 17345100, entièrement en acier inoxydable. Tous amovibles pour
        faciliter le nettoyage et l'hygiène des éléments en contact avec la viande.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Lame auto-affûtante et plaque perforée en acier inoxydable, avec trous de 6 mm.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Plateau en acier inoxydable, avec trémie d'entrée Ø 50 mm, avec poussoir en plastique alimentaire.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipé d'un plateau pour la collecte de la viande hachée, en acier inoxydable.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec moteur auto-ventilé haute puissance.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Activé au moyen d'un interrupteur marche-arrêt, avec la manœuvre à 24 volts.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Monté sur 4 pieds réglables.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCTION DE SCIES À RUBAN
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: À usage industriel, conçu pour couper proprement la viande, les os, les aliments surgelés, etc., avec une grande facilité et une sécurité
        maximale pour l'utilisateur.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Pour le placement sur la table.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Construction de structure en aluminium, avec finition anodisée, sur une base en acier inoxydable AISI 304 18/10.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec une scie à ruban de haute qualité, facile à remplacer, lorsqu'elle est usée. Voir ACCESSOIRES, les packs de rubans de rechange
        que nous proposons.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec tendeur de scie, situé en haut.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec un protecteur en acier inoxydable, avec une poignée en bakélite pour exercer une pression sur les aliments à couper, et ainsi
        éviter les accidents de travail.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Largeur de coupe jusqu'à 180 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Établi et butée de largeur de coupe réglable, tous deux en acier inoxydable.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec un moteur puissant et des performances maximales.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Ils peuvent être fournis monophasés ou triphasés, devant indiquer la tension lors de la commande.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec interrupteur, marche arrêt, et bouton d'urgence, qui arrête la scie lorsqu'elle est enfoncée et qui fonctionne à basse tension
        pour plus de sécurité.
      refs:
