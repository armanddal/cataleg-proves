    - role: text
      text: CONSTRUCCIÓN En acero inoxidable interior y exterior. Con cristal schott de 6 mm. de espesor. Dicho cristal, es muy fácil de limpiar.
        □ Con pies de apoyo antideslizantes. PLACAS DE INDUCCIÓN DE SOBREMESA La zona de cocción de esas placas, no quema, puesto que la tecnología
        de la inducción, consiste en calentar por ondas magnéticas, a través de un generador. Por ello deben usarse recipientes, sartenes, ollas,
        etc. especiales con el fondo de los mismos de material férrico. Y cuando no detecta, dicho recipiente, se pára automáticamente, en 60
        segundos. Dicho sistema es caro, pero se amortiza rápidamente, puesto que el consumo de energía eléctrica, baja un 40%, con relación a
        una cocina eléctrica y el 50% si se compara con una de gas. El tiempo de cocción en consecuencia, se reduce a la mitad de los otros sistemas,
        y además tiene la ventaja de aumentar o disminuir la temperatura al instante. Tampoco consume nada, cuando se retira el recipiente, no
        precisando pilotos de mantenimiento ni posiciones de mínimo, lo que también es un ahorro de energía. Panel de control digital con display
        para indicar la temperatura. □ Con pulsador marcha-paro. Con mando rotatorio para el control de potencia. □ Con selector de función, mantener
        o calentar. MODELO WOK Con el cristal schott cóncavo, para alojar la sartén con base cilíndrica. □ En dotación se suministra la sartén.
        □ HORNILLOS VITROCERÁMICOS Rápida transmisión del calor. Con resistencias de wolframio Con reguladores de energía analógicos y piloto
        indicador de funcionamiento. □
      estil:
        color: '#800080'
        negreta: true
