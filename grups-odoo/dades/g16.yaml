- id: p04
  n: 4
  tipus: informacio_general
  capcalera:
    banda: assets/g16/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: TRITURADORES, BATIDORES Y CORTADORAS DE FIAMBRES
      estil:
        color: '#ffffff'
        negreta: true
        mida: 13.0
    - role: text
      text: CRUSHERS, BLENDERS AND SLICERS
      estil:
        color: '#ffffff'
        negreta: true
        mida: 9.2
    - role: text
      text: BROYEURS, MÉLANGEURS ET TRANCHEUSES
      estil:
        color: '#ffffff'
        negreta: true
        mida: 9.2
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA TRITURADORES/BATIDORES
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Están compuestos por el bloque motor, que dispone de una empuñadura ergonómica, cuya carcasa es de PVC alimentario, muy resistente,
        con rejillas de ventilación y el triturador o el batidor, construidos en acero inoxidable 18/10, AISI-304, que son desmontables e intercambiables.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: BLOQUE MOTOR, que funciona presionando el pulsador y pára para cuando se suelta.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Mod/cod. 170052XM, es de velocidad fija (13000 r.p.m.). Muy manejable debido a su tamaño.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Resto de modelos, disponen de variador de velocidad, (250/1500 r.p.m.) cuando se usa el batidor y 2500/11000 r.p.m., para el triturador.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: TRITURADORES
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Ideales para mezclar, sopas, purés de verduras, salsas, mayonesas etc.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Son desmontables, a rosca, para facilitar la limpieza en el fregadero o lavavajillas.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Se fabrican en diferentes longitudes, de 300, 400, 500 y 600 mm, que opcionalmente se pueden suministrar, (ver en COMPONENTES)
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La cuchilla, también de acero inoxidable, fácilmente reemplazable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: BATIDORES
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Para batir cremas, huevos, nata, etc.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Son desmontables, a rosca, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: De una longitud de 350 mm, que permite una inmersión de 200 mm.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA DE LAS CORTADORAS DE FIAMBRES
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Fabricadas en aluminio con acabado anodizado.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Funcionan por gravedad, al estar el carro inclinado hacia la cuchilla.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Diseñadas, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con protector fijo, alrededor del disco de corte, para evitar accidentes del usuario.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disco de corte, regulable, según el espesor deseado, por medio de un mando giratorio, situado en la base frontal de la cortadora.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Incorporan un afilador fijo, de fácil uso, que permite tener el disco de corte en perfectas condiciones.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: El carro, dónde se colocan los fiambres, está montado sobre casquillos de bronce autolubricados, con un protector de plástico trasparente,
        para evitar la proyección de alimentos durante el uso.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Así mismo, dispone de un brazo con pinchos, para fijar el fiambre al carro, y a la vez, para accionarlo, hacia adelante y hacia atrás,
        con total seguridad para el usuario.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con interruptor marcha-paro.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 5
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Transmisión por medio de correa.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 8
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
