      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN DE LAS ENVASADORAS AL VACÍO Actualmente la constante evolución de las técnicas culinarias, requieren de avanzados sistemas
        de conservación y elaboración, que son posibles, gracias a las envasadoras al vació.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    - role: text
      text: Son imprescindibles para cualquier cocina profesional, ya que permiten aumentar la producción y variedad de platos. La tecnología
        de las envasadoras al vacío, facilitan la conservación a largo plazo de los alimentos, gracias a la ausencia de oxígeno, preservando el
        aroma y las cualidades del producto. Además ofrece beneficios económicos, ya que se pueden envasar alimentos, cuando la materia prima
        está a mejor precio, o es de temporada. Construcción en acero inoxidable 18/10 AISI-304. Tapa ergonómica transparente, de metacrilato
        de gran espesor. □ Inicio automático al bajar la tapa. Apertura automática de la tapa, una vez finalizado el ciclo de envasado. Con sistema
        de cierre de la tapa, que permite mantener la envasadora tapada, cuando no se usa. □ Carrocería abatible, en los modelos de sobre-mesa,
        para facilitar el servicio técnico de sus componentes. □ Barras de soldadura, fácilmente desmontables y substituibles. □ Con patas de
        goma, antideslizantes, en los modelos de sobremesa. Panel de control digital. □ Control preciso del tiempo de vacío y del tiempo de soldadura.
        Visualizador del tiempo para el final del proceso. Vacuómetro para control visual del nivel de vacío. Fases del proceso indicadas mediante
        Led luminoso. Modelo de pie, con 4 ruedas, 2 de ellas con freno. CARRO PARA ENVASADORAS Disponemos de un carro específico para las envasadoras
        de sobremesa, diseñado para queden a la altura ideal de trabajo, y que posibilitan el traslado. Ver en ACCESORIOS. □ Construidos en acero
        inoxidable 18/10 AISI-304. Con 4 ruedas de Ø 125 mm, 2 de ellas con freno, y con parachoques. CARACTERISTICAS COCCIÓN SOUS VIDE Es un
        cocedor al baño maría, con cocción al vacío, con la temperatura controlada con precisión. El calor y la recirculación del agua, asegura
        una temperatura constante. Con ese sistema se consigue, que los alimentos conserven su aspecto inicial, con todas las vitaminas y valores
        nutritivos, ya que no se resecan, ni se oxidan y además permite un servicio rápido. Construcción total en acero inoxidable 18/10 AISI-304.
        Cuba con todos los cantos redondeados, para facilitar la limpieza. Control electrónico de la temperatura, con 5 programas de memoria.
        □ Rango de temperatura de 30 a 90º C. Con grifo de desagüe. □ Con control del nivel del agua y filtro de seguridad, para evitar que entren
        impurezas, en el sistema de recirculación. En dotación, con accesorio para la separación de bolsas. Con 4 patas de material anti-deslizante.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
