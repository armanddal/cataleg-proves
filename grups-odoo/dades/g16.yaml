- id: p18
  n: 18
  tipus: informacio_general
  capcalera:
    banda: assets/g16/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION OF THE PIZZA FORMERS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Designed for the preparation of the dough, cold, so as not to alter its characteristics, stripping it until the desired thickness
        is achieved.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Exterior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Regulation of the thickness of the dough, from 0.5 to 4 mm, by means of polyethylene rollers, with transparent methacrylate protectors,
        removable for cleaning.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Electric motor, equipped with a cooling fan, for reliability in long operating sessions.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With start-stop switch.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, we have a pedal to activate operation, when pressed, which reduces power consumption when not in use.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCTION OF THE VEGETABLE CUTTERS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Professional machine for cutting, shredding, grating, etc. .. all kinds of vegetables, as well as vegetables, fruits, cheese, chocolate,
        bread etc.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: 18/10 AISI-304 stainless steel structure construction, and die-cast aluminum head with a bright anodized finish.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Folding head, to facilitate cleaning.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With 2 introduction nozzles. One oval, 150x70 mm, with a pressure handle and the other cylindrical, Ø 55, with a handle to push the
        product.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With start-stop switch, with 12 volt operation, for safety.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With automatic stop of the machine, in case of opening of the head.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Wide range of discs, for the different types of work to be carried out, with different thicknesses. How to cut into slices, or in
        the shape of cubes, or sticks, or straw ... Also for grating etc. (See in GROUP 16)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, we recommend a 5-disc KIT, when the machine is purchased, for the most frequent cases.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION DES FORMEUSES DE PIZZA
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Conçu pour confectionner la pâte à froid, afin de ne pas altérer ses caractéristiques, en la décapant jusqu'à l'obtention de l'épaisseur
        souhaitée.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Extérieur en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Régulation de l'épaisseur de la pâte, de 0,5 à 4 mm, au moyen de rouleaux en polyéthylène, avec protecteurs transparents en méthacrylate,
        amovibles pour le nettoyage.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Moteur électrique, équipé d'un ventilateur de refroidissement, pour une fiabilité dans les longues sessions de fonctionnement.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec interrupteur marche-arrêt.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: En option, nous avons une pédale pour activer le fonctionnement, lorsqu'elle est enfoncée, ce qui réduit la consommation d'électricité
        lorsqu'elle n'est pas utilisée.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CONSTRUCTION DES COUPE LÉGUMES
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Machine professionnelle pour couper, râper, triturer, etc. toutes sortes de légumes, des fruits, du fromage, du chocolat, du pain
        etc.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Structure en acier inoxydable 18/10 AISI-304 et tête en aluminium moulé avec une finition anodisée brillante.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Tête pliante, pour faciliter le nettoyage.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec 2 bouches d'introduction. Un ovale, 150x70 mm, avec une poignée de pression et l'autre cylindrique, Ø 55, avec une poignée pour
        pousser le produit.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec interrupteur marche-arrêt, avec fonctionnement 12 volts, pour la sécurité.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec arrêt automatique de la machine, en cas d'ouverture de la tête.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Large gamme de disques, pour les différents types de travaux à effectuer, avec différentes épaisseurs. Comment couper en tranches,
        ou en forme de cubes, ou de bâtonnets, ou de paille ... Aussi pour râper etc. (Voir dans le GROUPE 16)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: En option, nous recommandons un KIT de 5 disques, à l'achat de la machine, pour les cas les plus fréquents.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
