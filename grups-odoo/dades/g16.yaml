  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: VACUUM PACKING MACHINES AND SOUS VIDE COOKING
      estil:
        color: '#ffffff'
        negreta: true
        mida: 13.0
    - role: titol
      text: MACHINES D’EMBALLAGE SOUS VIDE ET DE CUISSON SOUS VIDE
      estil:
        color: '#ffffff'
        negreta: true
        mida: 13.0
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION OF VACUUM PACKING MACHINES Currently, the constant evolution of culinary techniques requires advanced preservation and
        preparation systems, which are possible thanks to vacuum machines.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    - role: text
      text: They are essential for any professional kitchen, since they allow to increase the production and variety of dishes. The technology
        of vacuum packaging machines facilitate the long-term preservation of food, thanks to the absence of oxygen, preserving the aroma and
        qualities of the product. It also offers economic benefits, since food can be packaged, when the raw material is at a better price, or
        is in season. 18/10 AISI-304 stainless steel construction. Ergonomic transparent lid, made of thick methacrylate. □ Automatic start by
        lowering the lid. Automatic opening of the lid, once the packaging cycle is finished. With lid closing system, which allows to keep the
        packaging machine covered, when not in use. □ Folding body, on tabletop models, to facilitate the technical service of its components.
        □ Welding bars, easily removable and replaceable. □ With non-slip rubber feet on tabletop models. Digital control panel. □ Precise control
        of vacuum time and welding time. Time display for the end of the process. Vacuum gauge for visual control of the vacuum level. Phases
        of the process indicated by luminous Led. Floor-standing model, with 4 wheels, 2 of them with brakes. TROLLEY FOR VACUUM PACKING MACHINES
        We have a specific trolley for tabletop packaging machines, designed to be at the ideal working height, and which makes it possible to
        move them. See ACCESSORIES. □ Built in 18/10 AISI-304 stainless steel. With 4 Ø 125 mm wheels, 2 of them with brakes, and with bumpers.
        SOUS VIDE COOKING CHARACTERISTICS It is a bain marie cooker, with vacuum cooking, with precisely controlled temperature. The heat and
        the recirculation of the water, ensures a constant temperature.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    - role: text
      text: With this system it is achieved that the food conserves its initial appearance, with all the vitamins and nutritional values, since
        they do not dry out or oxidize and also allows a quick service. Total 18/10 AISI-304 stainless steel construction. Cuba with all rounded
        edges, to facilitate cleaning. Electronic temperature control, with 5 memory programs. □ Temperature range from 30 to 90°C. With drain
        tap. □ With water level control and safety filter to prevent impurities from entering the recirculation system. Supplied with accessory
        for separating bags. With 4 legs made of non-slip material.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION DES MACHINES D’EMBALLAGE SOUS VIDE Actuellement, l'évolution constante des techniques culinaires nécessite des systèmes
        avancés de conservation et de préparation, qui sont possibles grâce aux emballeurs sous vide.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    - role: text
      text: Ils sont indispensables pour toute cuisine professionnelle, car ils permettent d'augmenter la production et la variété des plats.
        La technologie des machines d'emballage sous vide facilite la conservation à long terme des aliments, grâce à l'absence d'oxygène, en
        préservant l'arôme et les qualités du produit. Elle offre également des avantages économiques, puisque les aliments peuvent être conditionnés,
        lorsque la matière première est à un meilleur prix ou est de saison. Construction en acier inoxydable 18/10 AISI-304. Couvercle transparent
        ergonomique, en méthacrylate épais. □ Démarrage automatique en abaissant le couvercle. Ouverture automatique du couvercle, une fois le
        cycle d'emballage terminé. Avec système de fermeture du couvercle, qui permet de garder la machine d'emballage couverte lorsqu'elle n'est
        pas utilisée. □ Corps pliable, sur les modèles de table, pour faciliter le service technique de ses composants. □ Barres de soudage, facilement
        démontables et remplaçables. □ Avec pieds en caoutchouc antidérapants sur les modèles de table. Panneau de commande numérique. □ Contrôle
        précis du temps de vide et du temps de soudage. Affichage de l'heure pour la fin du processus. Vacuomètre pour le contrôle visuel du niveau
        de vide. Phases du processus indiquées par des LED lumineuses. Modèle sur pied, avec 4 roues dont 2 avec freins. CHARIOT POUR MACHINES
        D’EMBALLAGE SOUS VIDE Nous avons un chariot spécifique pour emballeurs de table, conçu pour être à la hauteur de travail idéale, et qui
        permet de les déplacer. Voir ACCESSOIRES. □ Construit en acier inoxydable 18/10 AISI-304. Avec 4 roues Ø 125 mm, dont 2 avec freins, et
        avec pare-chocs. CARACTÉRISTIQUES DE CUISSON SOUS VIDE C'est une cuisinière au bain-marie, avec cuisson sous vide, à température contrôlée
        avec précision. La chaleur et la recirculation de l'eau, assurent une température constante.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    - role: text
      text: Avec ce système, on obtient que les aliments conservent leur apparence initiale, avec toutes les vitamines et les valeurs nutritionnelles,
        car ils ne se dessèchent pas et ne s'oxydent pas et permettent également un service rapide. Construction totale en acier inoxydable 18/10
        AISI-304. Cuba avec tous les bords arrondis, pour faciliter le nettoyage. Contrôle électronique de la température, avec 5 programmes de
        mémoire. □ Plage de température de 30 à 90°C. Avec robinet de vidange. □ Avec contrôle du niveau d'eau et filtre de sécurité pour empêcher
        les impuretés de pénétrer dans le système de recirculation. Livré avec accessoire pour séparer les sacs. Avec 4 pieds en matériau antidérapant.
      estil:
        color: '#800080'
        negreta: true
        mida: 11.6
    pos:
      x: 10.65
      y: 2.694
      w: 9.85
      h: 25.6
