- id: p18
  n: 18
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: E INDUCTION COOKERS AND WOKS AND GAS WOKS F CUISINIÈRES ET WOKS À INDUCTION ET WOKS À GAZ
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION Made of AISI 304 stainless steel, both interior and exterior. With adjustable legs . INDUCTION COOKERS With 6 mm thick
        Schott glass. This glass is very easy to clean, as it is completely flat. □ With 3.5 KW plates. □ The cooking zone of these plates does
        not get hot, as induction technology heats through magnetic waves via a generator. Therefore, special containers, pans, pots, etc., with
        a ferromagnetic base must be used. When it does not detect such a container, it automatically stops in 60 seconds. This system is expensive
        but quickly pays for itself, as electricity consumption is reduced by 40% compared to an electric cooker and 50% compared to a gas cooker.
        As a result, cooking time is halved compared to other systems, and it also has the advantage of instantly increasing or decreasing the
        temperature. It also consumes nothing when the container is removed, as it does not require pilot lights or minimum settings, which also
        saves energy. With a rotary control for power adjustment. □ Tabletop models or on an open stand (optional doors can be added). □ INDUCTION
        WOKS With concave Schott glass to accommodate the pan. □ This glass is very easy to clean. With 5 KW cylindrical plates. □ The cooking
        zone of the induction woks does not get hot, as induction technology heats through magnetic waves via a generator. Therefore, special
        cylindrical base pans, □ made of ferromagnetic material, must be used. When it does not detect such a pan, it automatically stops in 60
        seconds. This system is expensive but quickly pays for itself, as electricity consumption is reduced by 50% compared to a gas wok. As
        a result, cooking time is halved, and it also has the advantage of instantly increasing or decreasing the temperature. It also consumes
        nothing when the pan is removed, as it does not require pilot lights or minimum settings, which also saves energy. With a rotary control
        for power adjustment. □ Tabletop models or on an open stand (optional doors can be added). □ GAS WOKS Embedded countertops of 1.5 mm thickness,
        with reinforcements to prevent deformation. □ High-performance circular cast iron burners with a power of 14 KW. □ With brass taps, equipped
        with adjustable maximum, minimum, and pilot position, with safety coil and thermocouple. With round vitrified cast iron grills, Ø 350/370.
        □ For use with cylindrical base pans. □ With removable grease trays. □ Tabletop models or on an open stand (optional doors can be added).
        □
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 0.98
      y: 3.101
      w: 9.43
      h: 25.45
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable AISI 304, intérieur et extérieur. Avec pieds réglables. CUISINIÈRES À INDUCTION Avec verre Schott
        de 6 mm d'épaisseur. Ce verre est très facile à nettoyer, car il est complètement plat. □ Avec plaques de 3,5 KW. □ La zone de cuisson
        de ces plaques ne brûle pas, car la technologie à induction consiste à chauffer par ondes magnétiques à travers un générateur. Il est
        donc nécessaire d'utiliser des récipients, poêles, casseroles, etc., spéciaux avec un fond en matériau ferreux. Et lorsqu'il ne détecte
        pas un tel récipient, il s'arrête automatiquement en 60 secondes. Ce système est coûteux, mais il est rapidement rentabilisé, car la consommation
        d'énergie électrique baisse de 40 % par rapport à une cuisinière électrique et de 50 % par rapport à une cuisinière à gaz. Par conséquent,
        le temps de cuisson est réduit de moitié par rapport aux autres systèmes, et il a également l'avantage d'augmenter ou de diminuer la température
        instantanément. Il ne consomme rien non plus lorsque le récipient est retiré, n'ayant pas besoin de veilleuses ni de positions minimales,
        ce qui permet également d'économiser de l'énergie. Avec commande rotative pour le contrôle de la puissance . □ Modèles de table ou sur
        support ouvert (des portes peuvent être ajoutées en option). □ WOKS À INDUCTION Avec verre Schott concave pour accueillir la poêle. □
        Ce verre est très facile à nettoyer. Avec plaques cylindriques de 5 KW. □ La zone de cuisson des woks à induction ne brûle pas, car la
        technologie à induction consiste à chauffer par ondes magnétiques à travers un générateur. Il est donc nécessaire d'utiliser des poêles
        à base cylindrique spéciales, □ en matériau ferreux. Et lorsqu'il ne détecte pas une telle poêle, il s'arrête automatiquement en 60 secondes.
        Ce système est coûteux, mais il est rapidement rentabilisé, car la consommation d'énergie électrique baisse de 50 % par rapport à un wok
        à gaz. Par conséquent, le temps de cuisson est réduit de moitié, et il a également l'avantage d'augmenter ou de diminuer la température
        instantanément. Il ne consomme rien non plus lorsque la poêle est retirée, n'ayant pas besoin de veilleuses ni de positions minimales,
        ce qui permet également d'économiser de l'énergie. Avec commande rotative pour le contrôle de la puissance. □ Modèles de table ou sur
        support ouvert (des portes peuvent être ajoutées en option). □ WOKS À GAZ Plans de travail encastrés de 1,5 mm d'épaisseur, avec renforts
        pour éviter les déformations. □ Brûleurs circulaires en fonte de haute performance d'une puissance de 14 KW. □ Avec robinets en laiton,
        dotés d'un maximum réglable, minimum et position veilleuse, avec bobine de sécurité et thermocouple. Avec grilles rondes vitrifiées en
        fonte, Ø 350/370. □ Pour utilisation avec des poêles à base cylindrique. □ Avec bacs à graisse amovibles. □ Modèles de table ou sur support
        ouvert (des portes peuvent être ajoutées en option). □
      estil:
        color: '#000000'
        mida: 8.4
