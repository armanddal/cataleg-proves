- id: p22
  n: 22
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: PLANCHAS-FRYTOP
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Todos los modelos con cajón recoge grasas □ en el frontal y tapón
        de estanqueidad cónico. □ Encimeras embutidas, con cantos redondeados, de acero inoxidable AISI 304, de 1,5 mm. de espesor. □ Con peto
        desmontable para facilitar la limpieza. □ Patas regulables en todos los aparatos. PLANCHAS-FRYTOP A GAS, DE SOBREMESA O SOBRE SOPORTE
        ABIERTO Con quemadores tubulares de acero inoxidable. Con encendido piezo-eléctrico. Las equipadas con placas de hierro, disponen de grifos
        de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar. Las equipadas con placas de cromo
        duro, disponen de válvula termostática y piloto de mantenimiento. Con bobina de seguridad y termopar. PLANCHAS-FRYTOP ELÉCTRICAS, DE SOBREMESA
        O SOBRE SOPORTE ABIERTO Con resistencias blindadas de acero inoxidable, montadas en cajones debidamente aislados. Con termostato y piloto
        indicador de funcionamiento. OPCIONALMENTE, se pueden solicitar para los modelos sobre soporte, la instalación con control electrónico
        de temperatura. Ver ACCCESORIOS. PLACAS SUPERIORES DE HIERRO De 15 mm. de espesor, soldadas en todo su contorno, superior e inferior,
        para su máxima higiene. Con desagüe frontal. La superficie de dichas placas, pueden ser lisas, ranuradas totalmente, o mixtas (2/3 lisa
        y 1/3 ranurada), en algunos modelos. PLACAS SUPERIORES DE CROMO DURO De 15 mm. de espesor, rectificadas y con baño de cromo duro de 50
        micras. Soldadas en todo su contorno, superior e inferior, para su máxima higiene. Con desagüe frontal. Se suministran con una espátula-cúter
        □ para su limpieza, la cual se debe usar sin golpear, sólo deslizando la cuchilla por la encimera. La forma de limpieza, es una vez parada
        la plancha y al cabo de 30/45 minutos (aún caliente), se deben colocar cubitos de hielo,  los cuales se evaporarán inmediatamente. Entonces
        la espátula-cúter deberá pasarse suavemente, para eliminar al máximo la grasa, y seguidamente un paño húmedo. No poner desengrasante hasta
        el día siguiente antes de poner la plancha en marcha y quedará la superficie brillante como nueva. Dichas placas siempre son lisas.
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 1.0
      y: 3.0
      w: 11.5
      h: 25.0
