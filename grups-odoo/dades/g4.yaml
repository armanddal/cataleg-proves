- id: p36
  n: 36
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: E FRYERS, FRIED CONSERVATORS, BAIN MARIES, PASTA COOKERS F FRITEUSES, RÉSERVES POUR FRITES, BAIN MARIES, CUISEURS À PÂTES
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: STRUCTURE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.2
    - role: text
      text: In stainless steel, interior and exterior.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: 1.5 mm countertops. of thickness.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Adjustable legs in all appliances.
      estil:
        color: '#000000'
        mida: 9.2
    - role: titol
      text: GAS AND ELECTRIC FRYERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.2
    - role: text
      text: All models with chrome steel baskets and covers with handle.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Fryers on stand, equipped with door/s as standard.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With vats fully welded to the countertop, embedded to facilitate cleaning and also prevent the oil from overflowing. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With perforated grid to avoid going food to the bottom.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With drain cock, located on the front of the fryer, with safety device, to prevent accidental opening, in tabletop fryers.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: The fryers on support, carry the drain tap in the lower area, and are equipped with a tank for emptying the oil, with a filter to
        retain impurities.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With generous cold zone, which increases the duration of the oil.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Gas models, with a clean tank, without tubes, only the protectors of the bulbs of thermostats □, except the mod / cod. 39150317, which
        carries a heat exchanger tube inside each tank.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With stainless steel burners, which are located under the tank and insulated in the combustion chamber.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: On express request, gas fryers can be supplied, with heat exchange tubes, inside the tank / s, without price variation. In this case,
        the burners are cast iron, torch type, with the same power, as the clean bowl. Like the mod / cod. 39150317.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With thermostatic valve and maintenance pilot. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Electric desktop models, with the tank very easy to clean, by having a mechanism so that the resistance can tilt to the vertical position,
        which is operated by a lever located to the right and with a locking system, in its elevated position. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Electric models on support, with a very easy to clean tank, for having a mechanism, so that the resistances can rotate, to the vertical
        position. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: All resistors are armored stainless steel.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With safety thermostat that stops the fryer in case of abnormal increase in oil temperature.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: OPTIONALLY, can be requested, with electronic temperature control, (only electric fryers on stand). See ACCESSORIES.
      estil:
        color: '#000000'
        mida: 9.2
    - role: titol
      text: ELECTRIC FRIED CONSERVATORS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.2
    - role: text
      text: They are manufactured, on tabletop or on open support.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Equipped with a bowl GN 1 / 1-150, with double perforated and curved bottom to facilitate the collection of fried foods, all removable
        for cleaning.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With a ceramic resistance, located on the upper screen. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Equipped with an energy regulator, to adjust the desired temperature and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.2
    - role: titol
      text: ELECTRIC BAIN-MARIES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.2
    - role: text
      text: They are manufactured, on tabletop or on open support.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With the tanks, GN 1/1 or 2/1 depending on the model, welded to the countertop, with all rounded internal edges. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With drain tap, located on the front, with safety device, to prevent accidental opening.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Equipped with an adhesive resistance, located at the bottom of the tank, so that the inside of it is completely clean.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Equipped with thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: OPTIONALLY, we have a double perforated stainless steel bottom, see in ACCESSORIES, for the maintenance of food in pots, directly.
        Or if they wish, they can place different combinations of GN containers. (See catalog GROUP-16)
      estil:
        color: '#000000'
        mida: 9.2
    - role: titol
      text: GAS AND ELECTRIC PASTA COOKERS ON SUPPORT
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.2
    - role: text
      text: They are manufactured with 1 tank or 2 tanks.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: The supports are equipped with door / s as standard.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With GN 2/3 vats, made of AISI 316 stainless steel, welded to the embedded countertop, for easy cleaning. □
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With perforated grid to avoid food going to the bottom.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: It has □ filling and emptying taps.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With overflow to avoid the spillage of water and at the same time the evacuation of the starch from the paste, which floats.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Gas models, with stainless steel tubular burner
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With brass tap, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Electric models, equipped with a stainless steel resistance, armored.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: Equipped with switch-thermostat and pilot operation.
      estil:
        color: '#000000'
        mida: 9.2
    - role: text
      text: OPTIONALLY, can be requested with electronic temperature control. Likewise, we have packs, perforated baskets with handle / s completely
        made of stainless steel. See in ACCESSORIES. □
      estil:
        color: '#000000'
        mida: 9.2
    pos:
      x: 0.98
      y: 3.101
      w: 9.52
      h: 25.4
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 8.4
    - role: text
      text: En acier inoxydable, intérieur et extérieur.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Comptoirs de 1,5 mm. épais
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Jambes réglables dans tous les appareils.
      estil:
        color: '#000000'
        mida: 8.4
    - role: titol
      text: FRITEUSES À GAZ ET ÉLECTRIQUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 8.4
    - role: text
      text: Tous les modèles avec des paniers en acier chromé et des couvercles avec poignée.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Friteuses sur pied, équipées de porte/s en standard.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Avec des cuves entièrement soudées au comptoir, intégrées pour faciliter le nettoyage et éviter le débordement de l'huile. □
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Avec grille perforée pour éviter de déposer de la nourriture au fond.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Avec robinet de vidange, situé sur le devant de la friteuse, avec dispositif de sécurité, pour éviter toute ouverture accidentelle,
        dans les friteuses de table.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Les friteuses sur support portent le robinet de vidange dans la zone inférieure et sont équipées d'un réservoir pour vider l'huile,
        avec un filtre pour retenir les impuretés.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Avec zone froide généreuse, ce qui augmente la durée de l'huile.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Modèles à gaz, avec un réservoir propre, sans tubes, uniquement les protecteurs des ampoules des thermostats □, à l'exception du mod
        / cod. 39150317, qui porte un tube échangeur de chaleur à l'intérieur de chaque réservoir.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Avec des brûleurs en acier inoxydable, situés sous le réservoir et isolés dans la chambre de combustion.
      estil:
        color: '#000000'
        mida: 8.4
    - role: text
      text: Sur demande expresse, les friteuses à gaz peuvent être fournies avec des tubes d'échange de chaleur à l'intérieur du / des réservoir
        (s), sans variation de prix. Dans ce cas, les brûleurs sont en fonte, de type torche, avec la même puissance, que le bol propre. Comme
        le mod / cod. 39150317. Avec vanne thermostatique et pilote de maintenance. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique.
        Modèles sur table électriques, avec le réservoir très facile à nettoyer, grâce à un mécanisme permettant l'inclinaison de la résistance
        en position verticale, qui est actionnée par un levier situé à droite et avec un système de verrouillage, en position surélevée. □ Modèles
        électriques sur support, avec un réservoir très facile à nettoyer, pour avoir un mécanisme, de sorte que les résistances puissent tourner,
        en position verticale. □ Toutes les résistances sont en acier inoxydable blindé. Avec thermostat et indicateur de fonctionnement de la
        veilleuse. Avec thermostat de sécurité qui arrête la friteuse en cas d’augmentation anormale de la température de l’huile. OPTIONNELLEMENT,
        sur demande, avec contrôle électronique de la température (friteuses électriques uniquement sur pied). Voir ACCESSOIRES. RÉSERVES POUR
        FRITES ÉLECTRIQUES Ils sont fabriqués, sur table ou sur support ouvert. Équipé d'un bol GN 1 / 1-150, avec double fond perforé et incurvé
        pour faciliter la collecte des aliments frits, tous amovibles pour le nettoyage. Avec une résistance en céramique, situé sur l'écran supérieur.
        □ Équipé d'un régulateur d'énergie, pour ajuster la température désirée et l'indicateur de fonctionnement du pilote. BAINS-MARIE ÉLECTRIQUES
        Ils sont fabriqués, sur table ou sur support ouvert. Avec les réservoirs, GN 1/1 ou 2/1 selon le modèle, soudé au comptoir, avec tous
        les bords intérieurs arrondis. □ Avec robinet de vidange, situé à l'avant, avec dispositif de sécurité, pour empêcher toute ouverture
        accidentelle. Équipé d'une résistance adhésive, situé au bas de la cuve, de sorte que l'intérieur de celle-ci soit parfaitement propre.
        Équipé d'un thermostat et d'un indicateur de fonctionnement de la veilleuse. OPTIONNELLEMENT, nous avons un fond en acier inoxydable double
        perforé, voir dans ACCESSOIRES, pour le maintien de la nourriture dans des pots, directement. Ou s'ils le souhaitent, ils peuvent placer
        différentes combinaisons de conteneurs GN. (Voir catalogue GROUPE 16) CUISEUR A PÂTES À GAZ ET ÉLECTRIQUES SUR SUPPORT Ils sont fabriqués
        avec 1 réservoir ou 2 réservoirs. Les supports sont équipés de porte / s en standard. Avec les cuves GN 2/3, en acier inoxydable AISI
        316, soudées au plan de travail intégré, facilitant le nettoyage. □ Avec grille perforée pour éviter que les aliments ne tombent au fond.
        Il dispose de □ robinets de remplissage et de vidange. Avec trop-plein pour éviter le déversement d'eau et en même temps l'évacuation
        de l'amidon de la pâte, qui flotte. Modèles à gaz, avec brûleur tubulaire en acier inoxydable Avec robinet en laiton, équipé de positions
        de réglage maximum, minimum et pilote. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Modèles électriques, équipés
        d'une résistance en acier inoxydable, blindés. Equipé d'interrupteur-thermostat et d'opération pilote. EN OPTION, peut être demandé avec
        contrôle électronique de la température. De même, nous avons des paniers perforés avec poignée / s entièrement en acier inoxydable. Voir
        dans ACCESSOIRES. □
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 11.114
      y: 3.101
      w: 9.386
      h: 25.0
