- id: p49
  n: 49
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: E TABLES, OVEN BASES AND SUPPORTS F TABLES, BASES DE FOUR ET SUPPORTS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: 'GENERAL CONSTRUCTION In stainless steel AISI 304, interior and exterior. 1.5 mm countertops. of thickness. Adjustable legs in all
        models. SUPPORT TABLES There are models with drawer, with sliding guides. The mod / cod. 38890617, it has a desktop shelf, for the placement
        of a salamander, microwave etc. □ BASES ELECTRIC OVENS 600 mm high, made to support two 400 mm tabletop devices. Or one of 800 mm. □ Embedded
        stainless steel doors and counter-doors, properly insulated with fiberglass, and handle. □ Doors with reinforced hinges, with snap closure
        by spring. Frames equipped with gasket, with air chamber, made of AISI 304 stainless steel, braided, with FIBERGLASS, resistant to high
        temperatures (up to 540º C), to avoid heat loss and heating of countertop controls . They are static in operation. Equipped with an oven
        thermostat and grill switch, with indicator lights. The operation can be independent. □ With armored stainless steel resistors. As an
        endowment, they equip a GN 2/1 grid, 530x650 mm. OPEN OR DOOR SUPPORTS The furniture is manufactured to place the cooking elements on
        top of them, forming a set. OPTIONALLY, guides for GN 1/1 can be placed for the storage of said containers. □ We also offer a heating
        element, which is placed in the Base of the support with door / s, to keep food warm. □ You will find all this in the ACCESSORIES pages.
        ASSEMBLY SUPPORTS On which you can mount the elements you want, with the lower free zone, which facilitates cleaning. Four options are
        offered: (2M). The one that carries two uprights, one at each end. (1M). The one that carries an upright on one side, and the joists are
        supported with a standing equipment, such as a deep fryer .., on the other. (PU). It is the bridge version, since it consists of two joists,
        which go from one team standing to another. (MU). It is a longitudinal wall support, through which the connections of gas, water and electricity
        can pass. WE ALSO MANUFACTURE, TO PLACE UP TABLE ELEMENTS 600 mm high. HOT TABLES See in group catalog- GROUP-7 HOT EQUIPMENT COLD RESERVATIONS.
        See in catalog GROUP-11 INDUSTRIAL COLD'
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 1.297
      y: 3.317
      w: 9.386
      h: 25.0
  - idioma: fr
    paragrafs:
    - role: text
      text: 'CONSTRUCTION En acier inoxydable, intérieur et extérieur. Comptoirs de 1,5 mm. épais Jambes réglables dans tous les appareils. TABLES
        DE SUPPORT Il existe des modèles avec tiroir, avec guides coulissants. Le mod / cod. 38890617, il a une étagère de sur table, pour le
        placement d''une salamandre, micro-ondes, etc. □ FOURS ELECTRIQUES BASES 600 mm de haut, conçu pour supporter deux appareils de table
        de 400 mm. Ou un de 800 mm. □ Portes et contre-portes en acier inoxydable intégrées, correctement isolées avec de la fibre de verre et
        poignée. □ Portes à charnières renforcées, à fermeture à ressort. Cadre de fours équipés de joint d''étanchéité, avec chambre à air, en
        acier inoxydable AISI 304, tressés, en fibre de verre, FIBERGLASS, résistant aux températures élevées (jusqu''à 540 ° C), pour éviter
        les déperditions de chaleur et le chauffage des commandes de comptoir . Ils sont statiques dans leur fonctionnement. Équipé d''un thermostat
        de four et d''un commutateur de gril, avec voyants. L''opération peut être indépendante. □ Avec des résistances blindées en acier inoxydable.
        En dotation, ils équipent une grille GN 2/1 de 530x650 mm. SUPPORTS OUVERTS AVEC PORTES Le mobilier est fabriqué de manière à placer les
        éléments de cuisson au dessus d’eux, formant ainsi un ensemble. FACULTATIVEMENT, des guides pour GN 1/1 peuvent être placés pour le stockage
        desdits conteneurs. □ Nous proposons également un élément chauffant, placé dans la base du support avec la / les porte (s), pour maintenir
        les aliments au chaud. □ Vous trouverez tout cela dans les pages ACCESSOIRES. SUPPORTS DE MONTAGE Sur lequel vous pouvez monter les éléments
        de votre choix, avec la zone libre inférieure, ce qui facilite le nettoyage. Quatre options sont proposées: (2M). Celui qui porte deux
        montants, un à chaque extrémité. (1M). Celui qui porte un montant d’un côté et les solives est soutenu par un équipement permanent, comme
        une friteuse, de l’autre. (PU). Il s’agit de la version bridge car elle est constituée de deux solives qui vont d’une équipe à l’autre.
        (MU). C''est un support mural longitudinal à travers lequel les connexions de gaz, d''eau et d''électricité peuvent passer. NOUS FABRIQUONS
        AUSSI, DE PLACER SUR DES ÉLÉMENTS DE TABLE 600 mm de haut. Tables chaudes Afficher dans GROUPE 7 ÉQUIPEMENT CHAUD RÉSERVATIONS FROIDES.
        Voir dans GROUPE 11 INDUSTRIEL FROID'
      estil:
        color: '#000000'
        mida: 8.4
