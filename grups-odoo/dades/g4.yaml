    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: COCINAS i WOKS DE INDUCCIÓN i WOKS A GAS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Con patas regulables. COCINAS DE INDUCCIÓN Con cristal schott de 6
        mm, de espesor Dicho cristal, es muy fácil de limpiar, al ser totalmente plano. □ Con placas de 3,5 KW. □ La zona de cocción de esas placas,
        no quema, puesto que la tecnología de la inducción, consiste en calentar por ondas magnéticas, a través de un generador. Por ello deben
        usarse recipientes, sartenes, ollas, etc. especiales con el fondo de los mismos de material férrico. Y cuando no detecta, dicho recipiente,
        se pára automáticamente, en 60 segundos. Dicho sistema es caro, pero se amortiza rápidamente, puesto que el consumo de energía eléctrica,
        baja un 40%, con relación a una cocina eléctrica y el 50% si se compara con una de gas. El tiempo de cocción en consecuencia, se reduce
        a la mitad de los otros sistemas, y además tiene la ventaja de aumentar o disminuir la temperatura al instante. Tampoco consume nada,
        cuando se retira el recipiente, no precisando pilotos de mantenimiento ni posiciones de mínimo, lo que también es un ahorro de energía.
        Con mando rotatorio para el control de potencia. □ Modelos de sobremesa o sobre soporte abierto (opcionalmente, se pueden colocar puertas).
        □ WOKS DE INDUCCIÓN Con el cristal schott, cóncavo, para alojar la sartén. □ Dicho cristal, es muy fácil de limpiar.  Con placas cilíndricas
        de 5 KW. □ La zona de cocción de los woks de inducción, no queman, puesto que la tecnología de la inducción, consiste en calentar por
        ondas magnéticas, a través de un generador. Por ello deben usarse sartenes con base cilíndrica, □ especiales, de material férrico. Y cuando
        no detecta, dicha sartén, se pára automáticamente, en 60 segundos. Dicho sistema es caro, pero se amortiza rápidamente, puesto que el
        consumo de energía eléctrica, baja un 50%, con relación a un wok de gas. El tiempo de cocción en consecuencia, se reduce a la mitad, y
        además tiene la ventaja de aumentar o disminuir la temperatura al instante. Tampoco consume nada, cuando se retira la sartén, no precisando
        pilotos de mantenimiento ni posiciones de mínimo, lo que también es un ahorro de energía. Con mando rotatorio para el control de potencia.
        □ Modelos de sobremesa o sobre soporte abierto (opcionalmente, se pueden colocar puertas). □ WOKS A GAS Encimeras embutidas de 1,5 mm,
        de espesor, con refuerzos, para evitar deformaciones. □ Quemadores circulares de fundición de hierro, de gran rendimiento de 14 KW. de
        potencia. □ Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto, con bobina de seguridad y termopar. Con parrillas
        redondas de fundición vitrificadas, de Ø 350/370. □ Para su uso, con sartenes con base cilíndrica. □ Con bandejas recoge grasas, extraíbles.
        □ Modelos de sobremesa o sobre soporte abierto (opcionalmente, se pueden colocar puertas). □
