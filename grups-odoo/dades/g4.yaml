- id: p35
  n: 35
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: FREIDORAS, CONSERVADORES DE FRITOS, BAÑOS MARÍA Y CUECE PASTA
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.0
    - role: text
      text: En acero inoxidable, interior y exterior.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Encimeras de 1,5 mm. de espesor.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Patas regulables en todos los aparatos.
      estil:
        color: '#000000'
        mida: 10.0
    - role: titol
      text: FREIDORAS A GAS Y ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.0
    - role: text
      text: Todos los modelos con cestas de acero cromado y tapas con asa.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Las freidoras sobre soporte, equipadas con puerta/s de serie.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con cubas totalmente soldadas a la encimera, embutida para facilitar la limpieza y así mismo evitar que el aceite rebose. □
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con rejilla perforada para evitar vayan alimentos al fondo.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con grifo de vaciado, situado en el frontal de la freidora, con dispositivo de seguridad, para evitar la abertura accidental, en freidoras
        de sobremesa.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Las freidoras sobre soporte, llevan el grifo de desagüe en la zona inferior, y van dotadas de una cuba para el vaciado del aceite,
        con filtro para retener las impurezas.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con generosa zona fría, lo cual aumenta la duración del aceite.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Modelos a gas, con cuba limpia, sin tubos, solo los protectores de los bulbos de los termostatos □, excepto el mod/cod. 39150317,
        que lleva un tubo intercambiador de calor en el interior de cada cuba.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con quemadores de acero inoxidable, que van ubicados debajo de la cuba y aislados en la cámara de combustión.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: A petición expresa, se pueden suministrar las freidoras a gas, con tubos intercambiadores de calor, en el interior de la/s cuba/s,
        sin variación de precio. En tal caso los quemadores son de fundición, tipo soplete, con la misma potencia, que los de cuba limpia. Al
        igual que el mod/cod. 39150317.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con válvula termostática y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Modelos eléctricos de sobremesa, con la cuba muy fácil de limpiar, por disponer de un mecanismo para que la resistencia pueda bascular
        hasta la posición vertical, que se acciona mediante una palanca situada a la derecha y con un sistema de bloqueo, en su posición elevada.
        □
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Modelos eléctricos sobre soporte, con cuba muy fácil de limpiar, por disponer de un mecanismo, para que las resistencias puedan rotar,
        hasta la posición vertical. □
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Todas las resistencias son de acero inoxidable blindadas.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con termostato de seguridad que pára la freidora en caso de aumento anormal de la temperatura del aceite.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: OPCIONALMENTE, se pueden solicitar, con control electrónico de temperatura, (solo freidoras eléctricas sobre soporte). Ver ACCESORIOS.
      estil:
        color: '#000000'
        mida: 10.0
    - role: titol
      text: CONSERVADORES DE FRITOS ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.0
    - role: text
      text: Se fabrican, de sobre-mesa o sobre soporte abierto.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Equipados con una cuba GN 1/1-150, con doble fondo perforado y curvado para facilitar la recogida de fritos, todo ello extraíble para
        su limpieza.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con una resistencia cerámica, situada en la pantalla superior. □
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Dotado de regulador de energía, para adecuar la temperatura deseada y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.0
    - role: titol
      text: BAÑOS MARÍA ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.0
    - role: text
      text: Se fabrican, de sobre-mesa o sobre soporte abierto.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con las cubas, GN 1/1 ó 2/1 según modelo, soldada a la encimera, con todos los cantos internos redondeados. □
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con grifo de desagüe, situado en el frontal, con dispositivo de seguridad, para evitar la abertura accidental.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Equipados con una resistencia adhesiva, situada en el fondo de la cuba, de manera que el interior de la misma esta totalmente limpio.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Dotados de termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: OPCIONALMENTE, disponemos de un doble fondo perforado de acero inoxidable, ver en ACCESORIOS, para el mantenimiento de alimentos en
        ollas, directamente. O si lo desean, pueden colocar distintas combinaciones de recipientes GN. (Ver catálogo GRUPO-16)
      estil:
        color: '#000000'
        mida: 10.0
    - role: titol
      text: CUECE PASTA A GAS Y ELÉCTRICOS SOBRE SOPORTE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.0
    - role: text
      text: Se fabrican con 1 cuba ó 2 cubas.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Los soportes van equipados con puerta/s de serie.
      estil:
        color: '#000000'
        mida: 10.0
    - role: text
      text: Con las cubas GN 2/3, fabricadas en acero inoxidable AISI 316, soldadas a la encimera embutida, para facilitar la limpieza. □
      estil:
        color: '#000000'
