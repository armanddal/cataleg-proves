  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Patas regulables en todos los aparatos. BARBACOAS A GAS DE SOBREMESA
        O SOBRE SOPORTE ABIERTO Funcionamiento mediante quemadores tubulares de acero inoxidable, que calientan la piedra volcánica, □ que se
        halla situada encima de una rejilla-soporte de acero inoxidable. Al calentar la piedra, hace la función de auténtica brasa. Con grifos
        de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar. Con encendido piezo-eléctrico. □
        Equipan parrillas, □ formadas por perfiles en “V” siempre de acero inoxidable, de 400 mm. de ancho, las cuales son ideales para carnes,
        verduras, etc. En ACCESORIOS, pueden ver como opción , las parrillas especiales para pescado, (que están construidas con perfiles redondos)
        Con un sistema que permite la colocación de parrilla en 2 posiciones, utilizando para ello las asas de baquelita de que dispone la parrilla
        y con peto alrededor de la parrilla, para evitar salpicaduras. □ Con cajón recoge-grasas. □ Modelos sobre soporte abierto □ (opcionalmente,
        se pueden colocar puertas). BARBACOAS A GAS-GRILL VAPOR CON SOPORTE CON PUERTAS Funcionamiento mediante quemadores tubulares de acero
        inoxidable, que calientan la piedra volcánica, □ que se halla situada encima de una rejilla-soporte de acero inoxidable. Al calentar la
        piedra, hace la función de auténtica brasa. Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de
        seguridad y termopar. Con encendido piezo-eléctrico. □ Equipan parrillas de fundición, esmaltadas, de 400 mm, de ancho (una o dos, según
        el modelo), de doble uso, para carne o pescado, simplemente invirtiendo su posición. □ Con un sistema que permite la colocación de parrilla
        en 2 posiciones, utilizando para ello las asas de baquelita de que dispone la parrilla y con peto alrededor de la parrilla, para evitar
        salpicaduras. □ Debajo, está situada una cuba, que se debe llenar de agua, en la cual caen las grasas de la cocción, lo cual reduce el
        humo generado y produce el vapor, para que los alimentos queden sabrosos y muy jugosos. □ Así mismo, es muy fácil de limpiar puesto que
        dispone de un grifo de desagüe, en la parte inferior. BARBACOAS ELECTRICAS-GRILL VAPOR, DE SOBREMESA O SOBRE SOPORTE ABIERTO La cocción-grill,
        se realiza mediante resistencias tubulares de acero inoxidable, las cuales basculan para su limpieza, mediante una palanca situada a la
        derecha, y con un sistema de bloqueo, en su posición elevada. □ Con un conmutador con varias posiciones y piloto indicador de funcionamiento.
        Debajo, está situada una cuba, que debe ser llenada con agua, en la cual caen las grasas de la cocción, lo cual reduce el humo generado
        y genera el vapor, para que los alimentos queden sabrosos y muy jugosos. Así mismo, es muy fácil de limpiar, puesto que dispone de un
        grifo de desagüe en la parte inferior, con un piloto luminoso en el frontal, que indica cuando precisa agua, que por la ebullición se
        ha evaporado.  Modelos sobre soporte abierto. □(opcionalmente, se pueden colocar puertas).
      estil:
