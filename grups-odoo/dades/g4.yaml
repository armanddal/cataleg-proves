- id: p31
  n: 31
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: BARBACOAS
      en: BARBECUES F BARBECUES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERAL CONSTRUCTION In stainless steel AISI 304, interior and exterior. Adjustable legs in all appliances. GAS BARBECUES Operation
        by means of stainless steel tubular burners, which heat the volcanic stone, □ which is located above a stainless steel support grid. When
        heating the stone, it acts as an authentic grill. With brass taps, equipped with adjustable maximum, minimum and pilot position. With
        safety coil and thermocouple. With piezo-electric ignition. □ They are equipped with grills, □ formed by “V” profiles, always made of
        stainless steel, 400 mm. wide, which are ideal for meats, vegetables, etc. In ACCESSORIES, you can see as an option, special grills for
        fish, (which are built with round profiles). With a system that allows the placement of a grill in 2 positions, using the bakelite handles
        available on the grill and with bib around the grill, to avoid splashing. □ With fat collection drawer. □ Tabletop models or on an open
        stand. □ (optionally, doors can be added). GAS BARBECUES - STEAM GRILL WITH STAND AND DOORS Operated by stainless steel tubular burners
        that heat the volcanic stone, □ which is located above a stainless steel support grid. By heating the stone, it functions as a true charcoal.
        With brass taps, equipped with adjustable maximum, minimum, and pilot position. With safety coil and thermocouple. With piezoelectric
        ignition. □ Equipped with enamelled cast iron grills, 400 mm wide (one or two, depending on the model), dual-use for meat or fish, simply
        by reversing their position. □ With a system that allows the grill to be placed in 2 positions, using the bakelite handles of the grill
        and with a surround to prevent splashes. □ Below, there is a tub that must be filled with water, into which the cooking fats fall, reducing
        the smoke generated and producing steam, so the food remains tasty and very juicy. □ Additionally, it is very easy to clean as it has
        a drain tap at the bottom. ELECTRIC BARBECUES-STEAM GRILL, TABLETOP OR OPEN STAND Grill cooking is done using tubular stainless steel
        resistances, which tilt for cleaning, using a lever located on the right, with a locking system in the raised position. □ With a switch
        with multiple positions and an indicator light for operation. Below, there is a tub that must be filled with water, into which cooking
        fats fall, reducing the smoke generated and creating steam, making the food tasty and very juicy. It is also very easy to clean, as it
        has a drain tap at the bottom, with an indicator light on the front, showing when it needs water, which has evaporated due to boiling.
        Models on an open stand . □(optionally, doors can be added).
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 0.98
      y: 3.435
      w: 9.43
      h: 24.7
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable AISI 304, intérieur et extérieur. Jambes réglables dans tous les appareils. BARBECUE À GAZ Fonctionnement
        au moyen de brûleurs tubulaires en acier inoxydable, qui chauffent la pierre volcanique □, situés au-dessus d’une grille de support en
        acier inoxydable. En chauffant la pierre, elle agit comme un grill authentique. Avec robinets en laiton, équipés de positions de réglage
        maximum, minimum et pilote. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. □ Ils sont équipés de grilles □ formées
        de profilés en «V», toujours en acier inoxydable de 400 mm. large, idéal pour les viandes, les légumes, etc. Dans ACCESSOIRES, vous pouvez
        voir en option des grilles spéciales pour le poisson (construites avec des profils ronds). Avec un système qui permet de placer un gril
        dans 2 positions, en utilisant les poignées en bakélite disponibles sur le gril et avec un bavoir autour du gril pour éviter les éclaboussures.
        □ Avec tiroir de récupération des graisses. □ Modèles de table ou sur support ouvert □ (des portes peuvent être ajoutées en option). BARBECUES
        À GAZ - GRIL VAPEUR AVEC SUPPORT ET PORTES Fonctionne avec des brûleurs tubulaires en acier inoxydable qui chauffent la pierre volcanique,
        □ située au-dessus d'une grille de support en acier inoxydable. En chauffant la pierre, elle agit comme une véritable braise. Avec robinets
        en laiton, équipés d'un maximum réglable, d'un minimum et d'une position veilleuse. Avec bobine de sécurité et thermocouple. Avec allumage
        piézo-électrique . □ Équipées de grilles en fonte émaillée, de 400 mm de large (une ou deux, selon le modèle), à double usage, pour la
        viande ou le poisson, simplement en inversant leur position. □ Avec un système permettant de placer la grille en 2 positions, en utilisant
        les poignées en bakélite de la grille et avec un pare-éclaboussures autour de la grille. □ En dessous, il y a une cuve qui doit être remplie
        d'eau, dans laquelle tombent les graisses de cuisson, ce qui réduit la fumée générée et produit de la vapeur, pour que les aliments restent
        savoureux et très juteux. □ De plus, il est très facile à nettoyer car il dispose d'un robinet de vidange en bas. BARBECUES ÉLECTRIQUES-GRILL
        À VAPEUR, DE TABLE OU SUR SUPPORT OUVERT La cuisson-grill se fait à l'aide de résistances tubulaires en acier inoxydable, qui basculent
        pour le nettoyage, à l'aide d'un levier situé à droite, et avec un système de blocage, en position élevée. □ Avec un commutateur à plusieurs
        positions et un témoin lumineux de fonctionnement. En dessous, se trouve une cuve, qui doit être remplie d'eau, dans laquelle tombent
        les graisses de la cuisson, ce qui réduit la fumée générée et crée de la vapeur, rendant les aliments savoureux et très juteux. De plus,
        il est très facile à nettoyer, car il dispose d'un robinet de vidange en bas, avec un témoin lumineux sur le devant, indiquant quand il
        faut rajouter de l'eau, qui s'est évaporée par ébullition.  Modèles sur support ouvert. □(des portes peuvent être ajoutées en option).
      estil:
        color: '#000000'
        mida: 8.4
