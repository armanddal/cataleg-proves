  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable AISI 304, intérieur et extérieur. Comptoirs de 1,5 mm. épais Jambes réglables dans tous les modèles.
        SAUTEUSES FIXES OU CUISEURS MULTIFONCTIONS ÉLECTRIQUES Ce sont des appareils qui peuvent être utilisés comme frytop, sauteuse, marmite
        ou bain-marie. Cuba soudé au comptoir, en acier inoxydable AISI 316. Avec tous les bords intérieurs arrondis et la base du matériau, COMPOUND,
        pour une meilleure conductivité thermique et résistance. De dimensions GN 1/1 ou GN 2/1, selon le modèle. □ Équipé de résistances blindées
        ultra-rapides en acier inoxydable, montées dans des tiroirs correctement isolés. Avec thermostat / s réglable / s jusqu'à 300 ° C et indicateur
        de fonctionnement. Avec thermostat de sécurité. OPTIONNELLEMENT, il peut être fourni avec un contrôle électronique de la température.
        Voir dans ACCESSOIRES. Avec robinet de vidange, en bas. Avec réservoir de vidange, équipé d'une poignée. □ Sous support ouvert, avec tablette
        inférieure. FACULTATIVEMENT, les portes peuvent être placées. Voir dans ACCESSOIRES. SAUTEUSES BASCULANTES À GAZ OU ELECTRIQUES Avec des
        cuves en acier inoxydable, avec le fond de 12 mm. épais Avec des bords arrondis pour faciliter le nettoyage et avec une conception pour
        vider les aliments lors de l'inclinaison. □ Le basculement du réservoir est effectué à l'aide d'un volant à main, actionné manuellement,
        pour le monter ou le baisser. Avec couvercle muni d’un ressort de pression de fermeture ou d’ouverture et de la poignée correspondante.
        Avec bec verseur pour le remplissage d'eau, □ avec la commande de robinet à l'avant. Le modèle à gaz, avec des brûleurs tubulaires en
        acier inoxydable. Avec vanne thermostatique, réglable de 100 à 300ºC, et pilote de maintenance. Avec bobine de sécurité et thermocouple.
        Avec allumage piézo-électrique. Ils ont un judas. Le modèle électrique, avec des résistances blindées en acier inoxydable, est monté dans
        des tiroirs correctement isolés. Avec thermostat réglable jusqu'à 300ºC et indicateur de fonctionnement. MARMITES INDIRECTS DE GAZ OU
        D'ÉLECTRICITÉ Avec plan de travail incorporé, auquel est soudé un réservoir cylindrique, avec le fond en acier inoxydable AISI 316, avec
        tous les bords arrondis, pour faciliter le nettoyage. Avec double chambre pour l'eau, empêchant ainsi les aliments de coller au fond et
        aux côtés du réservoir. Avec couvercle équipé d'un ressort de pression de fermeture ou d'ouverture vertical et de la poignée correspondante.
        □ Ils sont également équipés d'un groupe de sécurité et d'un manomètre de contrôle. □ Le remplissage de la chambre est effectué au moyen
        du tuyau disponible qui peut tourner et qui sert à son tour au remplissage du réservoir avec de l'eau chaude ou froide. □ Avec robinet
        d'évacuation avant de 2 pouces. Le modèle à gaz chauffe au moyen de brûleurs tubulaires en acier inoxydable. Avec robinet en laiton, équipé
        de positions de réglage maximum, minimum et pilote. Avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique. Il a une
        lunette de visée. Le modèle électrique fonctionne avec une résistance, en acier inoxydable blindé, immergé dans la chambre à eau elle-même.
        Contrôlé à l'aide d'un commutateur, avec 4 positions et indicateur de fonctionnement du pilote. Avec interrupteur marche-arrêt. OPTIONNELLEMENT,
        des paniers perforés peuvent être fournis, pour les pâtes, le riz, etc. avec des trous de 3 mm. Ø, ou pour les légumes, etc. 5 mm Ø. Voir
        dans ACCESSOIRES.
