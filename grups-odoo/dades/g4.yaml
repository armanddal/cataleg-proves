- id: p23
  n: 23
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: E GRIDDLES FRYTOP F PLAQUES FRYTOPS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: CONSTRUCTION In AISI 304 stainless steel, interior and exterior. All models with □ front grease collection drawer and conical sealing
        plug. □ Embedded countertops, with rounded edges, made of AISI 304 stainless steel, 1.5 mm thick. □ With removable backsplash for easy
        cleaning. □ Adjustable legs on all devices. TABLETOP OR OPEN-STAND GAS GRIDDLES-FRYTOPS With stainless steel tubular burners. With piezo-electric
        ignition. The models equipped with iron plates have brass taps, featuring adjustable maximum, minimum, and pilot positions. With safety
        coil and thermocouple. The models equipped with hard chrome plates have a thermostatic valve and maintenance pilot. With safety coil and
        thermocouple. TABLETOP OR OPEN-STAND ELECTRIC GRIDDLES-FRYTOPS With stainless steel sheathed heating elements, mounted in properly insulated
        drawers. With thermostat and operation indicator light. OPTIONALLY, models on stands can be requested with electronic temperature control
        installation. See ACCESSORIES. IRON TOP PLATES 15 mm thick, welded all around, top and bottom, for maximum hygiene. With front drain.
        The surface of these plates can be smooth, fully grooved, or mixed (2/3 smooth and 1/3 grooved), in some models. HARD CHROME TOP PLATES
        15 mm thick, rectified and with 50-micron hard chrome plating. Welded all around, top and bottom, for maximum hygiene. With front drain.
        Supplied with a spatula-cutter □ for cleaning, which should be used without hitting, only sliding the blade over the countertop. The cleaning
        method is once the griddle is off and after 30/45 minutes (still warm), ice cubes should be placed, which will evaporate immediately.
        Then the spatula-cutter should be gently passed to remove as much grease as possible, and then a damp cloth. Do not use degreaser until
        the next day before starting the griddle, and the surface will be as shiny as new. These plates are always smooth.
      estil:
        color: '#000000'
        mida: 8.4
    pos:
      x: 0.98
      y: 3.101
      w: 9.43
      h: 24.5
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION En acier inoxydable AISI 304, intérieur et extérieur. Tous les modèles avec □ tiroir ramasse-graisse à l'avant et bouchon
        d'étanchéité conique. □ Plans de travail emboutis, avec bords arrondis, en acier inoxydable AISI 304, d'une épaisseur de 1,5 mm.□ Avec
        dosseret amovible pour faciliter le nettoyage. □ Pieds réglables sur tous les appareils. PLAQUES-FRYTOP À GAZ, DE TABLE OU SUR SUPPORT
        OUVERT Avec brûleurs tubulaires en acier inoxydable. Avec allumage piézo-électrique. Les modèles équipés de plaques en fer disposent de
        robinets en laiton, dotés de positions maximum réglable, minimum et pilote. Avec bobine de sécurité et thermocouple. Les modèles équipés
        de plaques en chrome dur disposent d'une valve thermostatique et d'un pilote d'entretien. Avec bobine de sécurité et thermocouple. PLAQUES-FRYTOP
        ÉLECTRIQUES, DE TABLE OU SUR SUPPORT OUVERT Avec résistances blindées en acier inoxydable, montées dans des tiroirs correctement isolés.
        Avec thermostat et voyant de fonctionnement. OPTIONNELLEMENT, les modèles sur support peuvent être demandés avec installation de contrôle
        électronique de température. Voir ACCESSOIRES. PLAQUES SUPÉRIEURES EN FER D'une épaisseur de 15 mm, soudées tout autour, supérieur et
        inférieur, pour une hygiène maximale. Avec drain frontal. La surface de ces plaques peut être lisse, totalement rainurée, ou mixte (2/3
        lisse et 1/3 rainurée), selon certains modèles. PLAQUES SUPÉRIEURES EN CHROME DUR D'une épaisseur de 15 mm, rectifiées et avec un revêtement
        en chrome dur de 50 microns. Soudées tout autour, supérieur et inférieur, pour une hygiène maximale. Avec drain frontal. Fournies avec
        une spatule-cutter □ pour le nettoyage, qui doit être utilisée sans frapper, en glissant seulement la lame sur le plan de travail. La
        méthode de nettoyage est une fois la plancha éteinte et après 30/45 minutes (encore chaude), des glaçons doivent être placés, qui s'évaporeront
        immédiatement. Ensuite, la spatule-cutter doit être passée doucement pour éliminer au maximum la graisse, puis un chiffon humide. Ne pas
        utiliser de dégraissant avant le lendemain avant de démarrer la plancha, et la surface sera brillante comme neuve. Ces plaques sont toujours
        lisse.
      estil:
        color: '#000000'
        mida: 8.4
