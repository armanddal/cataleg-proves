- id: p48
  n: 48
  tipus: informacio_general
  capcalera:
    banda: assets/g4/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: '700'
    logo_serie: assets/g4/logo-serie-master.png
    titol:
      es: MESAS, BASES HORNOS Y SOPORTES
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: 'CONSTRUCCIÓN En acero inoxidable AISI 304, interior y exterior. Encimeras de 1,5 mm. de espesor. Patas regulables en todos los modelos.
        MESAS DE APOYO Hay modelos con cajón, con guías correderas.  El mod/cod. 38890617, dispone de un estante de sobremesa, para la colocación
        de una salamandra, microondas etc. □ BASES HORNOS ELÉCTRICOS De altura 600 mm., realizados para soportar dos aparatos de sobre-mesa de
        400 mm. O uno de 800 mm. □ Puertas y contra-puertas embutidas, de acero inoxidable, debidamente aisladas con fibra de vidrio, y tirador.
        □ Puertas con bisagras reforzadas, con cierre a presión mediante muelle. Marcos dotados de junta, con cámara de aire, de acero inoxidable
        AISI 304, trenzado, con fibra de vidrio, FIBERGLASS, resistente a altas temperaturas (hasta 540º C), para evitar la pérdida de calor y
        el calentamiento de los mandos de las encimeras. Son de funcionamiento estáticos. Equipados con un termostato para el horno y conmutador
        para el grill, con pilotos indicadores. El funcionamiento puede ser independiente. □ Con resistencias blindadas de acero inoxidable. Como
        dotación equipan una rejilla GN 2/1, de 530x650 mm. SOPORTES ABIERTOS Y CON PUERTAS Los muebles están fabricados para colocar encima de
        ellos los elementos de cocción, formando un conjunto. OPCIONALMENTE, se pueden colocar guías para GN 1/1, para el almacenamiento de dichos
        recipientes. □ También ofrecemos un elemento calefactor, que se coloca en la Base del soporte con puerta/s, para mantener alimentos calientes.
        □ Todo ello lo encontraran en las páginas de ACCESORIOS. SOPORTES CON MONTANTES Sobre los cuales se pueden montar los elementos que deseen,
        con la zona inferior libre, lo cual facilita la limpieza. Se ofrecen cuatro opciones: (2M). El que lleva dos montantes, uno en cada extremo.
        (1M). El que lleva un montante en un lado, y las viguetas se soportan con un equipo de pie, como por ejemplo una freidora.., en el otro.
        (PU). Es la versión puente, ya que consta de dos viguetas, que van de un equipo de pie a otro. (MU). Es un soporte mural, longitudinal,
        por el interior del cual pueden pasar las acometidas, de gas, agua y electricidad. TAMBIEN FABRICAMOS, PARA COLOCAR ENCIMA ELEMENTOS DE
        SOBRE-MESA De altura 600 mm. MESAS CALIENTES. Ver en Catalogo GRUPO-7 EQUIPOS CALIENTES RESERVAS FRIAS. Ver en Catalogo GRUPO-11 FRÍO
        INDUSTRIAL'
