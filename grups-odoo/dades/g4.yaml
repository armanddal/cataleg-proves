  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERAL CONSTRUCTION In stainless steel AISI 304, interior and exterior. 1.5 mm countertops. of thickness. Adjustable legs in all
        models. FIXED PAN OR ELECTRIC MULTIFUNCTION COOKERS They are devices that can be used as iron-frytop, fixed pan, kettle or bain maries.
        Cuba welded to the countertop, in AISI 316 stainless steel. With all rounded internal edges and the material base, COMPOUND, for better
        heat conductivity and resistance. Of dimensions GN 1/1 or GN 2/1, depending on the model. □ Equipped with ultra-fast, stainless steel,
        shielded resistors, mounted in properly insulated drawers. With thermostat / s adjustable / s up to 300ºC and pilot indicator of operation.
        With safety thermostat. OPTIONALLY, it can be supplied with electronic temperature control. See in ACCESSORIES. With drain tap, at the
        bottom. With tank for emptying, equipped with handle. □ Under open support, with lower shelf. OPTIONALLY, door / s can be placed. See
        in ACCESSORIES. GAS OR ELECTRIC TILTING BRAD PANS With stainless steel vats, with the bottom of 12 mm. of thickness. With rounded edges,
        to facilitate cleaning, and with design for the emptying of food, when tilting. □ The tipping of the tank is carried out by means of a
        handwheel, which is operated manually, to raise or lower it. With lid equipped with a closing or opening pressure spring, and its corresponding
        handle. With spout for water filling, □ with the tap control on the front. The gas model, with tubular stainless steel burners. With thermostatic
        valve, adjustable from 100 to 300ºC, and maintenance pilot. With safety coil and thermocouple. With piezo-electric ignition. They have
        a peephole. The electric model, with shielded stainless steel resistors, mounted in properly insulated drawers. With thermostat adjustable
        up to 300ºC and pilot indicator of operation. GAS OR ELECTRIC INDIRECT BOILING PANS With embedded countertop, to which a cylindrical tank
        is welded, with the bottom in stainless steel AISI 316, with all rounded edges, to facilitate cleaning. With double chamber for water,
        and thus prevent food from sticking to the bottom and sides of the tank. With cover equipped with a vertical closing or opening pressure
        spring and its corresponding handle. □ They are also equipped with a safety group and control manometer. □ The filling of the chamber
        is carried out, by means of the available pipe, which is rotatable and in turn is used for filling the tank, with hot or cold water. □
        With 2-inch front drain tap. The gas model heats by means of stainless steel tubular burners. With brass tap, equipped with adjustable
        maximum, minimum and pilot position. With safety coil and thermocouple. With piezo-electric ignition. It has a front sight glass. The
        electric model, works with a resistor, armored stainless steel, submerged in the water chamber itself. Controlled by means of a switch,
        with 4 positions and pilot operation indicator. With start-stop switch. OPTIONALLY, perforated baskets can be supplied, for pasta, rice
        etc. with 3 mm Ø holes, or for vegetables, etc. 5 mm. See in ACCESSORIES.
      estil:
        color: '#000000'
        mida: 8.4
