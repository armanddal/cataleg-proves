  - pos:
      x: 2.5
      y: 5.621
      w: 17.5
      h: 2.043
    textos:
      es:
      - role: text
        text: PORTES EN ESPAÑA Pagados en península y Baleares, a partir de 500,- €. En caso de importe inferior (base imponible), se cargarán
          en factura.
    icona: assets/g4/condicions-icona-p57-3.png
  - pos:
      x: 2.5
      y: 7.715
      w: 17.5
      h: 1.986
    textos:
      es:
      - role: text
        text: CARACTERÍSTICAS TÉCNICAS
      - role: text
        text: Como fabricantes, nos reservamos el derecho de modificar sin previo aviso las características que constan en este catálogo, en beneficio
          de mejorar nuestros productos.
    icona: assets/g4/condicions-icona-p57-4.png
  - pos:
      x: 2.5
      y: 9.897
      w: 17.5
      h: 3.7
    textos:
      es:
      - role: text
        text: GARANTIA
      - role: text
        text: La garantía se concede solamente en los defectos de fabricación quedando excluidos de ella la utilización indebida. PIEZAS Dicha
          garantía es de 12 meses en piezas defectuosas, siendo por cuenta del cliente los portes de ida y vuelta de dichas piezas. Todo material
          remitido en garantía se facturará y se procederá a su correspondiente abono, una vez remitidas las piezas defectuosas y comprobadas
          por parte del fabricante. MANO DE OBRA El servicio de mano de obra y los desplazamiento son siempre por cuenta del cliente. El fabricante
          no se hará cargo en ningún caso de ningún tipo o clase de indemnización.
    icona: assets/g4/condicions-icona-p57-5.png
  - pos:
      x: 2.5
      y: 13.548
      w: 17.5
      h: 1.5
    textos:
      es:
      - role: text
        text: JURISDICCIÓN
      - role: text
        text: Serán únicamente competentes, en caso de litigio, los tribunales de Barcelona.
    icona: assets/g4/condicions-icona-p57-6.png
  - pos:
      x: 0.0
      y: 15.241
      w: 21.0
      h: 0.798
    barra_idiomes:
      en: SALES CONDITIONS
      fr: CONDITIONS DE VENTE
    color_fons: '#a22b2d'
  - pos:
      x: 2.5
      y: 16.078
      w: 17.5
      h: 2.0
    textos:
      en:
      - role: text
        text: PRICES The prices in this list are retail prices (EX-WORKS). F PRIX Les prix du présent tarif correspondent à des Prix de Vente
          au Public. (EX-WORKS).
    icona: assets/g4/condicions-icona-p57-1.png
  - pos:
      x: 2.5
      y: 17.747
      w: 17.5
      h: 1.8
    textos:
      en:
      - role: text
        text: PAYMENT CONDITIONS Irrevocable letter of credit or Swift. F FORME DE PAIEMENT Lettre de crédit bancaire irrévocable o virement bancaire.
    icona: assets/g4/condicions-icona-p57-2.png
  - pos:
      x: 2.5
      y: 19.428
      w: 17.5
      h: 2.7
    textos:
      en:
      - role: text
        text: TECHNICAL CHARACTERISTICS As a manufacturer, we reserve the right to modify the characteristics of our catalogues without prior
          notice, in the interest of improving our products. F CARACTERISTIQUES TECHNIQUES En tant que fabricants, nous nous réservons le droit
          de modifier sans préavis, les caractéristiques indiquées dans le présent catalogue, dans le but d’améliorer nos produïts.
    icona: assets/g4/condicions-icona-p57-4.png
  - pos:
      x: 2.5
      y: 22.104
      w: 17.5
      h: 4.9
    textos:
      en:
      - role: text
        text: GUARANTEE The guarantee only covers manufacturing defects and excludes unauthorized use. PARTS The guarantee for defective parts
          are 12 months. All shipping costs are to be paid by the consumer. The manufacturer does not accept any responsability for any type of
          comprensation. F GARANTIE La garantie couvre uniquement les défauts de fabrication, une utilisation incorrecte en étant totalement exclue.
          PIECES Cette garantie est de 12 mois sur les pièces défectueuses, leurs transports d’aller et de retour étant à la charge du client.
          Les fabricants n’est en aucun cas responsable d’un quelconque type d’indemnisation.
    icona: assets/g4/condicions-icona-p57-5.png
  - pos:
      x: 2.5
      y: 26.812
      w: 17.5
      h: 1.924
    textos:
      en:
      - role: text
        text: JURISDICTION In the event of legal action, the only Courts considered competent are those of Barcelona (Spain) F JURIDICTION En
          cas de litige, seuls les Tribunaux de Barcelona (Espagne) seront compétents.
    icona: assets/g4/condicions-icona-p57-6.png
