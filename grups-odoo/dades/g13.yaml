  - idioma: fr
    paragrafs:
    - role: text
      text: CARACTÉRISTIQUES GÉNÉRIQUES Construction en acier inoxydable AISI 304 18/10. SÉCHOIRS-STÉRILISATEURS C'est la machine idéale pour
        garantir l'hygiène des couverts, car stérilisée, elle empêche la prolifération des bactéries, notamment sur les fourchettes. Aussi dans
        les cuillères que nous mettons dans notre bouche. De plus, lors du séchage au moyen de sable de maïs, dont les grains frottent contre
        les couverts, par vibration, il les fait polir et briller, comme s'ils étaient neufs. La température atteinte par le sable de maïs est
        de 80°C, ce qui assure l'élimination totale des germes. Son installation idéale est sous la table de sortie du lave-vaisselle à dôme,
        de sorte qu'après le lavage des couverts, ils sont introduits dans le séchoir / stérilisateur, par le trou d'entrée, □ et sortent automatiquement
        à 60'' qui est la durée du cycle, pour la sortie □ La production est de 5000 couverts / heure. L'ensemble du circuit électronique fonctionne
        à 24 volts. Il a une capacité de 8 kilos de sable de maïs, qui n'est pas consommé, mais ça doit être régénérant tous les mois pour maintenir
        la capacité idéale. En disposition, 2 sacs de 4,5 kg chacun sont fournis. Monté sur 4 roues pivotantes dont 2 avec freins. LAVE-CASSEROLES
        OU CONTENEURS Conçu pour laver pots □, plateaux □, bacs GN □, ou de gros ustensiles, pour lesquels ils ont une grande taille, tous deux
        panier avec hauteur d'entrée. Nous avons des paniers de toutes tailles, en acier inoxydable, et des supports à insérer dans ces paniers,
        pour le lavage des plateaux ou conteneurs GN. (Voir dans PANIERS) Ils sont fabriqués avec des doubles parois, y compris les portes, ce
        qui réduit le bruit et les pertes de chaleur. Les cuves sont embouties, avec des bords arrondis pour faciliter le nettoyage. □ Le filtre
        est composé d'une surface plane et inclinée pour le drainage des déchets solides et d'un panier qui les récupère. Facilement démontable
        pour vider et nettoyer. □ Avec 4 boutons tactiles et un affichage numérique LED à 4 caractères, plus deux barres latérales. Grâce à la
        combinaison appropriée de couleurs et de signes graphiques, il est possible d'identifier facilement l'état du lave-casseroles et la progression
        du cycle de lavage. En plus de visualiser les paramètres de fonctionnement, tels que la température de la cuve et de la chaudière, ou
        le nombre de cycles de lavage effectués. L'utilisateur peut régler la température du réservoir et de la chaudière, ou doser le détergent
        et le liquide de rinçage. □ Pression d'eau d'alimentation de 2 à 4 bars. Température de l'eau d'alimentation 15 à 60°C La durée du cycle
        de lavage dépendra du type de saleté à laver. De 120’’ à 420’’, selon qu’il s’agit de saletés fraîches légères ou de saletés difficiles
        sur les casseroles et les ustensiles. Par conséquent, la consommation d'eau sera de 3 à 6 litres par cycle. Toutes les données sont indicatives,
        car elles dépendront également de la température d'entrée de l'eau. Dotation 1 panier. Avec pieds réglables. MODÈLES AVEC PANIERS 500X600.
        Ils sont équipés d'un bras de lavage rotatif inférieur à 3 rayons, en matériau composite (PRO COMPOSIT), qui tourne sur des roulements
        en graphite. □ MODÈLES AVEC PANIERS 560x630. Ils sont équipés de 2 bras de lavage, supérieur et inférieur, tournant à 3 rayons, en matériau
        composite (PRO COMPOSIT), qui tournent sur des roulements en graphite. □ MODÈLES AVEC PANIERS 700x700 ou 1310x700 Ils intègrent 2 bras
        de lavage, supérieur et inférieur, tournant à 3 rayons, en acier inoxydable. □ ACCESSOIRES ET PANIERS Nous avons le récupérateur d'énergie
        qui est installé dans la partie supérieure du lave-casseroles de 230 mm. haut, ne prend donc pas de place en longueur. Il utilise la chaleur
        latente de l'intérieur pour condenser et chauffer l'eau qui entre dans la chaudière d'environ 25°C. Les économies d'énergie peuvent aller
        jusqu'à 5 kW / heure de travail, selon le programme de lavage sélectionné. □. Vous trouverez également dans PANIER, plusieurs modèles
        de supports en acier inoxydable pour plateaux, bacs GN, etc.
