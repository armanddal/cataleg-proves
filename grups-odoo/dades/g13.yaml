        color: '#000000'
        mida: 14.0
    - role: text
      text: También pueden actuar como vertederos, para el vaciado, limpieza de las ollas, o de los útiles de la cocina.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Altura de la encimera 560 a 600 mm., según regulación de las patas.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: GRIFERÍA
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Fabricados en latón cromado, de alta calidad, para su uso profesional.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Incluyen los latiguillos de conexión, flexibles.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Todos los latiguillos de conexión son de 1/2” G.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: GRIFOS CAÑO ALTO, con monomando para regular la temperatura del agua.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GRIFOS DE CODO gerontológico, el cual al accionarlo con el codo, regula la temperatura del agua. Con el caño alto.
      refs:
      - 3
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GRIFOS DE CAÑO BAJO, diseñados para su colocación en los fregaderos instalados detrás de las barra de bar. Con monomando para regular
        la temperatura del agua.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GRIFOS ELÉCTRONICOS, disponen de una célula, que activa la salida del agua, al aproximar las manos, y se pára automáticamente, al
        retirarlas.
      refs:
      - 4
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GRIFOS DE PEDAL, con regulador de agua fria/caliente, que al presionarlo sale el agua, con la temperatura deseada. En el KIT, se suministra,
        el caño giratorio de 1/2” y el latiguillo de 1/2”, de un metro de longitud, para la conexión. Pero si lo desean, también disponemos de
        los componentes por separado.
      refs:
      - 5
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GRIFOS DUCHA. Diseñados para el prelavado. Con muelle de acero inoxidable, que protege el latiguillo y asegura su fiabilidad y durabilidad.
        La ducha dispone de una palanca para abrir o cerrar, con sistema de bloqueo. Con monomando para la regulación de la temperatura del agua.
      refs:
      - 6
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: text
      text: El mod/cod. 16000124, también tiene un grifo de caño alto, que puede funcionar independientemente de la ducha.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: También se puede suministrar, sólo la ducha.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: GRIFOS EXTENSIBLES, con manguera retráctil, de 12 metros, con sistema de bloqueo para mantener la longitud deseada.
      refs:
      - 7
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: text
      text: Se puede colocar una pistola de chorro ajustable, dotada de una anilla, para mantener la pistola abierta.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Diseñadas para su instalación en la pared. Con la estructura y soportes de acero inoxidable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
