      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: SINKS ON STAND FOR CLEANING FOOD WITH DISCHARGE
      estil:
        color: '#800080'
        negreta: true
        mida: 9.5
    - role: text
      text: With 100 mm bib.
      estil:
        color: '#000000'
        mida: 9.5
