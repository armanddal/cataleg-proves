        negreta: true
        mida: 14.0
    - role: text
      text: Capacidad cuba 14 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacidad boiler 2,6 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bomba de lavado de 200 W. de potencia.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: LAVAVAJILLAS o CÚPULAS, PARA CESTAS DE 500x500
      estil:
