- id: p19
  n: 19
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      en: DUMP SINKS AND TAPS
      fr: ÉVIERS DE VIDAGE ET ROBINETS
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: DUMP SINKS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: 18/10 AISI 304 stainless steel construction.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With 100 mm rear splashback.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: They have a deep-drawn bowl, with rounded edges, to facilitate cleaning.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Likewise, a removable grid, on which large pots can be placed, for filling with water.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: They can also act as dumps, for emptying, cleaning pots, or kitchen utensils.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Height of the top 560 a 600 mm., Depending on the regulation of the legs.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: TAPS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Made of high quality chrome-plated brass for professional use.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: They include flexible connection hoses.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: All connection cables are 1/2 ”G.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: HIGH SPOUT TAPS, with mixer to regulate the water temperature. Gerontological.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: GERONTOLOGICAL ELBOW TAPS, which when operated with the elbow, regulates the water temperature. With high spout.
      refs:
      - 3
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: LOW SPOUT TAP, designed to be placed in the sinks installed behind the bar counter. With mixer to regulate the water temperature.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: ELECTRONIC TAPS, have a cell that activates the water outlet, when the hands are brought closer, and stops automatically when they
        are removed.
      refs:
      - 4
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: PEDAL TAP, with hot / cold water regulator, which when pressed, the water comes out, with the desired temperature. In the KIT, the
        1/2 "swivel spout and the 1/2" hose, one meter long, are supplied for connection. But if you wish, we also have the components separately.
      refs:
      - 5
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: titol
      text: SHOWER TAPS. Designed for prewash. With stainless steel spring, which protects the hose and ensures its reliability and durability.
        This shower has a lever to open or close, with a locking system. With mixer for regulating the water temperature.
      refs:
      - 6
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: text
      text: The mod / cod. 16000124, it also has a high spout tap, which can work independently of the shower.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Only the shower can also be supplied.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: EXTENDABLE FAUCETS, with a retractable 12-meter hose and a locking system to maintain the desired length.
      refs:
      - 7
      estil:
        color: '#000000'
        negreta: true
        mida: 14.0
    - role: text
      text: It is possible to attach an adjustable spray gun with a ring to keep the gun open.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Designed for installation on the wall. With the structure and supports in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.7
  - idioma: fr
    paragrafs:
    - role: titol
      text: ÉVIERS DE DÉPOTOIRS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.2
    - role: text
      text: Construction en acier inoxydable AISI 304 18/10.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Avec dossard arrière de 100 mm.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Ils ont une cuve emboutie, avec des bords arrondis, pour faciliter le nettoyage.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: De même, une grille amovible, sur laquelle de grands pots peuvent être placés, pour le remplissage d'eau.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Ils peuvent également servir de dépotoirs, pour vider, nettoyer les casseroles ou les ustensiles de cuisine.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Hauteur du dessus de 560 a 600 mm., en fonction de la régulation des jambes.
      estil:
        color: '#000000'
        mida: 13.2
    - role: titol
      text: ROBINETS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.2
    - role: text
      text: Fabriqué en laiton chromé de haute qualité pour un usage professionnel.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Ils comprennent des tuyaux de raccordement flexibles.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Tous les tuyaux de connexion sont de 1/2 ”G.
      estil:
        color: '#000000'
        mida: 13.2
    - role: titol
      text: ROBINETS À HAUT BEC, avec mélangeur pour régler la température de l'eau.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: titol
      text: ROBINETS COUDE gérontologique, qui, lorsqu'ils sont actionnés avec le coude, régulent la température de l'eau. Avec le bec haut.
      refs:
      - 3
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: titol
      text: ROBINETS À BEC BASSE, conçu pour être placé dans les éviers installés derrière le comptoir du bar. Avec mélangeur pour régler la température
        de l'eau.
      refs:
      - 2
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: titol
      text: ROBINETS ÉLECTRONIQUES, ont une cellule qui active la sortie d'eau, lorsque les mains sont rapprochées, et s'arrête automatiquement
        lorsqu'elles sont retirées.
      refs:
      - 4
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: titol
      text: ROBINET À PÉDALE, avec régulateur d'eau chaude / froide, qui une fois pressé, l'eau sort, avec la température désirée. Dans le KIT,
        le bec pivotant 1/2"et le tuyau 1/2", d'un mètre de long, sont fournis pour le raccordement. Mais si vous le souhaitez, nous avons également
        les composants séparément.
      refs:
      - 5
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: titol
      text: ROBINETS DE DOUCHE. Conçu pour le prélavage. Avec ressort en acier inoxydable, qui protège le tuyau et assure sa fiabilité et sa durabilité.
        Ce robinet de douche a un levier pour ouvrir ou fermer, avec un système de verrouillage. Avec mitigeur pour régler la température de l'eau.
      refs:
      - 6
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: text
      text: Le mod / cod. 16000124, il dispose également d'un robinet à bec haut, qui peut fonctionner indépendamment de la douche.
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: On peut aussi fournir seulement la douche.
      estil:
        color: '#000000'
        mida: 13.2
    - role: titol
      text: ROBINETS EXTENSIBLES, avec un tuyau rétractable de 12 mètres, avec un système de verrouillage pour maintenir la longueur souhaitée.
      refs:
      - 7
      estil:
        color: '#000000'
        negreta: true
        mida: 13.2
    - role: text
      text: On peut y installer un pistolet à jet réglable, équipé d'un anneau, pour maintenir le pistolet ouvert.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 13.2
    - role: text
      text: Conçu pour être installé sur le mur. Avec la structure et les supports en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 13.2
    pos:
      x: 10.65
      y: 2.694
      w: 9.85
      h: 25.7
