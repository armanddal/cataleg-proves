    - role: text
      text: Capacidad cuba de 20 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacidad boiler 6 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bomba de lavado de 470 W. de potencia.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disponemos de peanas, para lavavajillas, con espacio para cestas de 500x500, de 380 mm. de altura. (Ver ACCESORIOS)
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, en los Cúpulas, se pueden colocar mesas de entrada, con cuba y grifo, para el prelavado, o lisas para la salida. (Ver
        GRUPO 13)
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 5/TODOS LOS MODELOS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Con pulsadores de alta fiabilidad, para seleccionar las funciones.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SERIE 8/LAVAVASOS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Aislamiento acústico, al tener doble pared.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con 3 pulsadores para seleccionar las funciones.
      refs:
