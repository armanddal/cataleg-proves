- id: p39
  n: 39
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: MESAS PARA LAVAVAJILLAS DE CÚPULA Y TÚNELES DE LAVADO E TABLES FOR DOME DISHWASHERS AND WASHING TUNNELS F TABLES POUR DOME LAVE-VAISSELLE
        ET TUNNELS DE LAVAGE
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CARACTERÍSTICAS GENÉRICAS DE LAS MESAS PARA LAVAVAJILLAS DE CÚPULA O TÚNELES Totalmente de acero inoxidable 18/10 AISI 304. Todos
        los modelos adaptables a cualquier tipo o marca de lavavajillas de cúpula o túneles. Se suministran desmontados. El montaje se realiza
        en un máximo de 5 minutos. Con patas de tubo cuadrado de 40x40 mm, con regulador para elevar la altura de 850 a 900 mm. MESAS LISAS CENTRALES
        Con guía para las cestas, y a la vez perfil de aguas en todo el contorno de la mesa, para facilitar, que toda el agua vaya al lavavajillas.
        Son reversibles, pudiendo colocarlas, sin mas, a la derecha o izquierda de la máquina. SIN ESTANTE INFERIOR Las cuales se soportan por
        la encimera a la cúpula y tienen dos patas, en el lado opuesto a la máquina. CON ESTANTE INFERIOR De acero inoxidable, para almacenaje
        de cestas, etc. Con 4 patas. MESAS LISAS MURALES Con peto de 160 mm. y encimera en la parte posterior, para llegar a la pared, y así evitar
        que el agua, pueda ir al suelo, pues toda va canalizada al lavavajillas □ Con guía para las cestas. SIN ESTANTE INFERIOR Las cuales se
        soportan por la encimera a la cúpula y tienen dos patas, en el lado opuesto a la máquina. CON ESTANTE INFERIOR De acero inoxidable, para
        almacenaje de cestas, etc. Con 4 patas. MESAS CON 1 SENO, MURALES Con peto de 160 mm. y encimera en la parte posterior, para llegar a
        la pared, donde se puede instalar, opcionalmente, el grifo ducha (Ver GRIFOS, GRUPO 13), y así evitar que el agua, pueda ir al suelo,
        pues va canalizada al lavavajillas de cúpula. □ Con 1 seno embutido, con todos los cantos redondeados, para facilitar la limpieza, soldado
        a la encimera, y con material insonorizante, de 500x400x250 mm. □ Equipado con válvula de desagüe y tubo rebosadero, de acero inoxidable.
        □ Con guía para las cestas, las cuales pasan por encima del seno, permitiendo hacer el prelavado. Opcionalmente, se puede colocar un cesto
        perforado dentro del seno, para recoger los desperdicios, y así evitar la obstrucción del desagüe. (Ver ACCESORIOS) □ SIN ESTANTE INFERIOR
        Las cuales se soportan por la encimera a la cúpula y tienen dos patas, en el lado opuesto a la máquina. CON ESTANTE INFERIOR De acero
        inoxidable, para colocar los detergentes, abrillantador etc. Con 4 patas. MESAS CON 1 SENO, Y ARO DE DESBARACE, MURALES Con peto de 160
        mm. y encimera en la parte posterior, para llegar a la pared, donde se puede instalar, opcionalmente, el grifo ducha (Ver GRIFOS, GRUPO
        13), y así evitar que el agua, pueda ir al suelo, pues va canalizada al lavavajillas de cúpula. □ Con 1 seno embutido, con todos los cantos
        redondeados, para facilitar la limpieza soldado a la encimera, y con material insonorizante, de 500x400x250 mm. □ Equipado con válvula
        de desagüe y tubo rebosadero, de acero inoxidable. □ Con guía para las cestas, las cuales pasan por encima del seno, permitiendo hacer
        el prelavado. Opcionalmente, se puede colocar un cesto perforado dentro del seno, para recoger los desperdicios, y así evitar la obstrucción
        del desagüe. (Ver ACCESORIOS) □ Con aro de desbarace, de caucho alimentario, desmontable, debajo del cual se ubica el cubo de basura.
        (Ver GRUPO13) □ SIN ESTANTE INFERIOR Las cuales se soportan por la encimera a la cúpula y tienen dos patas, en el lado opuesto a la máquina.
        CON ESTANTE INFERIOR PARCIAL Y espacio para el cubo de basura GRIFERÍA Encontraran en el GRUPO 13, una extensa gama de modelos.
      estil:
        color: '#000000'
        mida: 12.2
