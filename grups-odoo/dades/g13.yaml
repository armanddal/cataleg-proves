      es: E TABLES FOR DOME DISHWASHERS AND WASHING TUNNELS F TABLES POUR DOME LAVE-VAISSELLE ET TUNNELS DE LAVAGE
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CHARACTERISTICS OF DOME DISHWASHER TABLES OR WASHING TUNNELS Completely made of 18/10 stainless steel AISI 304. All models
        adaptable to any type or brand of dome dishwasher or washing tunnels . They are supplied disassembled. Assembly is done in a maximum of
        5 minutes. With 40x40 mm square tube legs, with regulator to raise the height from 850 to 900 mm. CENTRAL SMOOTH TABLES With guide for
        the baskets, and at the same time water profile around the contour of the table, to facilitate that all the water goes to the dishwasher.
        They are reversible, being able to place them, without more, to the right or left of the machine. WITHOUT LOWER SHELF Which are supported
        by the top to the dome and have two legs, on the opposite side to the machine. WITH LOWER SHELF Made of stainless steel, for storage of
        baskets, etc. With 4 legs. SMOOTH WALL TABLES With 160 mm bib. and countertop at the back, to reach the wall, and thus prevent the water
        from going to the floor, since everything is channeled to the dishwasher. □ With guide for the baskets. WITHOUT LOWER SHELF Which are
        supported by the top to the dome and have two legs, on the opposite side to the machine. WITH LOWER SHELF Made of stainless steel, for
        storage of baskets, etc. With 4 legs. TABLES WITH 1 SINK, MURALS With 160 mm bib. and countertop at the back, to reach the wall, where
        you can optionally install the shower tap (See TAPS, GROUP 13), and thus prevent the water from going to the floor, as it is channeled
        to the dome dishwasher. □ With 1 deep-drawn bowl, with all rounded edges, to facilitate cleaning, welded to the worktop, and with soundproofing
        material, 500x400x250 mm. □ Equipped with a drain valve and overflow tube, made of stainless steel. □ With guide for the baskets, which
        pass over the sink, allowing the prewash to be carried out. Optionally, a perforated basket can be placed inside the sinus, to collect
        waste, and thus avoid clogging the drain. (See ACCESSORIES) □ WITHOUT LOWER SHELF Which are supported by the top to the dome and have
        two legs, on the opposite side to the machine. WITH LOWER SHELF Made of stainless steel, to place detergents, rinse aid etc. With 4 legs.
        TABLES WITH 1 SINK, AND CLEANING RING, MURALS With 160 mm bib. and countertop at the back, to reach the wall, where you can optionally
        install the shower tap (See TAPS, GROUP 13), and thus prevent the water from going to the floor, as it is channeled to the dome dishwasher.
        □ With 1 deep-drawn bowl, with all rounded edges, to facilitate cleaning, welded to the worktop, and with soundproofing material, 500x400x250
        mm. □ Equipped with a drain valve and overflow tube, made of stainless steel. □ With guide for the baskets, which pass over the sink,
        allowing the prewash to be carried out. Optionally, a perforated basket can be placed inside the sinus, to collect waste, and thus avoid
        clogging the drain. (See ACCESSORIES) □ With removable food rubber scrap ring, under which the rubbish bin is located. (See GROUP13) □
        WITHOUT LOWER SHELF Which are supported by the top to the dome and have two legs, on the opposite side to the machine. WITH PARTIAL LOWER
        SHELF And space for the garbage can TAPS You will find in GROUP 13, an extensive range of models.
