- id: p46
  n: 46
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: E DISCHARGE RING TABLES, SHELVES FOR BASKETS AND GARBAGE CANS F TABLES AVEC TROU VIDE DÉCHETS, ÉTAGÈRES POUR PANIERS ET POUBELLES
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION OF DISPOSAL TABLES, BASKET SHELVES AND GARBAGE BINS Completely built in 18/10 stainless steel, AISI 304. DISCHARGE
        RING TABLES Countertops with a water profile all around, reinforced. With 40x40 square tube legs, with regulator to raise the height from
        850 to 900 mm. With dismantling ring, made of food rubber, removable, under which the garbage can is located (See GROUP 13) □ Reversible,
        since its assembly can be done, to have the ring, to the right or left. They are supplied disassembled. Assembly is done in a maximum
        of 5 minutes. On your countertop you can place tabletop shelves for 500x500 baskets. WITHOUT LOWER SHELF Whose space, allows to place
        more trash cans. WITH LOWER SHELF For storage of baskets, etc. SHELVES FOR TABLE BASKETS For its installation, in tables. With the possibility
        of placing 500x500 baskets, on one side or the other. Basically, to place the glass and avoid breakage, for washing it, when you finish
        with the dishes. With drain tube. Supported on four Ø 30 mm round tube legs. WALL SHELVES With gussets, for fixing to the wall, in an
        inclined position. With drain tube. Supplied with plugs and screws. STAINLESS STEEL GARBAGE CANS, WITH WHEELS With embedded bottom, with
        rounded edges, to facilitate cleaning. Also inlaid lid. MODELS WITH MANUALLY REMOVABLE LID Ideal for placing them under tables with a
        knock-out ring. Lid equipped with a handle, which acts as a support, allowing it to be hung on the cube itself. Bucket with 2 handles,
        to facilitate movement. With 3 Ø 50 mm swivel wheels. MODELS WITH PEDAL OPERATED COVER Designed to be placed anywhere in the preparation
        areas or in the kitchen, complying with hygiene regulations. With a mechanism, which allows the lid to be opened by pressing the pedal.
        With 2 Ø 50 mm swivel wheels, and two support brackets, to prevent movement when operating the lid. □ With handle, to facilitate movement.
        WASTE CABINETS Designed for installation in dining rooms, Restaurants, Fast-Food, Buffets or Self Services. With space for cubes up to
        Ø 500 mm, and 700 mm. Tall. □ With pivoting door, for the extraction of the cube. Likewise, in the upper front part, with a hinged lid,
        for the introduction of the waste, which has a ramp, for the conduction of the same, to the bucket. □ With worktop, to deposit the trays,
        already empty ...
      estil:
        color: '#000000'
        mida: 12.2
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE DES TABLES AVEC TROU VIDE DÉCHETS, ÉTAGÈRES POUR PANIERS ET POUBELLES Entièrement construit en acier inoxidable
        18/10, AISI 304. TABLES AVEC TROU VIDE DÉCHETS Plans de travail avec un profil d'eau tout autour, renforcés. Avec pieds en tube carré
        40x40, avec régulateur pour augmenter la hauteur de 850 à 900 mm. Avec anneau en caoutchouc alimentaire, amovible, sous lequel se trouve
        la poubelle (voir GROUPE 13) □ Réversible, puisque son assemblage peut se faire, pour avoir l’anneau, à droite ou à gauche. Ils sont fournis
        démontés. L'assemblage se fait en 5 minutes maximum. Sur votre plan de travail, vous pouvez placer des étagères de table, pour des paniers
        de 500x500. SANS ÉTAGÈRE INFÉRIEURE Dont l'espace, permet de placer plus de poubelles. AVEC ÉTAGÈRE INFÉRIEURE Pour le stockage de paniers,
        etc. ÉTAGÈRES POUR PANIERS DE TABLE Pour son installation, dans des tableaux. Avec la possibilité de placer des paniers 500x500, d'un
        côté ou de l'autre. En gros, pour placer le verre et éviter de le casser, pour le laver, lorsque vous avez terminé avec la vaisselle.
        Avec tube de vidange. Supporté sur quatre pieds tubulaires ronds Ø 30 mm. ÉTAGÈRES MURALES Avec goussets, pour fixation au mur, en position
        inclinée. Avec tube de vidange. Livré avec bouchons et vis. POUBELLES EN ACIER INOXYDABLE, AVEC ROUES Avec fond emboutie, avec des bords
        arrondis, pour faciliter le nettoyage. Couvercle également emboutie. MODÈLES AVEC COUVERCLE AMOVIBLE MANUELLEMENT Idéal pour les placer
        sous des tables avec un trou de vidange. Couvercle équipé d'une poignée, qui fait office de support, lui permettant d'être accroché sur
        le cube lui-même. Seau avec 2 poignées, pour faciliter le mouvement. Avec 3 roues pivotantes Ø 50 mm. MODÈLES AVEC COUVERCLE À PÉDALE
        Conçu pour être placé n'importe où dans les zones de préparation ou dans la cuisine, conformément aux règles d'hygiène. Avec un mécanisme
        qui permet d'ouvrir le couvercle en appuyant sur la pédale. Avec 2 roues pivotantes Ø 50 mm et deux pieds de support, pour éviter tout
        mouvement lors de l'utilisation du couvercle. □ Avec poignée, pour faciliter le mouvement. ARMOIRES À DÉCHETS Conçu pour l'installation
        dans les salles à manger, les restaurants, la restauration rapide, les buffets ou les self-services. Avec espace pour poubelles jusqu'à
        Ø 500 mm et 700 mm. d'hauteur. □ Avec porte pivotante, pour l'extraction du poubelle. De même, dans la partie avant supérieure, avec un
        couvercle rabattable, pour l'introduction des déchets, qui comporte une rampe, pour les guider, vers le poubelle. □ Avec plan de travail,
        pour déposer les plateaux, déjà vides ...
      estil:
        color: '#000000'
        mida: 12.2
