  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE DES TUNNELS DE LAVAGE Le tout en acier inoxydable AISI 304 18/10. Les tunnels de lavage sont constitués de
        différents modules, ce qui permet le démontage, pour faciliter l'entrée, puis procéder au montage en toute simplicité, une fois situés
        sur le lieu de travail. □ L'ensemble du tunnel est à double paroi, y compris les portes à guillotine, ce qui réduit le bruit et les pertes
        de chaleur. □ Les cuves sont embouties, avec des bords arrondis pour faciliter le nettoyage. □ Le filtre est composé d'une surface plane
        et inclinée pour le drainage des déchets solides et d'un panier qui les récupère. Facilement démontable pour vider et nettoyer. □ Ils
        permettent une hauteur d'entrée de 450 mm., pour paniers 500x500, pouvant laver les plateaux, seaux GN et autres ustensiles. □ La traînée
        des paniers se fait avec des guides latéraux, ce qui facilite le nettoyage. Les dents qui déplacent les paniers sont en acier inoxydable
        épais. □ Ils sont réversibles, ce qui permet de changer le sens d'entrée ou de sortie en effectuant quelques opérations simples. Cependant,
        nous vous recommandons d'indiquer le sens de déplacement, lors de la commande, et ainsi il sera préparé en usine. La vitesse d'avance
        des paniers est régulée électroniquement, au moyen d'un variateur de fréquence et est contrôlée depuis le panneau de commande. Chacun
        des modules de prélavage / lavage / rinçage et de séchage démarre et s'arrête indépendamment, uniquement s'il y a effectivement un panier
        à l'intérieur. Ce système améliore la consommation d'énergie. □ Le contrôle est effectué au moyen d'un panneau de commande électronique,
        avec un écran multifonction, LED à 4 chiffres. Il dispose de 4 boutons tactiles pour programmer toutes les fonctions et fournir des informations,
        sélectionner des programmes, etc. avec connexion USB. □ Il est recommandé que la température de l'eau d'alimentation provienne d'un réchauffeur,
        de 40 à 60 ° C, car les données de guidage de production sont basées sur elle. Si l'eau entre entre 15 et 40 ° C, la production sera plus
        faible et la consommation d'énergie plus élevée. Cela influence également, si vous avez le module de récupération de chaleur. Equipement
        2 paniers (polyvalents et pour la vaisselle) et 1 coupe à couverts. Avec pieds réglables en acier inoxydable de 200 mm. MODULE LAVAGE
        / RINÇAGE D'une longueur de 1150 mm., Il dispose d'un réservoir de 70 litres, et d'un système de lavage avec 5 bras et 60 buses, avec
        une pompe à double flux, de 2,7 kW. Le système de gestion de la température, avec chauffage ou refroidissement de l'eau, est contrôlé
        électroniquement. Une pression d'alimentation constante est requise, entre 2 et 4 bars. □ MODULE DE PRÉLAVAGE D'une longueur de 820 mm.,
        Equipé d'un réservoir de 70 litres, et d'un système de lavage composé de 3 bras et 36 buses, avec une pompe à double flux de 1,5 kW. puissance.
        En option, il peut être fourni, avec le module de prélavage en angle, pour un placement à droite ou à gauche. (Voir ACCESSOIRES) MODULE
        DE SÉCHAGE Qui est installé après le processus de lavage / rinçage. 600 mm. en longueur, et qui est à la hauteur de la table de sortie.
        □ Fabriqué avec double paroi et fonctionne à basse température, 65°C. Il utilise un flux d'air de 1400 m3 / heure, extrait vers l'extérieur
        par un turbo-ventilateur de 550 W. Le module est équipé d'un drain. En option, il peut être fourni, avec le module de séchage en angle,
        pour un placement à droite ou à gauche. (Voir ACCESSOIRES) MODULE DE RÉCUPÉRATION DE CHALEUR S'installe sur le dessus du module d'entrée,
        210 mm. haut, ne prend donc pas de place en longueur. Il utilise la chaleur latente à l'intérieur du tunnel de lavage, ce qui la fait
        condenser et chauffer l'eau entrant dans la chaudière d'environ 25°C. Les économies d'énergie peuvent atteindre jusqu'à 8 kW / heure de
        travail, selon le programme de lavage sélectionné. Il utilise un débit d'air de 700 m3 / heure et dispose d'un turbo-ventilateur de 200
        W. □ ACCESSOIRES Vous trouverez des suppléments pour les modules de prélavage d'angle, les modules de séchage d'angle, les modules intermédiaires
        neutres, ou les modules de zone neutre d'entrée, les distributeurs de détergent et de produit de rinçage, etc... TABLES À ROULEAUX LINÉAIRES
        ET COURBES Avec un plateau recueille l'eau, qui les décante dans le tunnel de lavage, et agit comme un guide pour les paniers. Avec des
        rouleaux, qui facilitent le mouvement des paniers.
