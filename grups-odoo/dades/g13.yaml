      es: E GLASSWASHER, DISHWASHER AND DOME DISHWASHER F LAVA-VERRES, LAVE-VAISELLE ET LAVE-VAISSELLE À DÔME
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CHARACTERISTICS OF THE WASHING MACHINES All in 18/10 AISI 304 stainless steel. Stamped tanks, to facilitate cleaning, without
        edges. □ Embedded bottoms, with integral composite filter (PRO COMPOSIT) □ Washing arms, of the same material, that rotate on graphite
        bearings. □ Feed water pressure 2-4 bar. Feed water temperature 50 to 60ºC Duration of the wash cycle from 90 to 120 ’’ Endowment 2 baskets,
        (multipurpose and for dishes) and 1 cutlery cup. With adjustable feet. GLASSWASHER FOR 350x350 or 390x390 BASKETS Tank capacity 7.5 liters
        of water. Boiler capacity 2.6 liters of water. 200 W. power wash pump. We have bases for elevation, 120 mm. High. (See accessories) □
        DISHWASHER FOR 450x450 BASKETS Tank capacity 14 liters of water. Boiler capacity 2.6 liters of water. 200 W. power wash pump. DISHWASHERS
        or DOME, FOR 500x500 BASKETS Tank capacity of 20 liters of water. Boiler capacity 6 liters of water. 470 W. power washing pump. We have
        bases, for dishwashers, with space for baskets of 500x500, 380 mm. Tall. (See ACCESSORIES) □ Optionally, in the cupolas, inlet tables
        can be placed, with tub and tap, for the prewash, or plain for the outlet. (See GROUP 13) SERIES 5 / ALL MODELS With highly reliable pushbuttons
        to select functions. □ SERIES 8 / GLASSWASHERS Acoustic insulation, as it has a double wall. With 3 buttons to select the functions. □
        With an LED digital display, which indicates the washing and rinsing temperaturas. □ SERIES 8 / DISHWASHERS AND DOME Acoustic insulation,
        as it has a double wall. With 4 touch buttons and a 4-character digital LED display, plus two side bars. Thanks to the appropriate combination
        of colors and graphic signs, it is possible to easily identify the status of the dishwasher and the progress of the wash cycle. In addition
        to viewing the operating parameters, such as the temperature of the tank and the boiler, or the number of washing cycles carried out.
        The user can regulate the temperature of the tank and the boiler, or dose the detergent and rinse aid. □ ACCESSORIES They are available,
        discalcifier, smooth baskets, for plates, for glasses, etc.
      estil:
        color: '#000000'
        mida: 12.2
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CARACTÉRISTIQUES GÉNÉRIQUES DES MACHINES À LAVER
      estil:
        color: '#800080'
        negreta: true
        mida: 12.2
    - role: text
      text: Le tout en acier inoxydable AISI 304 18/10.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Réservoirs estampés, pour faciliter le nettoyage, sans bords. □
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Fond éstampée, avec filtre composite intégré (PRO COMPOSIT) □
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Bras de lavage, du même matériau, qui tournent sur des roulements en graphite. □
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Pression de l'eau d'alimentation 2-4 bar.
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Température de l'eau d'alimentation de 50 à 60 ° C
      estil:
        color: '#000000'
        mida: 12.2
    - role: text
      text: Durée du cycle de lavage de 90 à 120 ’’ Dotation 2 paniers, (polyvalents et pour la vaisselle) et 1 coupe à couverts. Avec pieds réglables.
        LAVE-VERRE POUR PANIERS 350x350 ou 390x390 Capacité du réservoir 7,5 litres d'eau. Capacité de la chaudière 2,6 litres d'eau. Pompe de
        lavage puissance de 200 W. Nous avons des bases pour l'élévation, 120 mm. haute. (Voir accessoires) □ LAVE-VAISSELLE POUR PANIERS 450x450
        Capacité du réservoir 14 litres d'eau. Capacité de la chaudière 2,6 litres d'eau. Pompe de lavage puissance de 200 W. LAVE-VAISSELLE À
        DÔME, POUR PANIERS 500x500 Capacité du réservoir de 20 litres d'eau. Capacité de la chaudière 6 litres d'eau. Pompe de lavage puissance
        de 470 W. Nous avons des bases, pour lave-vaisselle, avec un espace pour des paniers de 500x500, 380 mm. d'hauteur. (Voir ACCESSOIRES)
        □ En option, dans les coupoles, des tables d'entrée peuvent être placées, avec évier et robinet, pour le prélavage, ou lisse pour la sortie.
        (Voir GROUPE 13) SÉRIE 5 / TOUS LES MODÈLES Avec des boutons-poussoirs très fiables pour sélectionner les fonctions. □ SÉRIE 8/LAVE-VERRE
        Isolation acoustique, car il a une double paroi. Avec 3 boutons pour sélectionner les fonctions. □ Avec un écran LED numérique, qui indique
        les températures de lavage et de rinçage. □ SÉRIE 8 / LAVE-VAISSELLE ET DÔMES Isolation acoustique, car il a une double paroi. Avec 4
        boutons tactiles et un écran LED numérique à 4 caractères, plus deux barres latérales. Grâce à la combinaison appropriée de couleurs et
        de signes graphiques, il est possible d'identifier facilement l'état du lave-vaisselle et la progression du cycle de lavage. En plus de
        visualiser les paramètres de fonctionnement, tels que la température de la cuve et de la chaudière, ou le nombre de cycles de lavage effectués.
        L'utilisateur peut régler la température du réservoir et de la chaudière, ou doser le détergent et le liquide de rinçage. □ ACCESSOIRES
        Ils sont disponibles, adoucissants, paniers lisses, pour assiettes, pour verres, etc.
