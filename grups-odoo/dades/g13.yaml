    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: MESAS DE DESBARACE, ESTANTERIAS PARA CESTAS Y CUBOS BASURA E DISCHARGE RING TABLES, SHELVES FOR BASKETS AND GARBAGE CANS F TABLES AVEC
        TROU VIDE DÉCHETS, ÉTAGÈRES POUR PANIERS ET POUBELLES
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENERICA DE MESAS DE DESBARACE, ESTANTES PARA CESTAS Y CUBOS DE BASURA Totalmente construido en acero inoxidable 18/10,
        AISI 304. MESAS DE DESBARACE Encimeras con perfil de aguas en todo su contorno, reforzadas. Con patas de tubo cuadrado de 40x40, con regulador
        para elevar la altura de 850 a 900 mm. Con aro de desbarace, de caucho alimentario, desmontable, debajo del cual se ubica el cubo de basura
        (Ver GRUPO 13) □ Reversibles, ya que su montaje se puede realizar, para tener el aro, a la derecha o izquierda. Se suministran desmontadas.
        El montaje se realiza en un máximo de 5 minutos. En su encimera se pueden colocar estanterías de sobre-mesa, para cestas de 500x500. SIN
        ESTANTE INFERIOR Cuyo espacio, permite colocar mas cubos de basura. CON ESTANTE INFERIOR Para almacenaje de cestas, etc. ESTANTES PARA
        CESTAS DE SOBRE MESA Para su instalación, en mesas de desbarace. Con la posibilidad de colocar cestas de 500x500, en un lado o el otro.
        Básicamente, para colocar el cristal y evitar roturas, para su lavado, cuando se termina con los platos. Con tubo de desagüe. Soportados
        sobre cuatro patas de tubo redondo de Ø 30 mm. ESTANTES MURALES Con cartelas, para su fijación a la pared, en posición inclinada. Con
        tubo de desagüe. En dotación, los tacos y tornillos. CUBOS DE BASURA DE ACERO INOXIDABLE, CON RUEDAS Con fondo embutido, con cantos redondeados,
        para facilitar su limpieza. Tapa igualmente embutida. MODELOS CON TAPA EXTRAIBLE MANUALMENTE Idóneos para situarlos debajo de mesas con
        aro de desbarace. Tapa dotada de asa, que hace la función de soporte, que permite poderla colgar en el propio cubo. Cubo con 2 asas, para
        facilitar el desplazamiento. Con 3 ruedas giratorias de Ø 50 mm. MODELOS CON TAPA ACCIONADA POR PEDAL Concebidos, para su colocación,
        en cualquier lugar de las zonas de preparaciones o de la cocina, cumpliendo las normativas de higiene. Con un mecanismo, que permite abrir
        la tapa presionando el pedal. Con 2 ruedas giratorias de Ø 50 mm, y dos soportes de apoyo, para evitar el movimiento al accionar la tapa.
        □ Con asa, para facilitar el desplazamiento. ARMARIOS PARA DESPERDICIOS Diseñados para su instalación en comedores, de Restaurantes, de
        Fast-Food, Buffets o Self Services. Con espacio para cubos de hasta Ø 500 mm, y 700 mm. de altura. □ Con puerta pivotante, para la extracción
        del cubo. Así mismo, en la parte superior frontal, con una tapa abatible, para la introducción de los desperdicios, que dispone de una
        rampa, para la conducción de los mismos, al cubo. □ Con encimera, para depositar las bandejas, ya vacías...
      estil:
        color: '#000000'
        mida: 12.2
