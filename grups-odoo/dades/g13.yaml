- id: p23
  n: 23
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: E WASHBASINS F LAVABOS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: E GENERIC WASHBASIN CONSTRUCTION Construction in stainless steel 18/10 AISI 304. Sinks equipped with a drain valve. WALL MODELS To
        be fixed to the wall. MODS/CODS. 201P0000 and 20224160 With cylindrical sink. With swivel spout and knee-operated timed push button. □
        With hot-cold water mixer. MOD/COD. 201PJ100 Also equipped with a 600 ml soap dispenser. □ MOD/COD. 201E0022 With cylindrical sink. With
        electronic faucet with photoelectric cell. □ 220V/1 electrical connection. With hot-cold water mixer. MOD/COD. 201EJ102 Also equipped
        with a 600 ml soap dispenser. □ MOD/COD. 20424160  For corner installation. With cylindrical sink. With swivel spout and knee-operated
        timed push button. □ With hot-cold water mixer. MOD/COD. 20202450  Designed for kitchens with limited space to comply with regulations.
        With 2 sinks of 330x360x160 mm. With 1 swivel spout and knee-operated timed push button, and 1 swivel elbow faucet, gerontological, operated
        with the elbow. □ With hot-cold water mixer. FLOOR MODELS To be placed on the floor. MODS/CODS. 202P0001 and 20624160 With cylindrical
        sink. With swivel spout and foot-operated timed push button. With hot-cold water mixer. MOD/COD. 202PJ100 Also equipped with a 600 ml
        soap dispenser. □ MOD/COD. 202E0031 With cylindrical sink. With electronic faucet with photoelectric cell. □ 220V/1 electrical connection.
        With hot-cold water mixer. MOD/COD. 202EJ103 Also equipped with a 600 ml soap dispenser. □ MOD/COD. 20034160 Autonomous. No water supply
        or drainage required. With cylindrical sink. With swivel spout and hydraulic foot push button. With front tilting lid waste bin. Equipped
        with 2 10-liter containers, one for clean water and the other for dirty water. □ COLLECTIVE MODELS For installation in bathrooms, changing
        rooms, collective spaces, etc. With rectangular sink. □ With swivel spouts and knee-operated timed push buttons. With hot-cold water mixer.
      estil:
        color: '#000000'
        mida: 12.2
    pos:
      x: 0.75
      y: 2.5
      w: 9.6
      h: 26.0
  - idioma: es
    paragrafs:
    - role: text
      text: F CONSTRUCTION GÉNÉRIQUE POUR LAVABOS Construction en acier inoxydable 18/10 AISI 304. Équipé d'une vanne de vidange. MODÈLES MURAUX
        À fixer au mur. MODS/CODS. 201P0000 et 20224160 Avec lavabo cylindrique. Avec bec pivotant et bouton-poussoir temporisé pour le genou.
        □ Avec mélangeur eau chaude-froide. MOD/COD. 201PJ100 Également équipé d'un distributeur de savon de 600 ml. □ MOD/COD. 201E0022 Avec
        lavabo cylindrique. Avec robinet électronique à cellule photoélectrique. □ Connexion électrique à 220V/1. Avec mélangeur eau chaude-froide.
        MOD/COD. 201EJ102 Également équipé d'un distributeur de savon de 600 ml. □ MOD/COD. 20424160  Pour installation d'angle. Avec lavabo cylindrique.
        Avec bec pivotant et bouton-poussoir temporisé pour le genou. □ Avec mélangeur eau chaude-froide. MOD/COD. 20202450  Conçu pour les cuisines
        avec peu d'espace pour respecter la réglementation. Avec 2 lavabos de 330x360x160 mm. Avec 1 bec pivotant et bouton-poussoir temporisé
        pour le genou et 1 robinet coude pivotant, gérontologique, actionnable avec le coude. □ Avec mélangeur eau chaude-froide. MODÈLES SUR
        PIED À poser au sol. MODS/CODS. 202P0001 et 20624160 Avec lavabo cylindrique. Avec bec pivotant et bouton-poussoir temporisé pour le pied.
        Avec mélangeur eau chaude-froide. MOD/COD. 202PJ100 Également équipé d'un distributeur de savon de 600 ml. □ MOD/COD. 202E0031 Avec lavabo
        cylindrique. Avec robinet électronique à cellule photoélectrique. □ Connexion électrique à 220V/1. Avec mélangeur eau chaude-froide. MOD/COD.
        202EJ103 Également équipé d'un distributeur de savon de 600 ml. □ MOD/COD. 20034160 Autonome. Nécessite ni alimentation en eau ni évacuation.
        Avec lavabo cylindrique. Avec bec pivotant et bouton-poussoir hydraulique. Avec poubelle à couvercle basculant à l'avant. Équipé de 2
        bidons de 10 litres, un pour l'eau propre et un pour l'eau usée. □ MODELES COLLECTIFS Pour installation dans les salles de bains, vestiaires,
        espaces collectifs, etc. Avec lavabo rectangulaire. □ Avec becs pivotants et boutons-poussoirs temporisés pour le genou. Avec mélangeur
        eau chaude-froide.
