- id: p51
  n: 51
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: E WASHING TUNNELS AND ROLLER TABLES F TUNNELS DE LAVAGE ET TABLES À ROULEAUX
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION OF THE WASHING TUNNELS All in 18/10 AISI 304 stainless steel. The washing tunnels are made up of different modules,
        which allows disassembly, to facilitate entry, and then proceed to the assembly with ease, once located in the workplace. □ The entire
        tunnel is double-walled, including the guillotine doors, which reduces noise and heat loss. □ The tanks are deep-drawn, with rounded edges
        to facilitate cleaning. □ The filter is made up of a flat and inclined surface for the drainage of solid waste and a basket that collects
        it. Easily removable for emptying and cleaning. □ They allow a height entrance of 450 mm., for 500x500 baskets, being able to wash trays,
        GN buckets and other utensils. □ The dragging of the baskets is with lateral guides, which facilitates cleaning. The teeth that move the
        baskets are made of stainless steel thick. □ They are reversible, which makes it possible to change the direction of entry or exit, performing
        a few simple operations. However, we recommend indicating the direction of travel, when placing the order, and thus it will come factory-prepared.
        The forward speed of the baskets is regulated electronically, by means of a frequency variator and is controlled from the control panel.
        Each of the prewash / wash / rinse and drying modules starts up and stops independently, only if there is actually a basket inside. This
        system improves energy consumption. □ The control is carried out by means of an electronic control panel, with a multifunction display,
        4-digit led. It has 4 tactile buttons to program all functions and provide information, select programs, etc. with USB connection. □ The
        feed water temperature, it is recommended that it comes from a heater, from 40 to 60 ° C, since the indicative production data are based
        on it. If the water enters at 15 to 40 ° C, the production will be lower and the energy consumption higher. It also influences, if you
        have the heat recovery module. Equipment 2 baskets (multipurpose and for dishes) and 1 cutlery cup. With adjustable 200 mm stainless steel
        legs. WASH / RINSE MODULE With a length of 1150 mm., it has a 70 liter tank, and a washing system with 5 arms and 60 nozzles, with a 2.7
        kW double-flow pump. The temperature management system, with heating or cooling of the water, is electronically controlled. A constant
        supply pressure is required, between 2 and 4 bar. □ PREWASH MODULE With a length of 820 mm., equipped with a 70 liter tank, and a washing
        system composed of 3 arms and 36 nozzles, with a 1.5 kW double flow pump power. Optionally, it can be supplied, with the prewash module
        at an angle, for placement on the right or left. (See ACCESSORIES) DRYING MODULE Which is installed after the washing / rinsing process.
        600 mm. in length, and which is at the height of the output table. □ Manufactured with double wall, and works at low temperature, 65°C.
        It uses an air flow of 1400 m3 / hour, extracted to the outside by a 550 W turbo-fan. The module is equipped with a drain. Optionally,
        it can be supplied, with the drying module at an angle, for placement on the right or left. (See ACCESSORIES) HEAT RECOVERY MODULE Installs
        on top of input module, 210mm. high, therefore does not take up space in length. It uses the latent heat inside the car wash, making it
        condense and heating the water entering the boiler by about 25°C. Energy savings can be up to 8 kW / working hour, depending on the selected
        washing program. It uses an air flow of 700 m3 / hour, and has a 200 W turbo-fan. □ ACCESSORIES You will find supplements for Angle Prewash
        Modules, Angle Drying Modules, Intermediate Neutral Modules, or Entry Neutral Zone Modules, Detergent and Rinse Aid Dispensers, etc ...
        LINEAR AND CURVED ROLLER TABLES With a tray collects water, which decants them to the washing tunnel, and acts as a guide for the baskets.
        With rollers, which facilitate the movement of the baskets.
