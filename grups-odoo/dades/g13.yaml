  - idioma: fr
    paragrafs:
    - role: text
      text: CARACTÉRISTIQUES GÉNÉRIQUES DES TABLES DE DÔME LAVE-VAISSELLE OU TUNNELS DE LAVAGE Entièrement fabriqué en acier inoxydable 18/10
        AISI 304. Tous les modèles s'adaptent à tout type ou marque de lave-vaisselle à dôme ou tunnels de lavage. Ils sont fournis démontés.
        L'assemblage se fait en 5 minutes maximum. Avec pieds en tube carré de 40x40 mm, avec régulateur pour augmenter la hauteur de 850 à 900
        mm. TABLES LISSES CENTRALES Avec guide pour les paniers, et en même temps profil d'eau autour du contour de la table, pour faciliter que
        toute l'eau passe au lave-vaisselle. Ils sont réversibles, pouvant les placer, sans plus, à droite ou à gauche de la machine. SANS ÉTAGÈRE
        INFÉRIEURE Qui sont soutenus par le dessus au dôme et ont deux pieds, du côté opposé à la machine. AVEC ÉTAGÈRE INFÉRIEURE Fabriqué en
        acier inoxydable, pour le stockage de paniers, etc. Avec 4 pieds. TABLES MURALES LISSE Avec dosseret arrière de 160 mm. et plan de travail
        à l'arrière, pour atteindre le mur, et ainsi empêcher l'eau de descendre au sol, puisque tout est canalisé vers le lave-vaisselle.□ Avec
        guide pour les paniers. SANS ÉTAGÈRE INFÉRIEURE Qui sont soutenus par le dessus au dôme et ont deux pieds, du côté opposé à la machine.
        AVEC ÉTAGÈRE INFÉRIEURE Fabriqué en acier inoxydable, pour le stockage de paniers, etc. Avec 4 pieds. TABLES AVEC 1 ÉVIER, MURALES Avec
        dosseret arrière de 160 mm. et plan de travail à l'arrière, pour atteindre le mur, où vous pouvez éventuellement installer le robinet
        de douche (voir ROBINETS, GROUPE 13), et ainsi empêcher l'eau d'aller au sol, car elle est canalisée vers le lave-vaisselle à dôme. □
        Avec 1 cuve emboutie, avec tous les bords arrondis, pour faciliter le nettoyage, soudée au plan de travail, et avec un matériau d'insonorisation,
        500x400x250 mm. □ Équipé d'un robinet de vidange et d'un tube de trop-plein, en acier inoxydable. □ Avec guide pour les paniers, qui passent
        au-dessus de l'évier, permettant d'effectuer le prélavage. En option, un panier perforé peut être placé à l'intérieur du sinus, pour collecter
        les déchets, et ainsi éviter de boucher le drain. (Voir ACCESSOIRES) □ SANS ÉTAGÈRE INFÉRIEURE Qui sont soutenus par le dessus au dôme
        et ont deux pieds, du côté opposé à la machine. AVEC ÉTAGÈRE INFÉRIEURE Fabriqué en acier inoxydable, pour placer des détergents, du liquide
        de rinçage, etc. Avec 4 pieds. TABLES AVEC 1 ÉVIER ET TROU DE VIDANGE, MURALES Avec dosseret arrière de 160 mm. et plan de travail à l'arrière,
        pour atteindre le mur, où vous pouvez éventuellement installer le robinet de douche (voir ROBINETS, GROUPE 13), et ainsi empêcher l'eau
        d'aller au sol, car elle est canalisée vers le lave-vaisselle à dôme. □ Avec 1 cuve emboutie, avec tous les bords arrondis, pour faciliter
        le nettoyage, soudée au plan de travail, et avec un matériau d'insonorisation, 500x400x250 mm. □ Équipé d'un robinet de vidange et d'un
        tube de trop-plein, en acier inoxydable. □ Avec guide pour les paniers, qui passent au-dessus de l'évier, permettant d'effectuer le prélavage.
        En option, un panier perforé peut être placé à l'intérieur du sinus, pour collecter les déchets, et ainsi éviter de boucher le drain.
        (Voir ACCESSOIRES) □ Avec anneau en caoutchouc alimentaire amovible, sous lequel se trouve la poubelle. (Voir GROUPE 13) □ SANS ÉTAGÈRE
        INFÉRIEURE Qui sont soutenus par le dessus au dôme et ont deux pieds, du côté opposé à la machine. AVEC ÉTAGÈRE INFÉRIEURE PARTIELLE Et
        de l'espace pour la poubelle. ROBINETS Vous trouverez dans le GROUPE 13, une vaste gamme de modèles.
