      text: ROPE RING SINKS ON STAND
      estil:
        color: '#800080'
        negreta: true
        mida: 9.5
    - role: text
      text: Top with water profile, all around it.
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: With embedded breasts, with all rounded edges, to facilitate cleaning, welded to the worktop, with sound-absorbing material.
