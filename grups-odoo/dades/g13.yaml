- id: p59
  n: 59
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: E CUTLERY STERILIZER DRYERS, POT-WASHERS/CONTAINERS F SÉCHOIRS STÉRILISATEURS À COUVERTS, LAVE-CASSEROLES/CONTENEURS
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CHARACTERISTICS 18/10 AISI 304 stainless steel construction. DECK DRYERS-STERILIZERS It is the ideal machine to guarantee
        the hygiene of cutlery, since when sterilized, it prevents the proliferation of bacteria, especially on the forks. Also in the spoons,
        which we put in our mouths. In addition, when drying by means of corn sand, whose grains rub the cutlery, by vibration, it makes them
        polish and shine, as if they were new. The temperature that the corn sand reaches is 80°C, which ensures the total elimination of germs.
        Its ideal installation is under the outlet table of the dome dishwasher, so that after washing the cutlery, they are introduced into the
        dryer / sterilizer, through the inlet hole, □ and automatically come out at 60'' which is the duration of the cycle, for output □ The
        production is 5000 covers / hour. The entire electronic circuit operates at 24 volts. It has a capacity of 8 kilos of corn sand, which
        is not consumed, but it must be replenished, monthly, to maintain the ideal capacity. In provision, 2 bags of 4.5 kg each are supplied.
        Mounted on 4 swivel wheels, 2 with brakes. POT-WASHERS OR CONTAINERS Designed for pot-washing □, trays □, GN containers □, or large utensils,
        for which they have a large size, both basket with entry height. We have baskets of all sizes, in stainless steel, and supports to insert
        into these baskets, for washing GN trays or containers. (See in BASKETS) They are made with double walls, including the doors, which reduces
        noise and heat loss. The tanks are deep-drawn, with rounded edges to facilitate cleaning. □ The filter is made up of a flat and inclined
        surface for the drainage of solid waste and a basket that collects it. Easily removable for emptying and cleaning. □ With 4 touch buttons
        and a 4-character LED digital display, plus two side bars. Thanks to the appropriate combination of colors and graphic signs, it is possible
        to easily identify the status of the pot-washer and the progress of the wash cycle. In addition to displaying the operating parameters,
        such as the temperature of the tank and that of the boiler, or the number of washing cycles carried out. The user can regulate the temperature
        of the tank and the boiler, or dose the detergent and rinse aid. □ Feed water pressure 2 to 4 bar. Feed water temperature 15 to 60°C.
        The duration of the wash cycle will depend on the type of dirt to be washed. From 120’’ to 420’’, depending on whether it is light, fresh
        dirt, or difficult dirt on pots and utensils. Therefore, the water consumption will be from 3 to 6 liters per cycle. All the data are
        indicative, as they will also depend on the water inlet temperature. Endowment 1 basket. With adjustable feet. MODELS WITH 500X600 BASKETS.
        They are fitted with a lower 3-spoke rotary wash arm, made of composite material (PRO COMPOSIT), which rotates on graphite bearings. □
        MODELS WITH 560x630 BASKETS. They are equipped with 2 wash arms, upper and lower, rotating with 3 spokes, made of composite material (PRO
        COMPOSIT), which rotate on graphite bearings. □ MODELS WITH 700x700 or 1310x700 BASKETS They incorporate 2 washing arms, upper and lower,
        rotating with 3 spokes, in stainless steel. □ ACCESSORIES AND BASKETS We have the energy recuperator which is installed on the top of
        the 230 mm pot-washer. high, therefore does not take up space in length. It uses the latent heat from the interior, making it condense
        and heating the water entering the boiler by about 25°C. Energy savings can reach up to 5 kW / working hour, depending on the selected
        washing program. □. You will also find in BASKETS, several models of stainless steel supports. for trays, GN containers, etc.
      estil:
        color: '#000000'
        mida: 12.2
    pos:
