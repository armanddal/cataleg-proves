      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Aislamiento acústico, al tener doble pared.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con 4 botones táctiles y una pantalla digital de LED, de 4 caracteres, más dos barras laterales. Gracias a la adecuada combinación
        de colores y signos gráficos es posible identificar fácilmente el estado del lavavajillas y el avance del ciclo de lavado.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Además de visualizar los parámetros de funcionamiento, como la temperatura de la cuba y la del boiler, o el número de ciclos de lavado
        efectuados. El usuario, puede regular la temperatura, de la cuba y del boiler, o dosificar el detergente y el abrillantador.
