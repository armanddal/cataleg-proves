      text: LAVAVASOS PARA CESTAS DE 350x350 ó 390x390
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Capacidad cuba 7,5 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacidad boiler 2,6 litros de agua.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bomba de lavado de 200 W. de potencia.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disponemos de peanas para elevación, de 120 mm. de alto. (Ver accesorios)
      refs:
