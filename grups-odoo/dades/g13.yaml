      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: Deep-drawn sinks, with all rounded edges, to facilitate cleaning, welded to the countertops, and with sound-absorbing material.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: Equipped with a drain valve and overflow tube, made of stainless steel.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: Drainers, also sausages, with ribs, to reinforce said area, and with sound-absorbing material.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: SINK SUPPORTS
      estil:
        color: '#800080'
        negreta: true
        mida: 9.5
    - role: text
      text: With 40x40 mm tube legs, with adjustable feet, which allows going from 850 to 900 mm. Tall. The hind legs, 40 mm apart. from the wall,
        to allow the passage of water pipes, drainage and the sanitary profile of the floor.
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: SINK SUPPORTS WITH LOWER SHELF
      estil:
        color: '#800080'
        negreta: true
        mida: 9.5
    - role: text
