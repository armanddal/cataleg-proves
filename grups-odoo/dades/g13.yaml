- id: p58
  n: 58
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: SECADORES-ESTERILIZADORES DE CUBIERTOS, LAVAPEROLAS/RECIPIENTES E CUTLERY STERILIZER DRYERS, POT-WASHERS/CONTAINERS F SÉCHOIRS STÉRILISATEURS
        À COUVERTS, LAVE-CASSEROLES/CONTENEURS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CARACTERÍSTICAS GENÉRICAS Construcción en acero inoxidable 18/10 AISI 304. SECADORES-ESTERILIZADORES DE CUBIERTOS Es la máquina ideal
        para garantizar la higiene, de los cubiertos, ya que al esterilizarlos, evita la proliferación de bacterias, en especial en los tenedores.
        También en las cucharas, que nos ponemos en la boca. Además al realizar el secado por medio de arena de maíz, cuyos granos friccionan
        los cubiertos, por vibración, hace que se pulan y brillen, como si fueran nuevos. La temperatura que alcanza la arena de maíz, son 80°C,
        lo que asegura la eliminación total de gérmenes. Su instalación idónea, es debajo de la mesa de salida del lavavajillas de cúpula, de
        manera que después de efectuar el lavado de los cubiertos, se introducen en el secador/esterilizador, por el orificio de entrada, □ y
        salen automáticamente a los 60’’ que es la duración del ciclo, por el de salida □ La producción son 5000 cubiertos/hora. Todo el circuito
        electrónico funciona a 24 voltios. Tiene una capacidad de 8 kilos de arena de maíz, el cual no se consume, pero se debe ir reponiendo,
        mensualmente, para mantener la capacidad idónea. En dotación, se suministran 2 sacos de 4,5 Kgs. cada uno. Montado sobre 4 ruedas giratorias,
        2 con freno. LAVAPEROLAS O RECIPIENTES Diseñados para el lavado de ollas □, bandejas □, recipientes GN □, o utensilios de grandes dimensiones,
        para lo cual disponen de una gran tamaño, tanto de cesta con altura de entrada. Disponemos de cestas de todas las medidas, en acero inoxidable,
        y soportes para insertar en dichas cestas, para el lavado de bandejas o recipientes GN. (Ver en CESTAS) Están fabricados con doble pared,
        incluidas las puertas, lo cual reduce el ruido y la pérdida de calor. Las cubas están embutidas, con los cantos redondeados para facilitar
        la limpieza. □ El filtro está compuesto por una superficie plana e inclinada, para el escurrimiento de los residuos sólidos y un cesto
        que los recoge. Fácilmente extraíble para su vaciado y limpieza □ Con 4 botones táctiles y una pantalla digital de LED, de 4 carácteres,
        mas dos barras laterales. Gracias a la adecuada combinación de colores y signos gráficos es posible identificar fácilmente el estado del
        lavaperolas y el avance del ciclo de lavado. Además de visualizar los parámetros de funcionamiento, como la temperatura de la cuba y la
        del boiler, o el número de ciclos de lavado efectuados. El usuario, puede regular la temperatura, de la cuba y del boiler, o dosificar
        el detergente y el abrillantador. □ Presión del agua de alimentación de 2 a 4 bar. Temperatura del agua de alimentación de 15 a 60°C.
        La duración del ciclo de lavado dependerá del tipo de suciedad a lavar. De los 120’’ a los 420’’, según sea suciedad ligera fresca, o
        suciedad difícil en ollas y utensilios. Por lo tanto el consumo de agua, serán de 3 litros a 6 por ciclo. Todos los datos son orientativos,
        pues también dependerán de la temperatura de entrada del agua. Dotación 1 cesta. Con patas regulables. MODELOS CON CESTAS DE 500X600.
        Equipan un brazo de lavado inferior, giratorio de 3 radios, de material compuesto (PRO COMPOSIT), que gira sobre cojinetes de grafito.
        □ MODELOS CON CESTAS DE 560x630. Están dotados de 2 brazos de lavado, superior e inferior, giratorios de 3 radios, de material compuesto
        (PRO COMPOSIT), que giran sobre cojinetes de grafito. □ MODELOS CON CESTAS DE 700x700 ó 1310x700 Incorporan 2 brazos de lavado, superior
        e inferior, giratorios de 3 radios, de acero inoxidable. □ ACCESORIOS Y CESTAS Disponemos del recuperador de energía el cual se instala
        en la parte superior del lavaperolas, de 230 mm. de altura, por lo tanto no ocupa espacio de longitud. Utiliza el calor latente del interior,
        haciéndolo condensar y calentando unos 25°C el agua que entra en el boiler. El ahorro energético puede llegar hasta 5 Kw/hora de trabajo,
        según el programa de lavado seleccionado. □. También encontraran en CESTAS, varios modelos de soportes de acero inox. para bandejas, recipientes
        GN etc.
