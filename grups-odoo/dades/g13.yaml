    - role: text
      text: All in 18/10 AISI 304 stainless steel.
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: The models on support and with a lower shelf are supplied disassembled. This assembly is done in a maximum of 5 minutes.
      estil:
        color: '#000000'
        mida: 9.5
    - role: text
      text: SINKS WORKTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 9.5
    - role: text
      text: With 100 mm rear splashback.
      refs:
