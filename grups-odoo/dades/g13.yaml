    titol:
      es: TÚNELES DE LAVADO Y MESAS DE RODILLOS E WASHING TUNNELS AND ROLLER TABLES F TUNNELS DE LAVAGE ET TABLES À ROULEAUX
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA DE LOS TUNELES DE LAVADO Todo en acero inoxidable 18/10 AISI 304. Los túneles de lavado, están compuestos por
        distintos módulos, lo cual permite el desmontaje, para facilitar la entrada, y luego proceder al ensamblaje con facilidad, una vez situado
        en el lugar de trabajo. □ Todo el túnel está fabricado con doble pared, incluidas las puertas de guillotina, lo cual reduce el ruido y
        la pérdida de calor. □ Las cubas están embutidas, con los cantos redondeados para facilitar la limpieza. □ El filtro está compuesto por
        una superficie plana e inclinada, para el escurrimiento de los residuos sólidos y un cesto que los recoge. Fácilmente extraíble para su
        vaciado y limpieza. □ Permiten una entrada de altura de 450 mm., para cestas de 500x500, pudiendo lavar bandejas, cubetas GN y otros utensilios.
        □ El arrastre de las cestas, es con guías laterales, lo que facilita la limpieza. Los dientes que mueven las cestas son de acero inox.
        de gran espesor. □ Son reversibles, lo cual permite cambiar el sentido de entrada o salida, realizando unas simples operaciones. No obstante,
        recomendamos indiquen el sentido de marcha, al pasar el pedido, y así vendrá preparada de fábrica. La velocidad de avance de las cestas,
        se regula electrónicamente, por medio de un variador de frecuencia y se controla desde el panel de mandos. Cada uno de los módulos, de
        prelavado/lavado/aclarado y secado, se pone en marcha y se pára de manera independiente, solo si en su interior hay realmente una cesta.
        Dicho sistema mejora el consumo energético. □ El control se realiza por medio de un panel de mandos electrónico, con pantalla multifunción,
        led de 4 cifras. Posee 4 pulsadores táctiles para programar todas las funciones y proporcionar información, seleccionar programas, etc.
        Con conexión USB. □ La temperatura del agua de alimentación, es recomendable que proceda de un calentador, de 40 a 60°C, pues los datos
        orientativos de producción, están basados en ello. Si el agua entra de 15 a 40°C, la producción será menor y el consumo de energía superior.
        También influye, si dispone del módulo de recuperación de calor. Dotación 2 cestas (multiusos y para platos) y 1 cubilete para cubiertos.
        Con patas regulables, de acero inoxidable, de 200 mm. MÓDULO DE LAVADO/ACLARADO Con una longitud de 1150 mm., dispone de una cuba de 70
        litros, y un sistema de lavado con 5 brazos y 60 boquillas, con bomba de doble flujo, de 2,7 Kw. El sistema de gestión de la temperatura,
        con calentamiento o enfriamiento del agua es con control electrónico. Es necesaria una presión de alimentación constante, de entre 2 y
        4 bar. □ MÓDULO DE PRELAVADO Con una longitud de 820 mm., provisto de una cuba de 70 litros, y un sistema de lavado compuesto por 3 brazos
        y 36 boquillas, con una bomba de doble flujo, de 1,5 Kw. de potencia. Opcionalmente, se puede suministrar, con el módulo de prelavado
        en ángulo, para su colocación a derecha o izquierda. (Ver ACCESORIOS) MÓDULO DE SECADO Que está instalado después del proceso de lavado/aclarado.
        De 600 mm. de longitud, y que queda a la altura de la mesa de salida. □ Fabricado con doble pared, y funciona a baja temperatura, 65°C.
        Utiliza un caudal de aire de 1400 m3/hora, extraído al exterior por un turbo-ventilador de 550 W. El módulo está dotado de desagüe. Opcionalmente,
        se puede suministrar, con el módulo de secado en ángulo, para su colocación a derecha o izquierda. (Ver ACCESORIOS) MÓDULO DE RECUPERACIÓN
        DE CALOR Se instala en la parte superior del módulo de entrada, de 210 mm. de altura, por lo tanto no ocupa espacio de longitud. Utiliza
        el calor latente del interior del túnel de lavado, haciéndolo condensar y calentando unos 25°C el agua que entra en el boiler. El ahorro
        energético puede llegar hasta 8 Kw/hora de trabajo, según el programa de lavado seleccionado. Utiliza un caudal de aire de 700 m3/hora,
        y dispone de un turbo-ventilador de 200 W. □ ACCESORIOS Encontrarán, los suplementos por Módulos de prelavado en ángulo, Módulos de secado
        en ángulo, Módulos neutros intermedios, o Módulos zona neutra de entrada, Dosificadores detergente y Abrillantador, etc... MESAS DE RODILLOS
        LINEALES Y CURVAS Con bandeja recoge aguas, que las decanta al túnel de lavado, y que hace la función de guía de las cestas. Con rodillos,
        que facilitan el movimiento de las cestas.
