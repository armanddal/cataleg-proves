  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA LAVAMANOS Construcción en acero inoxidable 18/10 AISI 304. Senos dotados de válvula de desagüe. MODELOS MURALES
        Para su fijación a pared. MODS/CODS. 201P0000 y 20224160 Con seno cilíndrico. Con caño giratorio y pulsador temporizado de rodilla. □
        Con mezclador agua fría-caliente. MOD/COD. 201PJ100 Además dotado de dosificador de jabón de 600 ml. □ MOD/COD. 201E0022 Con seno cilíndrico
        Con grifo electrónico, con cédula fotoeléctrica. □ Conexión eléctrica a 220V/1. Con mezclador agua fría-caliente. MOD/COD. 201EJ102 Además
        dotado de dosificador de jabón de 600 ml. □ MOD/COD. 20424160  Para su instalación en una esquina. Con seno cilíndrico. Con caño giratorio
        y pulsador temporizado de rodilla. □ Con mezclador agua fría-caliente. MOD/COD. 20202450  Diseñado para cocinas con poco espacio, para
        cumplir la normativa. Con 2 senos de 330x360x160 mm. Con 1 caño giratorio y pulsador temporizado de rodilla y con 1 grifo giratorio de
        codo, gerontológico, accionable con el codo. □ Con mezclador agua fría-caliente. MODELOS DE PIE Para su colocación en el suelo. MODS/CODS.
        202P0001 y 20624160 Con seno cilíndrico. Con caño giratorio y pulsador temporizado de pie. Con mezclador agua fría-caliente. MOD/COD.
        202PJ100 Además dotado de dosificador de jabón de 600 ml. □ MOD/COD. 202E0031 Con seno cilíndrico Con grifo electrónico, con cédula fotoeléctrica.
        □ Conexión eléctrica a 220V/1 Con mezclador agua fría-caliente. MOD/COD. 202EJ103 Además dotado de dosificador de jabón de 600 ml. □ MOD/COD.
        20034160 Es autónomo. No precisa toma de agua ni desagüe. Con seno cilíndrico. Con caño giratorio y pulsador de pie hidráulico. Con papelera
        mediante tapa basculante, frontal. Dotados de 2 bidones de 10 litros, uno para agua limpia y el otro para agua sucia. □ MODELOS COLECTIVOS
        Para su instalación, en baños, vestuarios, colectividades… Con seno rectangular. □ Con caños giratorios y pulsadores temporizados de rodilla.
        Con mezclador agua fría-caliente.
