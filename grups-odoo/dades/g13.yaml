- id: p04
  n: 4
  tipus: informacio_general
  capcalera:
    banda: assets/g13/plantilla-quadre-numero.emf
    titol:
      es: FREGADEROS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Todo en acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Los modelos sobre soporte y con estante inferior, se suministran desmontados. Dicho montaje se realiza en un máximo de 5 minutos.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: ENCIMERAS FREGADEROS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Con peto de 100 mm.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Senos embutidos, con todos los cantos redondeados, para facilitar la limpieza, soldados a las encimeras, y con material insonorizante.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipados con válvula de desagüe y tubo rebosadero, de acero inoxidable.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Escurridores, asimismo embutidos, con nervaduras, para reforzar dicha zona, y con material insonorizante.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SOPORTES FREGADEROS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Con patas de tubo de 40x40 mm, con pies regulables, lo que permite pasar de 850 a 900 mm. de altura. Las patas traseras, separadas
        40 mm. de la pared, para permitir el paso de conductos de agua, desagüe y el pefil sanitario del suelo.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: SOPORTES FREGADEROS CON ESTANTE INFERIOR
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Estante reforzado. A 150 mm. del suelo, para facilitar la limpieza.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREGADEROS SOBRE ARMARIO
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Equipados con 2 puertas correderas, mediante guía en la parte superior, quedando la parte inferior libre, para facilitar la limpieza.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Modelos 20430606 y 20530707, con 1 puerta pivotante.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con los laterales tapados.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: El trasero, separado de la pared 40 mm., para salvar el perfil sanitario del suelo, y está abierto para facilitar el conexionado,
        de agua y el desagüe.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREGADEROS CON ESPACIO PARA LAVAVAJILLAS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Para ubicar un lavavasos o lavavajillas de hasta 600 mm. de ancho. (Ver GRUPO13)
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Las partas traseras, separadas 40 mm. De la pared, para permitir el paso de conductos de agua, desagüe y corriente. Y también para
        salvar el perfil sanitario del suelo.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Modelos sobre soporte, se suministran desmontados.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Modelos con estante inferior, reforzado a 150 mm. del suelo, para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Modelos con puerta pivotante y laterales tapados. Ideales para ubicar los productos de limpieza, que debido a la legislación vigente,
        deben estar en un espacio independiente, y cerrado.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREGADEROS SOBRE SOPORTE CON ARO DE DESBARACE
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Encimera con perfil de aguas, en todo su contorno.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con senos embutidos, con todos los cantos redondeados, para facilitar su limpieza, soldados a la encimera, con material insonorizante.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipados con válvula de desagüe y tubo rebosadero.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con aro de desbarace, de caucho alimentario, desmontable, debajo del cual se ubica el cubo de basura. Dispone de espacio para tener
        varias unidades. (Ver GRUPO13)
      refs:
      - 9
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREGADEROS SOBRE SOPORTE CON ARO DE DESBARACE Y ESPACIO PARA LAVAVAJILLAS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Encimera embutida, con perfil de aguas y escurridor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Preparados para ubicar, debajo del escurridor, el lavavajillas de hasta 600 mm. de ancho. (Ver GRUPO13)
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREGADEROS SOBRE SOPORTE PARA LA LIMPIEZA DE ALIMENTOS CON DESBARACE
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Con peto de 100 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con taladro cónico de desbarace, para tirar los desperdicios.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Debajo del mismo se puede ubicar el cubo de basura, y dispone de espacio, para tener mas unidades. (Ver GRUPO13)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: PARA PREPARACIÓN DE VERDURAS. Mod/cod. 208V4107
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dispone de un seno, con válvula de desagüe, en su parte posterior, de gran capacidad, de medida GN, donde se pueden colocar recipientes
        1/1, 2/3, 1/2 ó 1/3. (Ver GRUPO16)
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con placa de polietileno, de 20 mm. de espesor, situada en la parte anterior, para el corte y preparación de las verduras.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: PARA PREPARACION DE CARNES Y PESCADOS. Mod/cod. 208C4107
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con embutición de 20 mm., con desagüe, situada en la parte posterior, sobre la cual incorpora una bandeja perforada, para descongelar
        y escurrir el agua de carnes y pescados.
      refs:
      - 11
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con placa de polietileno, de 20 mm. de espesor, situada en la parte anterior, para la limpieza y preparación de carnes y pescados.
      refs:
      - 10
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: ACCESORIOS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Encontrarán, SOPORTES a pared y cartelas, para encimeras de fregadero, PETOS laterales, DOBLES FONDOS y CESTAS PERFORADAS, etc..
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.75
      y: 2.5
      w: 19.5
      h: 26.0
