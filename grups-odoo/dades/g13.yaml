      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Presión del agua de alimentación de 2-4 bar.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Temperatura del agua de alimentación de 50 a 60ºC
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Duración del ciclo de lavado de 90 a 120’’
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dotación 2 cestas, (multiusos y para platos) y 1 cubilete para cubiertos.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con patas regulables.
      estil:
        color: '#000000'
        mida: 14.0
