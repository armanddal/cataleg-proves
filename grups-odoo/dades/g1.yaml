      es: PLANCHAS GRILL, PLANCHAS GOFRERAS, CREPERAS E GRILL PLATES, WAFFLE IRONS, CREPE MAKERS
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CARACTERÍSTICAS GENERALES Construcción en acero inoxidable. Con patas antideslizantes. Planchas de fundición. PLANCHAS GRILL ELÉCTRICAS
        Tapa superior, basculante, con asa aislada para evitar quemaduras.□ Con bandeja recoge grasas extraíble para la limpieza. Calentamiento
        por medio de resistencias blindadas de acero inox. Con termostato graduable hasta 300ºC. Con piloto indicador de funcionamiento. Con placas
        ranuradas.□ PLANCHAS GOFRERAS ELÉCTRICAS Con las placas para la cocción de gofres, antiadherentes, para facilitar la extracción.□ Con
        temporizador de 5 minutos. CREPERAS ELÉCTRICAS Con placas de Ø 400 mm, esmaltadas.□ Con bandeja recoje grasas extraíble para la limpieza.□
        Calentamiento por medio de resistencias blindadas de acero inox. Con termostato graduable hasta 300ºC Con piloto indicador de funcionamiento.
        Con espátula en dotación. CREPERAS A GAS Con placas de Ø 400 mm, esmaltadas.□ Calentamiento por medio de potentes quemadores. Con termostato
        graduable hasta 280ºC. Con encendido piezoeléctrico. Con espátula en dotación.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 20.621
  - idioma: en
    paragrafs:
    - role: text
      text: GENERAL FEATURES Constructed from stainless steel. With non-slip feet. Cast iron plates. ELECTRIC GRILL PLATES Top cover, tilting,
        with insulated handle to prevent burns.□ With removable grease tray for easy cleaning. Heating through stainless steel shielded resistors.
        Adjustable thermostat up to 300°C. With operating indicator light. With grooved plates.□ ELECTRIC WAFFLE IRONS With non-stick waffle cooking
        plates for easy extraction.□ With a 5-minute timer. ELECTRIC CREPE MAKERS With Ø 400 mm enameled plates.□ With removable grease tray for
        easy cleaning.□ Heating through stainless steel shielded resistors. Adjustable thermostat up to 300°C. With operating indicator light.
        With included spatula. GAS CREPE MAKERS With Ø 400 mm enameled plates.□ Heating through powerful burners. Adjustable thermostat up to
        280°C. With piezoelectric ignition. With included spatula.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 10.65
      y: 3.101
      w: 9.85
      h: 20.675
