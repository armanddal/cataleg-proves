  columnes:
  - idioma: fr
    paragrafs:
    - role: text
      text: FABRICATION En acier inoxydable, intérieur et extérieur. Pieds réglables sur tous les appareils. Avec tiroir à graisse avant. □ Avec
        des plaques de chrome dur de 12 mm d’épaisseur, rectiﬁées et avec un bain de chrome dur de 50 microns. Avec une cuirasse en acier inoxydable
        soudée dans tous ses contours supérieur et inférieur pour une hygiène maximale.□ Fourni avec une spatule pour le nettoyage, il convient
        de l’utiliser sans frapper, en glissant simplement la lame vers le bas du comptoir. □ La méthode de nettoyage est, une fois arrêtée la
        plaque, et après 30/45 minutes (encore chaude), il faut placer des glaçons qui s’évaporent immédiatement. Ensuite, il faut passer doucement
        le coupe-spatule pour éliminer la graisse autant que possible, puis un chiffon humide. Ne mettez pas de dégraissant avant le lendemain
        avant de poser le fer et la surface restera brillante à l’état neuf. PLAQUES À GAZ Avec des robinets en laiton, équipés de maximum et
        minimum réglable. Avec bobine de sécurité et thermocouple. Brûleur tubulaire en acier inoxydable. Ils ont un judas à l’avant. PLAQUES
        ÉLECTRIQUES Avec thermostat et indicateur de fonctionnement de la veilleuse. Avec des résistances blindées en acier inoxydable, montées
        dans des tiroirs correctement isolés.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 17.0
  - idioma: de
    paragrafs:
    - role: text
      text: 'BAUWEISE Aus Edelstahl, innen und außen Verstellbare Füße auf allen Geräten. Mit vorderer Fettschublade ausgestattet. □ Ausgestattet
        mit 12 mm starken, geschliffenen Hartchromplatten und 50 Mikron Hartchrombad. Mit in allen oberen und unteren Konturen verschweißtem Edelstahlschutz
        für maximale Hygiene. □ Sie werden mit einem Reinigungsschaber geliefert, der ohne Stoßbewegungen verwendet werden sollte, indem die Klinge
        sanft über die Arbeitsplatte geschoben wird. □ Reinigung: 30/45 Minuten nach der Verwendung (noch heiß) sollten Eiswürfel hineingelegt
        werden, die sofort verdunsten. Danach mit dem Schaber vorsichtig reinigen, um so viel Fett wie möglich zu entfernen, dann ein feuchtes
        Tuch verwenden. Tragen Sie den Entfetter erst am nächsten Tag vor Beginn des Grillen auf und die Oberﬂ äche wird wie neu glänzend sein.
        GAS HERD Mit Messingarmaturen, ausgestattet mit einstellbarem Maximum und Minimum. Mit Thermoelement-Sicherheitsspule Mit Edelstahl-Rohrbrennern
        Mit Guckloch auf der Vorderseite ELEKTROHERD Mit Thermostat und Betriebsanzeigeleuchte Mit gepanzerten Widerständen aus Edelstahl, die
        in entsprechend isolierten Schubladen montiert sind.'
      estil:
        color: '#000000'
        mida: 7.0
