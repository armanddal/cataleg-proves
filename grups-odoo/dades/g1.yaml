      text: ALLGEMEINE MERKMALE Aus Edelstahl gefertigt. Mit rutschfesten Füßen. Gusseisenplatten. ELEKTRISCHE GRILLPLATTEN Obere Klappe, neigbar,
        mit isoliertem Griff zur Vermeidung von Verbrennungen.□ Mit herausnehmbarer Fettauffangschale für einfache Reinigung. Beheizung durch
        abgeschirmte Widerstände aus Edelstahl. Einstellbarer Thermostat bis zu 300°C. Mit Betriebsanzeigeleuchte. Gerillte Platten.□ ELEKTRISCHE
        WAFFELEISEN Mit antihaftbeschichteten Waffelbackplatten für einfaches Entnehmen.□ Mit 5-Minuten-Timer. ELEKTRISCHE CREPEMAKER Mit Ø 400
        mm emaillierten Platten.□ Mit herausnehmbarer Fettauffangschale für einfache Reinigung.□ Beheizung durch abgeschirmte Widerstände aus
        Edelstahl. Einstellbarer Thermostat bis zu 300°C. Mit Betriebsanzeigeleuchte. Mit im Lieferumfang enthaltener Spachtel. GAS CREPEMAKER
