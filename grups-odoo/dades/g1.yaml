      text: Patas regulables en todos los aparatos, excepto los soportes.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Con los mandos situados en el frontal para evitar quemaduras. □
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Cabezal con la resistencia de acero inoxidable y mecanismos, extraíble para su limpieza. □
      estil:
        color: '#000000'
