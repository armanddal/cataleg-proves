      text: Con cubeta GN extraíble para el vaciado del aceite y su limpieza.
      estil:
        color: '#000000'
        mida: 13.0
    - role: text
      text: Con cestas de acero inoxidable.
      estil:
        color: '#000000'
        mida: 13.0
