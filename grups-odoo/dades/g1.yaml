  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN En acero inoxidable, interior y exterior. Patas regulables en todos los aparatos. Con cajón recoge grasas frontal. □
        Con placas de cromo duro de 12mm de espesor, rectiﬁcadas y con baño de cromo duro de 50 micras. Con peto de acero inoxidable soldado en
        todo su contorno superior e inferior para su máxima higiene. □ Se suministran con una espátula cúter para su limpieza, la cual se debe
        usar sin golpear, sólo deslizando la cuchilla por la encimera. □ La forma de limpieza, es una vez parada y al cabo de 30/45 minutos (aún
        caliente), se deben colocar cubitos de hielo, los cuales se evaporarán inmediatamente. Entonces la espátula-cúter, deberá pasarse suavemente,
        para eliminar al máximo la grasa, y seguidamente un paño húmedo. No poner desengrasante hasta el día siguiente antes de poner la plancha
        en marcha y quedará la superﬁcie brillante como nueva. PLANCHAS A GAS Con grifos de latón, dotados de máximo regulable y mínimo. Con bobina
        de seguridad termopar. Con quemadores tubulares de acero inoxidable. Disponen de mirilla en el frontal. PLANCHAS ELÉCTRICAS Con termostato
        y piloto indicador de funcionamiento. Con resistencias blindadas de acero inoxidable, montadas en cajones debidamente aislados.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 17.0
  - idioma: en
    paragrafs:
    - role: text
      text: MAKING In stainless steel, inside and outside. Adjustable legs on all appliances. With frontal fat drawer. □ With hard chrome plates
        of 12mm thickness, rectiﬁ ed and with hard chrome bath of 50 microns. With stainless steel breastplate welded in all its upper and lower
        contour for maximum hygiene.□ Supplied with a cutter spatula for cleaning, which should be used without hitting, just sliding the blade
        across the countertop.□ The cleaning method is once stopped and after 30/45 minutes (still hot), ice cubes must be placed, which will
        evaporate immediately. Then the spatula-cutter, should be passed smoothly, to remove the fat as much as possible, and then awet cloth
        Do not put degreaser until the next day before putting the iron on and the surface will remain shiny as new. GAS HOT PLATES With brass
        taps, equipped with maximum and minimum adjustable. With safety coil and thermocouple With Tubular stainless Steel burner They have a
        peephole in the front. ELECTRIC HOT PLATES With thermostat and pilot operating indicator. With stainless steel armored resistors, mounted
        in separate drawers.
      estil:
        color: '#000000'
        mida: 7.0
