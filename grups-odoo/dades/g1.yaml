- id: p35
  n: 35
  tipus: informacio_general
  capcalera:
    banda: assets/g1/plantilla-quadre-numero.emf
    serie: BAR23
    serie_pos:
      x: 0.5
      y: 1.773
      w: 3.0
      h: 0.727
    titol:
      es: TOSTADORES ELÉCTRICOS E ELECTRIC TOASTERS F GRILLE-PAINS ÉLECTRIQUES D ELEKTRISCHE TOASTER
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CARACTERÍSTICAS GENERALES Construcción en acero inoxidable interior y exterior. Con patas antideslizantes. Con interruptores luminosos,
        independientes, para las resistencias superior e inferior. Con bandeja situada en la base, extraíble. Dotadas de rejilla con asas para
        la colocación del pan u otros alimentos. SERIE 2 - MODELOS CON RESISTENCIAS DE CUARZO La ventaja de las resistencias de cuarzo, consiste
        en la rapidez de calentamiento. Protegidas por parrillas fijas, para evitar roturas. Equipados con temporizador de 15’ que pára automáticamente
        al terminar el tiempo seleccionado, evitando un consumo innecesario de energía. MODELOS CON RESISTENCIAS DE ACERO INOXIDABLE Las resistencias
        blindadas de acero inoxidable, tienen mayor durabilidad. SERIE 5 Equipados con temporizador de 15’ que pára automáticamente al terminar
        el tiempo seleccionado, evitando un consumo innecesario de energía. SERIE 8 Disponen de guías para colocar el producto en 2 niveles distintos
        de cocción, según tamaño. Permiten gratinar o tostar productos fríos o congelados, ya que tienen resistencias inferiores y superiores.
        Equipados con reguladores de energía independientes.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 12.5
  - idioma: en
    paragrafs:
    - role: text
      text: GENERAL FEATURES Stainless steel construction both inside and outside. Equipped with non-slip feet. Independent illuminated switches
        for upper and lower heating elements. Removable tray located at the base. Includes a grid with handles for placing bread or other food
        items. SERIES 2 - MODELS WITH QUARTZ HEATING ELEMENTS The advantage of quartz heating elements is their quick heating. Protected by fixed
        grilles to prevent breakage. Equipped with a 15-minute timer that automatically stops when the selected time is up, preventing unnecessary
        energy consumption. MODELS WITH STAINLESS STEEL HEATING ELEMENTS Stainless steel sheathed heating elements for increased durability. SERIES
        5 Equipped with a 15-minute timer that automatically stops when the selected time is up, preventing unnecessary energy consumption. SERIES
        8 Includes guides for placing the product at 2 different cooking levels, depending on the size. Allows for grilling or toasting cold or
        frozen products, as they have both upper and lower heating elements. Equipped with independent energy regulators.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 10.65
      y: 3.101
      w: 9.85
      h: 12.5
  - idioma: fr
    paragrafs:
    - role: text
      text: CARACTÉRISTIQUES GÉNÉRALES Construction en acier inoxydable à l'intérieur et à l'extérieur. Doté de pieds antidérapants. Interrupteurs
        lumineux indépendants pour les éléments chauffants supérieurs et inférieurs. Plateau amovible situé à la base. Livré avec une grille munie
        de poignées pour placer le pain ou d'autres aliments. SÉRIE 2 - MODÈLES AVEC RÉSISTANCES EN QUARTZ L'avantage des résistances en quartz
        réside dans leur chauffage rapide. Protégées par des grilles fixes pour éviter les ruptures. Équipés d'une minuterie de 15 minutes qui
        s'arrête automatiquement lorsque le temps sélectionné est écoulé, évitant ainsi une consommation inutile d'énergie. MODÈLES AVEC RÉSISTANCES
        EN ACIER INOXYDABLE Résistances blindées en acier inoxydable pour une durabilité accrue. SÉRIE 5 Équipés d'une minuterie de 15 minutes
        qui s'arrête automatiquement lorsque le temps sélectionné est écoulé, évitant ainsi une consommation inutile d'énergie. SÉRIE 8 Comprend
        des guides pour placer le produit à 2 niveaux de cuisson différents, en fonction de la taille. Permet de griller ou de toaster des produits
        froids ou congelés, car ils disposent d'éléments chauffants supérieurs et inférieurs. Équipés de régulateurs d'énergie indépendants.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.98
      y: 16.2
      w: 9.386
      h: 12.5
  - idioma: de
    paragrafs:
    - role: text
      text: ALLGEMEINE MERKMALE Konstruktion aus Edelstahl innen und außen. Mit rutschfesten Füßen ausgestattet. Unabhängige beleuchtete Schalter
        für die oberen und unteren Heizelemente. Herausnehmbare Auffangschale am Boden. Enthält ein Gitter mit Griffen zum Platzieren von Brot
        oder anderen Lebensmitteln. SERIE 2 - MODELLE MIT QUARZ-HEIZELEMENTEN Der Vorteil von Quarz-Heizelementen besteht in ihrer schnellen Aufheizzeit.
        Geschützt durch feste Gitter, um Brüche zu verhindern. Ausgestattet mit einem 15-Minuten-Timer, der automatisch stoppt, wenn die ausgewählte
        Zeit abgelaufen ist, um unnötigen Energieverbrauch zu vermeiden. MODELLE MIT EDELSTAHL-HEIZELEMENTEN Edelstahl-Heizelemente für erhöhte
        Haltbarkeit. SERIE 5 Ausgestattet mit einem 15-Minuten-Timer, der automatisch stoppt, wenn die ausgewählte Zeit abgelaufen ist, um unnötigen
        Energieverbrauch zu vermeiden. SERIE 8 Enthält Führungen zur Platzierung des Produkts auf 2 verschiedenen Kochstufen, abhängig von der
        Größe. Ermöglicht das Grillen oder Toasten von kalten oder gefrorenen Produkten, da sie sowohl obere als auch untere Heizelemente haben.
        Ausgestattet mit unabhängigen Energieregulatoren.
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 10.65
      y: 16.2
      w: 9.85
      h: 12.5
