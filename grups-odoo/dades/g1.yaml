        supérieur basculant avec poignée isolée pour éviter les brûlures.□ Plateau de récupération des graisses amovible pour un nettoyage facile.
        Chauffage par résistances blindées en acier inoxydable. Thermostat réglable jusqu'à 300°C. Témoin lumineux de fonctionnement. Plaques
        striées.□ FERS À GAUFRES ÉLECTRIQUES Avec plaques antiadhésives pour faciliter l'extraction des gaufres.□ Minuterie de 5 minutes. CRÊPIÈRES
        ÉLECTRIQUES Avec plaques de Ø 400 mm, émaillées.□ Plateau de récupération des graisses amovible pour un nettoyage facile.□ Chauffage par
        résistances blindées en acier inoxydable. Thermostat réglable jusqu'à 300°C. Témoin lumineux de fonctionnement. Avec spatule incluse.
        CRÊPIÈRES À GAZ Avec plaques de Ø 400 mm, émaillées.□ Chauffage par des brûleurs puissants. Thermostat réglable jusqu'à 280°C. Allumage
        piezoélectrique. Avec spatule incluse.
      estil:
