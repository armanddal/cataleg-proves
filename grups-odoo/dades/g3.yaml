  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: STRUCTURE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: In stainless steel, interior and exterior.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Adjustable legs in all appliances.
      estil:
        color: '#000000'
        mida: 10.1
    - role: titol
      text: GAS OR ELECTRIC FRYTOPS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: Gas models with iron plates, with brass taps, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With tubular stainless steel burners.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Gas models with hard chrome plates, with thermostatic valve and maintenance pilot. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: All gas models with piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Electric models with thermostat and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With armored stainless steel resistors, mounted in drawers properly insulated.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: All models with drawer collects grease □ on the front and conical sealing cap. □
      estil:
        color: '#000000'
        mida: 10.1
    - role: titol
      text: FRYTOPS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: Models with 15 mm iron plates of thickness. With stainless steel breastplate welded in all its upper and lower contour for maximum
        hygiene. With front drain.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: The surface of these plates can be smooth, fully grooved, or mixed (2/3 smooth and 1/3 grooved), only on 700 mm wide models.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Models with 15mm thick hard chrome plates, rectified and with 50 micron hard chrome plating. With stainless steel breastplate welded
        in all its upper and lower contour for maximum hygiene. With front drain.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: They are supplied with a spatula-cutter □ for cleaning, which should be used without hitting, just by sliding the blade over the countertop.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: The cleaning method, once the iron is stopped and after 30/45 minutes (still hot), ice cubes should be placed, which will evaporate
        immediately. Then the spatula-cutter should be passed gently, to remove the maximum fat, and then a damp cloth. Do not put degreaser until
        the next day before starting the iron and the surface will be shiny as new.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: These plates are always smooth.
      estil:
        color: '#000000'
        mida: 10.1
    - role: titol
      text: GAS BARBECUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: Operation by means of stainless steel tubular burners, which heat the volcanic stone, which is located on top of a stainless steel
        support grid. When heating the stone, it acts as an authentic grill.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With brass taps, equipped with adjustable maximum, minimum and pilot position. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Equipped grills, □ formed by profiles in "V" always stainless steel, 350 mm. Wide. (one or two units depending on the model), which
        are ideal for meats, vegetables etc ... In ACCESSORIES, you can see as an option, the special grill for fish, which have cylindrical profiles.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With a system that allows the placement of a grill in 2 positions, using the bakelite handles available on the grill and with bib
        around the grill, to avoid splashing. □
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With fat-picker drawer on the front.
      estil:
        color: '#000000'
        mida: 10.1
    - role: titol
      text: GRILL STEAM ELECTRIC BARBECUE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: The grill-cooking is carried out by means of stainless steel tubular resistors, which are tilted for cleaning, by means of a lever
        on the right, and with a locking system, in its elevated position. □
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: With a switch with several positions and pilot operation indicator.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Underneath, a tank is located, which must be filled with water, in which the cooking fats fall, which reduces the smoke generated
        and generates the steam, so that the food is tasty and very juicy.
      estil:
        color: '#000000'
        mida: 10.1
    - role: text
      text: Likewise, it is very easy to clean, since it has a drain tap on the front with safety device, to prevent accidental opening. □
      estil:
        color: '#000000'
        mida: 10.1
    - role: titol
      text: ACCESSORIES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.1
    - role: text
      text: In the corresponding pages you will find the ELEMENTS OF UNION, between modules, (removable), to avoid leaks between them.
      estil:
        color: '#000000'
        mida: 10.1
    pos:
      x: 0.98
      y: 3.5
      w: 9.386
      h: 25.0
