        mida: 9.4
    - role: text
      text: Modèles électriques avec thermostat et indicateur de fonctionnement de la veilleuse.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec résistances blindées en acier inoxydable, montées dans des tiroirs correctement isolé.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Tous les modèles avec tiroir recueille la graisse □ à l'avant et le capuchon d'étanchéité conique. □
      estil:
        color: '#000000'
        mida: 9.4
    - role: titol
      text: PLAQUES–FRYTOP
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.4
    - role: text
      text: Modèles avec plaques de fer de 15 mm. épais Avec une cuirasse en acier inoxydable soudée dans tous ses contours supérieur et inférieur
        pour une hygiène maximale. Avec drain avant.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: La surface de ces plaques peut être lisse, entièrement rainurée ou mélangée (2/3 lisses et 1/3 rainurée), uniquement sur les modèles
        d’une largeur de 700 mm.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Modèles avec plaques de chrome dur de 15 mm d'épaisseur, rectifiées et chromées de 50 microns. Avec une cuirasse en acier inoxydable
        soudée dans tous ses contours supérieur et inférieur pour une hygiène maximale. Avec drain avant.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Ils sont fournis avec un couteau-spatule □ pour le nettoyage, qui doit être utilisé sans frapper, simplement en faisant glisser la
        lame sur le comptoir.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: La méthode de nettoyage, une fois que le fer est arrêté et après 30/45 minutes (encore chaud), il faut placer des glaçons qui s’évaporent
        immédiatement. Ensuite, il faut passer doucement le coupe-spatule pour éliminer le maximum de graisse, puis un chiffon humide. Ne mettez
        pas de dégraissant avant le lendemain, avant de mettre le fer en marche. La surface sera comme neuve.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Ces plaques sont toujours lisses
      estil:
        color: '#000000'
        mida: 9.4
    - role: titol
      text: BARBECUE À GAZ
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.4
    - role: text
      text: Fonctionnement au moyen de brûleurs tubulaires en acier inoxydable chauffant la pierre volcanique située au sommet d’une grille de
        support en acier inoxydable. En chauffant la pierre, elle agit comme un grill authentique.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec robinets en laiton, équipés de positions de réglage maximum, minimum et pilote. Avec bobine de sécurité et thermocouple.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec allumage piézo-électrique.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Grilles équipées, □ formées de profils en "V" toujours en acier inoxydable, 350 mm. large. (une ou deux unités selon le modèle), idéales
        pour les viandes, les légumes, etc. Dans ACCESSOIRES, vous pouvez voir en option le gril spécial pour le poisson, qui a des profils cylindriques.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec un système qui permet de placer un gril dans 2 positions, en utilisant les poignées en bakélite disponibles sur le gril et avec
        un bavoir autour du gril pour éviter les éclaboussures. □
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec tiroir à graisse sur le devant.
      estil:
        color: '#000000'
        mida: 9.4
    - role: titol
      text: BARBECUE ELECTRIQUE GRILL STEAM
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.4
    - role: text
      text: La cuisson au gril est réalisée au moyen de résistances tubulaires en acier inoxydable inclinées pour le nettoyage, au moyen d'un
        levier situé à droite et d'un système de verrouillage en position surélevée. □
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: Avec un interrupteur à plusieurs positions et indicateur de fonctionnement du pilote.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: En dessous se trouve un réservoir, qui doit être rempli d'eau, dans lequel tombent les graisses de cuisson, ce qui réduit la fumée
        générée et génère de la vapeur, de sorte que la nourriture soit savoureuse et très juteuse.
      estil:
        color: '#000000'
        mida: 9.4
    - role: text
      text: De même, il est très facile à nettoyer car il dispose d'un robinet de vidange à l'avant avec dispositif de sécurité pour éviter toute
        ouverture accidentelle. □
      estil:
        color: '#000000'
        mida: 9.4
    - role: titol
      text: ACCESSOIRES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 9.4
    - role: text
      text: Dans les pages correspondantes, vous trouverez les ELEMENTS OF UNION, entre les modules (amovibles), pour éviter les fuites entre
        eux.
      estil:
        color: '#000000'
        mida: 9.4
    pos:
      x: 11.114
