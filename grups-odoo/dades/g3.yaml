- id: p16
  n: 16
  tipus: informacio_general
  capcalera:
    banda: assets/g3/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: 600 SNACK
    logo_serie: assets/g3/logo-serie-master.png
    titol:
      es: FREIDORAS, CONSERVADORES DE FRITOS, BAÑOS MARIA, CUECE PASTA Y MESAS SOPORTE
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: En acero inoxidable, interior y exterior.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Patas regulables en todos los aparatos.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: FREIDORAS A GAS Y ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Todos los modelos con cestas de acero inoxidable y tapas con asa.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con cubas totalmente soldadas a la encimera, embutida para facilitar la limpieza y así mismo evitar que el aceite rebose.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con rejilla perforada para evitar vayan alimentos al fondo.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con grifo de vaciado, situado en el frontal de la freidora, con dispositivo de seguridad, para evitar la abertura accidental
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con generosa zona fría, lo cual aumenta la duración del aceite.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Modelos a gas, con dos tubos intercambiadores de calor en cada cuba de 10 litros, y con protectores de los bulbos de los termostatos.
        □
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Los quemadores de fundición, tipo soplete, de gran potencia.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con válvula termostática y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Modelos eléctricos, con la cuba muy fácil de limpiar, por disponer de un mecanismo para que la resistencia pueda bascular hasta la
        posición vertical, que se acciona mediante una palanca situada a la derecha y con un sistema de bloqueo, en su posición elevada. □
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Dichas resistencias son de acero inoxidable blindadas.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con termostato de seguridad que pára la freidora en caso de aumento anormal de la temperatura del aceite.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: CONSERVADORES DE FRITOS ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Equipados con una cuba GN 2/3-150, con doble fondo perforado y curvado para facilitar la recogida de fritos, todo ello extraíble para
        su limpieza.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con una resistencia cerámica, situada en la pantalla superior. □
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Dotado de regulador de energía, para adecuar la temperatura deseada y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: BAÑOS MARÍA ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Con la cuba, GN 1/1, soldada a la encimera, con todos los cantos internos redondeados.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con grifo de desagüe, situado en el frontal, con dispositivo de seguridad, para evitar la abertura accidental.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Equipados con una resistencia adhesiva, situada en el fondo de la cuba, de manera que el interior de la misma esta totalmente limpio.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Dotados de termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: OPCIONALMENTE, disponemos de un doble fondo perforado de acero inoxidable, □ ver en ACCESORIOS, para el mantenimiento de alimentos
        en ollas, directamente. O si lo desean, pueden colocar distintas combinaciones de recipientes GN. (Ver catálogo GRUPO-16)
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: CUECE PASTAS A GAS Y ELÉCTRICOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Con la cuba, GN 2/3, fabricada en acero AISI-316, soldada a la encimera.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con rejilla perforada pára evitar vayan los alimentos al fondo.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Dispone de grifos de llenado y de vaciado.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con rebosadero para evitar el derrame de agua y a la vez la evacuación del almidón de la pasta, que flota.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Modelos a gas, con quemador tubular de acero inoxidable
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con grifo de latón, dotado de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Modelos eléctricos, equipan una resistencia de acero inoxidable, blindada.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Dotados de conmutador-termostato y piloto de funcionamiento.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: OPCIONALMENTE, disponemos de cestas perforadas con asa/s totalmente de acero inoxidable. Ver en ACCESORIOS los packs que ofrecemos.
        □
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: MESAS DE APOYO Y FREGADEROS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Las mesas pueden disponer de cajón, con guías correderas de máxima calidad.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Los fregaderos con cuba soldada a la encimera y con válvula de desagüe.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: Con grifo de agua fría-caliente en dotación. □
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: SOPORTES ABIERTOS, CON PUERTAS Ó CON CAJONES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: Los muebles están fabricados para colocar encima de ellos los elementos de cocción, formando un conjunto.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: OPCIONALMENTE, se pueden colocar guías para GN 1/1, para el almacenamiento de dichos recipientes. □ También ofrecemos un elemento
        calefactor, que se coloca en la Base del soporte con puerta/s, para mantener alimentos calientes. □ Todo ello lo encontraran en las páginas
        de ACCESORIOS.
      estil:
        color: '#000000'
        mida: 10.6
    - role: titol
      text: TAMBIÉN FABRICAMOS, PARA COLOCAR ENCIMA ELEMENTOS DE SOBREMESA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 10.6
    - role: text
      text: De altura 600 mm.
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: MESAS CALIENTES. Ver en Catalogo GRUPO-7 EQUIPOS CALIENTES
      estil:
        color: '#000000'
        mida: 10.6
    - role: text
      text: RESERVAS FRIAS. Ver en Catalogo GRUPO-11 FRÍO INDUSTRIAL
      estil:
        color: '#000000'
        mida: 10.6
    pos:
      x: 0.5
      y: 3.0
      w: 14.5
      h: 25.4
