- id: p11
  n: 11
  tipus: informacio_general
  capcalera:
    banda: assets/g3/plantilla-quadre-numero.emf
    xip_color: '#772f32'
    serie: 600 SNACK
    logo_serie: assets/g3/logo-serie-master.png
    titol:
      es: PLANCHAS-FRYTOP Y BARBACOAS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: En acero inoxidable, interior y exterior.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Patas regulables en todos los aparatos.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: PLANCHAS-FRYTOP GAS O ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Los modelos a gas y con placas de hierro, con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de
        seguridad y termopar.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con quemadores tubulares de acero inoxidable.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Modelos a gas y con placas de cromo duro, con válvula termostática y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Todas los modelos a gas con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Modelos eléctricos con termostato y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con resistencias blindadas de acero inoxidable, montadas en cajones
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: debidamente aislados.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Todos los modelos con cajón recoge grasas □ en el frontal y tapón de estanqueidad cónico. □
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: PLACAS–FRYTOP
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Modelos con placas de hierro de 15 mm. de espesor. Con peto de acero inoxidable soldado en todo su contorno superior e inferior para
        su máxima higiene. Con desagüe frontal.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: La superficie de dichas placas pueden ser lisas, ranuradas totalmente, o mixtas (2/3 lisa y 1/3 ranurada), solo en los modelos de
        700 mm. de ancho.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Los modelos con placas de cromo duro de 15mm de espesor, rectificadas y con baño de cromo duro de 50 micras. Con peto de acero inoxidable
        soldado en todo su contorno superior e inferior para su máxima higiene. Con desagüe frontal.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Se suministran con una espátula-cúter □ para su limpieza, la cual se debe usar sin golpear, sólo deslizando la cuchilla por la encimera.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: La forma de limpieza, es una vez parada la plancha y al cabo de 30/45 minutos (aún caliente), se deben colocar cubitos de hielo,  los
        cuales se evaporarán inmediatamente. Entonces la espátula-cutter deberá pasarse suavemente, para eliminar al máximo la grasa, y seguidamente
        un paño húmedo. No poner desengrasante hasta el día siguiente antes de poner la plancha en marcha y quedará la superficie brillante como
        nueva.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Dichas placas siempre son lisas
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: BARBACOAS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Funcionamiento mediante quemadores tubulares de acero inoxidable, que calientan la piedra volcánica, que se halla situada encima de
        una rejilla-soporte de acero inoxidable. Al calentar la piedra, hace la función de auténtica brasa.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con grifos de latón, dotados de máximo regulable, mínimo y posición piloto. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Equipan parrillas, □ formadas por perfiles en “V” siempre de acero inoxidable, de 350 mm. de ancho. (una o dos unidades según modelo),
        las cuales son ideales para carnes, verduras etc... En ACCESORIOS, pueden ver como opción, la parrilla especial para pescado, las cuales
        disponen de perfiles cilindricos.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con un sistema que permite la colocación de parrilla en 2 posiciones, utilizando para ello las asas de baquelita de que dispone la
        parrilla y con peto alrededor de la parrilla, para evitar salpicaduras. □
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con cajón recoje-grasas en el frontal.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: BARBACOAS ELECTRICAS-GRILL VAPOR
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: La cocción-grill, se realiza mediante resistencias tubulares de acero inoxidable, las cuales basculan para su limpieza, mediante una
        palanca situada a la derecha, y con un sistema de bloqueo, en su posición elevada. □
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Con un conmutador con varias posiciones y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Debajo, está situada una cuba, que debe ser llenada con agua, en la cual caen las grasas de la cocción, lo cual reduce el humo generado
        y genera el vapor, para que los alimentos queden sabrosos y muy jugosos.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Así mismo, es muy fácil de limpiar, puesto que dispone de un grifo de desagüe en el frontal con dispositivo de seguridad, para evitar
        la abertura accidental. □
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: ACCESORIOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: En las páginas correspondientes encontraran los ELEMENTOS DE UNION, entre módulos, (extraíbles), para evitar filtraciones entre los
        mismos.
      estil:
        color: '#000000'
        mida: 11.7
    pos:
      x: 0.828
      y: 3.5
      w: 13.847
      h: 24.918
