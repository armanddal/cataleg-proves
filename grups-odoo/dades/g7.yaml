    textos:
      es:
      - role: text
        text: CARACTERÍSTICAS TÉCNICAS
      - role: text
        text: Como fabricantes, nos reservamos el derecho de modificar sin previo aviso las características que constan en este catálogo, en beneficio de mejorar nuestros productos.
    icona: assets/g7/condicions-icona-p37-4.png
  - pos:
      x: 2.5
      y: 9.897
      w: 17.5
      h: 3.7
    textos:
      es:
      - role: text
        text: GARANTIA
      - role: text
        text: La garantía se concede solamente en los defectos de fabricación quedando excluidos de ella la utilización indebida. PIEZAS Dicha garantía es de 12 meses en piezas defectuosas, siendo por cuenta
          del cliente los portes de ida y vuelta de dichas piezas. Todo material remitido en garantía se facturará y se procederá a su correspondiente abono, una vez remitidas las piezas defectuosas y comprobadas
          por parte del fabricante. MANO DE OBRA El servicio de mano de obra y los desplazamiento son siempre por cuenta del cliente. El fabricante no se hará cargo en ningún caso de ningún tipo o clase
          de indemnización.
    icona: assets/g7/condicions-icona-p37-5.png
  - pos:
      x: 2.5
      y: 13.548
      w: 17.5
      h: 1.5
    textos:
      es:
      - role: text
        text: JURISDICCIÓN
      - role: text
        text: Serán únicamente competentes, en caso de litigio, los tribunales de Barcelona.
