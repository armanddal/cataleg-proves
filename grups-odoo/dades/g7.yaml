        mida: 14.0
    - role: text
      text: Interior y exterior en acero inoxidable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CARACTERÍSTICAS GENÉRICAS DE LAS MESAS CALIENTES, MURALES Y CENTRALES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Cuba aislada con fibra de vidrio.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con patas regulables de acero inox. Para elevar la altura de 850 a 900 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con 2 estantes, el inferior y el intermedio.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con calor ventilado, para mejor reparto del calor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con resistencias circulares blindadas de acero inox.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termómetro termostato electrónico digital e interruptor luminoso marcha-paro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MESAS CALIENTES MURALES PARA PLATOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con peto posterior de 100 mm.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con dos puertas correderas
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MESAS CALIENTES CENTRALES PARA PLATOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Creadas para su colocación en el centro, para usarlas como mesas de pase.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Por ello, dispone de cuatro puertas correderas, 2 por cada lado, lo que permite acceder a los platos, tanto al cocinero como al camarero.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: RESERVAS CALIENTES PARA PLATOS Y GN 1/1 CON COMIDA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Altura 630 mm. diseñadas para colocar en su encimera, aparatos de cocción de 600, 700 ó 900 mm. de fondo. O para su instalación en buffets.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con patas regulables de acero inox, para poder ajustar la altura en línea con las cocinas.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Calor estático.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con elemento calefactor, extraíble, compacto. Con resistencia de acero inoxidable blindada, termostato regulable de temperatura y piloto indicador de funcionamiento.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con un estante inferior, donde se pueden depositar platos.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Así mismo, dispone de guías para 3 recipientes GN 1/1-65, encima del calefactor.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, se pueden colocar kits de 4 guías en las otras puertas (ver ACCESORIOS), en el caso de querer utilizar la reserva para recipientes GN 1/1.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con puertas pivotantes.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: ARMARIOS CALIENTES PARA PLATOS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Ideados para su instalación en comedores o buffets, para platos de hasta 310 mm Ø.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Altura 870 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Calor estático.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con resistencia de acero inoxidable blindada.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato de temperatura regulable y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con dos estantes, el inferior y otro intermedio.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con puertas pivotantes.
