- id: p32
  n: 32
  tipus: informacio_general
  capcalera:
    banda: assets/g7/plantilla-quadre-numero.emf
    titol:
      en: HOT TABLES AND HOT MEAL DELIVERY TROLLEYS
      fr: TABLES CHAUDES ET CHARIOTS DE LIVRAISON DE REPAS
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Interior and exterior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Fiberglass insulated tank
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With ventilated heat, for better heat distribution. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With circular heating elements, armored in stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With digital electronic thermometer-thermostat and luminous start-stop switch.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Model 60939159, with analog thermostat.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With guides for GN containers. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: The air circulation is total, since the trays do not touch the walls of the tank.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With pivoting doors.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: HOT TABLES FOR MEALS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: With rear breastplate of 100 mm. □ Models 65002340 and 62002340.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With adjustable stainless steel legs, to raise the height from 850 to 900 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacity for 7 GN 1 / 1-65 containers per door. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Humidity can be generated by placing a GN 1/1 40 mm. Container at the bottom, filling it with water, which creates the ideal degree of humidity so that the food does not dry out. (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: HOT MEAL DELIVERY TROLLEYS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: With 4 reinforced wheels of 150 mm. Ø, 2 of them with brake. With bumpers on all 4 corners. □ With handles for driving, located on the narrow side of the cart. Extendable connection cable, being
        spiral, single phase, with hook on the side, for when it is on the move. Capacity for one GN 2/1 container or two GN 1/1 per guide, as the entrance is 530 mm from the side. (See ACCESSORIES) Moisture
        is generated by filling the GN 2/3 containers with water, which are fitted as standard at the base of the tank, above the heating unit, and thus prevent the food from drying out. □ Hinges designed
        so that the opening of the doors reaches up to 270°, thereby achieving. That when it is open, it remains attached to the side of the trolley, and does not disturb. □ Doors with silicone gasket,
        to maintain the internal temperature. □ Snap closure, with key.
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Intérieur et extérieur en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Réservoir isolé en fibre de verre
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec chaleur ventilée, pour une meilleure répartition de la chaleur. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec éléments chauffants circulaires, blindés en acier inoxydable.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec thermomètre-thermostat électronique numérique et interrupteur marche-arrêt lumineux.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Modèle 60939159, avec thermostat analogique.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec guides pour conteneurs GN. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La circulation de l'air est totale, puisque les plateaux ne touchent pas les parois de le réservoir.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec portes pivotantes.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: TABLES CHAUDES POUR LES REPAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Avec dossard arrière de 100 mm. □ Modèles 65002340 et 62002340.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec pieds réglables en acier inoxydable, pour élever la hauteur de 850 à 900 mm.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacité pour 7 conteneurs GN 1 / 1-65 par porte. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: L'humidité peut être générée en plaçant un récipient GN 1/1 40 mm au fond, en le remplissant d'eau, ce qui crée le degré d'humidité idéal pour que les aliments ne se dessèchent pas. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CHARIOTS DE LIVRAISON DE REPAS CHAUDS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Avec 4 roues renforcées de 150 mm. Ø, 2 d'entre eux avec frein.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec pare-chocs aux 4 coins. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec poignées pour la conduite, situées sur le côté étroit du chariot.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Câble de connexion extensible, en spirale, monophasé, avec crochet sur le côté, pour quand il est en mouvement.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacité pour un bac GN 2/1 ou deux GN 1/1 par guide, l'entrée étant à 530 mm de côté. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: L'humidité est générée en remplissant les récipients GN 2/3 avec de l'eau, qui sont montés en standard à la base du réservoir, au-dessus de l'unité de chauffage, et de cette manière, les aliments
        ne se dessèchent pas. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Charnières conçues pour que l'ouverture des portes atteigne jusqu'à 270°, réalisant ainsi que lorsqu'il est ouvert, il reste attaché au côté le chariot, et ne dérange pas. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Portes avec joint en silicone, pour maintenir la température interne. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Fermeture à pression, avec clé.
      estil:
        color: '#000000'
        mida: 14.0
