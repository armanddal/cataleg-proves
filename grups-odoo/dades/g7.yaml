- id: p31
  n: 31
  tipus: informacio_general
  capcalera:
    banda: assets/g7/plantilla-quadre-numero.emf
    titol:
      es: MESAS Y CARROS CALIENTES PARA COMIDAS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Interior y exterior en acero inoxidable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cuba aislada con fibra de vidrio.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con calor ventilado, para mejor reparto del calor.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con resistencias circulares, blindadas de acero inox.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termómetro-termostato electrónico digital e interruptor luminoso de marcha-paro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Mod. 80839169, con termostato analógico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con guías para recipientes GN.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La circulación del aire, es total, puesto que las cubetas, no tocan las paredes de la cuba.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con las puertas pivotantes.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MESAS CALIENTES PARA COMIDAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con peto posterior de 100 mm. Mods. 65002340 y 62002340
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con patas regulables de acero inoxidable, para elevar la altura.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacidad para 7 recipientes GN 1/1-65 por puerta.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Se puede generar humedad, colocando un recipiente GN 1/1 de 40 mm., en la parte inferior, llenándolo de agua, la cual crea el grado de humedad idóneo para que no se resequen los alimentos. (Ver
        ACCESORIOS)
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CARROS CALIENTES PARA COMIDAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con 4 ruedas reforzadas de 150 mm. Ø, 2 de ellas con freno.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con parachoques en las 4 esquinas.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con asas para su conducción, situadas en el lado estrecho del carro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cable de conexión extensible, al ser espiral, monofásico, con gancho en el lateral, para cuando está en movimiento.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Capacidad para un recipiente GN 2/1 ó dos GN 1/1 por guía, al ser la entrada por el lado de 530 mm. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: La humedad se genera llenando de agua los recipientes GN 2/3 que lleva de serie en la base de la cubeta, encima del grupo calefactor, y de esa forma, se evita que se resequen los alimentos.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Bisagras diseñadas de manera que la apertura de las puertas llegue hasta los 270°, consiguiendo con ello. Que cuando está abierta, se quede adosada al lateral del carro, y no moleste.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Puertas con burlete de silicona, para el mantenimiento de la temperatura interna.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Cierre a presión, con llave.
      estil:
        color: '#000000'
        mida: 14.0
