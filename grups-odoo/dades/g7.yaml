- id: p16
  n: 16
  tipus: informacio_general
  capcalera:
    banda: assets/g7/plantilla-quadre-numero.emf
    titol:
      en: PASTRY FRYERS / RIBBON BREAD TOASTERS
      fr: FRITEUSES À PÂTISSERIE / GRILLE-PAIN À RUBAN
  columnes:
  - idioma: en
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: Interior and exterior in 18/10 AISI-304 stainless steel.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With adjustable feet
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: GENERIC DETAILS PASTRY FRYERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: Designed for the specific use of pastry shops, with large, shallow vats that allow uniform frying, without crowding of pieces, such as donuts, bagels, fritters, etc.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Tanks with rounded edges to facilitate cleaning.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With baskets equipped with 2 handles, for easy use.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Equipped with a grid that prevents product residues from falling and going to the bottom of the tank.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With drain tap, located on the front, with a safety device that prevents accidental opening.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Optionally, drainer can be placed on one side, right or left. See ACCESSORIES.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: GAS FRYERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: With heat exchangers inside the tank. With cast iron burners, torch type.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With thermostatic valve from 0 to 190° C and maintenance pilot. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With safety thermostat, which stops the fryer in case of abnormal increase in oil temperatura at 240° C.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With piezo-electric ignition.
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: ELECTRIC FRYERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: With armored stainless steel heating elements, which have a mechanism so that they can rotate to the vertical position, and thus facilitate cleaning. They are equipped with a safety micro, which
        disconnects the resistance when it is being cleaned, to avoid burns and failure of the resistance due to overheating.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With thermostat from 0 to 190° C and operating indicator light.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With safety thermostat, which stops the fryer in case of abnormal increase in oil temperature at 240° C.
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: GENERIC DETAILS OF RIBBON BREAD TOASTERS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: Designed for installation in hotel buffets.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With stainless steel belt, with adjustable advance.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Any type of bread can be toasted. 70 mm high inlet mouth.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Equipped with a removable tray to collect bread crumbs.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: With independent operating upper and lower stainless steel armored heating elements.
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: MOD./COD. 43616017 (HORIZONTAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: Horizontal operation. With double direction of rotation.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: Introduction of the bread, from the right or the left, and once toasted, it comes out on the opposite side.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 12.0
    - role: titol
      text: MOD./COD. 43816017 (VERTICAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 12.0
    - role: text
      text: Vertical operation. It has the advantage that it occupies only 480 mm. buffet.
      estil:
        color: '#000000'
        mida: 12.0
    - role: text
      text: The bread is introduced through the upper front part, and it comes out toasted at the bottom.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 12.0
    pos:
      x: 0.98
      y: 3.101
      w: 9.386
      h: 25.7
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Intérieur et extérieur en acier inoxydable 18/10 AISI-304.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec pieds réglables.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: DÉTAILS GÉNÉRIQUES FRITEUSES À PÂTISSERIE
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Conçu pour l'usage spécifique des pâtisseries, avec de grandes cuves peu profondes qui permettent une friture uniforme, sans encombrement de morceaux, tels que beignets, donuts, bagels, etc.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Cuves aux bords arrondis pour faciliter le nettoyage.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec des paniers équipés de 2 poignées, pour une utilisation facile.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Équipé d'une grille qui empêche les résidus de produit de tomber et d'aller au fond du réservoir.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec robinet de vidange, situé à l'avant, avec un dispositif de sécurité qui empêche l'ouverture accidentelle.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: En option, l'égouttoir peut être placé d'un côté, à droite ou à gauche. Voir ACCESSOIRES.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: FRITEUSES À GAZ
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Avec échangeurs de chaleur à l'intérieur du réservoir. Avec brûleurs en fonte, type torche.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec vanne thermostatique de 0 à 190° C et pilote de maintenance. Avec bobine de sécurité et thermocouple.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec thermostat de sécurité, qui arrête la friteuse en cas d'augmentation anormale de la température de l'huile à 240° C.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec allumage piézoélectrique.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: FRITEUSES ÉLECTRIQUES
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Avec des éléments chauffants blindés en acier inoxydable, qui ont un mécanisme leur permettant de tourner en position verticale, et de faciliter ainsi le nettoyage. Ils sont équipés d'un micro
        de sécurité, qui déconnecte la résistance lors du nettoyage, pour éviter les brûlures et la défaillance de la résistance due à une surchauffe.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec thermostat de 0 à 190° C et voyant de fonctionnement.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec thermostat de sécurité, qui arrête la friteuse en cas d'augmentation anormale de la température de l'huile à 240° C.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: DÉTAILS GÉNÉRIQUES DES GRILLE-PAIN AU RUBAN
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Conçu pour être installé dans les buffets de l'hôtel.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec courroie en acier inoxydable, avec avance réglable.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Tout type de pain peut être grillé. Bouche d'entrée de 70 mm de hauteur.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Équipé d'un plateau amovible pour recueillir les miettes de pain.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Avec éléments chauffants blindés supérieurs et inférieurs en acier inoxydable à fonctionnement indépendant.
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: MOD./COD. 43616017 (HORIZONTAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Fonctionnement horizontal. Avec double sens de rotation.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Introduction du pain, de droite ou de gauche, et une fois grillé, il sort du côté opposé.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 11.7
    - role: titol
      text: MOD./COD. 43816017 (VERTICAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 11.7
    - role: text
      text: Fonctionnement vertical. Il a l'avantage de n'occuper que 480 mm. buffet.
      estil:
        color: '#000000'
        mida: 11.7
    - role: text
      text: Le pain est introduit par la partie avant supérieure, et il sort grillé en bas.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 11.7
