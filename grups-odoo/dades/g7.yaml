      text: Con cestas equipadas con 2 asas, para su fácil utilización.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Equipadas con rejilla que evita que caigan restos de producto y vayan al fondo de la cuba.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con grifo de vaciado, situado en el frontal, con dispositivo de seguridad que evita la obertura accidental.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, se pueden colocar escurridores en un lado, derecho o izquierdo. Ver ACCESORIOS.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREIDORAS A GAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con intercambiadores de calor en el interior de la cuba. Con quemadores de fundición, tipo soplete.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con válvula termostática de 0 a 190° C y piloto de mantenimiento. Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato de seguridad, que pára la freidora en caso de aumento anormal de la temperatura del aceite a los 240° C.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con encendido piezo-eléctrico.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: FREIDORAS ELÉCTRICAS
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Con resistencias de acero inoxidable blindadas, que disponen de un mecanismo para que puedan rotar hasta la posición vertical, y así facilitar la limpieza. Equipan un micro de seguridad, que
        desconecta la resistencia cuando se está limpiando, para evitar quemaduras y avería de la resistencia por sobre-calentamiento.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato de 0 a 190° C y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con termostato de seguridad, que pára la freidora en caso de aumento anormal de la temperatura del aceite a los 240° C.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: DETALLES GENÉRICOS DE LOS TOSTADORES DE PAN DE CINTA
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Concebidos para su instalación en los buffets de los hoteles.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con cinta de acero inoxidable, con avance regulable.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Se puede tostar cualquier tipo de pan. Boca de entrada de 70 mm de altura.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Dotados de bandeja para recoger migas de pan, extraíble.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con resistencias blindadas de acero inoxidable, superior e inferior, de funcionamiento independiente.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MOD./COD. 43616017 (HORIZONTAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Funcionamiento horizontal. Con doble sentido de giro.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Introducción del pan, por la derecha o la izquierda, y una vez tostado, sale por el lado opuesto.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: MOD./COD. 43816017 (VERTICAL)
      estil:
        color: '#a22b2d'
        negreta: true
        mida: 14.0
    - role: text
      text: Funcionamiento vertical. Tiene la ventaja de que ocupa solo 480 mm. del buffet.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Se introduce el pan por la parte frontal superior, y sale por la inferior, tostado.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 14.0
