        text: PRICES The prices in this list are retail prices (EX-WORKS). F PRIX Les prix du présent tarif correspondent à des Prix de Vente au Public. (EX-WORKS).
    icona: assets/g7/condicions-icona-p37-1.png
  - pos:
      x: 2.5
      y: 17.872
      w: 17.5
      h: 1.8
    textos:
      en:
      - role: text
        text: PAYMENT CONDITIONS Irrevocable letter of credit or Swift. F FORME DE PAIEMENT Lettre de crédit bancaire irrévocable o virement bancaire.
    icona: assets/g7/condicions-icona-p37-2.png
  - pos:
      x: 2.5
      y: 19.553
      w: 17.5
      h: 2.7
    textos:
      en:
      - role: text
        text: TECHNICAL CHARACTERISTICS As a manufacturer, we reserve the right to modify the characteristics of our catalogues without prior notice, in the interest of improving our products. F CARACTERISTIQUES
          TECHNIQUES En tant que fabricants, nous nous réservons le droit de modifier sans préavis, les caractéristiques indiquées dans le présent catalogue, dans le but d’améliorer nos produïts.
    icona: assets/g7/condicions-icona-p37-4.png
  - pos:
      x: 2.5
      y: 22.104
      w: 17.5
      h: 4.9
    textos:
      en:
      - role: text
        text: GUARANTEE The guarantee only covers manufacturing defects and excludes unauthorized use. PARTS The guarantee for defective parts are 12 months. All shipping costs are to be paid by the consumer.
          The manufacturer does not accept any responsability for any type of comprensation. F GARANTIE La garantie couvre uniquement les défauts de fabrication, une utilisation incorrecte en étant totalement
          exclue. PIECES Cette garantie est de 12 mois sur les pièces défectueuses, leurs transports d’aller et de retour étant à la charge du client. Les fabricants n’est en aucun cas responsable d’un
          quelconque type d’indemnisation.
    icona: assets/g7/condicions-icona-p37-5.png
  - pos:
      x: 2.5
      y: 26.812
      w: 17.5
      h: 1.924
    textos:
      en:
      - role: text
        text: JURISDICTION In the event of legal action, the only Courts considered competent are those of Barcelona (Spain) F JURIDICTION En cas de litige, seuls les Tribunaux de Barcelona (Espagne) seront
          compétents.
    icona: assets/g7/condicions-icona-p37-6.png
