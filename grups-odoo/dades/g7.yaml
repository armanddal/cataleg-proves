  - idioma: fr
    paragrafs:
    - role: text
      text: DÉTAILS GÉNÉRIQUES DES SALAMANDRES Intérieur et extérieur en acier inoxidable 18/10 AISI-304. Avec pieds antidérapants réglables. Avec grille chromée, fournie Avec plateau amovible. SALAMANDRES
        ÉLECTRIQUES MODÈLES FIXES, avec guides latéraux pour placer la grille à la hauteur désirée, selon le gratin qu'ils souhaitent réaliser. □ MODÈLES AVEC GRILLE MOBILE, qui monte ou descend, avec 6
        positions, à l'aide d'un levier situé sur le montant. C'est aussi traversant, et peut être installé sur la table de pass. □ MODÈLES DE PLAFOND MOBILE, ajuste la hauteur en le déplaçant, qui a une
        poignée, dûment isolée. □ Équipé de résistances blindées en acier inoxydable. Dans les modèles rapides (FAST), le système de chauffage est réalisé pour les plaques vitrocéramiques, □ qui atteignent
        200 ° C en 20 secondes. De plus, ils économisent 75% de la consommation d'énergie, par rapport aux modèles avec résistances traditionnelles. Le contrôle de la température est effectué au moyen d'un
        thermostat analogique, avec un indicateur de fonctionnement. Le mod./cod. 43730612, avec panneau électronique et minuterie DIGITAL. □ SALAMANDRES À GAZ MODÈLE FIXE, avec guides latéraux, pour placer
        la grille à la hauteur souhaitée. MODÈLES AVEC GRILLE MOBILE, qui monte ou descend, avec différents positions, à l'aide d'un levier. C'est traversant, et peut être installé sur la table de pass.
        □ MODÈLES AVEC GRILL, pour gratiner et décongeler en même temps. Peut également être utilisé comme une plaque chauffante. □ Equipé de brûleurs à rayons infrarouges. Avec robinets en laiton, avec
