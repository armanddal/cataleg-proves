    - role: text
      text: DETALLES GENÉRICOS DE LOS GRATINADORES Interior y exterior en acero inoxidable 18/10 AISI-304. Con patas regulables antideslizantes. Con rejilla cromada, en dotación Con bandeja extraíble. GRATINADORES
        ELÉCTRICOS MODELOS FIJOS, con guías laterales para colocar la rejilla a la altura deseada, según el gratinado que deseen realizar. □ MODELOS CON REJILLA MÓVIL, la cual asciende o desciende, con
        6 posiciones, mediante una palanca situada en el montante. Además es pasante, pudiendo instalarse en la mesa de pase. □ MODELOS DE TECHO MÓVIL, se regula la altura, mediante el movimiento del mismo,
        el cual dispone de una asa, debidamente aislada. □ Equipados con resistencias de acero inoxidable blindadas. En los modelos rápidos (FAST), el sistema calorífico se realiza mediante placas vitro-cerámicas,
        □ que alcanzan los 200° C. en 20 segundos. Además, economizan el 75% del consumo de energía, con relación a los modelos con resistencias tradicionales. El control de la temperatura se realiza por
        medio de un termostato analógico, con indicador de funcionamiento. El mod./cod. 43730612, con panel electrónico y temporizador DIGITAL. □ GRATINADORES A GAS MODELO FIJO, con guías laterales, para
        colocar la rejilla a la altura deseada. MODELOS CON REJILLA MÓVIL, la cual asciende o desciende, con varias posiciones, mediante palanca. Es pasante, pudiendo instalarse en la mesa de pase. □ MODELOS
        CON GRILL, para gratinar y descongelar a la vez. También se puede usar como plancha. □ Equipados con quemadores de rayos infrarrojos. Con grifos de latón, con máximo regulable, mínimo y posición
        piloto, con bobina de seguridad y termopar.
