    - role: text
      text: GENERIC DETAILS OF SALAMANDERS Interior and exterior in 18/10 AISI-304 stainless steel. With adjustable non-slip feet. With chrome grille, supplied With removable tray. GRATINADORES ELÉCTRICOS
        FIXED MODELS, with lateral guides to place the grid at the desired height, according to the gratin they wish to make. □ MODELS WITH MOBILE GRILLE, which rises or falls, with 6 positions, using a
        lever located on the upright. It is also an intern, and can be installed on the pass table. □ MOVABLE CEILING MODELS, adjusts the height by moving it, which has a handle, duly insulated. □ Equipped
        with armored stainless steel resistors. In fast models (FAST), the heating system is carried out using vitro-ceramic plates, □ which reach 200 ° C in 20 seconds. In addition, they save 75% of energy
        consumption, compared to models with traditional resistors. Temperature control is carried out by means of an analog thermostat, with an operation indicator. The mod./cod. 43730612, with electronic
        panel and DIGITAL timer. □ GAS SALAMANDERS GRILL FIXED MODEL, with lateral guides, to place the grid at the desired height. MOVABLE GRILLE MODEL, which rises or falls, with various positions, using
        a lever. It is an intern, and can be installed on the pass table. □ MODELS WITH GRILL, for grilling and defrosting simultaneously. Can also be used as a hotplate. □ Equipped with infrared ray burners.
        With brass taps, with adjustable maximum, minimum and pilot position, with safety coil and thermocouple.
