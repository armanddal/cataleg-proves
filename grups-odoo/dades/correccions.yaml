# Correccions i dades manuals PER GRUP del generador (genera_config / font_odoo). Editable. Res d'això és al codi.
# Les claus porten el grup: «g4:...». Un grup nou només n'hi afegeix si en necessita.
#  pdf_mana          «gN:CODI:clau_columna» -> valor del PDF publicat (mana sobre el del .pub quan no coincideixen)
#  alies_codi        «gN:CODI_DEL_CATALEG» -> codi d'Odoo (mateix producte; el catàleg imprimeix un codi que a Odoo és un altre)
#  taules_manuals    «gN:id_taula» -> {columnes, files{codi: {clau: valor}}}: taules que l'extractor ha col·lapsat; es llegeixen de la imatge del PDF
#  titols_manuals    «gN:id_taula» -> {es,en,fr}: títol d'una taula d'accessoris que el .pub no porta
#  etiquetes_manuals «gN:id_taula:clau» -> {es,en,fr}: capçalera pròpia d'una columna sense icona ni text al .pub
#  ml_manual         «ES EN FR» enganxat -> {es,en,fr}: valors multillengua que l'extractor dóna enganxats
#  banners_manuals   «gN:id_taula_nota» -> {es,en,fr}: rètol de grup d'una pàgina d'accessoris que el .pub no porta com a text
#  faltes_text       paraula mal escrita a les dades originals -> forma correcta, NOMÉS en castellà i NOMÉS al render (no toca Odoo ni la config de càrrega)
