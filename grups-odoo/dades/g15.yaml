  - idioma: en
    paragrafs:
    - role: text
      text: AFIN D'OFFRIR L'ENSEMBLE COMPLET, NOUS AVONS CRÉÉ UNE GAMME DE MEUBLES, AVEC DIFFÉRENTES DÉCORATIONS DU PLAN DE TRAVAIL ET DES PANNEAUX,
        POUR PERSONNALISER L'INSTALLATION DANS VOTRE ÉTABLISSEMENT. ILS SONT ÉQUIPÉS DE LA CUVE BAIN-MARIE OU EN PLAQUE EN VITROCÉRAMIQUE, AINSI
        QUE DE L'ÉCRAN AVEC LUMIÈRE CHAUDE.  LES UNITÉS NEUTRES ONT UN PLAN DE TRAVAIL LISSE. NOUS FABRIQUONS ÉGALEMENT DES UNITÉS DE BUFFET FROID,
        ET NOUS PROPOSONS DES KITS D'UNION POUR RÉALISER DES ENSEMBLES LINÉAIRES. DE CETTE FAÇON, VOUS POUVEZ AVOIR LE BUFFET PRÊT À ÊTRE UTILISÉ
        IMMÉDIATEMENT DANS UN DÉLAI BEAUCOUP PLUS COURT QUE SI VOUS DEVEZ LE CONSTRUIRE AVEC DIFFÉRENTS INDUSTRIELS (MAÇONS, CHARPENTIERS, PLOMBIERS,
        ETC.) ET ENSUITE INSTALLER LES ÉLÉMENTS ENCASTRABLES ET LES ÉCRANS DONT VOUS AVEZ BESOIN… CONSTRUCTION GÉNÉRIQUE Mobilier soutenu, avec
        une structure métallique. Avec des plans de travail en quartz synthétique, en une seule pièce, sans joints. Revêtement de meubles en bois
        hydrofuge, avec différentes finitions laquées ou mélaminées. Avec des pieds réglables, pour quand vous voulez fixer l'ensemble.  Également
        équipé de roues, pour faciliter la mobilité du mobilier, en fonction de l'heure du petit-déjeuner ou du déjeuner/dîner. Équipés de plinthes
        en acier inoxydable. □ Les côtés de le meuble sont accessibles pour le branchement et la maintenance. □ Avec des étagères à assiettes
        intégrées, dans le sens de la longueur et éclairées par une lumière led . □ BUFFETS CHAUDS Élément encastré dans le plan de travail avec
        l'écran, réalisé en acier inoxydable 18/10 AISI-304. Isolation en fibre de verre. Chauffage au moyen d'éléments chauffants en silicone,
        placés dans la zone isolée. □ Contrôlé au moyen d'un thermomètre-thermostat numérique et d'un interrupteur marche/arrêt lumineux, accessible
        et visible. □ Température de travail de 0º + 90º C. Avec thermostat de sécurité caché. Écrans montées sur le cadre d'encastrement. □ Équipé
        d'un verre trempé, incurvé sur les deux côtés, qui agit comme une protection hygiénique pour les aliments exposés. □ Avec lumière chaude
        et éléments chauffants en céramique pour maintenir la température de la partie supérieure des aliments. BUFFET CHAUD AVEC BAIN-MARIE Cuve
        pour conteneurs GN 1/1, avec une profondeur maximale de 150 mm. Avec des bords internes arrondis pour un nettoyage facile. □ Avec vidange
        avec robinet. BUFFET CHAUD AVEC PLAQUE VITROCÉRAMIQUE Avec un verre vitrocéramique noir de 6 mm d'épaisseur. □ Avec cadre en acier inoxydable
        18/10 AISI 304. □ La chaleur est transmise par contact et on peut poser sur la plaque vitrocéramique des plateaux ou des assiettes en
        céramique, en mélamine ou en acier inoxydable, ainsi que des récipients GN. BUFFET NEUTRE Avec un plan de travail lisse en quartz synthétique,
        sur lequel on peut placer le grille-pain (voir GROUPE 7), le Chafing dish, les pots à soupe, les plaques vitro-top avec écran (pour paellas),
        les distributeurs de pain et de couverts, etc.
