        mida: 11.0
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: text
      text: CON LA FINALIDAD, DE OFRECER, EL CONJUNTO COMPLETO, HEMOS CREADO UNA GAMA DE MUEBLES, CON DISTINTAS DECORACIONES, DE LA ENCIMERA,
        Y DEL PANELADO, PARA PERSONALIZAR LA INSTALACIÓN EN SU ESTABLECIMIENTO. ESTAN EQUIPADOS CON LA CUBA O PLACA VITROCERÁMICA, ASÍ COMO LA
        PANTALLA CON LUZ CALIENTE.  LOS MUEBLES NEUTROS, TIENEN LA ENCIMERA LISA. TAMBIEN FABRICAMOS MUEBLES BUFFET FRIOS, Y OFRECEMOS, LOS KITS
        DE UNIÓN, PARA HACER CONJUNTOS LINEALES. DE ESA FORMA, PUEDEN DISPONER DEL BUFFET, PARA SU USO INMEDIATO, CON UN PLAZO MUCHO MAS CORTO,
        QUE SI LO TIENE QUE CONSTRUIR CON DISTINTOS INDUSTRIALES (ALBAÑILES, CARPINTEROS, FONTANEROS, ETC.) Y LUEGO INSTALAR LOS ELEMENTOS DROP-IN
        Y LAS PANTALLAS, QUE PRECISA… CONSTRUCCIÓN GENÉRICA Muebles soportados, con una estructura metálica. Con encimeras de cuarzo sintético,
        de una pieza, sin uniones. Panelado del mueble, en madera hidrófuga, con diferentes acabados lacados o de melamina. Con patas regulables,
        para cuando se desea fijar el conjunto.  También dotados de ruedas, para facilitar la mobilidad del mueble, según sea el momento del desayuno,
        o de la comida/cena. Equipados con zócalos en acero inoxidable. □ Laterales del mueble, accesibles para el conexionado y el servicio técnico.
        □ Con estantes para platos, empotrados, en sentido longitudinal e iluminados con luz led . □ BUFFETS CALIENTES Elemento encastrado, Drop-in,
        en la encimera con la pantalla, construidos en acero inoxidable 18/10 AISI-304. Aislamiento de fibra de vidrio. Calor mediante resistencias
        de silicona, colocadas en la zona aislada. □ Controladas mediante un termómetro-termostato digital y con interruptor luminoso de marcha-paro,
        accesible y visible. □ Temperatura de trabajo de 0º + 90º C. Con termostato de seguridad oculto. Pantallas montadas sobre el marco del
        Drop-in. □ Equipados con cristales templados, curvados a dos caras, que actuan como protector higiénico, de los alimentos expuestos. □
        Con luz caliente y resistencias cerámicas, para mantener la temperatura, de la parte superior de los alimentos. BUFFET CALIENTE CON CUBA
        BAÑO MARÍA Cuba para recipientes GN 1/1, de 150 mm de fondo máximo. Con los cantos internos redondeados, para facilitar la limpieza. □
        Con desagüe con grifo. BUFFET CALIENTE CON PLACA VITROCERÁMICA Con cristal vitrocerámico de color negro, de 6 mm, de espesor. □ Con marco
        de acero inoxidable 18/10 AISI 304. □ El calor, se transmite por contacto y sobre la placa vitrocerámica, se pueden colocar, bandejas
        o platos, de cerámica, melamína, o de acero inox, y también recipientes GN. BUFFET NEUTRO Con encimera lisa, de cuarzo sintético, sobre
        la cual, se pueden colocar, el tostador de pan (Ver GRUPO 7), Chafing dish, ollas para sopa, placas vitro de sobre-mesa, con pantalla
        (para paellas), Dispensadores de pan y cubiertos, etc. (Ver GRUPO 15).
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
