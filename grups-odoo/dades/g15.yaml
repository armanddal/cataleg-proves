  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA En acero inoxidable 18/10 AISI-304 Todas la cubas, con los cantos internos redondeados, para facilitar la limpieza.
        □ Elementos empotrables, con un sistema de fijación a la encimera del buffet, que evita la filtración de líquidos. □ Aislamiento de poliuretano
        inyectado ecológico, con densidad de 40 Kgs./m3. Libre de CFC’S. Gas refrigerante R290. CARACTERÍSTICAS GENÉRICAS DE LAS VITRINAS FRÍAS
        PARA MANTENIMIENTO Disponen la cuba refrigerada y de 3 niveles para la exposición. □ Cubas con desagüe. Con cristales templados a 3 caras,
        de las cuales, la posterior, dispone de puertas y está en la zona del camarero, para reposición. Los platos u otros alimentos, se deben
        colocar frios, ya que las vitrinas, son de mantenimiento para la duración del servicio. Refrigeración ventilada. Temperatura de trabajo
        +7° +10°C, con una temperatura ambiente de 25°C. Controladas mediante un termómetro-termostato digital y con interruptor luminoso de marcha-paro.
        □ Cuadro de mandos, dentro de una caja de seguridad, extraíble, para colocarla en el mueble del buffet. □ Iluminación led. □ Con cuba
        ventilada de 200 mm, de profundidad, para ubicar cubetas GN. Grupo instalado en la parte inferior de la cuba. □ Parte frontal, zona del
        cliente, abierta. □ Dotadas de cortina térmica enrollable, para el mantenimiento de los alimentos cuando no hay servicio. □ CARACTERÍSTICAS
        GENÉRICAS DE LAS CUBAS PARA MANTENIMIENTO DE HELADOS Refrigeración mediante tubos de cobre adosados en la parte interna de la cuba, para
        el mejor reparto del frio, situados en la zona aislada. Temperatura de trabajo -15º/-18ºC, con una temperatura ambiente de 25ºC. Con capacidad
        para cubetas heladeras, de 360x165x150 mm, de 7 litros. Ideadas para los helados, en terrinas o a granel. En dicho supuesto necesitaran
        las cubetas heladeras, no incluidas. (Ver ACCESORIOS) Con tapas correderas de metacrilato trasparente. □ CUBAS PARA MANTENIMIENTO DE HELADOS
        CON GRUPO FRIGORÍFICO □ Controladas mediante un termómetro-termostato digital y con interruptor luminoso de marcha-paro. □ Cuadro de mandos,
        dentro de una caja de seguridad, extraíble, para colocarla en el mueble del buffet. □ CUBAS PARA MANTENIMIENTO DE HELADOS SIN GRUPO Recomendamos
        la potencia del grupo, según modelo.
