  - idioma: en
    paragrafs:
    - role: text
      text: IN ORDER TO OFFER THE COMPLETE SET, WE HAVE CREATED A RANGE OF FURNITURE, WITH DIFFERENT DECORATIONS OF THE WORKTOP AND PANELLING,
        TO PERSONALISE THE INSTALLATION IN YOUR ESTABLISHMENT. THEY ARE EQUIPPED WITH THE TANK OR GLASS-CERAMIC PLAQUE, AS WELL AS THE SCREEN
        WITH HOT LIGHT.  THE NEUTRAL UNITS HAVE A SMOOTH WORKTOP. WE ALSO MANUFACTURE COLD BUFFET UNITS, AND WE OFFER UNION KITS TO MAKE LINEAR
        SETS. IN THIS WAY, YOU CAN HAVE THE BUFFET READY FOR IMMEDIATE USE IN A MUCH SHORTER TIME, THAN IF YOU HAVE TO BUILD IT WITH DIFFERENT
        INDUSTRIALISTS (BUILDERS, CARPENTERS, PLUMBERS, ETC.) AND THEN INSTALL THE DROP-IN ELEMENTS AND THE SCREENS THAT YOU NEED... GENERIC CONSTRUCTION
        Supported furniture, with a metal structure. With synthetic quartz worktops, in one piece, without joints. Furniture panelling in water-repellent
        wood, with different lacquered or melamine finishes. With adjustable legs, for when you want to fix the set.  Also equipped with castors,
        to facilitate the mobility of the furniture, depending on the time of breakfast or lunch/dinner. Equipped with stainless steel plinths.
        □ The sides of the unit are accessible for wiring and servicing. □ With built-in plate shelves, lengthwise and illuminated with LED light.
        □ HOT BUFFETS Drop-in, recessed element in the worktop with display, made of 18/10 AISI-304 stainless steel. Fibreglass insulation. Heating
        by means of silicone heating elements, placed in the insulated area. □ Controlled by means of a digital thermometer-thermostat and with
        a luminous on/off switch, accessible and visible. □ Working temperature of 0º + 90º C. With concealed safety thermostat. Displays mounted
        on the drop-in frame. □ Equipped with tempered glass, curved on both sides, which acts as a hygienic protector for exposed food. □ With
        hot light and ceramic heating elements to maintain the temperature of the upper part of the food. HOT BUFFET WITH BAIN-MARIE Tank for
        GN 1/1 containers, with a maximum depth of 150 mm. With rounded internal edges to facilitate cleaning. □ With drain with tap. HOT BUFFET
        WITH GLASS CERAMIC PLAQUE With 6 mm thick, black glass-ceramic glass. □ With 18/10 AISI 304 stainless steel frame. □ The heat is transmitted
        by contact and trays or plates made of ceramic, melamine or stainless steel can be placed on the glass ceramic plate, as well as GN containers.
        NEUTRAL BUFFET With a smooth, synthetic quartz worktop, on which the toaster (see GROUP 7), Chafing dish, soup pots, table-top vitro hobs
        with screen (for paellas), bread and cutlery dispensers, etc. (see GROUP 15) can be placed.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
