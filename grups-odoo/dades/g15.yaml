- id: p25
  n: 25
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: En acero inoxidable 18/10 AISI-304
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Ideados para su colocación, en la zona del Show Cooking del buﬀet. Pero también son una solución profesional, para su integración
        en muebles de cocina.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Elementos empotrables, con un sistema que permite la ﬁjación a la encimera, para evitar que se ﬁltren líquidos.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Los mandos de cada equipo, se pueden colocar en el frontal o la encimera del mueble.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: ENCIMERAS DE COCINAS A GAS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Encimeras embutidas, con cantos redondeados para facilitar la limpieza.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Grifos de latón, dotados de máximo regulable y mínimo.Con bobina de seguridad y termopar.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con encendido piezo-eléctrico, en todos los fuegos.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Quemadores de fundición, con coronas de latón, desmontables para su limpieza. De 5,2 y 3,3 Kw. de potencia y de alto rendimiento.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con parrillas dobles de fundición vitriﬁcadas.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: ENCIMERAS DE COCINAS ELÉCTRICAS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Encimeras embutidas, con cantos redondeados, para facilitar la limpieza, con alojamiento para las placas redondas.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Dotadas de conmutadores independientes, con 6 niveles de potencia y pilotos indicadores de funcionamiento.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con placas redondas de fundición de Ø 220 mm. y 2,6 Kw. de potencia.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con termostato de seguridad incorporado, para evitar el exceso de temperatura, cuando no hay ningún recipiente, y a la vez, para el
        ahorro energético.
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: ENCIMERAS DE COCINAS VITROCERÁMICAS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Marco encimera en acero inoxidable, con cristal schott de 6 mm. de espesor.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Dicho cristal, es muy facil de limpiar, al ser totalmente plano.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con conmutadores independientes, con 2 niveles y pilotos indicadores de funcionamiento.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con resistencias de wolframio, de 2,5 y 1,8 Kw. de potencia.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con termostato de seguridad incorporado, para evitar el exceso de temperatura, cuando no hay ningún recipiente, y a la vez, para el
        ahorro energético.
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: ENCIMERAS DE COCINAS DE INDUCCIÓN
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Marco encimera en acero inoxidable, con cristal schott de 6 mm. de espesor.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Dicho cristal, es muy facil de limpiar, al ser totalmente plano.
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: La zona de cocción de esas cocinas, no quema, puesto que la tecnología de la inducción, consiste en calentar por ondas magnéticas,
        a través de un generador.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Por ello deben usarse recipientes, sartenes, ollas, etc. especiales con el fondo de los mismos de material férrico. Y cuando no detecta,
        dicho recipiente, se pára automáticamente, en 60 segundos.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Dicho sistema es caro, pero se amortiza rápidamente, puesto que el consumo de energía eléctrica, baja un 40%, con relación a una cocina
        eléctrica y el 50% si se compara con una de gas.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: El tiempo de cocción en consecuencia, se reduce a la mitad de los otros sistemas, y además tiene la ventaja de aumentar o disminuir
        la temperatura al instante.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Tampoco consume nada, cuando se retira el recipiente, no precisando pilotos de mantenimiento ni posiciones de mínimo, lo que también
        es un ahorro de energía.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Mandos independientes, giratorios con posiciones ﬁjas de nivel de potencia y con pilotos indicadores de funcionamiento.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con placas de 3,5 Kw. de potencia.
      estil:
        color: '#000000'
        mida: 13.1
    - role: titol
      text: FRYTOPS ELÉCTRICOS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.1
    - role: text
      text: Con desagüe de las grasas, en la parte inferior, y tapón de estanqueidad, cónico, en la parte frontal de la placa.
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con peto de acero inoxidable soldado en todo su contorno superior e inferior, para su máxima higiene.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con termostatos regulables de 80º a 300ºC, independientes y piloto indicador de funcionamiento.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: Con resistencias blindadas de acero inoxidable, montadas en cajones, debidamente aislados.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: PLACAS LISAS DE HIERRO, de 15 mm. de espesor, rectiﬁcadas.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: PLACAS RANURADAS DE HIERRO, de 15 mm. de espesor. El mod/cod. 1202.0631, es mixta. 1/3 ranurada y resto lisa.
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: PLACAS LISAS DE CROMO DURO, de 15 mm. de espesor, rectiﬁcadas y con baño de cromo duro de 50 micras. Se suministran con una espátula-cútter
        para su limpieza, la cual se debe usar sin golpear, solo deslizando la cuchilla por la placa.
      refs:
      - 8
      estil:
        color: '#000000'
        mida: 13.1
    - role: text
      text: La forma de limpieza, es una vez parado el frytop y al cabo de 30/45 minutos (aún caliente), se deben colocar cubitos de hielo, los
        cuales se evaporarán inmediatamente. Entonces la espátula-cútter deberá pasarse suavemente, para eliminar al máximo la grasa, y seguidamente
        un paño húmedo. No poner desengrasante hasta el dia siguiente, antes de poner la plancha en marcha y quedará la superﬁcie brillante como
        nueva.
      estil:
        color: '#000000'
        mida: 13.1
