  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA En acero inoxidable 18/10 AISI-304 Ideados para su colocación, en la zona del Show Cooking del buﬀet. Pero también
        son una solución profesional, para su integración en muebles de cocina. Elementos empotrables, con un sistema que permite la ﬁjación a
        la encimera, para evitar que se ﬁltren líquidos. Los mandos de cada equipo, se pueden colocar en el frontal o la encimera del mueble.
        □ FREIDORAS ELÉCTRICAS Con cestas de acero inoxidable □ y tapas con asa. Con cubas totalmente soldadas a la encimera, embutida para facilitar
        la limpieza y así mismo evitar que el aceite rebose. □ Con rejilla perforada, para evitar vayan alimentos al fondo. Con grifo de vaciado,
        situado en la parte inferior de la freidora. Con amplia zona fría, lo cual aumenta la duración del aceite. Disponen de un mecanismo, para
        que las resistencias, puedan bascular hasta la posición vertical, que se acciona mediante una palanca situada a la derecha, □ con un sistema
        de bloqueo, en su posición elevada, con el ﬁn de facilitar la limpieza de la cuba. Dichas resistencias son de acero inoxidable blindadas.
        Con termostato y piloto indicador de funcionamiento. También dispone de termostato de seguridad, que pára la freidora, en el caso de aumento
        anormal de la temperatura del aceite. CONSERVADORES DE FRITOS ELÉCTRICOS Equipados con una cuba GN 2/3-150, con doble fondo perforado
        y curvado para facilitar la recogida de fritos. Todo ello extraíble para su limpieza. Con una resistencia cerámica, situada en la pantalla
        superior. □ Dotados de un regulador de energía, para adecuar la temperatura deseada y piloto indicador de funcionamiento. BAÑOS MARÍA
        ELÉCTRICOS Con la cuba, GN 1/1, soldada a la encimera, con todos los cantos interiores redondeados, en la cual se pueden colocar distintas
        combinaciones de recipientes GN, de 150 mm, de alto. No incluidos. (Ver en ACCESORIOS) □ Con grifo de vaciado, situado en la parte inferior
        del baño maría. Equipados con resistencias adhesivas, colocadas en el fondo, en la parte interna, donde está el aislamiento, de manera
        que el interior de la cuba esta totalmente limpia. Dotados de termostato y piloto indicador de funcionamiento. CUECE PASTA ELÉCTRICOS
        Con la cuba, GN 2/3, fabricada en acero inoxidable AISI-316, con todos los cantos redondeados y soldada a la encimera, embutida, para
        facilitar la limpieza. Con rejilla perforada para evitar que vayan alimentos al fondo. Con rebosadero para que el agua no se derrame,
        y a la vez la evacuación del almidón de las pasta, que ﬂota. Dispone de grifo para el llenado en el frontal, y de vaciado, situado en
        la parte inferior. Con resistencia de acero inoxidable blindada. Con conmutador-termostato y piloto indicador de funcionamiento. Opcionalmente,
        disponemos de cestas perforadas con asa/s, totalmente de acero inoxidable. (Ver en ACCESORIOS los packs que ofrecemos). □ PROTECTORES
        DE CRISTAL Ideados para proteger de salpicaduras y quemaduras, a los clientes, que se acercan al show cooking. □ Con soportes, en acero
        inoxidable AISI 304, para sujetar los cristales templados rectos, de 6 mm, de espesor.
