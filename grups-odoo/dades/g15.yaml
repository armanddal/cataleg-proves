  - idioma: en
    paragrafs:
    - role: text
      text: IN ORDER TO OFFER THE COMPLETE SET, WE HAVE CREATED A RANGE OF FURNITURE, WITH DIFFERENT DECORATIONS OF THE WORKTOP AND PANELLING,
        TO PERSONALISE THE INSTALLATION IN YOUR ESTABLISHMENT.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: THEY ARE EQUIPPED WITH THE TANK OR COLD SMOOTH PLATE, AS WELL AS THE DISPLAY WITH LED LIGHT.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: WE ALSO MANUFACTURE HOT OR NEUTRAL BUFFET UNITS, AND WE OFFER UNION KITS TO MAKE LINEAR SETS.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: IN THIS WAY, YOU CAN HAVE THE BUFFET READY FOR IMMEDIATE USE, IN A MUCH SHORTER TIME, THAN IF YOU HAVE TO BUILD IT WITH DIFFERENT
        INDUSTRIALISTS (BUILDERS, CARPENTERS, PLUMBERS, ETC.) AND THEN INSTALL THE DROP-IN ELEMENTS AND THE SCREENS THAT YOU NEED... GENERIC CONSTRUCTION
        Supported furniture, with a metal structure. With synthetic quartz worktops, in one piece, without joints. Furniture panelling in water-repellent
        wood, with different lacquered or melamine finishes. With adjustable legs, for when you want to fix the set.  Also equipped with castors,
        to facilitate the mobility of the furniture, depending on the time of breakfast or lunch/dinner. Equipped with stainless steel plinths.
        □ The sides of the unit are accessible for wiring and servicing. □ With built-in plate shelves, lengthwise and illuminated with LED light.
        □ Drop-in, recessed element in the worktop with display, made of 18/10 AISI-304 stainless steel. With rounded internal edges to facilitate
        cleaning. □ Ecological injected polyurethane insulation, with a density of 40 kg/m3. Free of CFC'S. R290 refrigerant gas. Refrigeration
        by means of copper tubes attached to the internal part, for better distribution of the cold, located in the insulated area. With refrigeration
        unit located inside the cabinet, which has ventilation. With drainage. Controlled by a digital thermometer-thermostat and with a luminous
        on/off switch, accessible and visible. □ Displays mounted on the drop-in frame. □ Equipped with tempered glass, curved on both sides,
        which acts as a hygienic protector for the exposed food. □ With led light, which highlights the refrigerated food. COLD BUFFET, WITH TANK
        Bowl for GN 1/1 containers, with a maximum depth of 65 mm. □ Working temperature +4° +8°C, with an ambient temperature of 25°C. COLD BUFFET,
        WITH SMOOTH PLATE The cooling, carried out by means of the coil, attached to the internal base of the tray, has the effect of an ice rink.
        This cooling is transmitted by contact and on the smooth plate □, ceramic, melamine or stainless steel trays or plates can be placed,
        as well as GN containers. Working temperature -4º +4°C, with an ambient temperature of 25°C.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
