- id: p55
  n: 55
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Interior y exterior, en acero inoxidable 18/10 AISI-304. Encimeras de 1,5 mm, de espesor, con cantos redondeados,
        longitudinalmente, en ambos lados. Elementos modulares, lo que permite realizar el montaje, de acuerdo con las necesidades y el espacio
        disponible, ya que también fabricamos muebles calientes, neutros, angulares etc. Los frontales de los muebles, de serie, son de acero
        inoxidable, pero opcionalmente, se pueden panelar en 4 colores.□, o colocar zócalos □ Así mismo, ofrecemos, opcionalmente, todos los complementos
        necesarios para equipar los muebles, tales como guías pasabandejas □, pantallas de cristal, simples o dobles, con luz led etc. □ Aislamiento
        de poliuretano inyectado ecológico, (libre de CFC), con una densidad de 40 Kg/m3. Grupos frigoríﬁcos sobre-dimensionados, con desescarche
        automático. Dichos grupos permiten su extracción para facilitar el servicio de mantenimiento y limpieza del condensador. Gas refrigerante
        hidrocarburo R290. De máximo rendimiento para obtener la caliﬁcación energética mas ecológica, y para reducir les emisiones de CO2. Con
        termómetro-termostato digital. Dicho programador permite ajustar las temperaturas, máxima y mínima, así como los desescarches automáticamente,
        con el ﬁn de optimizar al máximo, el rendimiento. Con patas regulables de acero inoxidable. MUEBLES FRÍOS CON CUBA SUPERIOR Ideados para
        la presentación de alimentos en recipientes GN 1/1, u otros tamaños, de hasta 150 mm, de profundidad. Igualmente, se pueden colocar bebidas.
        Cubas con todos los cantos redondeados, para facilitar la limpieza y dotadas de desagüe. □ Refrigeración mediante tubos de cobre adosados
        en la parte interna de la cuba, para el mejor reparto del frío, situados en la zona aislada. El régimen de trabajo es de +4º+8ºC, con
        una temperatura ambiente de 25ºC. MUEBLES FRÍOS CON PLACA LISA La placa lisa, encastrada en una cuba de 20 mm, hace el efecto de pista
        de hielo, □ que permite la colocación de alimentos en cualquier tipo de bandeja o recipiente, que se mantiene fría, por contacto. Dotadas
        de desagüe, para la evacuación del agua, cuando se pára la placa. Refrigeración mediante tubos de cobre adosados en la parte interna de
        la placa, situados en la zona aislada. El régimen de trabajo es de -4º + 4ºC, con una temperatura ambiente de 25ºC. CON RESERVA INFERIOR
        Con el mismo equipo frigoríﬁco. Con bisagras de torsión, en la puertas. Con posición de mantenimiento abierta, cuando supera los 95º.
        Puertas con tirador incorporado, con cierre magnético, mediante burletes dotados de cámara de aire, para asegurar la estanqueidad. Fácilmente
        substituibles. □ Con evaporador ventilado para conseguir la temperatura homogénea, en el interior de la cámara. Se suministran en dotación,
        con una rejilla plastiﬁcada GN 1/1, por puerta. SIN RESERVA Con un estante inferior. MUEBLES FRÍOS CENTRALES CON CUBA O PLACA LISA SUPERIOR
        Opcionalmente, se pueden colocar guías pasabandejas a ambos lados, □ así como pantallas de cristal curvado por los dos lados, con luz
        led. □ En la parte inferior, esta ubicado el grupo frigoríﬁco, y están cerrados con frontales de acero inoxidable, que opcionalmente se
        pueden panelar en 4 colores a escoger. □ Al estar situados como isla, opcionalmente, también se pueden colocar estantes para platos. □
        El resto de características, son las mismas de los muebles con cuba o placa fría. MUEBLES FRÍOS CON VITRINA Diseñados para la exposición
        de alimentos, especialmente entrantes en plato, postres etc, en los 3 estantes de que están equipados. Con los 4 lados acristalados. Al
        disponer de cuba refrigerada, es ideal para la presentación de yogures, postres lácteos etc. Con 6 puertas abatibles, de metráquilato,
        por el lado del cliente. □ Y con puertas correderas, por el lado del camarero. Con luz led. El régimen de trabajo es de +6º+12ºC, con
        una temperatura ambiente de 25ºC. Frio ventilado, para igualar la temperatura. Con grupo frigoríﬁco independiente, ubicado en el techo.
        Con mecanismo de control de la temperatura. Se fabrican con y sin reserva, cuyas características, son las mismas.
