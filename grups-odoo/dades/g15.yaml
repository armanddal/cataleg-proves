- id: p28
  n: 28
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: □ CONSTRUCTION GÉNÉRIQUE En acier inoxydable 18/10 AISI-304 Conçu pour être placé dans la zone Show Cooking du buffet. Mais c'est
        aussi une solution professionnelle, à intégrer dans les meubles de cuisine. Éléments encastrés, avec un système qui permet la fixation
        au plan de travail, qui empêche les liquides de s’inflitrer. Les commandes de chaque équipement peuvent être placées en façade ou sur
        le dessus du meuble. □ COMPTOIRS DE CUISSON À GAZ Plans de travail emboutis, avec bords arrondis pour faciliter le nettoyage. Robinets
        en laiton, équipés de maximum et minimum réglables, avec bobine de sécurité et thermocouple. Avec allumage piézo-électrique, dans tous
        les feux. Brûleurs en fonte, avec couronnes en laiton, amovibles pour le nettoyage. De 5,2 et 3,3 Kw. puissance et hautes performances.
        □ Avec doubles grilles en fonte vitrifiée. □ COMPTOIRS DE CUISSON ÉLECTRIQUES Plans de travail emboutis, avec bords arrondis, pour faciliter
        le nettoyage, avec logement pour plaques rondes. □ Équipé d'interrupteurs indépendants, avec 6 niveaux de puissance et voyants de fonctionnement.
        □ Avec plaques rondes en fonte de Ø 220 mm. et 2,6 Kw du puissance. Avec thermostat de sécurité intégré, pour éviter les excès de température,
        lorsqu'il n'y a pas de récipient, et en même temps, pour des économies d'énergie. COMPTOIRS DE CUISSON EN VITROCÉRAMIQ Cadre de comptoir
        en acier inoxydable, avec verre schott de 6 mm. d'épaisseur.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: Ledit verre est très facile à nettoyer, étant complètement plat. □ Avec interrupteurs indépendants, à 2 niveaux et voyants de fonctionnement.
        Avec résistances en tungstène, 2,5 et 1,8 Kw. du pouvoir. Avec thermostat de sécurité intégré, pour éviter les excès de température, lorsqu'il
        n'y a pas de récipient, et en même temps, pour des économies d'énergie. COMPTOIRS À INDUCTION Cadre de comptoir en acier inoxydable, avec
        verre schott de 6 mm. d'épaisseur. Ledit verre est très facile à nettoyer, étant complètement plat. □ La zone de cuisson de ces cuisines
        ne brûle pas, puisque la technologie à induction consiste à chauffer par ondes magnétiques, via un générateur. Par conséquent, des récipients,
        des casseroles, etc. doivent have le fond de matière ferrique. Et lorsqu'il ne le détecte pas, ledit conteneur s'arrête automatiquement,
        en 60 secondes. Ce système est cher, mais s'amortit rapidement puisque la consommation d'énergie électrique baisse de 40% par rapport
        à une cuisinière électrique et de 50% par rapport à une cuisinière à gaz. Par conséquent, le temps de cuisson est réduit de moitié par
        rapport aux autres systèmes, et il a également l'avantage d'augmenter ou de diminuer instantanément la température. Il ne consomme rien
        non plus lorsque le conteneur est retiré, ne nécessitant pas de voyants d'entretien ou de positions minimales, ce qui est également une
        économie d'énergie. Boutons rotatifs indépendants avec positions de niveau de puissance fixes et voyants de fonctionnement. Avec plaques
        de 3,5 Kw. du puissance. FRYTOPS ÉLECTRIQUES Avec évacuation des graisses en bas et un bouchon d'étanchéité conique à l'avant de la plaque.
        □ Avec cuirasse en acier inoxydable soudé autour de son contour supérieur et inférieur, pour une hygiène maximale. □ Avec thermostats
        réglables de 80º à 300ºC, voyant indépendant et voyant de fonctionnement. Avec résistances blindées en acier inoxydable, montées dans
        des tiroirs, dûment isolées. PLAQUES EN FER LISSES, 15 mm. épais, rectifié. PLAQUES EN FER RAINURÉE, 15 mm. épais. Le modele/code 12020631,
        est mixte. 1/3 rainuré et reste lisse. PLAQUES LISSES EN CHROME DUR, 15 mm. épais, rectifié et chromées dur de 50 microns. Ils sont fournis
        avec une spatule-cutter pour le nettoyage □, qu'il convient d'utiliser sans cogner, en glissant simplement la lame sur la plaque. La méthode
        de nettoyage est une fois que le fer est arrêtée et après 30/45 minutes (encore chaud), des glaçons doivent être placés, qui s'évaporent
        immédiatement. Puis la spatule-cutter doit être passée doucement, pour retirer le plus de graisse possible, suivie d'un chiffon humide.
        Ne mettez pas de dégraissant avant le lendemain, avant de démarrer le fer et la surface sera brillante comme neuve.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 1.0
      y: 2.5
      w: 19.0
      h: 25.9
