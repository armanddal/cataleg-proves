        expuestos. De cristal, templado de 6 mm, de espesor. □ Con soportes de tubo, de acero inoxidable, 18/10 AISI-304,con los correspondientes
        clips para la sujeción de los cristales. □ Dichos soportes se ﬁjan a los muebles. □ Se suministran desmontados. Con 1 estante, a 525 mm.
        de ancho. □ . □ ESTANTES DE CRISTAL CON PROTECTOR FRONTAL De cristal, templado de 6 mm, de espesor. □ □ ESTANTES DE CRISTAL CON PANTALLAS
        CON LUZ Además de las funciones de exposición, pasa-platos y protectores higiénicos, disponen de luz, para resaltar los alimentos que
        se ofrecen. Con luz led, e interruptor ON-OFF. ESTANTES DE CRISTAL CON PANTALLAS CON LUZ Y CALOR Con pantallas con luz led e infrarrojos
        para iluminar y mantener calientes los alimentos. Con un interruptor ON-OFF en la propia pantalla. □ . □ . □ GUÍAS PASA-BANDEJAS Diseñadas
        para el soporte y desplazamiento de las bandejas, que a la vez son muy fáciles de limpiar, al no tener base donde se pudieran estancar
        vertidos de bebidas o alimentos en general. Montaje rápido al frontal del mueble, ﬁjando los 2 soportes de acero inoxidable 18/10 AISI-304,
        por medio de tornillos, los cuales quedan ocultos por unos embellecedores. □ Fabricadas con 3 tubos Ø 30, de acero inoxidable 18/10 AISI-304.
        ESTANTES POSA PLATOS Para colocación en el lateral, de platos en los muebles centrales. PANELES FRONTALES Para personalizar la linea de
        self-service y decorarlo de acuerdo con el ambiente y el mobiliario, del espacio donde esta instalado. De serie, se suministran en acero
        inoxidable, por lo que al pasar el pedido, deberán indicar el color del panel, que es de material plastiﬁcado, muy resistente. Existen
        4 colores a elegir. Azul (RAL 5003), Rojo (RAL 3020), Blanco (RAL 9003) y Gris (RAL 9022). □ ZÓCALOS Que facilitan la limpieza, y a la
        vez mejoran el aspecto de la línea de Self-service. Fabricados en acero inoxidable 18/10 AISI-304. Con un fácil sistema de ﬁjación a las
