  - idioma: es
    paragrafs:
    - role: text
      text: □ CONSTRUCTION GÉNÉRIQUE En acier inoxydable 18/10 AISI-304 Conçu pour être placé dans la zone Show Cooking du buffet. Mais c'est
        aussi une solution professionnelle, à intégrer dans les meubles de cuisine. Éléments encastrés, avec un système qui permet la fixation
        au plan de travail, pour empêcher les fuites de liquides. Les commandes de chaque équipement peuvent être placées en façade ou sur le
        dessus du meuble. □ FRITEUSES ÉLECTRIQUES Avec paniers en acier inoxydable □ et couvercles avec poignées. Avec des réservoirs entièrement
        soudés au plan de travail, embouti pour faciliter le nettoyage et également empêcher l'huile de déborder. □ Avec grille perforée, pour
        éviter que les aliments ne tombent au fond. Avec robinet de vidange, situé au bas de la friteuse. Avec une grande zone froide, ce qui
        augmente la durée de l'huile. Ils disposent d'un mécanisme pour que les résistances puissent basculer en position verticale, qui s'active
        au moyen d'un levier situé à droite, □ avec un système de verrouillage, dans sa position relevée, afin de faciliter le nettoyage du réservoir.
        Ces résistances sont en acier inoxydable blindé. Avec thermostat et voyant de fonctionnement. Il dispose également d'un thermostat de
        sécurité qui arrête la friteuse en cas d'augmentation anormale de la température de l'huile. RÉSERVES POUR FRITES Équipé d'un bac GN 2/3-150,
        à double fond perforé et incurvé pour faciliter la collecte des aliments frits. Tout démontable pour le nettoyage. Avec une résistance
        en céramique, située sur l'écran supérieur. □ Équipé d'un régulateur d'énergie, pour régler la température souhaitée et d'un voyant lumineux
        de fonctionnement. BAINS-MARIE ÉLECTRIQUES Avec la cuve, GN 1/1, soudée au plan de travail, avec tous les bords intérieurs arrondis, dans
        laquelle différentes combinaisons de bacs GN, hauteur 150 mm, peuvent être placées. Non inclus. (Voir dans ACCESSOIRES) □ Avec robinet
        de vidange, situé au bas du bain-marie. Équipé de résistances adhésives, placées en bas, à l'intérieur, là où se trouve l'isolant, afin
        que l'intérieur du réservoir soit parfaitement propre. Équipé d'un thermostat et d'un voyant de fonctionnement. CUISEURS DE PÂTES ÉLECTRIQUES
        Avec la cuve, GN 2/3, en acier inoxydable AISI-316, avec tous les bords arrondis et soudé au plan de travail, embouti, pour faciliter
        le nettoyage. Avec grille perforée pour empêcher les aliments de tomber au fond. Avec débordement pour que l'eau ne se renverse pas, et
        en même temps l'évacuation de l'amidon des pâtes, qui flotte. Il dispose d'un robinet de remplissage sur le devant, et de vidange, situé
        au bas de la cuiseur. Avec résistance blindée en acier inoxydable. Avec interrupteur-thermostat et voyant de fonctionnement. En option,
        nous avons des paniers perforés avec poignée(s), entièrement en acier inoxydable. (Voir dans ACCESSOIRES les packs que nous proposons).
        □ PROTECTEURS DE VERRE Conçu pour protéger les clients qui viennent au show cooking des éclaboussures et des brûlures. □ Avec des supports,
        en acier inoxydable AISI 304, pour maintenir les cristaux en verre trempé droit, d’épaisseur 6 mm.
