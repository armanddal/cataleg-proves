  - idioma: en
    paragrafs:
    - role: text
      text: AFIN D'OFFRIR L'ENSEMBLE COMPLET, NOUS AVONS CRÉÉ UNE GAMME DE MEUBLES, AVEC DIFFÉRENTES DÉCORATIONS DU PLAN DE TRAVAIL ET DES PANNEAUX,
        POUR PERSONNALISER L'INSTALLATION DANS VOTRE ÉTABLISSEMENT. ILS SONT ÉQUIPÉS DE LA CUVE OU DE LA PLAQUE LISSE FROIDE, AINSI QUE DE L'ÉCRAN
        AVEC LUMIÈRE LED. NOUS FABRIQUONS ÉGALEMENT DES UNITÉS DE BUFFET CHAUD OU NEUTRE, ET NOUS PROPOSONS DES KITS D'UNION POUR RÉALISER DES
        ENSEMBLES LINÉAIRES. DE CETTE FAÇON, VOUS POUVEZ AVOIR LE BUFFET PRÊT POUR UNE UTILISATION IMMÉDIATE, EN UN TEMPS BEAUCOUP PLUS COURT
        QUE SI VOUS DEVEZ LE CONSTRUIRE AVEC DIFFÉRENTS INDUSTRIELS (MAÇONS, CHARPENTIERS, PLOMBIERS, ETC.) ET ENSUITE INSTALLER LES ÉLÉMENTS
        ENCASTRABLES ET LES ÉCRANS DONT VOUS AVEZ BESOIN… CONSTRUCTION GÉNÉRIQUE Mobilier soutenu, avec une structure métallique. Avec des plans
        de travail en quartz synthétique, en une seule pièce, sans joints. Revêtement de meubles en bois hydrofuge, avec différentes finitions
        laquées ou mélaminées. Avec des pieds réglables, pour quand vous voulez fixer l'ensemble.  Également équipé de roues, pour faciliter la
        mobilité du mobilier, en fonction de l'heure du petit-déjeuner ou du déjeuner/dîner. Équipés de plinthes en acier inoxydable. □ Les côtés
        de le meuble sont accessibles pour le branchement et la maintenance. □ Avec des étagères à assiettes intégrées, dans le sens de la longueur
        et éclairées par une lumière led . □ Élément encastré dans le plan de travail avec écran, en acier inoxydable 18/10 AISI-304. Avec des
        bords internes arrondis pour faciliter le nettoyage. □ Isolation écologique en polyuréthane injecté, d'une densité de 40 kg/m3. Sans CFC.
        Gaz réfrigérant R290. Réfrigération au moyen de tubes en cuivre fixés à la partie interne, pour une meilleure répartition du froid, situés
        dans la zone isolée. Avec unité de réfrigération située à l'intérieur de le meuble, qui dispose d'une ventilation. Avec drainage. Contrôlé
        par un thermomètre-thermostat numérique et avec un interrupteur marche/arrêt lumineux, accessible et visible. □ Écrans montées sur le
        cadre d'encastrement. □ Équipé d'un verre trempé, incurvé sur les deux côtés, qui agit comme une protection hygiénique pour les aliments
        exposés. □ Avec une lumière LED, qui met en valeur les aliments réfrigérés. BUFFET FROID, AVEC CUVE Cuve pour conteneurs GN 1/1, d'une
        profondeur maximale de 65 mm. □ Température de travail +4° +8°C, avec une température ambiante de 25°C. BUFFET FROID, AVEC PLAQUE LISSE
        Le refroidissement, effectué au moyen du serpentin, fixé à la base interne de la plaque, a l'effet d'une piste de glace. Ce froid se transmet
        par contact et sur la plaque lisse □, on peut placer des plateaux ou des assiettes en céramique, en mélamine ou en acier inoxydable, ainsi
        que des récipients GN. Température de travail -4º +4°C, avec une température ambiante de 25°C.
