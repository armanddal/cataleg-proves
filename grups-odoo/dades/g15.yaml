  - idioma: en
    paragrafs:
    - role: text
      text: GLASS SHELVES, NEUTRAL They act both as a display and as a plate rack. They are also hygienic protectors of the food on display. Made
        of tempered glass, 6 mm thick. □ With tube supports, made of stainless steel, 18/10 AISI-304, with the corresponding clips for holding
        the glass. □ These brackets are ﬁxed to the furniture. □ They are supplied unassembled. With 1 shelf, 525 mm. wide. □ . □ GLASS SHELVES
        WITH FRONT GUARD Made of tempered glass, 6 mm thick. □ □ GLASS SHELVES, WITH SCREENS WITH LIGHT In addition to the functions of display,
        plate racks and hygienic protectors, they have light to highlight the food on offer. With LED light, and ON-OFF switch. GLASS SHELVES
        WITH LIGHT AND HEAT CANOPIES With canopies featuring LED light and infrared heating to illuminate and keep food warm. With an ON-OFF switch
        on the canopy itself. □ . □ . □ TRAY GUIDES Designed to support and move the trays, which are also very easy to clean, as they do not
        have a base where spillages of drinks or foodstuffs in general could stagnate. Quick assembly to the front of the unit, ﬁxing the 2 18/10
        AISI-304 stainless steel supports by means of screws, which are hidden by some trims. □ Manufactured with 3 tubes Ø 30, in 18/10 AISI-304
        stainless steel. PLATE SUPPORTS For placing on the side of the central furniture. FRONT PANELS To personalise the self-service line and
        decorate it in accordance with the ambience and furnishings of the space where it is installed. As standard, they are supplied in stainless
        steel, so when ordering, you must indicate the colour of the panel, which is made of highly resistant plastic material. There are 4 colours
