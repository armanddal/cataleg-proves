- id: p27
  n: 27
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: □ GENERIC CONSTRUCTION
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: In 18/10 AISI-304 stainless Steel
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Designed to be placed in the Show Cooking area of ​​the buffet. But they are also a professional solution, for integration into kitchen
        furniture.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Recessed elements, with a system that allows fixing to the countertop, to prevent liquids from leaking.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: The controls of each equipment can be placed on the front or the top of the furniture. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: titol
      text: GAS KITCHEN COUNTERTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: Embedded worktops, with rounded edges to facilitate cleaning.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Brass taps, equipped with adjustable maximum and minimum. With safety coil and thermocouple.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With piezo-electric ignition, in all fires.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Cast iron burners, with brass crowns, removable for cleaning. Of 5.2 and 3.3 Kw. power and high performance. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With double vitrified cast iron grills. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: titol
      text: ELECTRIC KITCHEN COUNTERTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: Embedded worktops, with rounded edges, to facilitate cleaning, with housing for round plates. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Equipped with independent switches, with 6 power levels and operation indicator lights. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With round cast iron plates of Ø 220 mm. and 2.6 kW. of power
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With built-in safety thermostat, to avoid excess temperature, when there is no container, and at the same time, for energy savings.
      estil:
        color: '#000000'
        mida: 13.7
    - role: titol
      text: VITROCERAMIC KITCHEN COUNTERTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: Countertop frame in stainless steel, with 6 mm schott glass of thickness.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Said glass is very easy to clean, being completely flat. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With independent switches, with 2 levels and operating indicator lights.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With tungsten resistors, 2.5 and 1.8 Kw. of power
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With built-in safety thermostat, to avoid excess temperature, when there is no container, and at the same time, for energy savings.
      estil:
        color: '#000000'
        mida: 13.7
    - role: titol
      text: INDUCTION COUNTERTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: Countertop frame in stainless steel, with 6 mm schott glass of thickness.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Said glass is very easy to clean, being completely flat. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: The cooking area of ​​these kitchens does not burn, since induction technology consists of heating by magnetic waves, through a generator.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Therefore, containers, pans, pots, etc. must be used special with the bottom of the same of ferric material. And when it does not
        detect, said container stops automatically, in 60 seconds.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: This system is expensive, but pays for itself quickly, since the consumption of electrical energy drops by 40% compared to an electric
        kitchen and 50% compared to a gas kitchen.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Consequently, the cooking time is reduced by half compared to other systems, and it also has the advantage of instantly increasing
        or decreasing the temperature.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Nor does it consume anything when the container is removed, not requiring maintenance lights or minimum positions, which also saves
        energy.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: Independent rotary knobs with fixed power level positions and operation indicator lights.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With 3.5 Kw plates of power.
      estil:
        color: '#000000'
        mida: 13.7
    - role: titol
      text: ELECTRIC FRYTOPS
      estil:
        color: '#800080'
        negreta: true
        mida: 13.7
    - role: text
      text: With grease drain at the bottom and a conical sealing plug at the front of the plate. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With stainless steel breastplate welded all around its upper and lower contour, for maximum hygiene. □
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With adjustable thermostats from 80º to 300ºC, independent and operation indicator light.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: With armored stainless steel resistances, mounted in drawers, duly insulated.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: SMOOTH IRON PLATES, 15 mm. thick, rectified.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: SLOTTED IRON PLATES, 15 mm. of thickness. The mod/code 1202.0631, is mixed. 1/3 grooved and rest smooth.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: SMOOTH HARD CHROME PLATES, 15 mm. thick, rectified and a 50 micron thick. They are supplied with a spatula-cutter for cleaning,□ which
        should be used without knocking, just sliding the blade across the plate.
      estil:
        color: '#000000'
        mida: 13.7
    - role: text
      text: The cleaning method is once the frytop is stopped and after 30/45 minutes (still hot), ice cubes should be placed, which will evaporate
        immediately. Then the spatula-cutter should be passed gently, to remove as much fat as possible, followed by a damp cloth. Do not put
        degreaser until the next day, before starting the iron and the surface will be shiny as new.
      estil:
        color: '#000000'
        mida: 13.7
    pos:
      x: 1.0
      y: 2.5
      w: 19.0
      h: 25.9
  fotos: []
  textos_pagina:
