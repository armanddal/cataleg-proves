  - idioma: es
    paragrafs:
    - role: text
      text: □ GENERIC CONSTRUCTION In 18/10 AISI-304 stainless Steel Designed to be placed in the Show Cooking area of ​​the buffet. But they
        are also a professional solution, for integration into kitchen furniture. Recessed elements, with a system that allows fixing to the countertop,
        to prevent liquids from leaking. The controls of each equipment can be placed on the front or the top of the furniture. □ ELECTRIC FRYERS
        With stainless steel baskets and □ lids with handles. With tanks fully welded to the worktop, embedded to facilitate cleaning and also
        prevent the oil from overflowing. □ With perforated grid, to prevent food from going to the bottom. With drain tap, located at the bottom
        of the fryer. With a large cold zone, which increases the duration of the oil. They have a mechanism so that the resistances can tilt
        to the vertical position, which is activated by means of a lever located on the right, □ with a locking system, in its raised position,
        in order to facilitate cleaning of the tank. Said resistors are made of armored stainless steel. With thermostat and operating indicator
        light. It also has a safety thermostat that stops the fryer in the event of an abnormal increase in oil temperature. ELECTRIC FRIED CONSERVATORS
        Equipped with a GN 2/3-150 container, with double perforated and curved bottom to facilitate the collection of fried foods. All removable
        for cleaning. With a ceramic resistance, located on the upper screen. □ Equipped with an energy regulator, to adjust the desired temperature
        and operation indicator light. ELECTRIC BAINS-MARIE With the well, GN 1/1, welded to the worktop, with all rounded interior edges, in
        which different combinations of GN containers, 150 mm high, can be placed. Not included. (See in ACCESSORIES) □ With drain tap, located
        in the lower part of the bain-marie. Equipped with adhesive resistors, placed at the bottom, on the inside, where the insulation is, so
        that the interior of the tank is completely clean. Equipped with thermostat and operating indicator light. ELECTRIC PASTA COOKERS With
        the well, GN 2/3, made of AISI-316 stainless steel, with all rounded edges and welded to the worktop, deep-drawn, to facilitate cleaning.
        With perforated grid to prevent food from going to the bottom. With overflow so that the water does not spill, and at the same time the
        evacuation of the starch from the pasta, which floats. It has a tap for filling on the front, and emptying, located in the lower part.
        With armored stainless steel resistance. With switch-thermostat and operation indicator light. Optionally, we have perforated baskets
        with handle/s, completely made of stainless steel. (See in ACCESSORIES the packs we offer). □ GLASS PROTECTORS Designed to protect customers
        who come to the show cooking from splashes and burns. □ With AISI 304 stainless Steel supports to hold 6 mm thick tempered glass.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
