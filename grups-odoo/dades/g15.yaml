      h: 1.75
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Interior y exterior, en acero inoxidable 18/10 AISI-304. Encimeras de 1,5 mm, de espesor, con cantos redondeados,
        longitudinalmente, en ambos lados. Elementos modulares, lo que permite realizar el montaje, de acuerdo con las necesidades y el espacio
        disponible, ya que también fabricamos muebles fríos, muebles caja, angulares etc. Los frontales de los muebles, de serie, son de acero
        inoxidable, pero opcionalmente, se pueden panelar en 4 colores. □, o colocar zócalos □ Así mismo, ofrecemos, opcionalmente, todos los
        complementos necesarios para equipar los muebles, tales como guías pasabandejas. □, pantallas de cristal, simples o dobles, con luz caliente
        etc. □ Con patas regulables de acero inoxidable. MUEBLES CALIENTES CON CUBA/BAÑO MARÍA, SUPERIOR Para la exposición de alimentos calientes,
        en recipientes GN 1/1, u otros tamaños, de hasta 150 mm, de profundidad. Cubas con todos los cantos redondeados, para facilitar la limpieza
        y dotadas de desagüe. □ Con grifo de entrada de agua. Aislamiento de ﬁbra de vidrio. La calor es por medio de resistencias de silicona,
        adosadas, en la parte inferior de la cuba, en la zona del aislamiento, de manera que el interior, está totalmente limpio. □ Con termostato
        analógico y piloto indicador de funcionamiento. El régimen de trabajo es de +30º+90ºC. CON RESERVA CALIENTE, INFERIOR Puertas correderas
        con tirador incorporado, de doble pared aisladas. Aislamiento de ﬁbra de vidrio. Con calor ventilado para conseguir la temperatura homogénea,
        en el interior. El control de la temperatura, es independiente al de la cuba, con termostato analógico y piloto indicador de funcionamiento.
        El régimen de trabajo es de +30º+90ºC. SIN RESERVA Con un estante inferior. MUEBLES CALIENTES CENTRALES CON CUBA/BAÑO MARIA SUPERIOR Opcionalmente,
        se pueden colocar guías pasabandejas a ambos lados, □ así como pantallas de cristal curvado por los dos lados, con luz caliente. La parte
        inferior, están cerrados con frontales de acero inoxidable, que opcionalmente se pueden panelar en 4 colores a escoger. □ Al estar situados
        como isla, opcionalmente, también se pueden colocar estantes para platos. □ El resto de características, son las mismas de los muebles
        con cuba. MUEBLES CALIENTES, CON ENCIMERA LISA Con dos estantes, la base y otro intermedio. Resto de características, igual que las reservas
        calientes. MUEBLES NEUTROS ABIERTOS Con dos estantes, la base y otro intermedio.
