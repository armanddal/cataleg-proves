- id: p68
  n: 68
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA Interior y exterior, en acero inoxidable 18/10 AISI-304. Encimeras de 1,5 mm, de espesor, con cantos redondeados,
        longitudinalmente, en ambos lados. Elementos modulares, lo que permite realizar el montaje, de acuerdo con las necesidades y el espacio
        disponible, ya que también fabricamos muebles fríos, muebles calientes, muebles neutros, etc. Los frontales de los muebles, de serie,
        son de acero inoxidable, pero opcionalmente, se pueden panelar en 4 colores. □, o colocar zócalos. □ Así mismo, ofrecemos, opcionalmente,
        guías pasabandejas. □ Con patas regulables de acero inoxidable. MUEBLES DISPENSADORES DE PLATOS Regulación del nivel, por medio de muelles.
        Diámetro de los platos de 180 a 280 mm. Con capacidad para 45 platos, por columna. Opcionalmente se pueden suministrar tapas. Ver en ACCESORIOS
        □ PARA PLATOS NEUTROS, Mods/cod. 10927410 y 10714400. PARA PLATOS CALIENTES, Mods/cod. 10936110 y 10699010. Calor por medio de resistencias
        de acero inoxidable blindadas. Controlado por medio de un termostato analógico, de 0º+ 90ºC, e interruptor luminoso, marcha-paro. MUEBLE
        DISPENSADOR PARA VAJILLA NEUTRA Regulación del nivel, por medio de muelles. Para cestas de 500x500 mm. Con capacidad para 7 cestas de
        25 vasos, y de 80 mm, de altura. No incluidas. Ver en ACCESORIOS. □ MUEBLES PARA CARROS DISPENSADORES DE PLATOS Con forma de “U”, con
        alojamiento para un carro mod/cod. 10988500. □ CARROS DISPENSADORES DE PLATOS CALIENTES Diseñados para transportar y distribuir platos.
        Dotados de 4 ruedas de Ø 125 mm, 2 de ellas con freno y parachoques en las 4 esquinas. Con asa para su conducción. □ Regulación del nivel,
        por medio de muelles. Diámetro de los platos de 180 a 280 mm. Con capacidad para 45 platos, por columna. Opcionalmente se pueden suministrar
        tapas. Ver en ACCESORIOS □ Aislamiento en ﬁbra de vidrio. Calor por medio de resistencias de acero inoxidable blindadas. Controlado por
        medio de un termostato analógico, de 0º+ 90ºC, e interruptor luminoso, marcha-paro. Con el cable de toma de corriente, espiral y soporte,
        para cuando está en movimiento. □ MUEBLES CAJA Ideados para colocar la caja registradora, y con espacio para el camarero, para que pueda
        controlar todos los alimentos que el cliente tiene en la bandeja. Para su colocación al ﬁnal de la línea del self-service, a la derecha
        o izquierda. Disponen de un cajón con llave. MUEBLES NEUTROS ANGULARES Con dichos muebles, se puede realizar la linea del self-service,
        en ángulo a 90º ó 45º, adaptándose al local donde vaya instalado. MUEBLES ESTERNOS se fabrican las guías pasabandejas, especíﬁcas. □ MUEBLES
        INTERNOS con dos estantes, no necesitan guías. MUEBLES DISPENSADORES DE SOBRE-MESA □ PARA PAN Y CUBIERTOS Mod/cod. 11102000. Dispone de
        tolva para el pan, que el cliente puede coger por la apertura frontal. La carga se realiza por la parte posterior, donde está el camarero.
        También tiene un cubertero de PVC, extraible para su limpieza, con 4 departamentos, para los cubiertos, en posición inclinada, para facilitar
        la vista, al cliente. PARA VASOS Mod/cod. 10707001. Con 3 estantes inclinados, con tope de varilla en acero inox, a 3 lados. MUEBLES DISPENSADORES
        DE PIÉ para bandejas, servilletas, pan y cubiertos Mod/cod. 10100000. El estante inferior, permite colocar las bandejas apiladas. El segundo
        estante, es para los manteles y servilletas. Dispone se tolva para el pan, que el cliente puede coger por la apertura frontal. La carga
        se realiza por la parte posterior, donde está el camarero. También tiene un cubertero de PVC, extraíble para su limpieza, con 4 departamentos,
        para los cubiertos, en posición inclinada, para facilitar la vista, al cliente. para vasos. Mod/cod. 10607001 Con 6 estantes inclinados,
        con tope de varilla en acero inox, a 3 lados. Con patas regulables. Mod/cod. 10200000 Con 5 pares de guías inclinadas para 5 cestas de
        500x500. No incluidas. Ver en ACCESORIOS. Con 4 ruedas de Ø 125 mm, 2 de ellas con freno.
