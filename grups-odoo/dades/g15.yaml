- id: p09
  n: 9
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: □ DROP-IN / SHOWCASES AND TANKS FOR THE CONSERVATION OF ICE CREAM
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: □ DROP-IN / VITRINES ET CUVES POUR LA CONSERVATION DES GLACES
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION In 18/10 AISI-304 stainless steel. All tanks, with rounded internal edges for easy cleaning. □ Built-in elements,
        with a system for fixing to the buffet worktop, which prevents liquids from seeping in. □ Ecological injected polyurethane insulation,
        with a density of 40 kg/m3. Free of CFC'S. R290 refrigerant gas. GENERIC CHARACTERISTICS OF THE COLD DISPLAY CABINETS FOR MAINTENANCE
        They have a refrigerated tank and 3 levels for display. □ Vats with drainage. With tempered glass on 3 sides, of which the rear one has
        doors and is in the waiter's area for replenishment. Dishes or other food must be kept cold, as the display cabinets are for maintenance
        purposes for the duration of the service. Ventilated refrigeration. Working temperature +7° +10°C, with an ambient temperature of 25°C.
        Controlled by a digital thermometer-thermostat and with a luminous on/off switch. □ Control panel, in a safety box, removable, to be placed
        in the buffet cabinet. □ LED lighting. □ With 200 mm deep ventilated tank, for GN trays. Unit installed in the lower part of the tank.
        □ Front part, customer area, open. □ Fitted with roll-up thermal curtain, for food storage when there is no service. □ GENERIC CHARACTERISTICS
        OF TANKS FOR ICE-CREAM Refrigeration by means of copper tubes attached to the inside of the tank, for better distribution of the cold,
        located in the insulated area. Working temperature -15º/-18ºC, with an ambient temperature of 25°C. With capacity for ice-cream trays,
        360x165x150 mm, of 7 litres. Designed for ice cream, in terrines or in bulk. In this case you will need the ice-cream trays, not included.
        (See ACCESSORIES) With transparent methacrylate sliding lids. □ TANKS FOR ICE-CREAM MAINTENANCE WITH COOLING UNIT □ Controlled by a digital
        thermometer-thermostat and with a luminous on-off switch. □ Control panel, in a safety box, removable, to be placed in the buffet cabinet.
        □ TANKS FOR ICE-CREAM MAINTENANCE WITHOUT UNIT We recommend the power of the refrigeration unit, depending on the model.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE En acier inoxydable 18/10 AISI-304. Tous les cuves, avec des bords internes arrondis pour faciliter le nettoyage.
        □ Éléments encastrés, avec un système de fixation au plan de travail du buffet, qui empêche les liquides de s'infiltrer. □ Isolation écologique
        en polyuréthane injecté, d'une densité de 40 kg/m3. Sans CFC. Gaz réfrigérant R290. CARACTÉRISTIQUES GÉNÉRIQUES DES VITRINES FROIDES POUR
        LA MAINTENANCE Ils disposent d'une cuve réfrigérée et de 3 niveaux d'exposition. □ Cuves avec drainage. Avec du verre trempé sur 3 côtés,
        dont l'arrière a des portes et se trouve dans la zone du serveur pour le réapprovisionnement. Les plats ou autres aliments doivent être
        conservés au froid, les vitrines étant destinées à l'entretien pendant la durée du service. Réfrigération ventilée. Température de travail
        +7° +10°C, avec une température ambiante de 25°C. Contrôlé par un thermomètre-thermostat numérique et avec un interrupteur lumineux marche/arrêt.
        □ Panneau de commande, dans un boîtier de sécurité, amovible, à placer dans l'armoire du buffet. □ Éclairage LED. □ Avec cuve ventilée
        de 200 mm de profondeur, pour plateaux GN. Unité installée dans la partie inférieure du cuve. □ Partie avant, espace client, ouvert. □
        Équipé d'un rideau thermique enroulable, pour le stockage des aliments lorsqu'il n'y a pas de service. □ CARACTÉRISTIQUES GÉNÉRIQUES DES
        CUVES DE STOCKAGE DE GLACES Réfrigération au moyen de tubes en cuivre fixés à l'intérieur de la cuve, pour une meilleure répartition du
        froid, situés dans la zone isolée. Température de travail -15º/-18ºC, avec une température ambiante de 25ºC. Avec capacité pour bacs à
        glace, 360x165x150 mm, de 7 litres. Conçu pour la crème glacée, en terrines ou en vrac. Dans ce cas, vous aurez besoin des bacs à glace,
        non inclus. (Voir ACCESSOIRES) Avec des couvercles coulissants en méthacrylate transparent. □ CUVES POUR LA MAINTENANCE DES GLACES AVEC
        UNITÉ DE REFROIDISSEMENT □ Contrôlé par un thermomètre-thermostat numérique et avec un interrupteur lumineux marche-arrêt. □ Panneau de
        commande, dans un boîtier de sécurité, amovible, à placer dans l'armoire du buffet. □ CUVES POUR LA MAINTENANCE DES GLACES SANS UNITÉ
        Nous recommandons la puissance du groupe frigorifique, en fonction du modèle.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 10.65
      y: 2.694
      w: 9.85
      h: 25.6
