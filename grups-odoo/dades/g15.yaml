  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE Intérieur et extérieur en acier inoxydable 18/10 AISI-304. Plans de travail de 1,5 mm d'épaisseur, avec des
        bords arrondis, longitudinalement, des deux côtés. Éléments modulaires, qui permettent un assemblage, conformément aux besoins et à l'espace
        disponible, puisque nous fabriquons aussi des meubles froids, des meubles chauds, des pass meubles neutres, etc. Les façades des meubles,
        en standard, sont en acier inoxydable, mais en option, elles peuvent être décorées en 4 couleurs. □, ou mettre des plinthes. □ De même,
        nous proposons en option des guides pass plateaux. □ Avec pieds réglables en acier inoxydable. MEUBLES DISTRIBUTEURS D’ASSIETTES Régulation
        du niveau, au moyen de ressorts. Diamètre du plat, réglable de 180 à 280 mm. Avec une capacité de 45 plats, par colonne. Des couvercles
        peuvent être fournis en option. Voir dans ACCESSOIRES □ POUR PLATS NEUTRES, Mods/cod. 10927410 et 10714400. POUR PLATS CHAUDS, Mods/cod.
        10936110 et 10699010. Chauffer au moyen de résistances blindées en acier inoxydable. Contrôlé au moyen d'un thermostat analogique, 0º
        + 90ºC, et interrupteur d'éclairage, start-stop. MEUBLE DISTRIBUTEUR POUR PANIERS À VERRE Régulation du niveau, au moyen de ressorts.
        Pour paniers 500x500 mm. Avec une capacité de 7 paniers de 25 verres et 80 mm de haut. Non inclus. Voir dans ACCESSOIRES. □ MEUBLES POUR
        CHARIOTS DISTRIBUTEURS D’ASSIETTES En forme de U, avec logement pour un chariot mod/cod. 10988500. □ CHARIOTS DISTRIBUTEURS D’ASSIETTES
        CHAUDS Conçu pour transporter et distribuer des assiettes. Équipé de 4 roues Ø 125 mm dont 2 avec freins et pare-chocs aux 4 coins. Avec
        poignée pour conduire. □ Régulation du niveau, au moyen de ressorts. Diamètre du plat, réglable de 180 à 280 mm. Avec une capacité de
        45 plats, par colonne. Des couvercles peuvent être fournis en option. Voir dans ACCESSOIRES □ Isolation en fibre de verre. Chauffer au
        moyen de résistances blindées en acier inoxydable. Contrôlé au moyen d'un thermostat analogique, 0º + 90ºC, et interrupteur d'éclairage,
        start-stop. Avec cordon d'alimentation, spirale et support, pour vos déplacements. □ MEUBLES CAISSES Conçu pour placer la caisse enregistreuse,
        et avec un espace pour le serveur, afin qu'il puisse contrôler toute la nourriture que le client a sur le plateau. À placer en fin de
        ligne self-service, à droite ou à gauche. Ils ont un tiroir verrouillable. MEUBLES NEUTRE ANGULAIRE Avec ces meubles, la ligne self-service
        peut être réalisée, à un angle de 90º ou 45º, en s'adaptant à l'endroit où elle est installée. mobilier extérieur, les guides spécifiques
        pour plateaux sont fabriqués. □ mobilier intérieur avec 2 étagères n'a pas besoin de guides. MEUBLES DISTRIBUTEUR DE COMPTOIR □ pour le
        pain et les couverts Mod/cod. 10752500. Il dispose d'une trémie pour le pain, que le client peut prendre par l'ouverture frontale. Le
        chargement se fait à l'arrière, là où se trouve le serveur. Il dispose également d'un range-couverts en PVC, amovible pour le nettoyage,
        avec 4 départements, pour les couverts, en position inclinée, pour faciliter la vue du client. pour verres Mod/cod. 10719400. Avec 3 étagères
        inclinées, avec arrêt de tringle en acier inoxydable, sur 3 côtés. MEUBLE DE DISTRIBUTEUR DEBOUT pour plateaux, serviettes, pain et couverts
        Mod/cod. 10475500. L'étagère inférieure permet de placer les plateaux empilés. La deuxième étagère est pour les nappes et les serviettes.
        Il dispose d'une trémie pour le pain, que le client peut prendre par l'ouverture frontale. Le chargement se fait à l'arrière, là où se
        trouve le serveur. Il dispose également d'un range-couverts en PVC, amovible pour le nettoyage, avec 4 départements, pour les couverts,
        en position inclinée, pour faciliter la vue du client. pour verres Mod/cod. 10743600. Avec 6 étagères inclinées, avec arrêt de tringle
        en acier inoxydable, sur 3 côtés. Avec pieds réglables. Mod/cod. 10200000. Avec 5 paires de glissières inclinées pour 5 paniers 500x500.
        Non inclus. Voir dans ACCESSOIRES. Avec 4 roues de Ø 125 mm, dont 2 avec freins.
