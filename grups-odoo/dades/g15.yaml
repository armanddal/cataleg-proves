- id: p64
  n: 64
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: en
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION Interior and exterior, in 18/10 AISI-304 stainless steel. Countertops 1.5 mm thick, with rounded edges, longitudinally,
        on both sides. Modular elements, which allow the assembly, according to the needs and the available space, since we also manufacture cold
        furniture, cashier’s furniture, corner furniture, etc. The fronts of the furniture, as standard, are made of stainless steel, but optionally,
        they can be paneled in 4 colors. □, or put skirting boards □ Likewise, we offer, optionally, all the necessary accessories to equip the
        furniture, such as guides for trays. □, glass lampshades, single or double, with warm light etc. □ With adjustable stainless steel legs.
        HOT FURNITURE WITH BAIN-MARIE, SUPERIOR For the display of hot food, in GN 1/1 containers, or other sizes, up to 150 mm deep. Tanks with
        all rounded edges, to facilitate cleaning and equipped with a drain. □ With water inlet tap. Fiberglass insulation. The heat is by means
        of silicone resistances, attached, in the lower part of the tank, in the insulation area, so that the interior is completely clean. □
        With analog thermostat and operation indicator light. The working regime is +30º+90ºC. WITH HOT LOWER RESERVE Sliding doors with built-in
        handle, double wall insulated. Fiberglass insulation. With ventilated heat to achieve a homogeneous temperature, inside. The temperature
        control is independent from that of the tank, with an analog thermostat and operation indicator light. The working regime is +30º+90ºC.
        WITHOUT RESERVE With a lower shelf. CENTRAL HOT FURNITURE WITH BAIN-MARIE SUPERIOR Optionally, tray guides can be placed on both sides,
        □ as well as curved glass screens on both sides, with warm light. The lower part is closed with stainless steel fronts, which can optionally
        be paneled in 4 colors to choose from. □ Being located as an island, optionally, they can also be placed dish racks. □ The rest of the
        characteristics are the same as the furniture with a tank. HOT FURNITURE, WITH SMOOTH WORKTOP With two shelves, the base and an intermediate
        one. Other features, same as hot reserves. OPEN NEUTRAL FURNITURE With two shelves, the base and an intermediate one.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.0
      h: 25.8
  - idioma: fr
    paragrafs:
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE Intérieur et extérieur en acier inoxydable 18/10 AISI-304. Plans de travail de 1,5 mm d'épaisseur, avec des
        bords arrondis, longitudinalement, des deux côtés. Éléments modulaires, qui permettent l'assemblage, selon les besoins et l'espace disponible,
        puisque nous fabriquons également froides, meubles à caisse, meubles d'angle, etc. Les façades des meubles, en standard, sont en acier
        inoxydable, mais en option, elles peuvent être décorées en 4 couleurs. □, ou mettre des plinthes □ De même, nous proposons, en option,
        tous les accessoires nécessaires pour équiper le meuble, tels que des guides pour plateaux. □, écrans en verre, simples ou doubles, avec
        lumière chaude, etc. □ Avec pieds réglables en acier inoxydable. MEUBLES CHAUDS AVEC BAIN-MARIE, SUPÉRIEUR Pour la présentation d’aliments
        chauds, en bacs GN 1/1, ou autres formats, jusqu'à 150 mm de profondeur. Cuves à bords arrondis pour faciliter le nettoyage et équipées
        d'une vidange. □ Avec robinet d'arrivée d'eau. Isolation en fibre de verre. La chaleur se fait au moyen de résistances en silicone, fixées,
        dans la partie inférieure du réserve, dans la zone d'isolation, de sorte que l'intérieur soit complètement propre. □ Avec thermostat analogique
        et voyant de fonctionnement. Le régime de travail est de +30º+90ºC. AVEC RÉSERVE CHAUDE, INFÉRIEURE Portes coulissantes avec poignée intégrée,
        double paroi isolée. Isolation en fibre de verre. Avec chaleur ventilée pour obtenir une température homogène, à l'intérieur. Le contrôle
        de la température est indépendant de celui de la cuve, avec un thermostat analogique et un voyant de fonctionnement. Le régime de travail
        est de +30º+90ºC. SANS RÉSERVE Avec une étagère inférieure. MEUBLES CHAUDS CENTRALES AVEC BAIN-MARIE SUPÉRIEUR En option, des guides de
        plateaux peuvent être placés des deux côtés □, ainsi que des écrans en verre incurvé des deux côtés, avec une lumière chaude. La partie
        inférieure est fermée par des façades en acier inoxydable, qui peuvent éventuellement être décorées en 4 couleurs au choix. □ Étant situé
        comme une île, éventuellement, des étagères pour la vaisselle peuvent également être placées. □ Le reste des caractéristiques sont les
        mêmes que les meubles avec bain-marie. MEUBLES CHAUDES, AVEC PLAN DE TRAVAIL LISSE Avec deux étagères, la base et une intermédiaire. Autres
        caractéristiques, identiques aux réserves chaudes. MEUBLES NEUTRES OUVERTS Avec deux étagères, la base et une intermédiaire.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
