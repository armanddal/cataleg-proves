  - idioma: es
    paragrafs:
    - role: text
      text: CON LA FINALIDAD, DE OFRECER, EL CONJUNTO COMPLETO, HEMOS CREADO UNA GAMA DE MUEBLES, CON DISTINTAS DECORACIONES, DE LA ENCIMERA,
        Y DEL PANELADO, PARA PERSONALIZAR LA INSTALACIÓN EN SU ESTABLECIMIENTO. ESTAN EQUIPADOS CON LA CUBA O PLACA LISA FRIA, ASÍ COMO LA PANTALLA
        CON LUZ LED. TAMBIEN FABRICAMOS MUEBLES BUFFET CALIENTES O NEUTROS, Y OFRECEMOS, LOS KITS DE UNIÓN, PARA HACER CONJUNTOS LINEALES. DE
        ESA FORMA, PUEDEN DISPONER DEL BUFFET, PARA SU USO INMEDIATO, CON UN PLAZO MUCHO MAS CORTO, QUE SI LO TIENE QUE CONSTRUIR CON DISTINTOS
        INDUSTRIALES (ALBAÑILES, CARPINTEROS, FONTANEROS, ETC.) Y LUEGO INSTALAR LOS ELEMENTOS DROP-IN Y LAS PANTALLAS, QUE PRECISA… CONSTRUCCIÓN
        GENÉRICA Muebles soportados, con una estructura metálica. Con encimeras de cuarzo sintético, de una pieza, sin uniones. Panelado del mueble,
        en madera hidrófuga, con diferentes acabados lacados o de melamina. Con patas regulables, para cuando se desea fijar el conjunto.  También
        dotados de ruedas, para facilitar la mobilidad del mueble, según sea el momento del desayuno, o de la comida/cena. Equipados con zócalos
        en acero inoxidable. □ Laterales del mueble, accesibles para el conexionado y el servicio técnico. □ Con estantes para platos, empotrados,
        en sentido longitudinal e iluminados con luz led . □ Elemento encastrado, Drop-in, en la encimera con la pantalla, construidos en acero
        inoxidable 18/10 AISI-304. Con los cantos internos redondeados, para facilitar la limpieza. □ Aislamiento de poliuretano inyectado ecológico,
        con densidad de 40 Kgs./m3. Libre de CFC’S. Gas refrigerante R290. Refrigeración mediante tubos de cobre adosados en la parte interna,
        para el mejor reparto del frío, situados en la zona aislada. Con grupo frigorífico situado en el interior del mueble, el cual dispone
        de ventilación Con desagüe. Controladas mediante un termómetro-termostato digital y con interruptor luminoso de marcha-paro, accesible
        y visible □ Pantallas montadas sobre el marco del Drop-in □ Equipados con cristales templados, curvados a dos caras, que actúan como protector
        higiénico, de los alimentos expuestos. □ Con luz led, que resalta los alimentos refrigerados. BUFFET FRÍO, CON CUBA Cuba para recipientes
        GN 1/1, de 65 mm de fondo máximo. □ Temperatura de trabajo +4° +8°C, con una temperatura ambiente de 25°C. BUFFET FRÍO, CON PLACA LISA
        El frio, realizado por medio del serpentín, adosado en la base interna de la placa, hace el efecto de pista de hielo. Dicho frio se transmite
        por contacto y sobre la placa lisa □, se pueden colocar, bandejas o platos, de cerámica, melanina, o de acero inox, y también recipientes
        GN. Temperatura de trabajo -4º +4°C, con una temperatura ambiente de 25°C.
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
