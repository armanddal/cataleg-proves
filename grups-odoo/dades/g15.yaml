    paragrafs:
    - role: text
      text: BUFFETS / MUEBLES BUFFET CALIENTES Y NEUTROS □ BUFFETS / HOT AND NEUTRAL BUFFET FURNITURE
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    - role: text
      text: □ BUFFETS / MEUBLES BUFFET CHAUDES ET NEUTRES
      estil:
        color: '#ffffff'
