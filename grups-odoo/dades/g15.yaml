      text: ÉTAGÈRES NEUTRES EN VERRE Ils servent à la fois de présentoir et de porte-assiettes. Ils sont également des protecteurs hygiéniques
        des aliments exposés. Fabriqué en verre trempé, d'une épaisseur de 6 mm. □ Avec des supports de tube, en acier inoxydable, 18/10 AISI-304,
        avec les clips correspondants pour le maintien du verre. □ Ces supports sont ﬁxés aux meubles. □ Se suministran desmontados. Avec 1 étagère,
        de 525 mm de largeur. □ . □ ÉTAGÈRES EN VERRE AVEC PROTECTION FRONTALE Fabriqué en verre trempé, d'une épaisseur de 6 mm. □□ ÉTAGÈRES
        EN VERRE AVEC ÉCRAN ÉCLAIRÉ En plus des fonctions de présentoir, de porte-assiettes et de protections hygiéniques, ils disposent d'une
        lumière pour mettre en valeur les aliments proposés. Avec éclairage LED, et interrupteur ON-OFF. ÉTAGÈRES EN VERRE AVEC ÉCRANS LUMINEUX
        ET CHAUFFANTS Avec écrans équipés d’éclairage LED et infrarouges pour éclairer et maintenir les aliments au chaud. Avec un interrupteur
        ON-OFF sur l’écran lui-même. □ . □ . □ GUIDES PASS PLATEAU Conçus pour soutenir et déplacer les plateaux, ils sont également très faciles
        à nettoyer, car ils n'ont pas de base où pourraient stagner les débordements de boissons ou d'aliments en général. Montage rapide à l'avant
        de l'appareil, en ﬁxant les 2 supports en acier inoxydable 18/10 AISI-304 au moyen de vis, qui sont cachées par certains habillages. □
        Fabriqué avec 3 tubes Ø 30, en acier inoxydable 18/10 AISI-304. ÉTAGÈRES POUR ASSIETTES Pour installer sur le côté, dans les meubles centraux.
