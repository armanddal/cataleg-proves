        mida: 11.0
    - role: text
      text: □ SELF-SERVICES / GUIDES PASS PLATEAU, PANNEAUX FRONTAUX ET SOCLES
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: text
      text: GUÍAS PASA-BANDEJAS Diseñadas para el soporte y desplazamiento de las bandejas, que a la vez son muy fáciles de limpiar, al no tener
        base donde se pudieran estancar vertidos de bebidas o alimentos en general. Montaje rápido al frontal del mueble, ﬁjando los 2 soportes
        de acero inoxidable 18/10 AISI-304, por medio de tornillos, los cuales quedan ocultos por unos embellecedores. □ Fabricadas con 3 tubos
        Ø 30, de acero inoxidable 18/10 AISI-304. ESTANTES POSA PLATOS Para colocación en el lateral, de platos en los muebles centrales. PANELES
        FRONTALES Para personalizar la linea de self-service y decorarlo de acuerdo con el ambiente y el mobiliario, del espacio donde esta instalado.
        De serie, se suministran en acero inoxidable, por lo que al pasar el pedido, deberán indicar el color del panel, que es de material plastiﬁcado,
        muy resistente. Existen 4 colores a elegir. Azul (RAL 5003), Rojo (RAL 3020), Blanco (RAL 9003) y Gris (RAL 9022). □ ZÓCALOS Que facilitan
        la limpieza, y a la vez mejoran el aspecto de la línea de Self-service. Fabricados en acero inoxidable 18/10 AISI-304. Con un fácil sistema
        de ﬁjación a las patas de los muebles. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.75
      y: 2.5
      w: 11.6
      h: 12.8
  - idioma: en
    paragrafs:
    - role: text
      text: TRAY GUIDES Designed to support and move the trays, which are also very easy to clean, as they do not have a base where spillages
        of drinks or foodstuffs in general could stagnate. Quick assembly to the front of the unit, ﬁxing the 2 18/10 AISI-304 stainless steel
        supports by means of screws, which are hidden by some trims. □ Manufactured with 3 tubes Ø 30, in 18/10 AISI-304 stainless steel. PLATE
        SUPPORTS For placing on the side of the central furniture. FRONT PANELS To personalise the self-service line and decorate it in accordance
        with the ambience and furnishings of the space where it is installed. As standard, they are supplied in stainless steel, so when ordering,
        you must indicate the colour of the panel, which is made of highly resistant plastic material. There are 4 colours to choose from. Blue
        (RAL 5003), Red (RAL 3020), White (RAL 9003) and Grey (RAL 9022)□ SOCKS They facilitate cleaning and at the same time improve the appearance
        of the Self-service line. Made of 18/10 AISI-304 stainless steel. With an easy ﬁxing system to the legs of the furniture. □
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.98
      y: 15.966
      w: 9.386
      h: 12.077
  - idioma: fr
    paragrafs:
    - role: text
      text: GUIDES PASS PLATEAU Conçus pour soutenir et déplacer les plateaux, ils sont également très faciles à nettoyer, car ils n'ont pas de
        base où pourraient stagner les débordements de boissons ou d'aliments en général. Montage rapide à l'avant de l'appareil, en ﬁxant les
        2 supports en acier inoxydable 18/10 AISI-304 au moyen de vis, qui sont cachées par certains habillages. □Fabriqué avec 3 tubes Ø 30,
        en acier inoxydable 18/10 AISI-304. ÉTAGÈRES POUR ASSIETTES Pour installer sur le côté, dans les meubles centraux. PANNEAUX FRONTAUX Personnaliser
        la ligne de self-service et la décorer en fonction de l'ambiance et de l'ameublement de l'espace où elle est installée. Ils sont fournis
        en standard en acier inoxydable. Lors de la commande, vous devez donc indiquer la couleur du panneau, qui est fabriqué en matière plastique
        très résistante. Vous avez le choix entre 4 couleurs. Bleu (RAL 5003), rouge (RAL 3020), blanc (RAL 9003) et gris (RAL 9022). □SOCLES
        Cela facilite le nettoyage et améliore en même temps l'apparence de la ligne Self-service. Fabriqué en acier inoxydable 18/10 AISI-304.
        Avec un système de fixation facile aux pieds du meuble. □
