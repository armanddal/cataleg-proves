- id: p57
  n: 57
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: □ GENERIC CONSTRUCTION Interior and exterior, in 18/10 AISI-304 stainless steel. Countertops 1.5 mm thick, with rounded edges, longitudinally,
        on both sides. Modular elements, which allow the assembly, according to the needs and the available space, since we also manufacture warm,
        neutral, angular furniture, etc. The fronts of the furniture, as standard, are made of stainless steel, but optionally, they can be paneled
        in 4 colors.□, or put skirting boards. □ Likewise, we offer, optionally, all the necessary accessories to equip the furniture, such as
        tray guides □, glass screens, single or double, with led light etc. □ Ecological injected polyurethane insulation, (CFC free), with a
        density of 40 Kg/m3. Oversized refrigeration groups, with automatic defrost. These groups allow their extraction to facilitate the maintenance
        and cleaning of the condenser. R290 hydrocarbon refrigerant gas. Top performance to get the greener energy rating, and to reduce CO2 emissions.
        With digital thermometer-thermostat. Said programmer allows to adjust the maximum and minimum temperatures, as well as the defrosts automatically,
        in order to optimize the performance to the maximum. With adjustable stainless steel legs. COLD FURNITURE WITH UPPER TANK Designed for
        the presentation of food in GN 1/1 containers, or other sizes, up to 150 mm deep. Likewise, drinks can be placed. Tanks with all rounded
        edges, to facilitate cleaning and equipped with a drain. □ Cooling by means of copper tubes attached to the inside of the tank, for better
        distribution of the cold, located in the isolated area. The working regime is +4º+8ºC, with an ambient temperature of 25ºC. COLD FURNITURE
        WITH SMOOTH PLATE The smooth plate, embedded in a 20 mm bowl, has the effect of an ice rink, □ that allows the placement of food in any
        type of tray or container, which remains cold, by contact. Equipped with drainage, for the evacuation of water, when the plate stops.
        Cooling through copper tubes attached to the inside of the plate, located in the isolated area. The working regime is -4º + 4ºC, with
        an ambient temperature of 25ºC. WITH LOWER RESERVE With the same refrigeration equipment. With torsion hinges, on the doors. With open
        maintenance position, when it exceeds 95º. Doors with built-in handle, with magnetic closing, by means of weatherstripping fitted with
        an air chamber, to ensure sealing. Easily replaceable. □ With ventilated evaporator to achieve a homogeneous temperature inside the chamber.
        They are supplied as standard, with a GN 1/1 plastic grid, per door. WITHOUT RESERVE With a lower shelf. CENTRAL COLD FURNITURE WITH TANK
        OR UPPER SMOOTH PLATE Optionally, tray guides can be placed on both sides □, as well as curved glass screens on both sides, with LED light.
        □ In the lower part, the refrigeration group is located, and they are closed with stainless steel fronts, which can optionally be paneled
        in 4 colors □ to choose from. Being located as an island, optionally, they can also be placed dish racks. □ The rest of the characteristics
        are the same as those of the cabinets with a well or a cold plate. COLD FURNITURE WITH DISPLAY Designed for displaying food, especially
        starters on a plate, desserts, etc., on the 3 shelves with which they are equipped. With all 4 glazed sides. As it has a refrigerated
        tank, it is ideal for the presentation of yoghurts, dairy desserts, etc. With 6 folding doors, made of metráquilato, on the customer's
        side. □ And with sliding doors, on the side of the waiter. With led light. The working regime is +6º+12ºC, with an ambient temperature
        of 25ºC. Ventilated cold, to equalize the temperature. With independent refrigeration group, located on the roof. With temperature control
        mechanism. They are manufactured with and without reserve, whose characteristics are the same.
