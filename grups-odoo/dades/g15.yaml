- id: p58
  n: 58
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: □ CONSTRUCTION GÉNÉRIQUE Intérieur et extérieur en acier inoxydable 18/10 AISI-304. Plans de travail de 1,5 mm d'épaisseur, avec des
        bords arrondis, longitudinalement, des deux côtés. Des éléments modulaires, qui permettent l'assemblage, selon les besoins et l'espace
        disponible, puisque nous fabriquons également des meubles chaleureux, neutres, anguleux, etc. Les façades des meubles, en standard, sont
        en acier inoxydable, mais en option, elles peuvent être décorées en 4 couleurs.□, ou mettre des plinthes □ De même, nous proposons, en
        option, tous les accessoires nécessaires pour équiper le meuble, comme les guides plateaux □, écrans en verre, simples ou doubles, avec
        lumière led etc. □ Isolation écologique en polyuréthane injecté, (sans CFC), d'une densité de 40 Kg/m3. Groupes frigorifiques surdimensionnés,
        avec dégivrage automatique. Ces groupes permettent leur extraction pour faciliter l'entretien et le nettoyage du condenseur. Gaz réfrigérant
        hydrocarbure R290. Performances maximales pour obtenir la qualification énergétique la plus écologique et réduire les émissions de CO2.
        Avec thermomètre-thermostat numérique. Ce programmateur permet de régler automatiquement les températures maximales et minimales, ainsi
        que les dégivrages, afin d'optimiser au maximum les performances. Avec pieds réglables en acier inoxydable. MEUBLES FROIDS AVEC CUVE SUPÉRIEURE
        Conçu pour la présentation des aliments dans des bacs GN 1/1, ou d'autres tailles, jusqu'à 150 mm de profondeur. De même, des boissons
        peuvent être placées. Cuves à bords arrondis pour faciliter le nettoyage et équipées d'une vidange. □ Refroidissement au moyen de tubes
        en cuivre fixés à l'intérieur de la cuve, pour une meilleure répartition du froid, situés dans la zone isolée. Le régime de travail est
        de +4º+8ºC, avec une température ambiante de 25ºC. MEUBLES FROIDS AVEC PLAQUE LISSE La plaque lisse, encastrée dans une cuvette de 20
        mm, fait l'effet d'une piste de glace, □ qui permet le placement d'aliments dans tout type de plateau ou de récipient, qui reste froid,
        par contact. Équipé d'un drainage, pour l'évacuation de l'eau, lorsque le plateau s'arrête. Refroidissement par tubes de cuivre fixés
        à l'intérieur de la plaque, situés dans la zone isolée. Le régime de travail est de -4º + 4ºC, avec une température ambiante de 25ºC.
        AVEC RÉSERVE INFÉRIEURE Avec le même équipement de réfrigération. Avec charnières à torsion, sur les portes. Avec position de maintenance
        ouverte, lorsqu'elle dépasse 95º. Portes avec poignée intégrée, à fermeture magnétique, au moyen d'un coupe-froid muni d'une chambre à
        air, pour assurer l'étanchéité. Facilement remplaçable. □ Avec évaporateur ventilé pour obtenir une température homogène à l'intérieur
        de la chambre. Ils sont livrés en standard, avec une grille plastique GN 1/1, par porte. SANS RÉSERVE Avec une étagère inférieure. MEUBLES
        FROIDS CENTRALES AVEC CUVE OU PLAQUE SUPÉRIEURE LISSE En option, des guides de plateau peuvent être placés des deux côtés □, ainsi que
        des écrans en verre incurvé des deux côtés, avec lumière LED. □ Dans la partie inférieure, le groupe de réfrigération est situé, et ils
        sont fermés par des façades en acier inoxydable, qui peuvent éventuellement être lambrissées en 4 couleurs au choix. □ Étant situé comme
        une île, éventuellement, des étagères pour la vaisselle peuvent également être placées. □ Le reste des caractéristiques sont les mêmes
        que celles des armoires à cuve ou à plaque froide. MEUBLES FROID AVEC VITRINE Conçu pour présenter des aliments, notamment des entrées
        sur assiette, des desserts, etc., sur les 3 étagères dont ils sont équipés. Avec les 4 faces vitrées. Dotée d'une cuve réfrigérée, elle
        est idéale pour la présentation de yogourts, desserts lactés, etc. Avec 6 portes battantes, en metráquilato, côté client. □ Et avec des
        portes coulissantes, du côté du serveur. Avec lumière led. Le régime de travail est de +6º+12ºC, avec une température ambiante de 25ºC.
        Froid ventilé, pour égaliser la température. Avec groupe de réfrigération indépendant, situé sur le toit. Avec mécanisme de contrôle de
        la température. Ils sont fabriqués avec et sans réserve, dont les caractéristiques sont les mêmes.
      estil:
