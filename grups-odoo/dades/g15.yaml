- id: p70
  n: 70
  tipus: informacio_general
  capcalera:
    banda: assets/g15/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: GENERIC CONSTRUCTION Interior and exterior, in 18/10 AISI-304 stainless steel. Countertops 1.5 mm thick, with rounded edges, longitudinally,
        on both sides. Modular elements, which allows assembly, in accordance with the needs and the available space, since we also manufacture
        cold furniture, warm furniture, neutral furniture, etc. The fronts of the furniture, as standard, are made of stainless steel, but optionally,
        they can be paneled in 4 colours. □, or put baseboards. □ Likewise, we optionally offer tray guides. □ With adjustable stainless steel
        legs. PLATE DISPENSER FURNITURE Level regulation, by means of springs. Plate diameter, adjustable from 180 to 280 mm. With capacity for
        45 plates, per column. Lids can be optionally supplied. See in ACCESSORIES □ FOR NEUTRAL PLATES, Mods/cod. 10927410 and 10714400. FOR
        HOT PLATES, Mods/cod. 10936110 and 10699010. Heat by means of armored stainless steel resistances. Controlled by means of an analog thermostat,
        0º + 90ºC, and light switch, start-stop. DISPENSER FURNITURE FOR NEUTRAL GLASS BASKETS Level regulation, by means of springs. For 500x500
        mm baskets. With capacity for 7 baskets of 25 glasses, and 80 mm high. Not included. See in ACCESSORIES. □ FURNITURE FOR PLATE DISPENSER
        TROLLEYS U-shaped, with accommodation for a trolley mod/cod. 10988500. □ HOT PLATES DISPENSER TROLLEYS Designed to transport and distribute
        plates. Equipped with 4 Ø 125 mm wheels, 2 of them with brakes and bumpers on the 4 corners. With handle for driving. □ Level regulation,
        by means of springs. Plate diameter, adjustable from 180 to 280 mm. With capacity for 45 plates, per column. Lids can be optionally supplied.
        See in ACCESSORIES □ Fiberglass insulation. Heat by means of armored stainless steel resistances. Controlled by means of an analog thermostat,
        0º + 90ºC, and light switch, start-stop. With power cord, coil and stand, for when you're on the go. □ CASH FURNITURE Designed to place
        the cash register, and with space for the waiter, so that he can control all the food that the client has on the tray. To be placed at
        the end of the self-service line, to the right or left. They have a lockable drawer. ANGULAR NEUTRAL FURNITURES With said furniture, the
        self-service line can be made, at an angle of 90º or 45º, adapting to the place where it is installed. external furniture, the specific
        guides for trays are manufactured. □ internal furniture with 2 shelves does. Not need guides. COUNTERTOP DISPENSER FURNITURE □ for bread
        and cutlery Mod/cod. 10752500, . It has a hopper for bread, which the customer can take through the front opening. Loading is done at
        the back, where the waiter is. It also has a PVC cutlery tray, removable for cleaning, with 4 departments, for cutlery, in an inclined
        position, to facilitate the customer's view. for glasses Mod/cod. 10719400. With 3 inclined shelves, with stainless steel rod stop, on
        3 sides. FOOT DISPENSER FURNITURE for trays, napkins, bread and cutlery Mod/cod. 10475500. The lower shelf allows the stacked trays to
        be placed. The second shelf is for tablecloths and napkins. It has a hopper for bread, which the customer can take through the front opening.
        Loading is done at the back, where the waiter is. It also has a PVC cutlery tray, removable for cleaning, with 4 departments, for cutlery,
        in an inclined position, to facilitate the customer's view. for glasses Mod/cod. 10743600. With 6 inclined shelves, with stainless steel
        rod stop, on 3 sides. With adjustable legs. Mod/code 10200000 With 5 pairs of inclined guides for 5 500x500 baskets. Not included. See
        in ACCESSORIES. With 4 wheels of Ø 125 mm, 2 of them with brakes.
