      text: SELF-SERVICES / GUÍAS PASA-BANDEJAS, FRONTALES PANELADOS Y ZÓCALOS □ SELF-SERVICES / TRAY GUIDES, FRONT PANELS AND SOCKS
      estil:
        color: '#ffffff'
