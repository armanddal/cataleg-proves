- id: p07
  n: 7
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
    serie: SERIE 5
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.149
    titol:
      es: CAMPANAS CON MOTOR INCORPORADO
      en: WALL HOODS WITH BUILT-IN MOTOR FOR BAR / SNACK
      fr: HOTTES MURALES AVEC MOTEUR INTÉGRÉ POUR BAR / SNACK
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: En acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Con visera inclinada.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Con motor-ventilador incorporado, situado en el centro de las campanas.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: De Serie, con filtros de lamas de acero inoxidable de 500x500x50 mm, que van colocados en una canal, sin montantes intermedios, y
        en posición inclinada, fácilmente extraíbles.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Con bandeja recogegrasas de una pieza, con tapón con rosca, para drenaje y limpieza.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Están construidas con un perfil en todo el perímetro, para la recogida de aceites, que por la condensación , se producen.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Opcionalmente, se pueden colocar filtros de malla y de carbón activo para reducir los olores. Ambos de 25 mm, de espesor, que se colocan
        en el lugar de los de lamas de 50 mm. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Disponemos de reguladores de velocidad con interruptor marcha-paro y variadores de frecuencia, para motores II y III (Ver ACCESORIOS).
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Es recomendable la colocación de luminarias de bajo consumo o led, en cualquier campana, pues la propia campana priva de luz al cocinero.
        Opcionalmente, se pueden suministrar instaladas, si se piden en el momento de hacer el pedido. Dicha luminarias, están protejidas por
        un vidrio templado, plano, estanco y fácil de limpiar (Ver ACCESORIOS).
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: MODELOS CON MOTOR-VENTILADOR INCORPORADO DE 400° C/2 HORAS
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: Cumplen la normativa vigente, ya que soportan el fuego, durante 120 minutos, evitando que la cocina se quede sin oxígeno, con el consiguiente
        peligro para las personas que están trabajando.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Al estar dicho motor-ventilador en el interior de la campana, el costo es muy inferior, a las campanas que van con la caja de ventilación
        a distancia.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Homologadas de acuerdo con la norma EN12101-3-2002, por el fabricante del motor.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: GENERIC CONSTRUCTION
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: In stainless steel 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With sloping visor.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With built-in fan motor, located in the center of the hoods.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Standard, with 500x500x50 mm stainless steel slat filters, which are placed in a channel, without intermediate posts, and in an inclined
        position, easily removable.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: With one-piece grease tray, with screw cap, for drainage and cleaning.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: They are built with a profile around the entire perimeter, for the collection of oils, which are produced by condensation.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Optionally, activated carbon and mesh filters can be fitted to reduce odors. Both are 25 mm thick, which are placed in the place of
        the 50 mm slats. (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: We have speed regulators with start-stop switch and frequency variators, for motors II and III (See ACCESSORIES).
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: It is advisable to place low-consumption or LED lights in any hood, as the hood itself deprives the cook of light. Optionally, they
        can be supplied installed, if requested at the time of ordering. Said luminaires are protected by a tempered glass, flat, watertight and
        easy to clean (See ACCESSORIES).
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: MODELS WITH BUILT-IN MOTOR-FAN 400° C/2 HOURS
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: They comply with current regulations, since they withstand fire for 120 minutes, preventing the kitchen from running out of oxygen,
        with the consequent danger to people who are working.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: As this fan-motor is inside the hood, the cost is much lower than the hoods that go with the remote ventilation box.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Approved in accordance with the EN12101-3-2002 standard, by the engine manufacturer.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: En acier inoxydable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec visière inclinée.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec moteur de ventilateur intégré, situé au centre des hottes.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Standard, avec des filtres à lamelles en acier inoxydable de 500x500x50 mm, qui sont placés dans un canal, sans poteaux intermédiaires,
        et en position inclinée, facilement démontables.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Avec bac à graisse monobloc, avec bouchon à vis, pour vidange et nettoyage.
      refs:
      - 4
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Ils sont construits avec un profil sur tout le périmètre, pour la collecte des huiles, qui sont produites par condensation.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: En option, des filtres à charbon actif et à mailles peuvent être installés pour réduire les odeurs. Les deux ont une épaisseur de
        25 mm, qui sont placés à la place des lattes de 50 mm. (Voir ACCESSOIRES
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Nous avons des régulateurs de vitesse avec interrupteur marche-arrêt et variateurs de fréquence, pour les moteurs II et III (voir
        ACCESSOIRES).
      refs:
      - 5
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Il est conseillé de placer des lampes à faible consommation ou à LED dans n'importe quelle hotte, car la hotte elle-même prive le
        cuisinier de lumière. En option, ils peuvent être fournis installés, sur demande au moment de la commande. Ces luminaires sont protégés
        par un verre trempé, plat, étanche et facile à nettoyer (voir ACCESSOIRES).
      refs:
      - 6
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: MODÈLES AVEC VENTILATEUR MOTEUR INTÉGRÉ 400° C/2 HEURES
      estil:
        color: '#800080'
        negreta: true
        mida: 10.2
    - role: text
      text: Ils sont conformes à la réglementation en vigueur, car ils résistent au feu pendant 120 minutes, empêchant la cuisine de manquer d'oxygène,
        avec le danger qui en résulte pour les personnes qui travaillent.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Comme ce moteur-ventilateur est à l'intérieur de la hotte, le coût est bien inférieur à celui des hottes qui vont avec le boîtier
        de ventilation à distance.
      estil:
        color: '#000000'
        mida: 10.2
    - role: text
      text: Homologué selon la norme EN12101-3-2002, par le constructeur du moteur.
      refs:
      - 7
      estil:
        color: '#000000'
        mida: 10.2
