      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Avec vidange, pour l'évacuation de l'eau, qui doit être raccordée, au même conduit de vidange du four.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Pour le démarrer, il faut actionner l'interrupteur qui démarre le ventilateur à vitesse minimale, pour extraire les vapeurs du four
        lui-même. Lorsque la porte est ouverte, automatiquement, le ventilateur augmente la force d'aspiration pour capter les vapeurs de l'intérieur.
      refs:
