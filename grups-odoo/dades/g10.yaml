        dans la salle à manger, qui est aspiré par les portes.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Il y a également un systéme de régulation sur chaque filtre, qui permettent de régler l'aspiration, en fonction de l'appareil de cuisson.
        L'air aspiré est extrait par un autre plenum. □
      estil:
        color: '#000000'
        mida: 14.0
