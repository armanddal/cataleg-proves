- id: p15
  n: 15
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: DISTANCE MOTOR EXTRACTION HOODS AND COMPENSATEDS
      estil:
        color: '#ffffff'
        negreta: true
        mida: 14.0
    - role: titol
      text: HOTTES D’EXTRACTION POUR MOTEUR À DISTANCE ET COMPENSÉS
      estil:
        color: '#ffffff'
        negreta: true
        mida: 14.0
    pos:
      x: 1.0
      y: 0.25
      w: 19.0
      h: 1.75
  - idioma: en
    paragrafs:
    - role: titol
      text: GENERIC CONSTRUCTION
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: In 18/10 AISI 304 stainless steel.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: To operate with ventilation box, (with motor-fan) at a distance. See in GROUP 10, the wide range that we have, for any type of installation.
        □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Standard, with 500x500x50 mm stainless steel louvred filters, which are placed in a channel, without intermediate uprights, and in
        an inclined position, easily removable. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With one-piece grease collection tray, with screw cap, for drainage and cleaning. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: They are built with a profile around the entire perimeter for the collection of oils produced by condensation.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Optionally, mesh and active carbon filters can be fitted to reduce odours. Both are 25 mm thick and can be fitted in place of the
        50 mm slats. (See ACCESSORIES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: We have speed regulators for single-phase motors, with start-stop switch and frequency variators for three-phase motors. (See ACCESSORIES)
        □□
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: It is advisable to fit low-consumption or LED lights in any hood, as the hood itself deprives the cook of light. These 500 or 1000
        mm luminaires are protected by tempered, flat, watertight and easy to clean tempered glass. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: WALL-MOUNTED HOODS FOR ROTISSERIES, OVENS AND STEAM
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Designed specifically for these appliances, as the filters are located at the front, so that the vapours are sucked in when the doors
        are opened and also so that they do not receive the maximum temperature generated by the burners at the back, thus preventing fires. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: With vertical visor.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: COMPENSATED HOODS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: They have a plenum with grilles, distributed along their entire length, for air supply, thus avoiding draughts, as 70% is supplied
        by means of another ventilation box. It also saves on air conditioning consumption in the dining room, which is drawn in through the doors.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: There are also control dampers on each filter, which can be used to regulate the suction of each filter, depending on the cooking
        appliance. The extracted air is extracted through another plenum. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.98
      y: 2.694
      w: 9.386
      h: 25.6
  - idioma: fr
    paragrafs:
    - role: titol
      text: CONSTRUCTION GÉNÉRIQUE
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: En acier inoxydable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Pour travailler avec le caisson de ventilation, (avec motoventilateur) à distance. Voyez dans le GROUPE 10, la large gamme que nous
        avons, pour tout type d'installation. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Standard, avec des filtres à lamelles en acier inoxydable de 500x500x50 mm, qui sont placés dans un canal, sans montants intermédiaires,
        et dans une position inclinée, facilement démontable. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec bac de récupération des graisses en une seule pièce, avec bouchon à vis, pour le drainage et le nettoyage. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Ils sont construits avec un profil sur tout le périmètre, pour la collecte des huiles produites par la condensation.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: En option, des filtres à maille et à charbon actif peuvent être installés pour réduire les odeurs. Toutes deux d'une épaisseur de
        25 mm, qui sont placées à la place des filtres de 50 mm. (Voir ACCESSOIRES)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Nous disposons de régulateurs de vitesse pour les moteurs monophasés, avec interrupteur marche-arrêt et variateurs de fréquence pour
        les moteurs triphasés. (Voir ACCESSOIRES).□□
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Il est conseillé d'installer des lampes à basse consommation ou à led dans toute hotte, car la hotte elle-même prive le cuisinier
        de lumière. Ces lumières, de 500 ou 1000 mm, sont protégées par un verre trempé, plat, étanche et facile à nettoyer. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: HOTTES MURALES POUR RÔTISSOIRES, FOURS ET VAPEUR
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Conçus spécifiquement pour ces appareils, les filtres sont situés à l'avant, de sorte que les vapeurs sont aspirées à l'ouverture
        des portes et qu'ils ne reçoivent pas la température maximale générée par les brûleurs à l'arrière, évitant ainsi les incendies. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Avec visière verticale.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: HOTTES COMPENSÉS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Ils disposent d'un plenum avec des grilles, réparties sur toute leur longueur, pour l'alimentation en air, évitant ainsi les courants
