  - idioma: es
    paragrafs:
    - role: text
      text: F BOÎTES DE VENTILATION En acier galvanisé. Doublé à l'intérieur d'un matériau isolant et insonorisant. Couvercles amovibles pour
        faciliter l'accès technique et le nettoyage, et étanches pour éviter les fuites d'air ou les infiltrations d'eau. Ventilateur avec bande
        anti-vibration. Moteurs montés sur des supports anti-vibration en caoutchouc. Transmission du moteur au ventilateur au moyen de 2 courroies,
        avec un système de tension. En remplaçant les poulies, on peut faire varier les révolutions. (Sauf les modèles avec un moteur 1/3, qui
        est direct). Ils sont fabriqués avec une sortie horizontale ou verticale, vous devez donc demander le mod/cod correspondant, lors de votre
        commande. Avec les moteurs triphasés, pour des raisons de consommation et de durabilité, un moteur monophasé peut être monté en option
        (voir dans ACCESSOIRES). Il est conseillé d'installer un variateur de fréquence, pour pouvoir régler les révolutions du moteur, en fonction
        des besoins du moment. (Voir dans ACCESSOIRES) □ IL EXISTE DE NOMBREUX MODÈLES DE BOÎTES, en plus de ceux indiqués dans ce catalogue,
        pour obtenir une extraction optimale des fumées en fonction des caractéristiques de votre installation. De nombreux facteurs en dépendent,
        comme le diamètre et la longueur du conduit d'aspiration... Les modèles recommandés (R) dans les caractéristiques des hottes, ainsi que
        des conduits, sont simplement orientatifs, mais normalement suffisants et surdimensionnés. Notre service technique est à votre disposition
        et vous conseillera. SÉRIE 2 - BOÎTES D'VENTILATION Ils peuvent être utilisés pour l'aspiration et pour l'impulsion. Le moteur est logé
        à l'intérieur de la boîte. □ SÉRIE 5 - BOÎTES DE VENTILATION HOMOLOGUÉS, 400ºC/2 HEURES - POUR ASPIRATION Ils sont conformes à la réglementation
        en vigueur, puisqu'ils résistent au feu pendant 120 minutes, évitant ainsi que la cuisine ne manque d'oxygène, avec le danger que cela
        représente pour les personnes qui travaillent. Approuvé conformément à la norme NBE-CP1/96, par le fabricant du moteur. □ Le moteur est
        situé à l’intérieur du caisson, avec une séparation suffisante afin qu’il ne soit pas affecté par le feu. □ CONDUITS Nous proposons les
        tôles galvanisées cylindriques. Ils sont livrés en longueur de 2 mètres, mais sur demande, nous pouvons fournir des conduits rectangulaires
        ou cylindriques en acier inoxydable, avec isolation EI-30, etc. Les conduits recommandés dans ce catalogue, en fonction de la hotte à
        installer, sont indicatifs, car ils dépendent de nombreux facteurs, mais normalement, ils sont suffisants et surdimensionnés. Vous trouverez
        également dans ce catalogue les accessoires les plus courants, tels que les coudes à 90 ou 45 degrés, les manchons de raccordement, les
        colliers de fixation, les chapeaux, etc. Mais, nous pouvons également fournir des "tés" ou des pantalons, des greffes, des vannes, des
        couvercles de regard pour le nettoyage, etc. Notre département technique, vous conseillera, une fois vu l'installation.
