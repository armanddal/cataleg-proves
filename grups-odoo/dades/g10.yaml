- id: p12
  n: 12
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CAMPANAS CON MOTOR, PARA MONTAJE ENCIMA DEL HORNO (SÓLO ELÉCTRICOS)
      estil:
        color: '#ffffff'
        negreta: true
        mida: 14.0
    - role: text
      text: HOODS WITH MOTOR, FOR MOUNTING ABOVE THE OVEN (ELECTRICAL ONLY)
      estil:
        color: '#ffffff'
        negreta: true
        mida: 10.0
    - role: text
      text: HOTTES AVEC MOTEUR, POUR MONTAGE AU-DESSUS DU FOUR (ÉLECTRIQUE UNIQUEMENT)
      estil:
        color: '#ffffff'
        negreta: true
        mida: 11.0
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 2.136
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: En acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Para su montaje directamente encima del techo del horno EURAST, no precisando sujeción a la pared.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Para hornos a convección eléctricos, de 6 y 10 GN 1/1, de las series MINI, 2, 5 y 8 (Ver GRUPO 8 de HORNOS).
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Incorporan un motor ventilador 7/7 de 1/10 HP.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Con filtros de lamas de acero inoxidable de 350x350x20.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: MODELOS PARA EXTRACCIÓN AL EXTERIOR
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: Precisan un conducto de Ø 150 mm, con salida al exterior o su conexión a campana existente.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Para la extracción de la salida de vahos del propio horno, así como la absorción de los vapores, de los asados que salen al abrir
        la puerta.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: MODELOS DE CONDENSACIÓN
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: No precisan salida al exterior, al ser autónomas.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Disponen de un condensador, que transforma los vapores en agua.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Con desagüe, para la evacuación del agua, que debe conectarse, al mismo conducto del desagüe del horno.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Para su puesta en marcha, se ha de accionar el interruptor, con lo cual se pone en marcha el ventilador a velocidad mínima, para la
        extracción de los vahos del propio horno. Cuando se abre la puerta, automaticámente, el ventilador aumenta la fuerza de aspiración, para
        captar los vapores del interior.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: GENERIC CONSTRUCTION
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: In 18/10 AISI 304 stainless steel.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: For mounting directly above the ceiling of the EURAST oven, not requiring attachment to the wall.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: For electrical convection ovens, 6 and 10 GN 1/1, of the MINI, 2, 5 and 8 series (See GROUP 8 of OVENS)
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: They incorporate a 1/10 HP 7/7 fan motor.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: With 350x350x20 stainless steel slat filters.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: MODELS FOR EXTRACTION TO THE EXTERIOR
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: They require a Ø 150 mm duct, with an outlet to the outside or its connection to an existing Hood
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: For the extraction of the vapors from the oven itself, as well as the absorption of the vapors from the roasts that come out when
        the door is opened.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: CONDENSATION MODELS
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: They do not require an exit to the outside, as they are autonomous.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: They have a condenser, which transforms the vapors into water.
      refs:
      - 2
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: With drain, for the evacuation of the water, that must be connected, to the same duct of the oven drain.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: To start it, the switch must be activated, which starts the fan at minimum speed, to extract the vapors from the oven itself. When
        the door is opened, automatically, the fan increases the suction force to capture the vapors from inside.
      refs:
      - 3
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: CONSTRUCTION GÉNÉRIQUE
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: En acier inoxydable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Pour montage directement au-dessus du plafond du four EURAST, ne nécessitant pas de fixation au mur.
      refs:
      - 1
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Pour fours électriques à convection, 6 et 10 GN 1/1, des séries MINI, 2, 5 et 8 (Voir GROUPE 8 des FOURS).
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Ils intègrent un moteur de ventilateur 1/10 CV 7/7.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Avec filtres à lamelles en acier inoxydable 350x350x20.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: MODÈLES D'EXTRACTION VERS L'EXTÉRIEUR
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: Ils nécessitent un conduit Ø 150 mm, avec une sortie vers l'extérieur ou son raccordement à une hotte existante.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Pour l'extraction des vapeurs du four lui-même, ainsi que l'absorption des vapeurs des rôtis qui sortent lorsque la porte est ouverte.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: MODÈLES À CONDENSATION
      estil:
        color: '#800080'
        negreta: true
        mida: 11.4
    - role: text
      text: Ils ne nécessitent pas de sortie vers l'extérieur, car ils sont autonomes.
      estil:
        color: '#000000'
        mida: 11.4
    - role: text
      text: Ils ont un condenseur, qui transforme les vapeurs en eau.
      refs:
