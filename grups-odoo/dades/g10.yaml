- id: p23
  n: 23
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: PROTECCIÓN CONTRA INCENDIOS (PCI) SUMINISTRO E INSTALACIÓN
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: '(España peninsular y Baleares) Es obligatorio en instalaciones a partir de 50 Kw (a partir de 25 KW, en centros hospitalarios o residencias),
        según el (DBSI) Documento Básico de Seguridad contra Incendios, publicado el 16/12-2011. Consiste en la instalación de uno, o más (según
        tamaño campana) extintores presurizados, de carbonato de potasio, NO TÓXICO. □ Dicho extintor, equipa el correspondiente manómetro de
        control de carga. La distribución del agente extintor, es mediante difusores (sprinklers), que están tarados según la temperatura del
        elemento de cocción y van colocados en una tuberia de acero inoxidable de 16 mm. □ El sistema ofrece 3 protecciones: A-Los elementos de
        cocción.  B-Los filtros-plenúm. C-Los conductos. La activación es automática, pero además dispone de un pulsador a una distancia de 2
        metros que puede hacerse manualmente, el cual debe estar en la via de evacuación desde la cocina. Bajo presupuesto se puede colocar a
        mayor distancia. El sistema, actúa durante las 24 horas del dia, por lo que, si por un descuido, se han dejado, por ejemplo, la freidora
        en marcha y el aceite se incendia, se activaría automaticámente para apagarlo. SISTEMA SEGÚN PROTOCOLO (UNE 23510:2017), CON CERTIFICADO
        DE IDONEIDAD (ETI1908), EMITIDO POR CENTRO TECNOLÓGICO DEL METAL. Una vez está colocada la campana y hecha la conducción de humos al exterior,
        se procede a la instalación de la PROTECCION CONTRA INCENDIOS IN SITU. Que se realiza en cualquier provincia de España (Peninsula y Baleares),
        por técnicos homologados, y se registra en los DEPARTAMENTOS DE INDUSTRIA DE CADA COMUNIDAD AUTÓNOMA. INCLUIDO EN EL PVP, LA INSTALACIÓN
        Y EL CERTIFICADO CORRESPONDIENTE.'
