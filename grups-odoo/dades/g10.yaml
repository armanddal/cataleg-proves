- id: p26
  n: 26
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: CONSTRUCCIÓN GENÉRICA DE CAJAS DE VENTILACIÓN En acero galvanizado inoxidable. Forradas interiormente de material aislante e insonorizante.
        Tapas desmontables para facilitar el acceso técnico y la limpieza, y herméticas, para evitar pérdidas de aire o entradas de agua. Ventilador
        con banda antivibratoria. Motores montados sobre antivibratorios de caucho. Transmisión del motor al ventilador por medio de 2 correas,
        disponiendo de un sistema para su tensado. Sustituyendo las poleas, se pueden variar las revoluciones. (Excepto modelos con motor de 1/3,
        que es directa) Se fabrican con la salida horizontal o vertical, por lo que se debe pedir el mod/cod, correspondiente al pasar el pedido.
        Con motores trifásicos, por motivo de consumo y durabilidad, opcionalmente se puede colocar el motor monofásico (Ver en ACCESORIOS) Es
        aconsejable instalar un variador de frecuencia, para poder regular las revoluciones del motor, según las necesidades del momento. (Ver
        en ACCESORIOS) □ HAY MUCHOS MODELOS DE CAJAS, aparte de los indicados en ese catálogo, para conseguir la extracción de humos óptima de
        acuerdo con las características de su instalación. Dependen muchos factores, tales como el diámetro y la longitud del conducto de aspiración...Los
        modelos recomendados (R) en las características de las campanas, así como los conductos, son meramente orientativos, pero normalmente
        suficientes y sobre-dimensionados. Nuestro departamento técnico, está a su disposición y le asesorará. SERIE 2 - CAJAS DE VENTILACIÓN
        Se pueden utilizar tanto para aspiración como para impulsión. El motor está alojado en el interior de la caja. □ SERIE 5 - CAJAS DE VENTILACIÓN
        HOMOLOGADAS, 400ºC/2 HORAS - PARA EXTRACCIÓN Cumplen la normativa vigente, ya que soportan el fuego, durante 120 minutos, evitando que
        la cocina se quede sin oxígeno, con el consiguiente peligro para las personas que están trabajando. Homologadas de acuerdo con la norma
        NBE-CP1/96, por el fabricante del motor. □ El motor está en el interior de la caja, con una separación de manera que el fuego no le afecta.
        □ CONDUCTOS Ofrecemos los de chapa galvanizada cilíndricos. Van en tramos de 2 metros, pero bajo demanda, se pueden suministrar rectangulares
        o cilíndricos de acero inoxidable, con aislamiento EI-30 etc. Los conductos recomendados en ese catálogo, según la campana a instalar,
        son indicativos, pues dependen de muchos factores, pero normalmente, son suficientes y sobredimensionados. También encontrarán en ese
        catálogo, los accesorios más habituales, como codos a 90 ó 45 grados, manguitos de unión, abrazaderas para su fijación, sombreros, etc.
        Pero aparte, podemos suministrar “Tes” o pantalones, injertos, compuertas, tapas de registro para la limpieza, etc. Nuestro departamento
        técnico, le asesorará, una vez vista la instalación.
