- id: p35
  n: 35
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: E FIRE PROTECTION (PCI), PLENUMS AND WALL PANELS
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: F PROTECTION CONTRE L'INCENDIE (PCI), PLÉNUMS ET PANNEAUX MURAUX
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.75
      y: 0.25
      w: 19.5
      h: 1.75
  - idioma: es
    paragrafs:
    - role: text
      text: 'E FIRE PROTECTION (PCI) SUPPLY AND INSTALLATION It is recommended, and also mandatory in installations from 50 kW onwards, according
        to the (DBSI) Basic Fire Safety Document, published on 16/12-2011. It consists of the installation of one, or more (depending on hood
        size) pressurized potassium carbonate extinguishers, NON-TOXIC. □ Said extinguisher is equipped with the corresponding pressure gauge
        for charge control. The distribution of the extinguishing agent is carried out by means of diffusers (sprinklers), which are calibrated
        according to the temperature of the cooking element and are installed on a 16 mm stainless steel pipe. □ The system offers 3 protections:'
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: A-The cooking elements.
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: B-The plenum filters.
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: C-The ducts. Activation is automatic, but it also has a push button at a distance of 2 metres which can be operated manually. Upon
        quotation, it can be placed at a greater distance. The system operates 24 hours a day, therefore, if through negligence, for example,
        the fryer has been left on and the oil catches fire, it would activate automatically to extinguish it. SYSTEM ACCORDING TO PROTOCOL (UNE
        23510:2017), WITH CERTIFICATE OF SUITABILITY (ETI1908), WITH CERTIFICATE No. 011GA001 ISSUED BY TÜV SARLAND. Once the hood is installed
        and the smoke ducting to the outside has been completed, the FIRE PROTECTION is installed ON SITE. Carried out in any province of Spain
        (Mainland and Balearic Islands), by approved technicians, and registered with the INDUSTRY DEPARTMENTS OF EACH AUTONOMOUS COMMUNITY. WALL
        PANELS Made of 18/10 AISI 304 stainless steel. Recommended for wall-mounted hoods, as they cover the wall between the cooking equipment
        and the hood itself. □ They make cleaning easier, as they have no joints. In addition, they do not break, as is the case with tiles, due
        to the high temperature that comes out of the chimneys of kitchens. From 2500 mm upwards, they are supplied in 2 pieces. They are supplied
        with a stainless steel bar for hanging kitchen utensils. □
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 0.75
      y: 2.5
      w: 9.432
      h: 25.9
  - idioma: es
    paragrafs:
    - role: text
      text: 'F PROTECTION CONTRE L''INCENDIE (PCI) FOURNITURE ET INSTALLATION Elle est recommandée, et également obligatoire dans les installations
        à partir de 50 kW, selon le (DBSI) Document de Base de Sécurité contre les Incendies, publié le 16/12-2011. Elle consiste en l’installation
        d’un ou plusieurs extincteurs pressurisés au carbonate de potassium (selon la taille de la hotte), NON TOXIQUE. □ Ledit extincteur est
        équipé du manomètre correspondant pour le contrôle de charge. La distribution de l’agent extincteur se fait au moyen de diffuseurs (sprinklers),
        calibrés selon la température de l’élément de cuisson et placés sur une tuyauterie en acier inoxydable de 16 mm. □ Le système offre 3
        protections :'
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: A-Les éléments de cuisson.
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: B-Les filtres-plénum.
      estil:
        color: '#000000'
        mida: 7.0
    - role: text
      text: C-Les conduits. L’activation est automatique, mais il dispose également d’un bouton-poussoir à une distance de 2 mètres pouvant être
        actionné manuellement. Sur devis, il peut être placé à une plus grande distance. Le système fonctionne 24 heures sur 24, de sorte que
        si, par inadvertance, la friteuse est restée en marche et que l’huile s’enflamme, il s’activerait automatiquement pour l’éteindre. SYSTÈME
        SELON LE PROTOCOLE (UNE 23510:2017), AVEC CERTIFICAT D’APTITUDE (ETI1908), AVEC CERTIFICAT Nº 011GA001 ÉMIS PAR TÜV SARLAND. Une fois
        la hotte installée et la conduite des fumées vers l’extérieur réalisée, on procède à l’installation de la PROTECTION CONTRE INCENDIES
        SUR SITE. Réalisée dans toute province d’Espagne (Péninsule et Baléares), par des techniciens homologués, et enregistrée auprès des DÉPARTEMENTS
        DE L’INDUSTRIE DE CHAQUE COMMUNAUTÉ AUTONOME. PANNEAUX MURAUX Fabriqué en acier inoxydable 18/10 AISI 304. Recommandés pour les hottes
        murales, car ils couvrent le mur entre l'équipement de cuisson et la hotte elle-même. □ Ils facilitent le nettoyage, car ils n'ont pas
        de joints. En outre, ils ne se cassent pas, comme c'est le cas des tuiles, à cause de la température élevée qui sort des cheminées des
        fourneaux. A partir de 2500 mm, ils sont fournis en 2 pièces. Ils sont fournis avec une barre en acier inoxydable pour suspendre les ustensiles
        de cuisine. □
      estil:
        color: '#000000'
        mida: 7.0
    pos:
      x: 10.576
      y: 2.5
      w: 9.432
      h: 25.9
