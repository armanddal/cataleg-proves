  columnes:
  - idioma: es
    paragrafs:
    - role: text
      text: E GENERIC CONSTRUCTION OF VENTILATION BOXES In galvanised steel. Lined on the inside with insulating and soundproofing material. Removable
        covers to facilitate technical access and cleaning, and airtight to prevent air leaks or water ingress. Fan with anti-vibration band.
        Motors mounted on rubber anti-vibration mounts. Transmission of the motor to the fan by means of 2 belts, with a system for their tensioning.
        By replacing the pulleys, the revolutions can be varied. (Except for models with 1/3 motor, which is direct). They are manufactured with
        horizontal or vertical output, for which the corresponding mod/cod must be requested when placing the order. With three-phase motors,
        for reasons of consumption and durability, a single-phase motor can be fitted as an option (See in ACCESSORIES). It is advisable to install
        a frequency variator, to be able to regulate the revolutions of the motor, according to the needs of the moment. (See in ACCESSORIES)
        □ THERE ARE MANY MODELS OF BOXES, apart from those indicated in this catalogue, to achieve the optimum smoke extraction according to the
        characteristics of your installation. Many factors depend, such as the diameter and length of the suction duct... The recommended models
        (R) in the characteristics of the hoods, as well as the ducts, are merely orientative, but normally sufficient and over-dimensioned. Our
        technical department is at your disposal and will advise you. SERIES 2 - VENTILATION BOXES They can be used for both suction and discharge.
        The motor is housed inside the box. □ SERIES 5 - APPROVED VENTILATION BOXES, 400ºC/2 HOURS - FOR SUCTION They comply with current regulations,
        as they withstand fire for 120 minutes, preventing the kitchen from running out of oxygen, with the consequent danger to the people working
        in it. Approved in accordance with the NBE-CP1/96 standard, by the engine manufacturer. □ The motor is located inside the box, with sufficient
        separation so that it is not affected by fire. □ DUCTS We offer cylindrical galvanised sheet metal ducts. They come in 2 metre lengths,
        but on request, rectangular or cylindrical stainless steel ducts can be supplied, with EI-30 insulation, etc. The recommended ducts in
        this catalogue, depending on the hood to be installed, are indicative, as they depend on many factors, but they are normally sufficient
        and oversized. You will also find in this catalogue the most common accessories, such as 90 or 45 degree elbows, union sleeves, clamps
        for fixing, hats, etc. But we can also supply tees or trousers, grafts, gates, manhole covers for cleaning, etc. Our technical department
        will advise you once we have seen the installation.
      estil:
