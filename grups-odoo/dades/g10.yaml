        text: GARANTIA
      - role: text
        text: La garantía se concede solamente en los defectos de fabricación quedando excluidos de ella la utilización indebida. PIEZAS Dicha
          garantía es de 12 meses en piezas defectuosas, siendo por cuenta del cliente los portes de ida y vuelta de dichas piezas. Todo material
          remitido en garantía se facturará y se procederá a su correspondiente abono, una vez remitidas las piezas defectuosas y comprobadas
          por parte del fabricante. MANO DE OBRA El servicio de mano de obra y los desplazamiento son siempre por cuenta del cliente. El fabricante
          no se hará cargo en ningún caso de ningún tipo o clase de indemnización.
