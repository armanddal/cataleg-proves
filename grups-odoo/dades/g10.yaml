- id: p14
  n: 14
  tipus: informacio_general
  capcalera:
    banda: assets/g10/plantilla-quadre-numero.emf
    serie: SERIE 8
    serie_pos:
      x: 0.5
      y: 0.5
      w: 3.0
      h: 2.149
    titol:
      es: CAMPANAS PARA MOTOR A DISTANCIA Y COMPENSADAS
      en: DISTANCE MOTOR EXTRACTION HOODS AND COMPENSATEDS
      fr: HOTTES D’EXTRACTION POUR MOTEUR À DISTANCE ET COMPENSÉS
  columnes:
  - idioma: es
    paragrafs:
    - role: titol
      text: CONSTRUCCIÓN GENÉRICA
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: En acero inoxidable 18/10 AISI 304.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Para funcionar con caja de ventilación, (con motor-ventilador) a distancia. Ver en GRUPO 10, la amplia gama de que disponemos, para
        cualquier tipo de instalación. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: De Serie, con filtros de lamas de acero inoxidable de 500x500x50 mm, que van colocados en una canal, sin montantes intermedios, y
        en posición inclinada, fácilmente extraíbles. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con bandeja recoge grasas de una pieza, con tapón con rosca, para drenaje y limpieza. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Están construidas con un perfil en todo el perímetro, para la recogida de aceites, que por la condensación , se producen.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Opcionalmente, se pueden colocar filtros de malla y de carbón activo para reducir los olores. Ambos de 25 mm, de espesor, que se colocan
        en el lugar de los de lamas de 50 mm. (Ver ACCESORIOS)
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Disponemos de reguladores de velocidad para los motores monofásicos, con interruptor marcha-paro y variadores de frecuencia, para
        motores trifásicos. (Ver ACCESORIOS). □□
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Es recomendable la colocación de luminarias de bajo consumo o led, en cualquier campana, pues la propia campana priva de luz al cocinero.
        Dichas luminarias, de 500 ó 1000 mm, están protegidas por un vidrio templado, plano, estanco y fácil de limpiar. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CAMPANAS MURALES PARA ASADORES, HORNOS Y EXTRACCIÓN DE VAPOR
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Diseñadas específicamente, para estos aparatos, ya que los filtros están situados en la parte frontal, para que aspiren los vahos,
        al abrir las puertas y también para que no reciban la máxima temperatura que generan los quemadores, en la parte posterior, y así evitar
        incendios. □
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: Con visera vertical.
      estil:
        color: '#000000'
        mida: 14.0
    - role: titol
      text: CAMPANAS COMPENSADAS
      estil:
        color: '#800080'
        negreta: true
        mida: 14.0
    - role: text
      text: Disponen de un plenun con rejillas, repartidas en toda su longitud, para la aportación de aire, y así evitar corrientes, ya que el
        70% se aporta por medio de otra caja de ventilación. Así mismo, ahorra consumo del aire acondicionado del comedor, que aspira a través
        de las puertas.
      estil:
        color: '#000000'
        mida: 14.0
    - role: text
      text: También tienen compuertas de regulación en cada filtro, con las cuales se puede regular la aspiración de cada uno de ellos, según
        el aparato de cocción. El aire aspirado, se extrae a través de otro plenun. □
      estil:
        color: '#000000'
        mida: 14.0
    pos:
      x: 0.75
      y: 2.5
      w: 12.4
      h: 21.373
